upstream dashboard_api {
    server dashboard-api:8100;
}

upstream config_service {
    server config-service:8200;
}

server {
    listen 80;
    server_name _;

    # Dashboard API
    location /api/ {
        proxy_pass http://dashboard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Config Service
    location /config/ {
        proxy_pass http://config_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Monitoring Dashboard (static files)
    location /monitoring/ {
        proxy_pass http://monitoring:8300/;
    }

    # Health checks
    location /health {
        proxy_pass http://dashboard_api/api/v1/health;
    }

    # Static docs
    location /docs/ {
        alias /app/handover_dashboard/docs/;
        autoindex on;
    }
}
