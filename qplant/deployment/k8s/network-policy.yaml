# QPLANT Network Policy — Restrict traffic to/from API pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qplant-api-network-policy
  namespace: qplant-production
  labels:
    app: qplant-api
spec:
  podSelector:
    matchLabels:
      app: qplant-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  - from:
    - podSelector:
        matchLabels:
          app: qplant-monitoring
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
