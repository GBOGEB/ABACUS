# QPLANT API Server Deployment — Production
# Canonical runtime port is inherited from qplant/deployment/Dockerfile (8100).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qplant-api-server
  namespace: qplant-production
  labels:
    app: qplant-api
    tier: backend
    version: "v4.4.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: qplant-api
  template:
    metadata:
      labels:
        app: qplant-api
        version: v4.4.0
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: validate-ssot
        # Reuse the application image so the validator has the exact PyYAML
        # dependency set proven by the canonical QPLANT build.
        image: qplant/api-server:v4.4.0
        imagePullPolicy: IfNotPresent
        command: ["python3", "-c"]
        args:
          - |
            import yaml
            with open('/etc/qplant/config/config.yaml', encoding='utf-8') as f:
                cfg = yaml.safe_load(f.read())
            assert cfg['compressors']['count'] == 3, 'Compressor count mismatch'
            assert cfg['compressors']['motor_power_kw'] == 315, 'Motor power mismatch'
            assert cfg['version'] == '4.4.0', 'Version mismatch'
            print('SSOT validation passed')
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: ssot-volume
          mountPath: /etc/qplant/config
          readOnly: true

      containers:
      - name: api-server
        image: qplant/api-server:v4.4.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8100
          name: http
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: QPLANT_API_PORT
          value: "8100"
        - name: SSOT_CONFIG_PATH
          value: "/etc/qplant/config/config.yaml"
        - name: LOG_LEVEL
          value: "INFO"
        - name: QPLANT_ADMIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: qplant-api-keys
              key: admin-api-key

        volumeMounts:
        - name: ssot-volume
          mountPath: /etc/qplant/config
          readOnly: true

        startupProbe:
          httpGet:
            path: /api/v1/health
            port: http
          periodSeconds: 5
          failureThreshold: 12

        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          periodSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          periodSeconds: 5
          failureThreshold: 2

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]

      volumes:
      - name: ssot-volume
        configMap:
          name: qplant-ssot-v4-4-0
