# QPLANT API Service — cluster service fronted by the managed Ingress.
apiVersion: v1
kind: Service
metadata:
  name: qplant-api-service
  namespace: qplant-production
  labels:
    app: qplant-api
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: qplant-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: http
    name: http
