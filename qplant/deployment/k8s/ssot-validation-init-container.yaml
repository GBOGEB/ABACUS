# QPLANT SSOT semantic validator and periodic integrity check.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qplant-ssot-validator-script
  namespace: qplant-production
data:
  validate_ssot.py: |
    #!/usr/bin/env python3
    import hashlib
    import json
    import os
    import sys
    from datetime import datetime, timezone

    import yaml

    SSOT_PATH = os.environ.get("SSOT_PATH", "/config/config.yaml")
    EXPECTED_SHA = os.environ.get("EXPECTED_SHA256", "").strip().lower()

    def check(name, passed, **details):
        row = {"check": name, "passed": bool(passed)}
        row.update(details)
        return row

    def validate():
        rows = []
        if not os.path.exists(SSOT_PATH):
            return {"passed": False, "checks": [check("file_exists", False, path=SSOT_PATH)]}

        content = open(SSOT_PATH, "rb").read()
        actual_sha = hashlib.sha256(content).hexdigest()
        rows.append(check("file_exists", True, path=SSOT_PATH))
        rows.append(check("sha256_observed", True, sha256=actual_sha))
        if EXPECTED_SHA:
            rows.append(check("sha256_expected", actual_sha == EXPECTED_SHA, expected=EXPECTED_SHA, actual=actual_sha))

        try:
            cfg = yaml.safe_load(content) or {}
            rows.append(check("yaml_parse", True))
        except Exception as exc:
            rows.append(check("yaml_parse", False, error=str(exc)))
            return {"passed": False, "checks": rows}

        required = ["version", "system", "compressors", "flow_parameters", "refrigeration", "financial"]
        for section in required:
            rows.append(check(f"section_{section}", section in cfg))

        compressors = cfg.get("compressors", {})
        rows.append(check("version_4_4_0", cfg.get("version") == "4.4.0", actual=cfg.get("version")))
        rows.append(check("compressor_count_3", compressors.get("count") == 3, actual=compressors.get("count")))
        rows.append(check("motor_power_kw_315", compressors.get("motor_power_kw") == 315, actual=compressors.get("motor_power_kw")))

        return {
            "schema": "qplant-k8s-ssot-runtime-receipt/v1",
            "timestamp": datetime.now(timezone.utc).isoformat(),
            "passed": all(row["passed"] for row in rows),
            "sha256": actual_sha,
            "checks": rows,
        }

    if __name__ == "__main__":
        result = validate()
        print(json.dumps(result, indent=2, sort_keys=True))
        sys.exit(0 if result["passed"] else 1)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qplant-ssot-integrity-check
  namespace: qplant-production
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: integrity-checker
            image: qplant/api-server:v4.4.0
            imagePullPolicy: IfNotPresent
            command: ["python3", "/validator/validate_ssot.py"]
            env:
            - name: SSOT_PATH
              value: "/config/config.yaml"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: "25m"
                memory: "32Mi"
              limits:
                cpu: "100m"
                memory: "128Mi"
            volumeMounts:
            - name: validator-script
              mountPath: /validator
              readOnly: true
            - name: ssot-config
              mountPath: /config
              readOnly: true
          volumes:
          - name: validator-script
            configMap:
              name: qplant-ssot-validator-script
              defaultMode: 0555
          - name: ssot-config
            configMap:
              name: qplant-ssot-v4-4-0
