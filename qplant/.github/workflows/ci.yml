name: CI - Test & Build

on:
  push:
    branches: [ main, develop, 'feature/**', 'release/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio
    
    - name: Run pytest
      run: |
        pytest --cov=. --cov-report=xml --cov-report=html -v
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
    
    - name: Archive coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: htmlcov/

  test-authentication:
    name: Authentication Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Test API key generation
      run: |
        python authentication/key_cli.py generate --name "CI Test" --days 1
    
    - name: Test rate limiter
      run: |
        pytest authentication/tests/test_rate_limiter.py -v

  test-load-performance:
    name: Load Testing (Smoke)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install locust
    
    - name: Start API server
      run: |
        cd handover_dashboard/api
        uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 5
    
    - name: Run smoke load test
      run: |
        cd load_testing
        locust -f locustfile.py \
          --host=http://localhost:8000 \
          --headless \
          --users=10 \
          --spawn-rate=2 \
          --run-time=2m \
          --html=reports/ci_smoke_test.html
    
    - name: Upload load test report
      uses: actions/upload-artifact@v3
      with:
        name: load-test-report
        path: load_testing/reports/ci_smoke_test.html

  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install playwright pytest
        playwright install chromium
    
    - name: Run visual regression tests
      run: |
        cd visual_regression
        python visual_tests.py --mode=test --threshold=0.1
    
    - name: Upload diff images
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: visual-diffs
        path: visual_regression/diffs/

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test-python, test-authentication]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build image
      run: |
        docker build -t qplant/api-server:${{ github.sha }} .
    
    - name: Test image
      run: |
        docker run -d -p 8000:8000 qplant/api-server:${{ github.sha }}
        sleep 5
        curl http://localhost:8000/health

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Run pip-audit
      run: |
        pip install pip-audit
        pip-audit --require-hashes --disable-pip -r requirements.txt || true
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Generate SBOM
      run: |
        pip install cyclonedx-bom
        cyclonedx-py -i requirements.txt -o sbom/cyclonedx_sbom.json
    
    - name: Upload SBOM
      uses: actions/upload-artifact@v3
      with:
        name: sbom
        path: sbom/cyclonedx_sbom.json
