name: Release to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v4.4.0)'
        required: true

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name || github.event.inputs.version }}
    
    - name: Configure kubectl
      uses: azure/setup-kubectl@v3
    
    - name: Deploy to production
      run: |
        cd deployment
        ./scripts/deploy_production.sh production
    
    - name: Validate deployment
      run: |
        cd deployment
        ./scripts/validate_deployment.sh production
    
    - name: Create deployment record
      run: |
        echo "Deployed ${{ github.event.release.tag_name }} to production at $(date)" >> DEPLOYMENT_HISTORY.md
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add DEPLOYMENT_HISTORY.md
        git commit -m "chore: Record production deployment ${{ github.event.release.tag_name }}"
        git push
