# =============================================================================
# icd_inputs.yaml  --  READ-ONLY projection of the controlled SSOT
# -----------------------------------------------------------------------------
# These values are MIRRORED from the private engineering SSOT
# (GBOGEB/cryoplant-project). They are the CANONICAL electrical / thermal
# interface anchors. This file is a read-only consumption surface for the
# ABACUS analytical-runtime handover. DO NOT edit the numbers here to "fix"
# anything -- the SSOT is authoritative; raise any change against the SSOT.
#
# Binding rule (W52 ICD): HP flow and B flow SHALL NOT be conflated.
#   - HP compressor duty  is driven by total warm HP circulation flow (mdot_HP_total).
#   - PVPS duty           is driven by the B / VLP return flow (mdot_B).
#   They are SEPARATE drivers; they are NOT summed into a single sizing flow.
# =============================================================================

