// Compute ranks
function computeRanks(){
  // Overall rank by btO
  const sorted = [...ARTIFACTS].sort((a,b)=>b.btO-a.btO);
  sorted.forEach((a,i)=>a.rankTotal=i+1);
  // Category ranks
  Object.keys(TYPES).forEach(t=>{
    const ofType = sorted.filter(a=>a.type===t).sort((a,b)=>b.btT-a.btT);
    ofType.forEach((a,i)=>{a.rankCat=i+1;a.catTotal=ofType.length});
  });
}
computeRanks();

function setDim(dim,btn){
  currentDim=dim;
  document.querySelectorAll('#dimensionBar button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}
function setSort(s,btn){
  currentSort=s;
  document.querySelectorAll('#sortBar button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function renderTypeFilters(){
  const bar=document.getElementById('typeFilter');
  bar.innerHTML='';
  Object.keys(TYPES).forEach(t=>{
    const b=document.createElement('button');
    b.innerHTML=`<span class="type-dot type-${t}"></span>${t}`;
    b.className=activeTypes.has(t)?'active':'';
    b.onclick=()=>{activeTypes.has(t)?activeTypes.delete(t):activeTypes.add(t);renderTypeFilters();renderTable()};
    bar.appendChild(b);
  });
}

function renderTable(){
  let data = ARTIFACTS.filter(a=>activeTypes.has(a.type));
  if(currentDim==='facing') data=data.filter(a=>a.facing);
  // Sort
  const sortFns={rankTotal:(a,b)=>a.rankTotal-b.rankTotal, rankCat:(a,b)=>a.rankCat-b.rankCat,
    btOverall:(a,b)=>b.btO-a.btO, btType:(a,b)=>b.btT-a.btT};
  data.sort(sortFns[currentSort]||sortFns.rankTotal);

  const t=document.getElementById('btTable');
  t.innerHTML=`<thead><tr><th>#</th><th>Artifact</th><th>Type</th><th>Rank Total</th><th>Rank Category</th><th>BT Overall</th><th>BT Type</th><th>Importance</th><th>Stability</th><th>Interaction</th></tr></thead><tbody>${
    data.map(a=>`<tr>
      <td class="mono">${a.rankTotal}</td>
      <td><span class="type-dot type-${a.type}"></span>${a.name}</td>
      <td>${a.type}</td>
      <td class="mono">${a.rankTotal}/67</td>
      <td class="mono">${a.rankCat}/${a.catTotal}</td>
      <td class="mono" style="font-weight:700">${a.btO.toFixed(3)}</td>
      <td class="mono">${a.btT.toFixed(3)}</td>
      <td><span class="sev-badge sev-${a.importance}">${a.importance}</span></td>
      <td>${a.stability}</td>
      <td class="mono">${a.interaction}</td>
    </tr>`).join('')}</tbody>`;

  // Stats
  const sg=document.getElementById('statsGrid');
  sg.innerHTML=`
    <div class="stats-card"><div class="big">${ARTIFACTS.length}</div><div class="lbl">Total Artifacts</div></div>
    <div class="stats-card"><div class="big">${ARTIFACTS.filter(a=>a.importance==='Critical').length}</div><div class="lbl">Critical</div></div>
    <div class="stats-card"><div class="big">${ARTIFACTS.filter(a=>a.type==='HTML').length}</div><div class="lbl">HTML Views</div></div>
    <div class="stats-card"><div class="big">${ARTIFACTS.filter(a=>a.stability==='Evolving').length}</div><div class="lbl">Evolving</div></div>
    <div class="stats-card"><div class="big">${data.length}</div><div class="lbl">Showing</div></div>`;

  renderCharts(data);
}

function renderCharts(data){
  const pc2={bg:'rgba(0,0,0,0)',paper:'rgba(0,0,0,0)'};
  const pl2={font:{family:'Aptos,sans-serif',size:11},margin:{l:50,r:30,t:40,b:50},
    plot_bgcolor:pc2.bg,paper_bgcolor:pc2.paper};

  // Scatter: BT Overall vs BT Type
  const byType={};
  data.forEach(a=>{if(!byType[a.type])byType[a.type]=[];byType[a.type].push(a)});
  const traces=Object.entries(byType).map(([t,items])=>({
    x:items.map(a=>a.btO),y:items.map(a=>a.btT),
    text:items.map(a=>a.name),mode:'markers',name:t,
    marker:{size:items.map(a=>Math.max(8,a.interaction/3)),color:TYPES[t],opacity:0.8},
    type:'scatter',hoverinfo:'text+x+y'
  }));
  Plotly.newPlot('plotScatter',traces,{...pl2,
    title:{text:'BT Overall vs BT Type Score',font:{size:13}},
    xaxis:{title:'BT Overall Score'},yaxis:{title:'BT Type Score'},
    legend:{x:0.02,y:0.02}},{responsive:true});

  // Category comparison bar
  const cats=Object.keys(TYPES);
  const avgBT=cats.map(t=>{const items=ARTIFACTS.filter(a=>a.type===t);return items.reduce((s,a)=>s+a.btO,0)/items.length});
  Plotly.newPlot('plotCatBar',[{
    x:cats,y:avgBT,type:'bar',marker:{color:cats.map(c=>TYPES[c])},
    text:avgBT.map(v=>v.toFixed(3)),textposition:'outside'
  }],{...pl2,title:{text:'Average BT Score by Type',font:{size:13}},
    yaxis:{title:'Mean BT Overall',range:[0.4,1]}},{responsive:true});

  // Rank distribution histogram
  Plotly.newPlot('plotRankDist',[{
    x:data.map(a=>a.btO),type:'histogram',nbinsx:15,
    marker:{color:'#2171b5',line:{color:'#08519c',width:1}}
  }],{...pl2,title:{text:'BT Score Distribution',font:{size:13}},
    xaxis:{title:'BT Overall Score'},yaxis:{title:'Count'}},{responsive:true});

  // Confidence intervals (top 15)
  const top15=data.slice(0,15);
  const margin=0.02;
  Plotly.newPlot('plotConfidence',[{
    y:top15.map(a=>a.name).reverse(),x:top15.map(a=>a.btO).reverse(),
    error_x:{type:'data',array:top15.map(()=>margin).reverse(),visible:true,color:'#e6550d'},
    type:'scatter',mode:'markers',marker:{size:10,color:'#08519c'},
    orientation:'h'
  }],{...pl2,title:{text:'Top 15 — BT Scores with 97.5% CI',font:{size:13}},
    xaxis:{title:'BT Overall Score'},yaxis:{automargin:true},
    margin:{...pl2.margin,l:180}},{responsive:true});
}

function exportData(fmt){
  const data = ARTIFACTS.map(a=>({...a}));
  if(fmt==='json'){
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a2=document.createElement('a');a2.href=URL.createObjectURL(blob);a2.download='bt-artifacts.json';a2.click();
  } else if(fmt==='csv'){
    const hdr='name,type,rankTotal,rankCat,catTotal,btOverall,btType,importance,stability,facing,interaction\n';
    const rows=data.map(a=>`${a.name},${a.type},${a.rankTotal},${a.rankCat},${a.catTotal},${a.btO},${a.btT},${a.importance},${a.stability},${a.facing},${a.interaction}`).join('\n');
    const blob=new Blob([hdr+rows],{type:'text/csv'});
    const a2=document.createElement('a');a2.href=URL.createObjectURL(blob);a2.download='bt-artifacts.csv';a2.click();
  } else { // YAML
    const yaml=data.map(a=>`- name: ${a.name}\n  type: ${a.type}\n  rank_total: ${a.rankTotal}\n  rank_category: ${a.rankCat}/${a.catTotal}\n  bt_overall: ${a.btO}\n  bt_type: ${a.btT}\n  importance: ${a.importance}\n  stability: ${a.stability}`).join('\n');
    const blob=new Blob([yaml],{type:'text/yaml'});
    const a2=document.createElement('a');a2.href=URL.createObjectURL(blob);a2.download='bt-artifacts.yaml';a2.click();
  }
}
