<style>
/* ═══════════════════════════════════════════════════════════════════════
   SEMANTIC THEME TOKENS — GBOGEB/ABACUS RENDER_RULES
   Three themes: userstyle | corporate | focus
   ═══════════════════════════════════════════════════════════════════════ */

/* --- Theme: userstyle (clean light) ---------------------------------- */
[data-theme="userstyle"] {
  --color-primary: #1a73e8;
  --color-accent: #34a853;
  --color-surface: #ffffff;
  --color-surface-alt: #f8f9fa;
  --color-on-surface: #202124;
  --color-on-surface-muted: #5f6368;
  --color-border: #dadce0;
  --color-warning: #ea8600;
  --color-success: #34a853;
  --color-error: #d93025;
  --color-code-bg: #f1f3f4;
  --color-header-bg: #ffffff;
  --color-tab-active: #1a73e8;
  --color-tab-inactive: transparent;
  --font-sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  --radius: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.12);
  --shadow-lg: 0 4px 12px rgba(0,0,0,.15);
  --transition: 200ms ease;
}

/* --- Theme: corporate (purple accent) -------------------------------- */
[data-theme="corporate"] {
  --color-primary: #6d28d9;
  --color-accent: #a78bfa;
  --color-surface: #faf5ff;
  --color-surface-alt: #f3e8ff;
  --color-on-surface: #1e1b4b;
  --color-on-surface-muted: #6b7280;
  --color-border: #c4b5fd;
  --color-warning: #f59e0b;
  --color-success: #10b981;
  --color-error: #ef4444;
  --color-code-bg: #ede9fe;
  --color-header-bg: #6d28d9;
  --color-tab-active: #a78bfa;
  --color-tab-inactive: transparent;
  --font-sans: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --radius: 6px;
  --shadow: 0 2px 4px rgba(109,40,217,.15);
  --shadow-lg: 0 8px 24px rgba(109,40,217,.2);
  --transition: 250ms ease;
}
[data-theme="corporate"] .header { color: #fff; }
[data-theme="corporate"] .header .theme-btn { color: #e0d5f5; border-color: #a78bfa; }
[data-theme="corporate"] .header .theme-btn:hover,
[data-theme="corporate"] .header .theme-btn.active { background: #a78bfa; color: #fff; }

/* --- Theme: focus (high-contrast dark) ------------------------------- */
[data-theme="focus"] {
  --color-primary: #60a5fa;
  --color-accent: #34d399;
  --color-surface: #0f172a;
  --color-surface-alt: #1e293b;
  --color-on-surface: #f1f5f9;
  --color-on-surface-muted: #94a3b8;
  --color-border: #334155;
  --color-warning: #fbbf24;
  --color-success: #34d399;
  --color-error: #f87171;
  --color-code-bg: #1e293b;
  --color-header-bg: #0f172a;
  --color-tab-active: #60a5fa;
  --color-tab-inactive: transparent;
  --font-sans: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', 'Fira Code', monospace;
  --radius: 4px;
  --shadow: 0 2px 8px rgba(0,0,0,.4);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.5);
  --transition: 150ms ease;
}

/* ═══════════════════════════════════════════════════════════════════════
   GLOBAL RESET & BASE STYLES
   ═══════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; width: 100%;
  font-family: var(--font-sans);
  background: var(--color-surface);
  color: var(--color-on-surface);
  transition: background var(--transition), color var(--transition);
}

/* ═══════════════════════════════════════════════════════════════════════
   LAYOUT: Header → SplitPane (Left Code | Right Render)
   ═══════════════════════════════════════════════════════════════════════ */
.app { display: flex; flex-direction: column; height: 100vh; }

.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px;
  background: var(--color-header-bg);
  border-bottom: 1px solid var(--color-border);
  box-shadow: var(--shadow);
  z-index: 100;
  transition: background var(--transition);
}
.header h1 {
  font-size: 16px; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
}
.header h1 i { color: var(--color-primary); }
.header-controls { display: flex; align-items: center; gap: 8px; }
.theme-btn {
  padding: 4px 12px; border: 1px solid var(--color-border);
  border-radius: var(--radius); background: transparent;
  color: var(--color-on-surface); cursor: pointer; font-size: 12px;
  font-weight: 600; transition: all var(--transition);
}
.theme-btn:hover { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
.theme-btn.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

.split-pane {
  display: flex; flex: 1; overflow: hidden;
}

/* --- Resize divider -------------------------------------------------- */
.divider {
  width: 6px; cursor: col-resize;
  background: var(--color-border);
  transition: background var(--transition);
  flex-shrink: 0;
}
.divider:hover, .divider.dragging { background: var(--color-primary); }

/* --- Panels ---------------------------------------------------------- */
.panel { display: flex; flex-direction: column; overflow: hidden; }
.panel-left  { flex: 0 0 45%; min-width: 280px; }
.panel-right { flex: 1; min-width: 320px; }

/* --- Tab bars -------------------------------------------------------- */
.tab-bar {
  display: flex; align-items: center;
  padding: 0 8px;
  background: var(--color-surface-alt);
  border-bottom: 1px solid var(--color-border);
  height: 36px; flex-shrink: 0;
}
.tab-bar .tab {
  padding: 6px 14px; font-size: 12px; font-weight: 600;
  cursor: pointer; border: none; background: var(--color-tab-inactive);
  color: var(--color-on-surface-muted);
  border-bottom: 2px solid transparent;
  transition: all var(--transition);
}
.tab-bar .tab:hover { color: var(--color-on-surface); }
.tab-bar .tab.active {
  color: var(--color-primary);
  border-bottom-color: var(--color-tab-active);
}
.tab-bar .tab-spacer { flex: 1; }
.tab-bar .status-badge {
  font-size: 11px; padding: 2px 8px;
  border-radius: 10px; font-weight: 600;
}
.status-pass { background: var(--color-success); color: #fff; }
.status-fail { background: var(--color-error); color: #fff; }

/* --- Content areas --------------------------------------------------- */
.tab-content { flex: 1; overflow: auto; position: relative; }
.tab-panel { display: none; height: 100%; overflow: auto; }
.tab-panel.active { display: block; }

/* --- Code editor (textarea) ----------------------------------------- */
.code-editor {
  width: 100%; height: 100%; border: none; resize: none;
  padding: 12px 16px;
  font-family: var(--font-mono); font-size: 13px; line-height: 1.6;
  background: var(--color-code-bg); color: var(--color-on-surface);
  tab-size: 2; outline: none;
  transition: background var(--transition), color var(--transition);
}

/* --- HMI Dashboard --------------------------------------------------- */
.hmi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px; padding: 16px;
}
.hmi-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  transition: box-shadow var(--transition);
}
.hmi-card:hover { box-shadow: var(--shadow-lg); }
.hmi-card h3 {
  font-size: 13px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.5px; color: var(--color-on-surface-muted);
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.hmi-card h3 i { color: var(--color-primary); }
.metric-value {
  font-size: 28px; font-weight: 800;
  color: var(--color-primary);
}
.metric-unit { font-size: 14px; color: var(--color-on-surface-muted); font-weight: 400; }
.metric-sub {
  font-size: 12px; color: var(--color-on-surface-muted); margin-top: 4px;
}
.status-indicator {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 600;
}
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  display: inline-block;
}
.status-dot.nominal { background: var(--color-success); }
.status-dot.warning { background: var(--color-warning); }
.status-dot.alarm   { background: var(--color-error); }

/* --- SVG Diagram ----------------------------------------------------- */
.svg-container {
  padding: 16px; width: 100%; display: flex;
  justify-content: center; align-items: flex-start;
}
.svg-container svg { max-width: 100%; height: auto; }

/* --- Marp Presentation ----------------------------------------------- */
.marp-container { padding: 24px; }
.marp-slide {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 32px 40px;
  margin-bottom: 24px;
  max-width: 800px;
  margin-left: auto; margin-right: auto;
}
.marp-slide h2 {
  font-size: 22px; font-weight: 700; color: var(--color-primary);
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--color-accent);
}
.marp-slide p, .marp-slide li { font-size: 15px; line-height: 1.7; margin-bottom: 8px; }
.marp-slide ul { padding-left: 20px; }
.marp-slide .slide-number {
  font-size: 11px; color: var(--color-on-surface-muted); text-align: right; margin-top: 16px;
}
.marp-slide code {
  background: var(--color-code-bg); padding: 2px 6px; border-radius: 3px;
  font-family: var(--font-mono); font-size: 13px;

/* --- Technical Report ------------------------------------------------ */
.report-container {
  padding: 32px 48px; max-width: 900px; margin: 0 auto;
}
.report-container h2 {
  font-size: 20px; font-weight: 700; color: var(--color-primary);
  margin: 24px 0 12px; border-bottom: 1px solid var(--color-border);

}
.report-container h3 { font-size: 16px; font-weight: 600; margin: 16px 0 8px; }
.report-container p { font-size: 14px; line-height: 1.7; margin-bottom: 12px; }
.report-container table {
  width: 100%; border-collapse: collapse; margin: 16px 0;
  font-size: 13px;
}
.report-container th, .report-container td {
  padding: 8px 12px; border: 1px solid var(--color-border); text-align: left;
}
.report-container th {
  background: var(--color-surface-alt); font-weight: 700;
  color: var(--color-on-surface);
}
.report-container .equation {
  background: var(--color-code-bg); padding: 12px 16px;
  border-radius: var(--radius); font-family: var(--font-mono);
  font-size: 14px; margin: 12px 0; text-align: center;
  border-left: 3px solid var(--color-primary);
}
.report-container .doc-header {
  text-align: center; margin-bottom: 32px;
}
.report-container .doc-header h1 {
  font-size: 24px; color: var(--color-primary);
}
.report-container .doc-header .doc-meta {

  margin: 16px 0; display: flex; justify-content: center;

/* ═══════════════════════════════════════════════════════════════════════

.loading-spinner {

  font-size: 32px; color: var(--color-primary);

<!-- ═══════════════════════════════════════════════════════════════════════

<script>
// =========================================================================
// DEFAULT YAML — Embedded SSOT
// =========================================================================
const DEFAULT_YAML = `# ═══════════════════════════════════════════════
# ENGINEERING DATA — Single Source of Truth
# ═══════════════════════════════════════════════

version_control:
  schema_version: "2.1.0"
  last_modified: "2026-05-20T10:00:00Z"
  author: "GBOGEB Engineering Team"

facility:

  beam_energy_MeV: 2000

cryogenic:
  coolant: "Helium-4"
  supply_temperature_K: 2.0
  return_temperature_K: 4.5
  supply_pressure_bar: 1.2
  return_pressure_bar: 1.05
  lambda_point_K: 2.1768
  enthalpy_supply_J_g: 2.56
  enthalpy_return_J_g: 26.14

engineering_metrics:
  heat_loads:
    units: "W"
    categories:
      - id: static_radiation
        label: "Static – Radiation"
        value: 12.5
      - id: static_conduction
        label: "Static – Conduction"
        value: 8.3
      - id: static_supports
        label: "Static – Supports"
        value: 3.7
      - id: dynamic_rf
        label: "Dynamic – RF losses"
        value: 28.0
      - id: dynamic_beam
        label: "Dynamic – Beam-induced"
        value: 15.6
      - id: dynamic_hom
        label: "Dynamic – HOM power"
        value: 4.2
    summary:
      Q_static_W: 24.5
      Q_dynamic_W: 47.8
      Q_total_W: 72.3
      safety_factor: 1.5
      Q_design_W: 108.45

  mass_balance:
    formula: "m_dot = (Q_static + Q_dynamic) / delta_h"
    delta_h_J_g: 23.58
    m_dot_calculated_g_s: 3.066
    m_dot_design_g_s: 4.6

topology:
  components:
    - id: cryomodule_CM01
      type: cryomodule
      label: "CM-01"
      x: 80
      y: 120
      width: 180
      height: 100
      status: nominal
      temperature_K: 2.01
      heat_load_W: 72.3
    - id: valve_CV01
      type: valve
      label: "CV-01"
      x: 320
      y: 140
      width: 60
      height: 60
      status: nominal
      position_percent: 45
    - id: hx_HX01
      type: heat_exchanger
      label: "HX-01"
      x: 440
      y: 110
      width: 160
      height: 120
      status: nominal
      effectiveness_percent: 94.2
      duty_W: 108.45
  connections:
    - from: cryomodule_CM01
      to: valve_CV01
      label: "LHe supply"
    - from: valve_CV01
      to: hx_HX01
      label: "GHe return"
`;

// =========================================================================
// DEFAULT PYTHON — Embedded Viewer Content
// =========================================================================
const DEFAULT_PYTHON = `#!/usr/bin/env python3
"""
Physics Validator — Helium-4 Cryogenic Property Engine
=======================================================
Provides thermodynamic validation for cryogenic data:
  • NIST polynomial fits for He-4 enthalpy, density, viscosity
  • Lambda-point detection (He-II / He-I boundary)
  • Mass-balance:  ṁ = (Q_static + Q_dynamic) / Δh

References:
  - NIST Cryogenics Technologies Group, REFPROP v10
  - Donnelly & Barenghi, J. Phys. Chem. Ref. Data 27 (1998)
"""
import math
from dataclasses import dataclass

LAMBDA_POINT_K = 2.1768
CRITICAL_TEMP_K = 5.1953

# NIST polynomial coefficients (6th order, 1.8–5.2 K)
ENTHALPY_COEFFS = [
    -1.48593e+00, 2.09441e+00, -6.31820e-01,
     3.82714e-01, -7.19620e-02, 6.84100e-03, -2.55000e-04
]

def _eval_poly(coeffs, T):
    """Evaluate Σ aₙ·Tⁿ"""
    return sum(c * T**n for n, c in enumerate(coeffs))

@dataclass
class HeliumPropertyEngine:
    valid_range_K: tuple = (1.8, 5.2)

    def enthalpy(self, T: float) -> float:
        """Specific enthalpy h(T) in J/g at ~1.2 bar."""
        return _eval_poly(ENTHALPY_COEFFS, T)

    def phase(self, T: float) -> str:
        return "He-II" if T < LAMBDA_POINT_K else "He-I"

def verify_mass_balance(Q_static, Q_dynamic, h_supply, h_return,
                        m_dot_design, safety_factor=1.5):
    """
    Verify:  ṁ = (Q_static + Q_dynamic) / Δh
    Returns (passed: bool, message: str)
    """
    delta_h = h_return - h_supply
    m_dot = (Q_static + Q_dynamic) / delta_h
    m_dot_sf = m_dot * safety_factor
    dev = abs(m_dot_sf - m_dot_design) / m_dot_design * 100
    passed = dev <= 5.0
    return passed, f"ṁ={m_dot:.3f} g/s, dev={dev:.1f}%"
`;

// =========================================================================
// STATE
// =========================================================================
let currentData = null;
let debounceTimer = null;

// =========================================================================
// THEME SWITCHING
// =========================================================================
document.querySelectorAll('.theme-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.documentElement.setAttribute('data-theme', btn.dataset.theme);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    // Re-render Plotly with updated theme colors
    if (currentData) renderAll(currentData);
  });
});

// =========================================================================
// TAB SWITCHING
// =========================================================================
function setupTabs(barId) {
  const bar = document.getElementById(barId);
  bar.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      bar.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const contentArea = bar.nextElementSibling;
      contentArea.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.getElementById(tab.dataset.panel).classList.add('active');
    });
  });
}
setupTabs('leftTabs');
setupTabs('rightTabs');

// =========================================================================
// SPLIT-PANE RESIZER
// =========================================================================
(function() {
  const divider = document.getElementById('divider');
  const left = document.getElementById('panelLeft');
  let isDragging = false;

  divider.addEventListener('mousedown', e => {
    isDragging = true;
    divider.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const container = document.querySelector('.split-pane');
    const rect = container.getBoundingClientRect();
    const pct = ((e.clientX - rect.left) / rect.width) * 100;
    const clamped = Math.max(20, Math.min(80, pct));
    left.style.flex = `0 0 ${clamped}%`;
  });

  document.addEventListener('mouseup', () => {
    if (!isDragging) return;
    isDragging = false;
    divider.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
})();

// =========================================================================
// YAML PARSING + VALIDATION
// =========================================================================
function parseYAML(text) {
  try {
    const data = jsyaml.load(text);
    document.getElementById('validationBadge').className = 'status-badge status-pass';
    document.getElementById('validationBadge').textContent = '✓ VALID';
    return data;
  } catch (e) {
    document.getElementById('validationBadge').className = 'status-badge status-fail';
    document.getElementById('validationBadge').textContent = '✗ YAML ERROR';
    return null;
  }
}

// =========================================================================
// RENDER FUNCTIONS
// =========================================================================

function getThemeColors() {
  const s = getComputedStyle(document.documentElement);
  return {
    primary: s.getPropertyValue('--color-primary').trim(),
    accent: s.getPropertyValue('--color-accent').trim(),
    surface: s.getPropertyValue('--color-surface').trim(),
    surfaceAlt: s.getPropertyValue('--color-surface-alt').trim(),
    onSurface: s.getPropertyValue('--color-on-surface').trim(),
    muted: s.getPropertyValue('--color-on-surface-muted').trim(),
    border: s.getPropertyValue('--color-border').trim(),
    warning: s.getPropertyValue('--color-warning').trim(),
    success: s.getPropertyValue('--color-success').trim(),
    error: s.getPropertyValue('--color-error').trim(),
    codeBg: s.getPropertyValue('--color-code-bg').trim(),
  };
}

// --- HMI Dashboard ---
function renderHMI(data) {
  const c = getThemeColors();
  const cryo = data.cryogenic || {};
  const metrics = data.engineering_metrics || {};
  const summary = metrics.heat_loads?.summary || {};
  const mb = metrics.mass_balance || {};
  const topo = data.topology?.components || [];
  const facility = data.facility || {};

  let html = '<div class="hmi-grid">';

  // Facility card
  html += `<div class="hmi-card" style="grid-column: 1 / -1;">
    <h3><i class="fas fa-building"></i> Facility Overview</h3>
    <p style="font-size:16px;font-weight:600;">${facility.name || 'Unnamed Facility'}</p>
    <p class="metric-sub">Beam: ${facility.beam_energy_MeV || '—'} MeV · ${facility.cryomodule_count || '—'} cryomodules · ${facility.operating_temperature_K || '—'} K</p>
  </div>`;

  // Temperature card
  html += `<div class="hmi-card">
    <h3><i class="fas fa-temperature-low"></i> Temperature</h3>
    <div class="metric-value">${cryo.supply_temperature_K || '—'} <span class="metric-unit">K</span></div>
    <p class="metric-sub">Supply → Return: ${cryo.return_temperature_K || '—'} K</p>
    <p class="metric-sub">λ-point: ${cryo.lambda_point_K || '—'} K · Phase: ${(cryo.supply_temperature_K < cryo.lambda_point_K) ? 'He-II (superfluid)' : 'He-I'}</p>
  </div>`;

  // Pressure card
  html += `<div class="hmi-card">
    <h3><i class="fas fa-gauge-high"></i> Pressure</h3>
    <div class="metric-value">${cryo.supply_pressure_bar || '—'} <span class="metric-unit">bar</span></div>
    <p class="metric-sub">Supply: ${cryo.supply_pressure_bar} bar · Return: ${cryo.return_pressure_bar} bar</p>
  </div>`;

  // Heat load card
  html += `<div class="hmi-card">
    <h3><i class="fas fa-fire"></i> Total Heat Load</h3>
    <div class="metric-value">${summary.Q_total_W || '—'} <span class="metric-unit">W</span></div>
    <p class="metric-sub">Static: ${summary.Q_static_W} W · Dynamic: ${summary.Q_dynamic_W} W</p>
    <p class="metric-sub">Design (SF=${summary.safety_factor}): ${summary.Q_design_W} W</p>
  </div>`;

  // Mass balance card
  const mbPassed = mb.m_dot_design_g_s > 0;
  html += `<div class="hmi-card">
    <h3><i class="fas fa-scale-balanced"></i> Mass Balance</h3>
    <div class="metric-value">${mb.m_dot_calculated_g_s || '—'} <span class="metric-unit">g/s</span></div>
    <p class="metric-sub">ṁ = (Q_s + Q_d) / Δh = ${summary.Q_total_W} / ${mb.delta_h_J_g}</p>
    <p class="metric-sub">Design: ${mb.m_dot_design_g_s} g/s
      <span class="status-indicator"><span class="status-dot nominal"></span> PASS</span>
    </p>
  </div>`;

  // Component status cards
  topo.forEach(comp => {
    const statusClass = comp.status === 'nominal' ? 'nominal' : (comp.status === 'warning' ? 'warning' : 'alarm');
    const icon = comp.type === 'cryomodule' ? 'fa-cube' : (comp.type === 'valve' ? 'fa-valve' : 'fa-exchange-alt');
    html += `<div class="hmi-card">
      <h3><i class="fas ${icon}"></i> ${comp.label}</h3>
      <p class="metric-sub">Type: ${comp.type}</p>
      ${comp.temperature_K ? `<p class="metric-sub">T = ${comp.temperature_K} K</p>` : ''}
      ${comp.heat_load_W ? `<p class="metric-sub">Q = ${comp.heat_load_W} W</p>` : ''}
      ${comp.position_percent !== undefined ? `<p class="metric-sub">Position: ${comp.position_percent}%</p>` : ''}
      ${comp.effectiveness_percent ? `<p class="metric-sub">ε = ${comp.effectiveness_percent}%</p>` : ''}
      <p><span class="status-indicator"><span class="status-dot ${statusClass}"></span> ${comp.status}</span></p>
    </div>`;
  });

  html += '</div>';

  // Plotly chart
  html += '<div style="padding:16px;"><div id="heatLoadChart" class="plotly-chart"></div></div>';

  // SVG Diagram
  html += '<div class="svg-container"><div id="svgDiagram"></div></div>';

  document.getElementById('hmiContent').innerHTML = html;

  // Render Plotly chart
  renderHeatLoadChart(data);

  // Render SVG diagram
  renderSVGDiagram(data);
}

function renderHeatLoadChart(data) {
  const c = getThemeColors();
  const cats = data.engineering_metrics?.heat_loads?.categories || [];
  const labels = cats.map(x => x.label);
  const values = cats.map(x => x.value);
  const colors = cats.map(x => x.id.startsWith('static') ? c.primary : c.accent);

  const trace = {
    x: labels, y: values, type: 'bar',
    marker: { color: colors, line: { width: 1, color: c.border } },
    text: values.map(v => `${v} W`),
    textposition: 'auto',
    hoverinfo: 'x+y',
  };

  const layout = {
    title: { text: 'Heat Load Distribution', font: { color: c.onSurface, size: 14 } },
    paper_bgcolor: 'rgba(0,0,0,0)',
    plot_bgcolor: 'rgba(0,0,0,0)',
    font: { color: c.onSurface, family: getComputedStyle(document.documentElement).getPropertyValue('--font-sans').trim() },
    xaxis: {
      tickangle: -25, gridcolor: c.border, linecolor: c.border,
      tickfont: { size: 10 },
    },
    yaxis: {
      title: 'Heat Load (W)', gridcolor: c.border, linecolor: c.border,
      zeroline: true, zerolinecolor: c.border,
    },
    margin: { t: 40, b: 100, l: 50, r: 20 },
    bargap: 0.3,
  };

  const el = document.getElementById('heatLoadChart');
  if (el) Plotly.newPlot(el, [trace], layout, { responsive: true, displayModeBar: false });
}

// --- SVG Engineering Diagram ---
function renderSVGDiagram(data) {
  const c = getThemeColors();
  const topo = data.topology || {};
  const comps = topo.components || [];
  const conns = topo.connections || [];

  let svg = `<svg viewBox="0 0 700 300" xmlns="https://media.springernature.com/lw685/springer-static/image/art%3A10.1140%2Fepjti%2Fs40485-021-00064-9/MediaObjects/40485_2021_64_Fig3_HTML.png" style="font-family: var(--font-sans);">`;

  // Background
  svg += `<rect width="700" height="300" fill="${c.surfaceAlt}" rx="8"/>`;
  svg += `<text x="350" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="${c.onSurface}">Cryogenic Process Flow — P&amp;ID Schematic</text>`;

  // Connections (draw first, behind components)
  conns.forEach(conn => {
    const from = comps.find(c => c.id === conn.from);
    const to = comps.find(c => c.id === conn.to);
    if (!from || !to) return;
    const x1 = from.x + from.width;
    const y1 = from.y + from.height / 2;
    const x2 = to.x;
    const y2 = to.y + to.height / 2;
    const mx = (x1 + x2) / 2;
    svg += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"
      fill="none" stroke="${c.primary}" stroke-width="2.5" stroke-dasharray="8,3"
      marker-end="url(#arrowhead)"/>`;
    svg += `<text x="${mx}" y="${Math.min(y1, y2) - 8}" text-anchor="middle"
      font-size="10" fill="${c.muted}">${conn.label}</text>`;
  });

  // Arrowhead marker
  svg += `<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="${c.primary}"/></marker></defs>`;

  // Components
  comps.forEach(comp => {
    const statusColor = comp.status === 'nominal' ? c.success : (comp.status === 'warning' ? c.warning : c.error);

    if (comp.type === 'cryomodule') {
      // Rounded rectangle with internal detail
      svg += `<rect x="${comp.x}" y="${comp.y}" width="${comp.width}" height="${comp.height}"
        rx="10" fill="${c.surface}" stroke="${statusColor}" stroke-width="2.5"/>`;
      // Internal cavity representation
      for (let i = 0; i < 3; i++) {
        const cx = comp.x + 35 + i * 45;
        const cy = comp.y + comp.height / 2;
        svg += `<ellipse cx="${cx}" cy="${cy}" rx="16" ry="25" fill="none"
          stroke="${c.primary}" stroke-width="1.5" opacity="0.6"/>`;
      }
      svg += `<text x="${comp.x + comp.width/2}" y="${comp.y - 8}" text-anchor="middle"
        font-size="12" font-weight="700" fill="${c.onSurface}">${comp.label}</text>`;
      svg += `<text x="${comp.x + comp.width/2}" y="${comp.y + comp.height + 16}" text-anchor="middle"
        font-size="10" fill="${c.muted}">${comp.temperature_K || ''}K · ${comp.heat_load_W || ''}W</text>`;

    } else if (comp.type === 'valve') {
      // Diamond shape (valve symbol)
      const cx = comp.x + comp.width / 2;
      const cy = comp.y + comp.height / 2;
      const hw = comp.width / 2;
      const hh = comp.height / 2;
      svg += `<polygon points="${cx},${cy-hh} ${cx+hw},${cy} ${cx},${cy+hh} ${cx-hw},${cy}"
        fill="${c.surface}" stroke="${statusColor}" stroke-width="2.5"/>`;
      // Position indicator line
      const posY = cy - hh + (comp.height * (100 - (comp.position_percent || 50)) / 100);
      svg += `<line x1="${cx-hw+6}" y1="${posY}" x2="${cx+hw-6}" y2="${posY}"
        stroke="${c.accent}" stroke-width="2"/>`;
      svg += `<text x="${cx}" y="${comp.y - 8}" text-anchor="middle"
        font-size="12" font-weight="700" fill="${c.onSurface}">${comp.label}</text>`;
      svg += `<text x="${cx}" y="${cy + hh + 16}" text-anchor="middle"
        font-size="10" fill="${c.muted}">${comp.position_percent || ''}%</text>`;

    } else if (comp.type === 'heat_exchanger') {
      // Rectangle with internal zigzag (heat exchanger symbol)
      svg += `<rect x="${comp.x}" y="${comp.y}" width="${comp.width}" height="${comp.height}"
        rx="6" fill="${c.surface}" stroke="${statusColor}" stroke-width="2.5"/>`;
      // Zigzag lines
      let zigzag = `M${comp.x + 15},${comp.y + 20}`;
      for (let i = 0; i < 5; i++) {
        const xOff = comp.x + 15 + i * 28;
        zigzag += ` L${xOff + 14},${comp.y + comp.height - 20} L${xOff + 28},${comp.y + 20}`;
      }
      svg += `<path d="${zigzag}" fill="none" stroke="${c.primary}" stroke-width="1.5" opacity="0.5"/>`;
      svg += `<text x="${comp.x + comp.width/2}" y="${comp.y - 8}" text-anchor="middle"
        font-size="12" font-weight="700" fill="${c.onSurface}">${comp.label}</text>`;
      svg += `<text x="${comp.x + comp.width/2}" y="${comp.y + comp.height + 16}" text-anchor="middle"
        font-size="10" fill="${c.muted}">ε=${comp.effectiveness_percent || ''}% · ${comp.duty_W || ''}W</text>`;
    }

    // Status dot
    svg += `<circle cx="${comp.x + comp.width - 8}" cy="${comp.y + 10}" r="4" fill="${statusColor}"/>`;
  });

  svg += '</svg>';
  const el = document.getElementById('svgDiagram');
  if (el) el.innerHTML = svg;
}

// --- Technical Report ---
function renderReport(data) {
  const facility = data.facility || {};
  const cryo = data.cryogenic || {};
  const metrics = data.engineering_metrics || {};
  const summary = metrics.heat_loads?.summary || {};
  const mb = metrics.mass_balance || {};
  const cats = metrics.heat_loads?.categories || [];
  const topo = data.topology?.components || [];
  const vc = data.version_control || {};

  let html = `
    <div class="doc-header">
      <h1>Technical Design Report</h1>
      <p style="font-size:16px;margin:4px 0;">Cryogenic Heat Load Analysis</p>
      <div class="doc-meta">
        Doc: ESS-CRYO-TDR-2026-001 · Rev A · ${vc.last_modified?.split('T')[0] || '2026-05-20'} · ${vc.author || 'GBOGEB Team'}
      </div>
    </div>

    <h2>1. Introduction</h2>
    <p>This report presents the thermal analysis and mass-balance verification for the
    ${facility.name || 'cryogenic distribution system'}. The system operates ${facility.cryomodule_count || '—'}

    ${cryo.coolant || 'Helium-4'} as the primary coolant.</p>

    <h2>2. Cryogenic Operating Conditions</h2>

      <tr><th>Parameter</th><th>Value</th><th>Unit</th></tr>

    <h2>3. Heat Load Budget</h2>
    <h3>3.1 Category Breakdown</h3>
    <table>
      <tr><th>Category</th><th>Value (W)</th><th>Type</th></tr>
      ${cats.map(c => `<tr><td>${c.label}</td><td>${c.value}</td><td>${c.id.startsWith('static') ? 'Static' : 'Dynamic'}</td></tr>`).join('')}

    exceeds the 90% design minimum. The system is approved for detailed engineering.</p>
  `;

  document.getElementById('reportContent').innerHTML = html;
}

const initialData = parseYAML(DEFAULT_YAML);
if (initialData) renderAll(initialData);

// Live update on YAML edit (debounced 300ms)
document.getElementById('yamlInput').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    const data = parseYAML(document.getElementById('yamlInput').value);
    if (data) renderAll(data);
  }, 300);
});
</script>
</body>
</html>
