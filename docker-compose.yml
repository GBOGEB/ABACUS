version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys;s=socket.socket();sys.exit(0 if s.connect_ex(('127.0.0.1',8000))==0 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - app-data:/app/data

volumes:
  app-data:
