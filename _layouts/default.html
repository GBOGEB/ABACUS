<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="generator" content="GBOGEB/ABACUS {{ site.gbogeb.version }}">

  <!-- WCAG AA Compliant Semantic Theme -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  {% seo %}
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header role="banner">
    <nav role="navigation" aria-label="Primary navigation">
      <div class="nav-container">
        <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
      </div>
    </nav>
  </header>

  <main id="main-content" role="main">
    {{ content }}
  </main>

  <footer role="contentinfo">
    <div class="footer-container">
      <p>
        Generated by <strong>GBOGEB/ABACUS</strong> v{{ site.gbogeb.version }}
        | Governance: {{ site.gbogeb.governance_mode }}
        | WCAG: {{ site.gbogeb.wcag_level }}
      </p>
      <p class="lineage-note">
        <em>Generated outputs are NEVER canonical.</em>
        Source of truth: <code>GBOGEB/CODEX</code>
      </p>
    </div>
  </footer>

  <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
</body>
</html>
