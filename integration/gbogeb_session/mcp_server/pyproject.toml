[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gbogeb-mcp-server"
version = "1.0.0"
description = "Model Context Protocol server for GBOGEB dual-repository context sharing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "GBOGEB Engineering Team", email = "gbogeb@mcp.dev"},
]
keywords = ["mcp", "model-context-protocol", "gbogeb", "engineering", "cryogenics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
gbogeb-mcp = "gbogeb_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gbogeb_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
