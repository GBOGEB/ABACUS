physical_findings:
  - id: DOW-PVPS-01
    result: REJECT_PRINTED_ARITHMETIC
    statement: "The offer expression 4 x 18.5 = 78 kW is numerically invalid; 74 kW is exact."
  - id: DOW-PVPS-02
    result: DEFER_83KW_BOUNDARY
    statement: >-
      83 kW is 12.16% above the aggregate 74 kW motor rated power. Without an explicit package boundary,
      running count/frequency/load and auxiliary definition, the 83 kW same-point claim is not independently reproducible.
  - id: DOW-PVPS-03
    result: DEFER_COOLING_RECONCILIATION
    statement: >-
      75 kW cooling duty is 90.36% of the stated 83 kW electrical value but 101.35% of the exact 74 kW aggregate
      motor nameplate. This supports the need for a defined electrical/package boundary; it does not prove one.
  - id: DOW-PVPS-04
    result: HISTORIC_DIAGNOSTIC_ONLY
    statement: >-
      LKT MOL-STUDY22 / Leybold data for the different historic SV630BF gives about 15 kW per pump at 400 mbar.a
      versus 20 kW motor rated power. It is useful as a plausibility prior only and cannot validate the current SV750BF point.

recommendation_to_keb: DEFER
required_return:
  - bidder/OEM current SV750BF performance curve or calculation at the actual 2K-OP suction condition
  - number of pumps running at 2K-OP and per-pump VFD frequency/load
  - PVPS helium mass flow at the same point, not total plant compressor circulation unless explicitly reconciled
  - suction pressure and temperature and discharge pressure at the same point
  - explicit definition of the 83 kW boundary and reconciliation of the erroneous 78 kW table entry
  - explicit definition/reconciliation of the 75 kW cooling-water heat duty
