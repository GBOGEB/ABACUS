    - C24_C30_configuration
    - support_system_permissives_and_loss_impact
    - N_plus_1_and_degraded_capability
    - Table10_failure_consequence
    - RAMS_and_safety_barriers
    - RCM_spares_service_and_lifecycle_cost
    - code_standard_lifecycle_evidence
