# federation/manifest.yaml
# Global federation entry point for GBOGEB/ABACUS (DELTA_1 runtime plane).
# This file is the canonical listing of federation members, DEV snapshots,
# and assimilation hooks used by src/dmaic/federation.py and CI smoke tests.
#
# Authoritative spec: runtime/federation/codex-abacus-federation.yaml

federation:
  moniker: DELTA_1
  version: "1.0"

  planes:
    governance:
      repository: GBOGEB/CODEX
      role: governance_plane
      spec_ref: runtime/federation/codex-abacus-federation.yaml
    math:
      repository: GBOGEB/gg_MATH
      role: math_ssot_plane
      spec_ref: kernels/
      responsibility:
        - canonical_pca_bradley_terry_kernels
        - exact_jacobi_eigendecomposition_and_parallel_analysis
        - fail_closed_mle_ranking_with_defer_guards
        - parity_contracts_for_downstream_consumers
      authority_transfer: false
      parity_binding: qps_slide_reviewer/parity/QPS_SLIDE_REVIEWER_PARITY_CONTRACT_v1.md
    runtime:
      repository: GBOGEB/ABACUS
      role: runtime_plane
      spec_ref: runtime/federation/codex-abacus-federation.yaml
    notebook:
      repository: GBOGEB/CODESPACES_jyperter
      branch: main
      role: notebook_plane
      spec_ref: runtime/federation/codex-abacus-federation.yaml
      responsibility:
        - notebook_execution
        - interactive_analysis
        - artifact_visualization
        - jupyter_based_reporting
    cryoplant:
      repository: GBOGEB/cryoplant-project
      role: auxiliary_plane
      spec_ref: integration/cryoplant_project/federation/manifest.yaml
      responsibility:
        - myrrha_qps_qplant_cryoplant_engineering_analyses
        - binaries_segregation_policy_and_manifest_generator
        - bidirectional_smoke_warmup_against_secondary_repo_cluster

  member_repos:
    - name: GBOGEB/ABACUS
      plane: runtime
      status: active
    - name: GBOGEB/CODEX
      plane: governance
      status: active
    - name: GBOGEB/gg_MATH
      plane: math
      status: active
      role: math_ssot_plane
      # Mathematical single source of truth for PCA / Bradley-Terry across the
      # federation. Downstream consumers (qps_slide_reviewer, CODEX pca_engine)
      # bind to its kernels via parity contracts rather than re-deriving math.
      # Registered on branch feat/register-gg_math-ssot-and-qps-parity.
    - name: GBOGEB/morris.js
      plane: auxiliary
      status: active
    - name: GBOGEB/CODESPACES_jyperter
      plane: notebook
      status: active
      role: interactive_execution_plane
    - name: GBOGEB/cryoplant-project
      plane: auxiliary
      status: active
      # Activated 2026-10-11 after the pairwise smoke ran from both
      # directions: cryoplant-project scripts/federation_smoke.py (all
      # targets reachable, status ok) and, from this side,
      # integration/cryoplant_project/scripts/reciprocal_smoke.py, which
      # reads cryoplant-project's own manifest at its main head over the
      # GitHub API (evidence in
      # integration/cryoplant_project/federation/reciprocal_smoke.json,
      # status ok at 101695a). The local tests in
      # integration/cryoplant_project/tests only read this repository and
      # require that evidence while the member is active. Registration
      # history below.
      # Self-declared on the cryoplant-project side (see its own
      # federation/manifest.yaml, branch
      # federation/delta1-auxiliary-member-20260831). Registered here on
      # ABACUS's own branch federation/register-cryoplant-project-20260831,
      # status left as "proposed" (not "active") until both branches merge
      # and the pairwise smoke check has run for real from both directions.
      role: cryoplant_engineering_auxiliary_plane

  dev_snapshots:
    # DEV snapshot folders registered here for provenance;
    # NOT integrated into main src tree.
    - path: ABACUS-v031/
      status: legacy
      note: Pre-V3 baseline snapshot
    - path: ABACUS-v032/
      status: snapshot
      note: V3.2 feature snapshot
    - path: deepagent-handover-package/
      status: snapshot
      note: TypeScript handover stubs
    - path: ABACUS-UNIFIED/
      status: merged
      note: Unified merge checkpoint

  assimilation_hooks:
    # Python entry point: src/dmaic/federation.py::assimilate()
    # Called by recursive_build.py --smoke --index GLOBAL_index.json
    entry_point: src/dmaic/federation.py
    function: assimilate
    smoke_test: DMAIC_V3/tests/test_smoke_federation.py

  knowledge_basis_refs:
    - docs/FEDERATION_TOPOLOGY.md
    - docs/CODEX_ABACUS_FEDERATION_MATRIX.md
    - KNOWLEDGE_SYSTEMS_ARCHITECTURE.md
    - docs/session-lifecycle/README.md
