    adopted_learning:
      - activity_without_accepted_receipt_has_zero_score_delta
      - use_fixed_before_after_delta_target_remaining_gap_reporting
      - separate_diagnosis_gain_from_readiness_credit
  QPS_CRYOPLANT:
    adopted_learning:
      - >-
        separate_structural_preparation_from_weighted_readiness_and_publish_permission
      - track_absolute_release_artifact_count_type_size_and_materialization_state
      - exact_SHA_runtime_then_parity_then_publication_envelope_then_tag_archive
  CODEX:
    adopted_learning:
      - freeze_terminal_prerequisite_denominator
      - track_strict_non_PASS_outstanding_separately_from_equivalent_outstanding
      - track_items_under_executable_attack_without_counting_queued_as_PASS
  ABACUS:
    retained_strengths:
      - exact_pathset_fingerprints_for_authority_disposition
      - release_critical_unknown_asset_classification
      - full_file_index_with_size_last_touch_commit_and_300_second_temporal_clusters
      - measured_PCA_rows_require_numeric_features_and_distinct_source_SHAs

