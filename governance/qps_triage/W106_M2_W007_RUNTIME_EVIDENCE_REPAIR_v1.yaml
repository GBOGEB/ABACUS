    rationale: >-
      governance.py is the actual authority that writes dmaic_snapshot.json,
      governance_snapshot.json and completion_vector.json through the DMAIC/governance
      generators; tests/test_governance.py executes that generator and verifies the
      written governance and completion outputs. Traceability therefore binds to
      executable source plus executable verification rather than pretending ignored
      generated files are permanent repository evidence.
