purpose: >-
  Keep one current issue-burndown queue with evidence-backed closure gates.

rules:
  - Do not close from age or title alone.
  - Fixes require a merged PR and the required runtime or CI receipt.
  - Verification closures cite the exact proving receipt.
  - Local, private, and owner-admin gates do not consume coding capacity.
  - Parent issues stay open only while they own a distinct live outcome.
  - A red detector is not prevention; merge admission is separate.

