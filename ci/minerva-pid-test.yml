# MINERVA QCELL/RFCELL P&ID subproject — regenerate + test (W001-W005)
# Scoped to MINERVA_PID/** so it never interferes with other ABACUS subprojects.
name: MINERVA P&ID — build & test

on:
  push:
    paths:
      - "MINERVA_PID/**"
      - ".github/workflows/minerva-pid-test.yml"
  pull_request:
    paths:
      - "MINERVA_PID/**"
      - ".github/workflows/minerva-pid-test.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: MINERVA_PID

jobs:
  build-and-test:
    name: build & test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native Cairo (required by CairoSVG)
        run: sudo apt-get update && sudo apt-get install -y libcairo2 libcairo2-dev

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies (exact pins)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify CairoSVG native binding
        run: python -c "import cairosvg; print('cairosvg', cairosvg.__version__)"

      - name: Regenerate all derived outputs (make.sh)
        run: |
          chmod +x make.sh
          ./make.sh

      - name: Run test suite (standalone runners — no pytest)
        run: |
          export PYTHONPATH=src
          fail=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            python3 "$t" || fail=1
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more MINERVA P&ID test files failed."
            exit 1
          fi
