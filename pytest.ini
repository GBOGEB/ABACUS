[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
console_output_style = progress
addopts =
    -v
    --strict-markers
    --tb=short
    --maxfail=3
    --color=yes
    -ra

norecursedirs = .git .tox dist build *.egg 11_PREVIOUS_SESSIONS BACKUPS venv .venv

markers =
    bootstrap_stats: Statistical computation tests
    data_loading: Data ingestion tests
    integration: End-to-end workflow tests
    edge_cases: Boundary condition tests
    phase0: Phase 0 environment gate tests
    dow_core: DOW core smoke tests
    slow: Tests that take a long time to run
    unit: Unit tests
    functional: Functional tests
    bridge: Bridge connectivity and synchronization tests
    dmaic: DMAIC phase-aligned tests (Define-Measure-Analyze-Improve-Control)
    smoke: Smoke tests for quick validation
    env: Environment setup and configuration tests
    docker: Docker container and image tests
    db: Database connectivity and query tests
    agents: Agent and API integration tests
    mcp: Model Context Protocol tests
    dow: DOW test suite compliance marker
    dmaic_phase_1: DMAIC Phase 1 - Define
    dmaic_phase_2: DMAIC Phase 2 - Measure
    dmaic_phase_3: DMAIC Phase 3 - Analyze
    dmaic_phase_4: DMAIC Phase 4 - Improve
    dmaic_phase_5: DMAIC Phase 5 - Control
    ci_core: Core CI/CD tests
    gbgeb: GBGEB-specific tests
    bootstrap: Bootstrap statistical tests
    artifact: Artifact tracking marker

[coverage:run]
source = .
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*
    */BACKUPS/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:

[coverage:html]
directory = htmlcov
