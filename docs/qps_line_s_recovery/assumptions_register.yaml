# QPS Line S Recovery - Assumptions and Provenance Register
# Wave 0 spine. Every published number must trace to a row here.
# status: one of {RESOLVED, UNRESOLVED, OPEN_RFI, CALIBRATION_PENDING}
# Nothing downstream may use a default for an UNRESOLVED quantity.

meta:
  build: qps_line_s_recovery
  track: MDA
  pr: GBOGEB/ABACUS#582
  branch: w001
  merge_allowed: false
  lineage_anchor:
    chatgpt_share_url: TODO_PASTE_EXPORT_URL
    first_prompt: "120 m3 vessel, 1 to 15 barg He, 300 K: mass plus fill-rate sensitivity"
    raw_file: S_line_raw.txt
    chain:
      - initial helium mass and filling model
      - Line S pressure-buffer framing for RTM-261 and RTM-292
      - D2.1 pages 34 to 37 LOOP source basis
      - Appendix 8.2, 8.3, 8.4 integration
      - native DOCX parsing
      - corrected 8700 W heat-load sensitivity
      - ABACUS PR 582
      - Agent A issue 583, Agent B issue 584, CODEX helper issue 237

blockers:
  - id: V_EFF
    quantity: effective connected gas volume during the transient
    value: null
    unit: m3
    status: UNRESOLVED
    confidence: none
    why_it_matters: >
      dP/dt scales as 1/V_eff. The 120 m3 value used earlier was inherited
      from an unrelated storage-vessel prompt and must not be treated as the
      Line S effective volume. The response remains parametric until resolved.
    decompose:
      - line_s_pipe_volume: {value: null, unit: m3, status: OPEN_RFI}
      - connected_buffer_or_balloon: {value: null, unit: m3, status: OPEN_RFI}
      - warm_ghe_header_open_during_transient: {value: null, unit: m3, status: OPEN_RFI}
    depends_on: [VALVE_STATE_8_4]
    interim_handling: report answer parametrically in V_eff over [9, 30, 120, 240] m3

  - id: P_LIMIT
    quantity: most restrictive applicable Line S pressure ceiling
    value: null
    unit: bar
    status: OPEN_RFI
    formula: min(design, max_operating, relief_set_minus_margin, recovery_suction_max, hp_suction_max, interface_max)
    components:
      design_pressure: {value: null, status: OPEN_RFI}
      max_operating_pressure: {value: null, status: OPEN_RFI}
      relief_set_pressure: {value: null, status: OPEN_RFI}
      recovery_suction_max: {value: null, status: OPEN_RFI}
      hp_suction_max: {value: null, status: OPEN_RFI}
      interface_max: {value: null, status: OPEN_RFI}
    why_it_matters: t_available = (P_limit - P_initial)/(dP/dt); no ceiling means no final answer.

  - id: RECOVERY_POWER_DURING_LOOP
    quantity: are 2 x 50 g/s recovery compressors powered during loss of utility
    value: null
    status: OPEN_RFI
    confidence: none
    why_it_matters: >
      If not on credited backup, recovery during LOOP is not 100 g/s. The
      balanced 100 g/s case then becomes invalid for LOOP.
    source: D2.1 5.6.5 diesel backup concept

asserted_inputs:
  - id: MDOT_IN_PRE_HP_MAX
    value: 112
    unit: g/s
    status: UNRESOLVED
    confidence: low
    note: Governing pre-HP inflow. Origin still requires Applicant trace.
    source: user-supplied conversation basis

  - id: HP_CAPACITY
    value: 100
    unit: g/s
    status: UNRESOLVED
    confidence: low
    note: Assumed so 200 g/s equals 100 g/s recovery plus 100 g/s HP acceptance. Confirm against HP suction curve.

  - id: T_GAS
    value: 300
    unit: K
    status: CALIBRATION_PENDING
    confidence: low
    note: Line S range is mixed 2 to 292 K. Fixed-T is only a sanity ribbon; energy balance is governing.

heat_load:
  design_point: {value: 8700, unit: W, status: RESOLVED, note: D2.1 design or loaded point}
  true_nominal_baseline: {value: 6042, unit: W, status: RESOLVED, formula: 8700 / 1.44}
  uncertainty_case: {value: 7250, unit: W, status: RESOLVED, formula: 8700 * 100 / 120}
  margin_factor_1_44:
    value: 1.44
    status: UNRESOLVED
    note: Pedigree undocumented. Confirm whether it is 1.2 x 1.2, code factor, or contingency.

physics_findings:
  - id: H1_energy_balance
    statement: >
      Fixed-temperature mass balance under-predicts the early pressure rise by
      gamma = 5/3 in the ideal charging limit. This is now represented in the
      energy-balance spine and test plan.
    status: RESOLVED_IN_CODE
    test: tests/test_line_s_buffer.py::test_energy_balance_is_gamma_times_ribbon

  - id: H2_heat_to_flow
    statement: >
      8700 W drives 4 K bath boil-off into Line S, not the shield-coolant supply.
      Pure 4 K latent heat would imply approximately 420 g/s, so the D2.1
      100 to 150 g/s relief is an integrated bath response requiring calibration.
    status: CALIBRATION_PENDING
    owner: Agent A and Agent B

constants:
  R_He: {value: 2077.2, unit: J/kg/K}
  cp_He: {value: 5193.0, unit: J/kg/K}
  cv_He: {value: 3115.8, unit: J/kg/K}
  gamma: {value: 1.6667}
  h_fg_He_4K: {value: 20700, unit: J/kg, note: anchor for boiloff link}
  Z_He: {value: "1.00-1.02", note: ideal-gas default acceptable for first-pass range}

rtm_refs:
  RTM-260: helium loss <= 1 percent inventory
  RTM-261: accept 200 g/s normal and 100 g/s abnormal return without loss
  RTM-262: recover normal circulation post-event
  RTM-292: Line S and recovery interface pressure build-up
  OFFER-22: Applicant recovery strategy, storage, and maximum accepted flow
