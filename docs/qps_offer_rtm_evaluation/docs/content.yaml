- index: 25
  elements:
  - shape: Title 1
    type: text
    text: Appendix F — Deriving the SAE Frequency Limit
  - shape: Text Placeholder 2
    type: text
    text: How the 90-day continuity requirement becomes RTM-05's annual rate cap
  - shape: TextBox 4
    type: text
    text: '1. Continuity requirement

      QPLANT shall support ≥ 90 consecutive days at 2 K, with no unplanned operational-state transition
      — the user-relevant continuity metric.

      2. Model it as Poisson

      Class-A Service-Affecting Events (SAE) are modeled as a Poisson process, constant rate λ. For a
      90-day window, t = 90/365 = 0.2466 y, and P(zero SAE) = e^(−λt) (Appendix D).

      3. Invert for the rate cap

      Requiring P(zero SAE) ≥ 0.95 over 90 days gives λ ≤ −ln(0.95)/0.2466 ≈ 0.208 SAE/year, i.e. MTBF_A
      ≥ 4.8 years — not an unrealistic number, once read correctly.

      4. Duty-factor conversion

      SAE statistics are gathered during active 2 K time. For the nominal duty factor d = 9/14, calendar
      time = active 2 K time / d — this is how a per-active-time rate becomes a calendar-year rate.'
  - shape: Rounded Rectangle 5
    type: text
    text: A COMMON MISREADING  Reading the success target as ≤1% failure probability over the entire multi-year
      mission (not per 90-day campaign) implies MTBF ≈ 387 years — see Appendix D (2/2), example 3. RTM-05
      is deliberately written as an annual rate, not a lifetime probability.
  - shape: Rounded Rectangle 6
    type: text
    text: RTM-05 (NORMATIVE)  The QPLANT design shall limit the frequency of Service-Affecting Events
      (SAE) attributable to QPLANT — unplanned transitions out of 2 K Operation — to λ_SAE ≤ 0.26 events
      per calendar year, averaged over representative operating periods. ≈ one SAE every 46.7 calendar
      months.
  - shape: Rounded Rectangle 7
    type: text
    text: 'ANNEX X — METHOD  Compliance is assessed with the same Poisson event-rate model (Appendix D),
      applied to the declared operational duty cycle. Worked check: λ ≈ 12/46.7 ≈ 0.257 SAE/yr → P(N=0,
      90 d) ≈ e^(−0.257×0.2466) ≈ 0.94 — satisfies RTM-05a.'
  - shape: Slide Number Placeholder 9
    type: text
    text: '25'
  dmaic_phase: ANALYZE
