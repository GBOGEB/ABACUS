    text: Appendix D (1/2) — Poisson Reliability Model
  - shape: Text Placeholder 2
    type: text
    text: Methodology behind every campaign-success number in this compendium
  - shape: TextBox 4
    type: text
    text: 'The model

      Failures are modeled as a Poisson process with constant rate λ (events/year) — equivalent to assuming
      a constant hazard rate, i.e., MTBF = 1/λ.

      What the chart shows

      P₀ = probability of zero trips within a time window, as MTBF varies. Three windows are plotted:
      the 90-day campaign (the operational requirement), 1 year, and 5 years (long-term intuition check).

      Formula

      P(N=0) = e^(−λt),  with  t in years and  λ = 1 / MTBF.'
  - shape: Rounded Rectangle 5
    type: text
    text: WHERE THIS GETS USED  Appendix D (2/2) applies this to three specific cases; Appendix F uses
      it to derive RTM-05's 0.26 events/year limit; Appendix I applies the same logic with a Weibull (age-dependent)
      hazard instead of a constant one.
  - shape: Slide Number Placeholder 8
    type: text
    text: '22'
  dmaic_phase: ANALYZE
  speaker_notes: 'This slide replaces 5 near-identical Poisson-curve screenshots from the original working
    deck (all plotting the same P0=e^-lambda*t relationship with progressively more annotation layered
    on) with one clean chart and the underlying formula stated once. Full original chart axis/curve legend:
    X-axis = trips per year (lambda), the Poisson event rate, equivalent to MTBF = 1/lambda. Y-axis =
    probability of zero trips over a given time window. Curves = 90-day campaign (physics continuity requirement),
    1 year (operational intuition), 5 years (long-term cold-operation intuition). All curves follow P(N=0)
    = exp(-lambda*t).'
