- index: 10
  elements:
  - shape: Title 1
    type: text
    text: Unit Economics — Single HP Compressor
  - shape: Text Placeholder 2
    type: text
    text: Isothermal Compression Power & Energy Cost (new — not in baseline)
  - shape: Text Placeholder 3
    type: text
    text: 'Model

      Isothermal compression, Ẇ = ṁ·R·T·ln(P₂/P₁) — the thermodynamic best case for a water-cooled, intercooled
      screw compressor.

      Assumptions (flagged)

      T=300 K inlet · P₂=14 bar(a) (Slide 6) · P₁≈1.1 bar(a) LP suction (assumed, not in RTMs) · η_isothermal=50%
      · helium, R=2077 J/(kg·K)

      Flow point used

      112.5 g/s = FSD 575 @ 72 Hz (Slide 8) — same per-unit number as the N−1 and Hz-requirement charts.

      VFD & cooling note

      Water-cooling keeps compression near-isothermal; VFD scales power ~linearly with flow, not cubically.'
  - shape: Rounded Rectangle 4
    type: text
    text: KEY TAKEAWAY  The 50%-isothermal model, with a plausible 1.1 bar suction assumption, reproduces
      the deck's own 350 kW nameplate rating to within 2% — a useful sanity check on both numbers.
  - shape: Slide Number Placeholder 7
    type: text
    text: '10'
  dmaic_phase: MEASURE
  speaker_notes: 'This slide is new — it is not derived from a baseline slide. It fills a gap the deck''s
    compressor sizing sections did not cover: what a single HP compressor actually costs to run. Isothermal
    compression is the correct idealisation for a water-cooled, intercooled screw machine (it is the thermodynamic
    lower bound on required work; real machines sit between isothermal and adiabatic depending on cooling
    effectiveness). The 50% isothermal efficiency figure is a reasonable planning assumption for this
    class of machine but should be confirmed against the OEM''s actual performance curve. The suction
    pressure (1.1 bar) is not stated anywhere in the RTMs excerpted in this deck and is flagged as an
    assumption — sensitivity: 1.05-1.5 bar suction brackets 313-363 kW, i.e. the 350 kW nameplate sits
    comfortably inside that range. The energy-cost figures use illustrative tariff bands (€0.12-0.20/kWh);
    replace with the actual SCK CEN industrial electricity contract rate before using this for a budget
    submission. This slide''s real purpose is to make the case, in Euros, for why the CONTROL section''s
    predictable-replacement policy matters: running cost this large dwarfs a single overhaul, so keeping
    the compressor in its efficient operating window is itself worth money, independent of the reliability
    argument.'
