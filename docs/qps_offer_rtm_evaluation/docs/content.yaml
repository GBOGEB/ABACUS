    text: How to read this master deck, part 2 — why the numbers behave the way they do
  - shape: Text Placeholder 3
    type: text
    text: 'ANALYZE  (Slides 22–28)

      This is the deck''s math core: the Poisson/exponential campaign-success model, the 94–95% reliability
      ceiling, the Wrong / Better / Chosen architecture trade-off, and the Weibull wear-out relation that
      eventually limits any MTBF-only argument.

      This section is intentionally chart-heavy — the technical-blue banner marks it as the deck''s quantitative
      narrative, distinct from the definitional purple sections either side.

      This is a MASTER slide set — the Analyze section alone can be lifted into a standalone reliability-math
      briefing.'
  - shape: Rounded Rectangle 4
    type: text
    text: SAMPLE CALC — Poisson  MTBF = 5 y → λ = 1/5 = 0.200 / y. P(zero trips, 90 d) = e^(−λt) = e^(−0.200
      × 0.246) ≈ 95.3%  →  the origin of the deck's ~95% campaign figure (Slides 22–23, 25).
  - shape: Rounded Rectangle 5
    type: text
    text: SAMPLE CALC — Weibull  β = 2.5, η = 114,400 h (cold compressor). P(fail in next 90 d | age =
      5 y) is ≈ 235× the same-window probability right after a good-as-new overhaul (Slide 28) — the mechanism
      that IMPROVE (part 3) responds to.
  - shape: Rounded Rectangle 6
    type: text
    text: '94–95%

      90-day campaign

      success ceiling (single-train)'
  - shape: Rounded Rectangle 7
    type: text
    text: 'β > 1

      hazard rises with age →

      MTBF alone understates risk'
  - shape: Slide Number Placeholder 9
    type: text
    text: '3'
  dmaic_phase: ANALYZE
