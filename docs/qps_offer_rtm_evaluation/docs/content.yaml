  - shape: TextBox 4
    type: text
    text: 'The system

      3 cold compressors in series, no redundancy — losing one means the plant cannot maintain 27 mbar.
      A pure series system: λ_train = 3 × λ_stage.

      Train MTBF

      Single-stage MTBF = 105,000 h (Appendix G) ⇒ MTBF_train = 105,000 / 3 ≈ 35,000 h ≈ 4.0 years — the
      number used for Class A failure frequency and RTM-030/031 aggregation.

      Why Weibull, not just MTBF

      Slide 31 explains the general relation h(t) = (β/η)·(t/η)^(β−1): whenever β > 1, hazard rises with
      age. The table (right) applies it to real components instead of restating the formula.'
