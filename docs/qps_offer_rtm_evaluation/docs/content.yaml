  - shape: Slide Number Placeholder 1
    type: text
    text: '30'
  - shape: Rectangle 2
    type: text
    text: The Hidden Assumption
  - shape: TextBox 7
    type: text
    text: 'MTBF only means what we want it to mean if failures arrive at random, at a constant rate —
      the Poisson/exponential assumption used throughout the ANALYZE section (Slides 22–28). Under that
      assumption, a component with MTBF = 5 years is exactly as likely to fail in month one as in month
      fifty.

      That is a convenient mathematical fiction, not a description of real machinery. It holds well for
      random, external trips — it says nothing about wear. The chart opposite is the same Poisson relationship,
      one more time, as a reminder that everything to its left was built on a flat hazard rate.'
  - shape: Rounded Rectangle 8
    type: text
    text: KEY TAKEAWAY  A single MTBF number silently assumes “no aging.” The next slides show why that
      assumption has an expiry date.
  dmaic_phase: IMPROVE
- index: 31
  elements:
  - shape: Slide Number Placeholder 1
    type: text
    text: '31'
  - shape: Rectangle 2
    type: text
    text: When MTBF Lies — the Wear-Out Boundary
  - shape: Text Placeholder 2
    type: text
    text: Assumptions
  - shape: TextBox 10
    type: text
    text: 'Appendix I''s (Slide 28) RCM/Weibull relation, h(t) = (β/η)·(t/η)^(β−1), makes the limit explicit:
      whenever β > 1, hazard rate rises with age, and a single constant MTBF understates real short-term
      risk near end-of-life. Appendix I''s worked example shows the effect is not small: for a β = 2.5
      asset (oil screw / cold compressor), the chance of failing in the next 90 days after 5 years in
      service is 200–240× higher than the same 90 days right after a good-as-new overhaul.'
  - shape: Rounded Rectangle 11
    type: text
    text: KEY TAKEAWAY  MTBF governs the plant's average reliability budget. Weibull shape (β) governs
      whether any one unit is quietly approaching a cliff.
  dmaic_phase: IMPROVE
- index: 32
  elements:
  - shape: Slide Number Placeholder 1
    type: text
    text: '32'
  - shape: Rectangle 2
    type: text
    text: 'Case File: HP Compressors'
  - shape: TextBox 5
    type: text
    text: "The HP screw compressors carry an assumed 350,000 h MTBF\n— long enough that, under the Poisson\
      \ model, a bare 3-of-3 no-redundancy train still clears 90 days with 98.2% probability. That number\
      \ is comforting only while the compressors stay inside their flat-hazard useful-life window.\nScrew\
      \ compressors wear through bearings, seals and rotor packages on a calendar/duty-cycle clock that\
      \ the Poisson model on the page knows nothing about. \nThe 3+1 redundancy case (right) does not\
      \ just buy short-window margin — it buys the time needed to pull a unit for scheduled service before\
      \ it enters its own wear-out region."
  - shape: Rounded Rectangle 6
    type: text
    text: KEY TAKEAWAY  Redundancy here is not only insurance against random failure — it is the maintenance
      window that makes predictable replacement possible.
  dmaic_phase: IMPROVE
- index: 33
  elements:
  - shape: Slide Number Placeholder 1
    type: text
    text: '33'
  - shape: Rectangle 2
    type: text
    text: 'Case File: PVPS'
  - shape: TextBox 6
    type: text
    text: "PVPS multiplies the same logic across (up to) nine parallel units. At 9-of-9 with no spare,\
      \ the 5-year probability of at least one trip is 67.6% \n— not because any single pump is unreliable,\
      \ but because unreliability compounds as fleet size grows.\nN+1 and N+2 sparing claw back the 90-day\
      \ and 1-year numbers dramatically, but the 5-year figure stays stubborn (13–33%): \nover long horizons,\
      \ “more components” re-introduces the wear-out problem this section is about. Sparing buys statistical\
      \ margin against random failure — it does not buy the fleet time out of its wear-out clock."
  - shape: Rounded Rectangle 7
    type: text
    text: KEY TAKEAWAY  For a 9-unit fleet, the honest 5-year reliability number is a scheduling problem,
      not just a redundancy problem.
  dmaic_phase: IMPROVE
- index: 34
  elements:
  - shape: Slide Number Placeholder 1
    type: text
    text: '34'
  - shape: Rectangle 2
    type: text
    text: 'Case File: Turbines — Nowhere to Hide'
  - shape: TextBox 6
    type: text
    text: 'MTBF values indicative – since different values for type of turbine


      Spare, redundant NOT possible – since position of trips dictates the cooling – where would the spare
      be?


      >80 K stage – 2 to 3 turbines

      < 80 K stage – 4-5 turbines'
  - shape: TextBox 7
    type: text
    text: 'Turbines are the clearest case in this compendium for why MTBF-only thinking runs out. There
      is no credible spare position: cooling topology fixes each turbine''s location in the cold-box train,
      so a “redundant” unit is not interchangeable the way a compressor is.

      With 7-of-7 required and a 105,000 h assumed MTBF, the 5-year no-trip probability is already down
      to 94.6%; adding an 8th unit barely moves it. A fleet this exposed cannot be managed by waiting
      for an MTBF-driven alarm — it has to be managed by knowing, ahead of time, which unit is closest
      to end of usable life.'
  - shape: Rounded Rectangle 8
    type: text
    text: KEY TAKEAWAY  No spare position + no redundancy = the fleet where predictable, age-based replacement
      matters most, not least.
  dmaic_phase: IMPROVE
- index: 35
  elements:
  - shape: Slide Number Placeholder 1
    type: text
    text: '35'
  - shape: Rectangle 2
    type: text
    text: 'The Turn: From Predicting Failure to Preventing It'
  - shape: TextBox 9
    type: text
    text: 'Every slide so far has used MTBF exactly as designed: to predict how often a well-behaved,
      randomly-failing fleet will trip. That is the right tool for budget-setting, architecture trade-offs,
      and acceptance testing.

      It is the wrong tool for one aging turbine, compressor or PVPS unit that has quietly moved from
      the flat part of the bathtub curve onto the rising one. Once wear-out dominates — as the three case
      files above all confirm it eventually does — the right question stops being “what''s the MTBF” and
      becomes “how much usable life is left, and when do we act.” That is the shift from reliability prediction
      to reliability control.'
  - shape: Rounded Rectangle 10
    type: text
    text: KEY TAKEAWAY  MTBF tells you the odds. It does not tell you when to intervene — the remaining
      slides answer that question.
  - shape: TextBox 6
    type: text
    text: 'MTBF values indicative – since different values for type of turbine


      Spare, redundant NOT really possible – since position of trips dictates the cooling – where would
      the spare be?


      >80 K stage – 2 to 3 turbines

      < 80 K stage – 4-5 turbines'
  dmaic_phase: CONTROL
- index: 36
  elements:
  - shape: Slide Number Placeholder 1
    type: text
    text: '36'
  - shape: Rectangle 2
    type: text
    text: Predictable Service Replacement
  - shape: TextBox 7
    type: text
    text: 'The control response to a rising hazard rate is not a better MTBF estimate — it is a scheduled
      intervention set before the wear-out region is reached, sized from each component''s Weibull characteristic
      life (η) rather than its long-run MTBF.

      In practice: set overhaul/replacement intervals at a fraction of η (tightened further for Class
      B/C consequence items); track operating hours and Hz-band exposure per unit — data this deck already
      mandates the Applicant to log; and treat “still running at 340,000 hours” as a maintenance trigger,
      not a reliability success story.'
  - shape: Rounded Rectangle 8
    type: text
    text: KEY TAKEAWAY  A predictable replacement interval is a Weibull-based deadline set before the
      hazard curve turns upward — not a reaction to it.
  dmaic_phase: CONTROL
- index: 37
  elements:
  - shape: Slide Number Placeholder 1
    type: text
    text: '37'
  - shape: Rectangle 2
    type: text
    text: Reset to New
  - shape: TextBox 9
    type: text
    text: A full overhaul or unit exchange does more than avoid one failure — it resets the clock. A good-as-new
      replacement returns the component to t = 0 on its Weibull curve, restoring the low, flat hazard
      rate that every Poisson/MTBF probability in this compendium (Slides 22–28) depends on.
  - shape: Rounded Rectangle 10
    type: text
    text: KEY TAKEAWAY  “Reset to new” is what keeps the rest of this deck's mathematics honest — skip
      it, and every MTBF-based probability quoted earlier quietly becomes optimistic.
  dmaic_phase: CONTROL
- index: 38
  elements:
  - shape: Slide Number Placeholder 1
    type: text
    text: '38'
  - shape: Rectangle 2
    type: text
    text: Reliability Governance — Closing the Loop
  - shape: TextBox 5
    type: text
    text: 'This compendium opened with a budget (Slide 29: 0.35 events/year) and closes with the mechanism
      that keeps the plant inside it: a continuous RAMI governance loop.'
  - shape: Oval 6
    type: text
    text: '1'
  - shape: TextBox 7
    type: text
    text: 'MEASURE exposure

      Log operating hours and Hz-band time per unit (already mandated, Slide 7).'
  - shape: Oval 8
    type: text
    text: '2'
  - shape: TextBox 9
    type: text
    text: 'TRACK age vs. η

      Compare accumulated life to each component''s Weibull characteristic life.'
  - shape: Oval 10
    type: text
    text: '3'
  - shape: TextBox 11
    type: text
    text: 'REPLACE before wear-out

      Trigger overhaul/exchange at a fraction of η — not at first symptom.'
  - shape: Oval 12
    type: text
    text: '4'
  - shape: TextBox 13
    type: text
    text: 'RESET & feed back

      Log the renewal and roll it into next year''s RAMI dossier (Slide 13).'
  - shape: Rounded Rectangle 14
    type: text
    text: KEY TAKEAWAY  MTBF opened the story; predictable, logged, reset-to-new replacement is how the
      plant keeps living up to it.
  dmaic_phase: CONTROL
