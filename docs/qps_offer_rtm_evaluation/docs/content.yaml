    text: 'IMPROVE  (Slides 29–34)

      Why MTBF matters, when it stops being trustworthy, and the component evidence (compressors, PVPS,
      turbines) that proves it.

      CONTROL  (Slides 35–38)

      Predictable, usage-based service replacement; the reset-to-new renewal principle; and the governance
      loop that keeps the system inside the assumptions MTBF requires.

      This is a MASTER slide set — Improve + Control together form a standalone maintenance-policy pack.'
  - shape: Rounded Rectangle 4
    type: text
    text: SAMPLE CALC  Same β=2.5, η=114,400 h cold-compressor pair as part 2 → replace at ≈ 0.65×η (≈
      74,000 h) instead of running to MTBF-implied end of life — the deadline is set before the hazard
      curve turns upward, not after (Slide 36).
