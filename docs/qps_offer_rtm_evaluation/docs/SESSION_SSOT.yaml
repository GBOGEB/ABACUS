# ------------------------------------------------------------- session_improvement
# GBO's own request: "session improvement - better prompts quick to end goal."
# Concrete, non-judgmental suggestions based on this session's actual pattern.
session_improvement:
  observed_pattern: >
    Messages arrive as dense, single-paragraph, multi-ask bundles (often 3-6
    distinct requests in one message, sometimes with screenshots, frequently
    with typos/shorthand that are still decipherable from context). This
    works and every ask has been getting addressed, but two costs show up:
    (1) some asks get partially deferred/lost when 5 more arrive before the
    first is fully closed out (see gaps.investigation_not_relayed as the
    concrete example), and (2) a few build scripts didn't get saved under
    discoverable names because the round moved fast (see
    gaps.missing_build_scripts).
  suggestions:
    - "One-ask-per-line still works as a single message -- doesn't need to be split into multiple turns, just visually separated (blank line or dash per ask) so nothing silently gets merged into the request before/after it."
    - "When an ask is 'explain X' / 'investigate Y' (not 'build/fix Z'), say so explicitly (e.g. prefix with 'question:' or 'explain:') -- this session treated a couple of investigation-only asks as build asks by default and the plain-English answer sometimes lagged behind the file delivery."
    - "For visual/layout complaints (illegible text, cramped columns, truncation), a screenshot + the sheet/tab name is the single highest-leverage thing to include -- every screenshot-backed bug report this session was found and fixed on the first pass; the ones without a screenshot took longer to root-cause."
    - "If a request depends on a prior answer GBO hasn't seen yet (e.g. asking for more toggles/analysis 'the new way' before confirming the previous toggle/analysis landed correctly), flagging that dependency explicitly avoids compounding a design choice that might get revised anyway."
    - "For '<X> but idempotent/reproducible/documented' asks specifically (this message's own genre): naming the exact target format up front (YAML vs JSON vs Markdown, one file vs several) saves a round of guessing which this response had to make explicitly."
  meta_note: >
    This suggestions list is itself a hypothesis about this session's
    pattern, not a critique of how GBO should communicate -- the bundled,
    stream-of-consciousness style has correctly gotten every substantive ask
    addressed so far. These are offered as optional levers, not requirements.
