# ------------------------------------------------------------------ decisions_log
# Condensed rationale for choices that could plausibly be second-guessed or
# re-litigated later -- kept here so nobody re-derives them from scratch.
decisions_log:
  gate_precedence_vs_pure_score_rank:
    decision: "OFFER_RANKING's official rank = gate items first (regardless of S), then remaining items ranked by Weighted S. The v17 live scenario toggle deliberately uses PURE score rank (no gate precedence), even though this means the toggle set to 'Base' does not exactly reproduce the official rank order."
    why: "First implementation added gate-precedence to the toggle's rank formula to make 'Base' match the official rank exactly -- this defeated the toggle's whole illustrative purpose (gate items stayed pinned at ranks 1-6 even under the Cost-heavy scenario, hiding the 'gate items fall ~15 places' insight that was the reason for building the toggle). Reverted; disclosure text added instead explaining the expected Base/official divergence."
  hyperlink_convention:
    decision: "All new cross-sheet navigation links use =HYPERLINK(\"#Sheet!A1\",\"label\") formula strings, never openpyxl's native .hyperlink attribute."
    why: "The LITE-workbook slim-builder's dead-link neutralisation only regex-matches the HYPERLINK() formula string convention. README initially used .hyperlink and its dead links to dropped sheets survived un-neutralised into LITE. Fixed once, now the enforced convention project-wide."
  isolated_sheet_qa_false_positives:
    decision: "When visually QA-ing one sheet via a stripped-down copy (all other sheets deleted for a clean PDF render), any dependency sheet a formula references must be RETAINED in that copy, or it will show #NAME? errors that are QA-harness artefacts, not real bugs."
    why: "Caught this exact false alarm mid-session; confirmed via the always-passing full-workbook LibreOffice recalculation pass, which is the actual formula-integrity gate, not the isolated-sheet visual QA."
  primary_supporting_review_flag_investigation:
    finding: >
      Primary/Supporting RTM split and the Review flag are both hand-curated
      per-item annotations (documented in ENGINEERING_HANDOVER_OFFER_BT_v3_6.md),
      not rule/formula-derived -- no code branch sets either. OFFER-level
      "explicit deliverable" text is a generated f"Offer response: {title}"
      template, NOT a verbatim contract-PDF quote (contrast: RTM-level
      deliverable text for the 43 hand-authored T0 Gate rows IS grounded in
      a real section title). "Applicable phase(s)" is a single generic
      combined-phase string per row -- no mechanism exists for one
      deliverable type appearing as separate phase-tagged row instances
      (e.g. P&ID at L0/L0neg1/L0neg2/L1/L2/L4/L5/As-built as 8 rows).
    status: "investigated, not yet relayed to GBO -- see gaps.investigation_not_relayed"
  excel_repaired_file_investigation:
    finding: >
      GBO reported Excel opening QPS_OFFER_Evaluation_LITE_v18.xlsx with a
      "Repaired" title-bar warning (screenshot evidence) -- this had been a
      standing open question earlier in the project, never previously
      confirmed. Investigated via raw XML audit (relationship-target
      integrity across every .rels part, Content_Types override coverage,
      and every sheet's <dimension> vs <autoFilter> extent) since this
      class of defect can survive both an openpyxl save AND a LibreOffice
      recalculation pass without ever showing up as a formula error --
      LibreOffice's own converter rewrites the file from scratch, which can
      silently launder an XML-level defect that real Excel's stricter
      loader would flag. Found one genuine, confirmed defect: DOMAIN_SUMMARY's
      AutoFilter was stale (A5:L27, i.e. sized for the ~22 domains that
      existed when the filter was first applied) while the sheet's real
      data now runs to row 41 (36 domains) -- fixed in v19 by re-applying
      the filter to the sheet's actual extent. Relationships and
      Content_Types were otherwise clean; charts all reference in-workbook
      ranges correctly.
    caveat: >
      This is the strongest confirmed lead, not a certainty -- there is no
      real Excel available in this environment to reproduce the "Repaired"
      dialog directly, only LibreOffice (which does not reproduce Excel's
      stricter validation) and manual XML auditing. If v19 still shows
      "Repaired" when GBO opens it, the next diagnostic step is the repair
      log Excel itself offers to display after repairing (Excel writes what
      it changed to a small log/dialog) -- that pinpoints the exact broken
      part far faster than continued blind XML auditing.
    status: "fixed the one confirmed defect found; awaiting GBO confirmation that v19 opens clean in real Excel"
    new_lead_v24_round: >
      Different session, real Excel WAS available this time (unlike the
      caveat above) -- but Excel COM automation (win32com, Workbooks.Open())
      failed to open ANY version of this workbook, including the pristine,
      completely unmodified FULL_v23.xlsx, with a generic "Open method of
      Workbooks class failed" COM error. Tried: fresh dedicated Excel
      instance (DispatchEx, not a possibly-stale cached one), copying the
      file to a different (non-worktree) folder, AutomationSecurity=Low,
      explicit CorruptLoad=xlRepairFile. All failed identically. Creating a
      brand-new blank workbook via the same COM session worked fine, so COM
      itself is not broken -- the failure is specific to opening these
      existing files. NOT the same symptom as a "Repaired" title-bar warning
      (that requires the file to open, just with a warning) -- this is a
      harder failure, Open() itself never completes. Still an open lead, not
      a confirmed cause: could be this specific machine/session's Excel
      Trust Center blocking automation from this path outright (untested:
      whether a normal interactive double-click-to-open works fine, only
      COM automation was tried), unrelated to file content at all. Verified
      this round's own edits via openpyxl reload-and-verify + a Playwright
      QA sweep on the Navigator instead (see workbook_full.builder_chain
      v24 entry and html_navigator.builder_chain v24 entry).
  isolated_qa_harness_NAME_error_recurrence:
    finding: >
      Re-confirmed the same QA-harness artifact documented under
      isolated_sheet_qa_false_positives: this round's visual-QA copy for
      QUALITY_CHECKS (trimmed to 6 sheets for a clean PDF render) showed
      #NAME? on every row whose formula references EVALUATION_WORKSPACE,
      OFFER_CANONICAL, OFFER_RANKING or RTM_CROSSWALK -- all 4 were
      excluded from that trimmed copy. Confirmed as harness-only (not a
      real defect) via the always-passing full-workbook LibreOffice
      recalculation pass (0 errors, every sheet present). Recording the
      recurrence here since it's now happened twice -- worth remembering
      QUALITY_CHECKS specifically pulls from 4 other sheets before trimming
      a QA copy that includes it.
  pareto_avgS_dot_suppression:
    decision: "Cumulative-% dot on any Pareto bar chart is shown ONLY for additive measures (RTM count, Sum of Weighted S). When the Average-Weighted-S measure is selected, no dot is drawn; an explanatory note replaces the usual purple-dot legend caption."
    why: "An average is not additive -- summing per-row averages and dividing by their sum computes a number but not a meaningful 'share of a real total', so a cumulative line drawn from it is not a valid 80/20 read. Producing it anyway (mathematically possible) would be presenting a fabricated-looking trend as real. Chose to disclose the limitation rather than fake the visualization, consistent with this project's standing convention (e.g. the Outline tab's own 'what this tab is NOT' disclosure box)."
  sprawling_request_triage_via_askuserquestion:
    decision: "When GBO's message combined dozens of asks spanning wildly different abstraction levels (concrete chart polish through an abstract personal-knowledge-taxonomy proposal, SKILL_user_ADD 00-10), triaged in prose into 'already covered' / 'concrete, one decision needed' / 'needs real scoping', then used AskUserQuestion rather than guessing at priority or building the most abstract items speculatively."
    why: "This session's own documented session_improvement lesson is that unscoped structural asks waste effort if guessed at. GBO answered: build the Deliverables Index HTML + a Knowledge Taxonomy mapping doc next; limit the purple-recolour/'read together' banner treatment to just the Domain/Cluster measure toggles (not every chart in the workbook/deck)."
    status: "All three delivered this round: Navigator v9 (purple recolour + callouts), DELIVERABLES_INDEX.html, KNOWLEDGE_TAXONOMY_MAPPING.md."
  knowledge_taxonomy_mapping:
    decision: "Interpreted GBO's SKILL_user_ADD 00-10 as a general-purpose taxonomy proposal that should be MAPPED onto this project's existing artifacts, not built as new infrastructure -- produced KNOWLEDGE_TAXONOMY_MAPPING.md scoring each node covered/partial/gap against real sheets and scripts, rather than attempting to construct the abstract framework itself."
    why: "The taxonomy as GBO described it is explicitly reusable across projects, not QPS-specific -- designing it for real would be its own scoping conversation, not something to guess at inside this session. Mapping it onto what already exists is honest, useful now, and doesn't foreclose a real design conversation later."
    finding: "7 of 11 nodes already covered by existing artifacts (00 Content, 01 Content Parsing, 02 Memory/KO, 03 Knowledge Renditions, 05 Graphs/Math/Trends, 08 Document Navigation, 09 Coding Space Navigation, 10 WIP). 4 genuine gaps: PNA/DMAIC phase-per-item (03.1-03.5), STATS iteration/wave history (04), requirement conflict/interference detection (06, the 'interferences' half only), project-level review-completion rollup (07, item-level status already covered). None of the 4 gaps were in GBO's priority pick -- not built."
    status: "3 of 4 gaps closed in v20 -- RTM_PHASE_EXPANSION (03), METRIC_HISTORY.json (04), DASHBOARD_2 review-completion rollup (07). CONFLICT_CANDIDATES (06) built as an explicitly-disclosed heuristic first pass, not a solved detector -- most rows will be false positives by design, never presented as confirmed."
  hidden_excel_layer_investigation:
    finding: >
      GBO asked whether an 'advanced full excel (hidden by password)' layer
      exists beyond what's normally visible. Checked directly rather than
      guessing: wb.sheetnames (28 sheets in FULL_v19, all accounted for),
      every worksheet's sheet_state (all 'visible'), every worksheet's
      protection.sheet/.password (all None), workbook-level wb.security
      (None), and a zip namelist scan (no vbaProject.bin, no macros, no
      unexpected extra parts beyond the 28 sheets' own tables/charts/
      comments).
    status: "CONFIRMED NEGATIVE -- no hidden or password-protected layer exists. Reported plainly as a negative finding, not left ambiguous. Full detail in PCA_DMAIC_BT_ANALYSIS.md Section 0."
  v20_banded_fill_bug:
    finding: >
      build_workbook_v20.py's shared banded(ws, row, ncols, start_col=1)
      row-striping helper unconditionally applies a fill to every cell in
      its column range on even rows, with no awareness that a specific
      column in that range already carries a deliberate, meaning-bearing
      colour (relation-type badge, review-flag status colour, phase-type
      colour, AD top-level-group accent). Recurred in 4 new v20 sheets
      (TAXONOMY relation-types table, REVIEW_FOCUS, RTM_PHASE_EXPANSION,
      DELIVERABLES_DOSSIER) -- same root cause each time.
    why_it_kept_happening: "banded() was reused unmodified from earlier rounds where no competing colour existed in the striped range -- v20 was the first round where every new table ALSO carried its own per-row colour coding, and the helper was never updated to check for that."
    fix: "narrowed the banded column range to skip the pre-coloured column in each case (start_col offsets, or splitting into two calls that skip the coloured column, or making the call conditional on row type) -- verified via direct cell.fill.fgColor.rgb inspection after each fix, not just a re-render screenshot."
    control_action: "any future banded() call on a table with its own colour-coded column must explicitly exclude that column -- noted as a standing implementation note wherever banded() is called in build_workbook_v20.py."
  v20_phase_string_mismatch_bug:
    finding: >
      RTM_PHASE_EXPANSION's initial PHASE_ORDER/PHASE_COLORS dicts were
      built from an assumed phase-string format ('L0 Tender/Offer', no
      spaces, 7 phases) copied from a single earlier-session example row,
      rather than a direct scan of the live data. The real live format uses
      spaces around '/' ('L0 Tender / Offer') and includes 3 additional real
      phase values never accounted for (FAC -- 17 RTMs, PAC / Handover -- 30
      RTMs, Warranty -- 20 RTMs).
    fix: "rebuilt both dicts from a direct scan of every distinct value actually present in RTM_RANKING!'Applicable phase(s)' across all 722 rows (now 10 phase values, correctly ordered/coloured), with an inline code comment warning against assuming a string format without checking live data first."
    control_action: "standing lesson, not project-specific: any lookup dict keyed on a data-derived string (phase names, category labels, status values) must be built or verified from a live scan of the actual column, never carried forward from a remembered example row."

