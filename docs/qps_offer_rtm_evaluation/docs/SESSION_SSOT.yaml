%YAML 1.1
---
# SESSION_SSOT.yaml -- single source of truth for the QPS OFFER Evaluation
# project state (workbook + BT-method decks + HTML Navigator + MTBF/DMAIC deck).
#
# Split deliberately from ARTIFACT_REGISTRY.json:
#   - ARTIFACT_REGISTRY.json is 100% auto-generated (generate_artifact_registry.py
#     scans the working directory -- file names, sizes, mtimes, "latest per
#     family"). Re-run it, never hand-edit it. It cannot drift because it
#     doesn't record opinions, only what's actually on disk.
#   - THIS file is the narrative/decision layer that a directory listing can't
#     capture: why each version exists, what's still open, what's known-missing,
#     and lessons that should change how future rounds get built. Hand/agent
#     maintained -- update it at the end of any round that ships a new version
#     or closes/opens a TODO. Re-read it (memory_read-style: read before write)
#     at the start of any new session picking this project back up.
#
# Idempotency contract: regenerating any deliverable from its build script with
# unchanged inputs reproduces the same output byte-for-byte (no timestamps, no
# randomness baked into any build_*.py). See build_chain below for the exact
# script->output edges; run in listed order.

meta:
  project: QPS OFFER Evaluation -- RTM/OFFER BT-ranking workbook, decks, HTML Navigator
  owner: GBO
  session_span: "2026-08-12 through 2026-08-17 (this container)"
  last_updated: "2026-08-17, after Navigator v12 + Excel v20 + BT deck v9 + git commits + DMAIC metric-history backfill"
  working_dir: /home/claude/work
  companion_file: ARTIFACT_REGISTRY.json   # run generate_artifact_registry.py to refresh
  git_repository:
    status: "local-only, per GBO's explicit choice (2026-08-17 AskUserQuestion: 'Local git only for now') -- no GitHub remote configured, no credentials given to or requested by this session; GBO pulls/pushes to GitHub themselves"
    branch: master
    commits_this_session:
      - {hash: f3b6245, summary: "Initial commit: baseline (workbook v19, Navigator v10, decks, handover/SSOT, all build scripts) -- ~2578 files"}
      - {hash: 13a86e5, summary: "Excel v20: 9-section build from GBO's uploaded annotation file"}
      - {hash: 272c9ae, summary: "BT deck v9: PCA and Sum-vs-Average domain-quadrant slides"}
      - {hash: b76e966, summary: "Navigator v11-v12: Code/Standard dropdown, Taxonomy relation types & Deliverables Dossier"}
      - {hash: 13ce732, summary: "DMAIC metric-history log: backfilled v5-v20"}
    note: "Working tree clean as of last_updated -- every delivered artifact from this session is committed. Commit messages are the intended 'major changelog details, traceable in intent' GBO asked for -- read via `git log` for the narrative history; this SSOT stays the living/decision layer, git history is the immutable log."

# ------------------------------------------------------------------ deliverable families
# One entry per thing GBO actually opens/uses. `canonical` = what to hand them
# today. `builder_chain` = ordered script list to reproduce it from scratch
# (IN/OUT verified from each script's own IN/OUT constants where the script
# still exists on disk -- see gaps.missing_build_scripts for the versions
# whose script was NOT preserved).
families:
  workbook_full:
    canonical: QPS_OFFER_Evaluation_FULL_v24.xlsx
    purpose: >
      The SSOT workbook -- RTM_RANKING (722 reqs), OFFER_RANKING (50 items),
      BT/weighted-S scoring, gate precedence, taxonomy, cluster grouping,
      review queue, and every audit/method/legend sheet. Everything else
      (LITE workbook, Navigator, PDFs) derives FROM this file, never the
      reverse.
    sheet_count: 33
    builder_chain:
      - {script: build_workbook_full_v5.py, in: GBO's hand-edited base + QPS_RTM_BT_Standalone.xlsx, out: QPS_OFFER_Evaluation_FULL_v5.xlsx}
      - {script: build_workbook_v6.py,  in: FULL_v5,  out: FULL_v6,  summary: "taxonomy, C1-C8 clusters, RTM_LOOKUP page, OFFER disposition cols, Z_comment formula, filterable dashboard"}
      - {script: build_workbook_v7.py,  in: FULL_v6,  out: FULL_v7,  summary: "Requirement Type/Category extended 43-->722 RTMs (rule-based, disclosed); inferred cluster for 429 unlinked RTMs (confidence-tagged)"}
      - {script: build_workbook_v8.py,  in: FULL_v7,  out: FULL_v8,  summary: "DELIVERABLES!F de-genericised: real RTM cross-ref + EPIC-keyed evidence-type descriptor"}
      - {script: build_workbook_v9.py,  in: FULL_v8,  out: FULL_v9,  summary: "soft C1-C8 cluster colour palette; 'safe to edit' cream fill on manual-entry EVALUATION_WORKSPACE columns"}
      - {script: "MISSING (v10-v15, see gaps.missing_build_scripts)", in: FULL_v9, out: FULL_v15, summary: "classify_all_rtms.py / infer_clusters.py / fix_mtbf_rtm_numbers.py / t0_taxonomy.py were run in this span but the per-version orchestration scripts that called them were not preserved under discoverable v10..v15 names"}
      - {script: build_workbook_v16.py, in: FULL_v15, out: FULL_v16, summary: "DASHBOARD chart-7 spike explanation callout; Gate-column red fill reuse (EVALUATION_WORKSPACE/OFFER_RANKING/RTM_RANKING)"}
      - {script: build_workbook_v17.py, in: FULL_v16, out: FULL_v17, summary: "7-dim weight ColorScaleRule heatmaps on OFFER_RANKING/RTM_RANKING; live Base/Cost-heavy scenario toggle (WEIGHTS_METHOD); CATEGORY_FOCUS hidden-champions sheet; README + CHANGELOG sheets"}
      - {script: build_workbook_v18.py, in: FULL_v17, out: FULL_v18, summary: "RTM_RANKING col J-N width/height rebalance (verbatim-text visibility); RTM_CROSSWALK!J white-on-white CF font fix; START_HERE colour legend + stale version-string fix"}
      - {script: build_workbook_v19.py, in: FULL_v18, out: FULL_v19, summary: "RTM_RANKING!O:AG full layout overhaul (title bars extended to real width, legacy dataBar CF removed, dimension columns normalised, AC:AF widened + folded into row-height calc); TAXONOMY 3 missing-border tables fixed; QUALITY_CHECKS OPEN/CHECK status colours + border grid added; nav-button 3D-bevel border applied workbook-wide (198 cells/25 sheets); DASHBOARD_2 gained 5 RTM-side charts + an RTM<->OFFER crosswalk coverage panel; DOMAIN_SUMMARY's stale AutoFilter (A5:L27 vs real A1:L41 data extent) found and fixed -- prime suspect for the Excel 'Repaired' prompt GBO reported on LITE_v18, confirmed via full relationship/autofilter/content-types XML audit (all else clean)."}
      - {script: build_workbook_v20.py, in: FULL_v19, out: FULL_v20, summary: "9-section build direct from GBO's uploaded annotation file: TAXONOMY Relation Types table (real RTM_CROSSWALK!J bucketed counts); COMPLIANCE_LEGEND Primary/Supporting RTM + Review flag formal definitions; Review flag standardised 5 free-text values -> 5 canonical + dropdown + colour CF across 3 sheets; REVIEW_FOCUS new sheet (9 flagged OFFER items); RTM_PHASE_EXPANSION new sheet (722 RTMs -> 2,169 (RTM,phase) rows, phase vocabulary rebuilt after a wrong-assumed-format bug); DELIVERABLES_DOSSIER new sheet (32 real contract AD entries from the mirror PDF's own Table 2, cross-referenced against every RTM's text); DASHBOARD_2 review-completion rollup (0/289 decided -- genuine finding, not a bug); CONFLICT_CANDIDATES heuristic requirement-conflict first-pass (65 candidate pairs, explicitly disclosed unverified); comment-column consistency pass (QUALITY_CHECKS gained one, 2 existing ones got the cream 'safe to edit' fill). See decisions_log.v20_banded_fill_bug and decisions_log.v20_phase_string_mismatch for the 2 bugs found+fixed during this build."}
      - {script: fix_pdf_page_numbers.py, in: FULL_v20, out: FULL_v21, summary: "RTM_RANKING!J (PDF page) corrected against the real 137-page source PDF (every RTM-### is literally printed in the text, giving a 722/722 ground truth): only 247/722 (34%) of stored values matched, 475 rows (66%) were wrong (avg drift 1.40 pages, max 35) -- fixed all 475. Triggered by GBO's RTM-693 screenshot showing the real page 127 vs. workbook's stored 129."}
      - {script: build_workbook_v22.py, in: FULL_v21, out: FULL_v22, summary: "DASHBOARD_2 chart C ('Average Weighted S by Domain') data-range bug fixed -- was pulling DOMAIN_SUMMARY rows 5-41 (36 rows) when the real domain table is only rows 6-27 (22 domains); rows 28-41 belong to an unrelated 'Cluster breakdown' table lower on the same sheet, causing the mismatched/blank category ticks GBO spotted in a Google Drive chart-preview screenshot. Range trimmed to the real 22-domain extent."}
      - {script: build_workbook_v23.py, in: FULL_v22, out: FULL_v23, summary: "DELIVERABLES_DOSSIER gained AD_07 (QPS Cybersecurity Policy Framework) and AD_08 (QPLANT Abnormal Scenarios / Line S) from GBO's Master_Input working folder -- distinct from AD_01-06's contract-Table-2 provenance, disclosed as such (no SCKCEN ref# fabricated). Links taken from each document's own self-declared RTM anchor (AD_07->RTM-322, AD_08->RTM-260/261/292/294), not a fuzzy text scan. 34 AD entries total now (was 32). Found+fixed a real openpyxl bug during this build: insert_rows() does not shift merged-cell ranges, which was silently blanking the new AD_08 row's B:F columns -- explicit unmerge/re-merge added around the insert."}
      - {script: build_workbook_v24.py, in: FULL_v23, out: FULL_v24, summary: "New PCA_ANALYSIS sheet (explained-variance/loadings/domain-position tables, from the newly-named scripts/compute_pca.py -- closes DMAIC_BT_TECHNICAL_REPORT.md Section 5.1's reproducibility gap; re-run against live v23 data reproduced the original report's numbers EXACTLY, PC1=30.6%/PC2=16.5%/174 distinctive items, confirming no drift). WEIGHTS_METHOD gained a 3rd live-toggle scenario ('Cost-heavy-proportional', row 62) and a static comparison table -- GBO-requested variant of the existing Cost=70% scenario that keeps the other 6 dimensions' relative ratios instead of splitting flat 5% each (scripts/compute_weight_scenario4.py). Real finding: both variants give Cost the same 70% weight but rank very differently (Spearman vs Base: 0.994 flat vs. 0.661 proportional). B56's data-validation dropdown values changed from descriptive strings to short labels ('Base'/'Cost-heavy'/'Cost-heavy-proportional') to support 3-way INDEX/MATCH instead of a 2-way IF() -- disclosed inline at WEIGHTS_METHOD row 50. Verified via openpyxl reload (structure/formulas/merges intact); Excel COM verification was attempted but blocked by an environment-level issue unrelated to this edit (even the pristine, unmodified v23 file fails to open via COM on this machine -- see gaps below)."}
    known_data_caveat: >
      RTM-BT ranking values integrated in v5 are a static snapshot (130
      formulas / 34,838 cells = 0.4% density) using a 4-dimension (L/R/P/F)
      scheme, not the canonical 7-dimension (L/R/P/F/Q/LC/C) model used
      everywhere else in this workbook from v6 onward. Usable for review,
      will not recompute if canonical weights change. Disclosed on the
      sheet itself; not re-derived (out of scope, flagged as bigger/riskier
      than this pass warranted).

  workbook_lite:
    canonical: QPS_OFFER_Evaluation_LITE_v23.xlsx
    stale_note: >
      1 workbook version behind FULL_v24 as of this SSOT update (FULL gained
      PCA_ANALYSIS + the 4th weight scenario, not yet re-sliced into LITE).
      build_workbook_slim_v24.py not yet written -- straightforward, same
      pattern as v20-v22 (see builder_chain below), just needs PCA_ANALYSIS
      added to the KEEP list if it should be reviewer-facing.
    purpose: >
      Reviewer-shareable subset of workbook_full -- KEEP-list derived (not a
      DROP list) so new FULL sheets are excluded by default until explicitly
      added. Currently 23 sheets kept; internal/audit/method-reproduction
      sheets (STANDARDS, DELIVERABLES, AUDIT_NOTES, DMAIC_AUDIT,
      EVALUATION_INPUT, NAVIGATION_MAP, CODING_HANDOVER, WEIGHTS_METHOD,
      CHANGELOG) stay FULL-only.
    builder_chain:
      - {script: build_workbook_slim_v5.py through build_workbook_slim_v18.py, note: "one per FULL version, always IN=matching FULL_vN, OUT=LITE_vN; KEEP list is the single array to edit if the kept/dropped split should change"}
      - {script: build_workbook_slim_v20.py, in: FULL_v20, out: LITE_v20, summary: "KEEP list gains REVIEW_FOCUS, RTM_PHASE_EXPANSION, DELIVERABLES_DOSSIER, CONFLICT_CANDIDATES -- all 4 reviewer-facing tools (worklist/analytical view/reference/heuristic flag list), same promotion logic as earlier rounds' RTM_LOOKUP/DASHBOARD_2/CLUSTERS/TAXONOMY additions"}
      - {script: build_workbook_slim_v21.py, in: FULL_v21, out: LITE_v21, summary: "same KEEP list, re-run to pick up the PDF-page-number fix"}
      - {script: build_workbook_slim_v22.py, in: FULL_v22, out: LITE_v22, summary: "same KEEP list, re-run to pick up the DASHBOARD_2 chart-range fix"}
    invariants_enforced_by_script:
      - "pre-flight regex scan: no kept-sheet formula (excluding HYPERLINK) may depend on a dropped sheet"
      - "dead =HYPERLINK(\"#Sheet!...\") formulas pointing at dropped sheets are neutralised to plain grey italic text, not left to throw on click"
      - "LISTS sheet kept but hidden (dropdown data source for STATUS/Depth/Negotiation columns)"

  html_navigator:
    canonical: QPS_RTM_BT_Navigator_v22.html
    purpose: >
      Single-file, read-only HTML companion to workbook_full -- browse
      RTM/OFFER rankings, filter dashboard, domain/cluster heatmaps,
      document outline, taxonomy, without opening Excel. Data is spliced in
      at build time from a JSON export of the live workbook (never
      hand-typed), so it cannot silently drift from the SSOT.
    builder_chain:
      - {script: export_nav_data.py, in: "workbook_full canonical (or any FULL_vN)", out: "/tmp/nav_data_vN.json", note: "re-run whenever RTM_RANKING/OFFER_RANKING/RTM_REVIEW_QUEUE/CLUSTERS/DOMAIN_SUMMARY/TAXONOMY change; safe/no-op to re-run when only formatting changed (v18's JSON is byte-identical to v17's)"}
      - {script: splice_navigator.py, in: "nav_data_vN.json + navigator_template.html", out: "QPS_RTM_BT_Navigator_vN.html", note: "PROMOTED FROM INLINE PYTHON this round -- verified byte-identical output vs. the inline splice it replaces before being trusted as canonical. Standing gap closed."}
      - {script: "export_nav_data.py v23 + splice_navigator.py", in: FULL_v23, out: Navigator_v21, summary: "re-sync after AD_07/AD_08 landed in DELIVERABLES_DOSSIER (34 entries) -- Navigator was 1 workbook version stale; full 12-tab Playwright QA sweep, zero errors/overflow."}
      - {script: "export_nav_data.py v24 + splice_navigator.py", in: FULL_v24, out: Navigator_v22, summary: "New 'PCA / Structure' tab (13th tab) -- Proposal A (PC1xPC2 scatter, 722 RTMs, self-contained inline SVG, coloured by domainColor()) and Proposal B (domain quadrant, 22 domains) from DMAIC_BT_TECHNICAL_REPORT.md Section 4.1-4.2; an ASCII method panel (BT scoring flow + PCA computation flow); the new 4th weight-scenario table. btLambda (RTM_RANKING col X / OFFER_RANKING col Q) exported and surfaced on both Lookup detail cards for the first time -- was in the workbook since at least v19 but never in the Navigator (NEXT_ITERATION_BACKLOG.md item 10's own named gap). export_nav_data.py also gained auto-discovery of pca_results_v*.json / weight_scenario4_v*.json next to the input workbook (glob-latest, omitted gracefully if absent) rather than hardcoding one version. Playwright QA: 13 tabs, 722+22 scatter points verified by exact count, ascii-diagram text content verified, 0 console/page errors, 0 horizontal overflow."}
    qa_process: >
      Playwright headless Chromium sweep: zero console errors, zero
      pageerror events, zero horizontal overflow (scrollWidth-clientWidth),
      across tab clicks and dropdown/measure-toggle interactions, plus a
      targeted screenshot of any newly-changed control.
    version_history_this_session:
      v6: "dataset-switchable (RTM/OFFER) Filter Dashboard: Category/Domain group selector, Cluster selector, Code/Standard free-text search, live top-40 result list"
      v7: "Domain x Cluster heatmap gets a Measure toggle (count/avgS/sumS) with rows re-sorted by the same measure being coloured, not just recoloured in fixed order"
      v8: "Pareto cumulative-% dot suppressed for the Average-Weighted-S measure (non-additive, was rendering a meaningless near-linear staircase) across all 4 call sites; explanatory note shown instead. Also fixed a real scoping bug found during this round's own QA: renderParetoInto() was nested inside buildDomains() and unreachable from buildOutline(), which would have crashed the Outline tab's chart outright -- hoisted to top-level scope."
      v9: "Domain x Cluster heatmap + Domain-summary chart section recoloured teal/orange -> purple family; 2 new 'Read together, for a presenter' interpretive callout banners."
      v10: "Reusable colour-key legend component (colourKeyCallout()) auto-inserted on every tab that colour-codes Tier and/or Cluster."
      v11: "Filter Dashboard Code/Standard free-text box replaced with a real dropdown (81 real values, same UX pattern as Cluster) -- GBO reported the free-text box 'doesn't seem to work'; root cause was most codeStd cells holding a placeholder string, not a broken filter."
      v12: "Taxonomy tab exposes the 2 new v20 Excel sheets: RTM<->OFFER Relation Types table (reuses OFFER Lookup's own .linktype badge colours) and the 32-entry Deliverables Dossier, with clickable RTM cross-links (new jumpToRtm() helper) that jump to RTM Lookup and populate that record -- completing the AD->RTM->OFFER chain GBO asked to confirm."
      v13: "Clusters tab brought to the same depth as Domains/Domain Summary (GBO: 'clusters are not receiving the same treatment, visuals, breadth'). Added: enhanced summary table, click-to-detail panel per cluster (Domain/Tier/Requirement-Type composition + OFFER membership), a Cluster x Domain heatmap (transpose of the existing Domain x Cluster heatmap), RTM/OFFER value-concentration Paretos with divergence callouts, Focus Score rankings. Required hoisting 6 helper functions (metricsByGroup, buildMeasureParetoSection, renderDivergence, buildFocusScoreSection, etc.) from nested-in-buildDomains() to top-level so buildClusters() could reuse them instead of duplicating ~150 lines -- verified no regression on Domains/Domain Summary/Taxonomy via Playwright."
      v14: "RTM-<N> input locked to a fixed 'RTM-' prefix badge + numeric spinner (type=\"number\", min/max from a real idMax() computed off live data, not a guessed range) -- eliminates the zero-pad-skip bug where typing 'RTM-70' missed the zero-padded 'RTM-070' row. Phase (L0-L8) filter added to the Filter Dashboard (export_nav_data.py gained the missing offerRanking.phases field in the same round). GBO-CONFIRMED WORKING (screenshot, this round): typing a bare 1-3 digit number (e.g. '359') resolves correctly with no zero-padding required on entry -- GBO explicitly closed this as 'mechanics - solved,' no further action needed."
      v15: "RTM<->OFFER cross-references now clickable (jumpToRtm()/jumpToOffer(), jumpToRtm's internal signature had to change to strip the 'RTM-' prefix once the Lookup input became type=\"number\" -- caught proactively before it broke the existing Deliverables Dossier cross-link, re-verified via Playwright). Domain/Cluster/Primary-Dimension now render as the same colour-chip pattern (chip()/domainColor()/dimColor()) Tier already used, on both Lookup detail cards. New radial 'link map' SVG in OFFER Lookup -- nodes evenly spaced by linked-item count, coloured by relation type (Direct/Supporting/Broad/Contextual) since the crosswalk has no true forward/backward direction; that substitution is disclosed in-page rather than fabricated, per GBO's own low-priority framing of this ask."
      v16: "OFFER Lookup dropdown gets per-option cluster colouring (reuses OFFER_CLUSTER_MAP/CLUSTER_COLORS) plus an always-visible cluster colour-key legend. New back-navigation breadcrumb (NAV_HISTORY stack + renderBackBar()) so a cross-link jump can be undone -- jumpToRtm/jumpToOffer gained an isBack param. RTM Lookup gained a 'Related RTMs -- same contract section' card using real existing RTM IDs (GBO: 'core is the link, not a new number')."
      v17-v18: "Document Outline: floating sticky legend, row background switched from flat-opacity teal to a proportional-width gradient bar (barBackground()), new 'SCK CEN -- contracting authority' root node (93 verified mentions; GBO's suggested project-parent names MYRRHA/MINERVA/QYS were searched for and found 0 occurrences -- disclosed, not guessed). Cluster colour-key swatch contrast strengthened (border/size/box-shadow) after GBO re-flagged legibility. Re-spliced against nav_data_v21.json once the PDF-page-number fix (below) landed."
      v19: "'Full verbatim requirement' card added to RTM Lookup -- RTM_RANKING column 14 (complete bulleted shall-text, previously captured in the workbook but never exported) now shown alongside the condensed one-line shall statement, resolving GBO's repeated ask for the full/verbatim RTM text."
      v20: "STATUS/Compliance legend (real COMPLIANCE_LEGEND colours) now LEADS the Taxonomy tab, per GBO's explicit request. New live 'Lifecycle phase coverage' bar visual (L0-L6 + PAC/Warranty/FAC, coloured by Lifecycle supergroup) -- also the first live metric tying supergroups to real counts (previously pure reference text, confirmed zero live usage anywhere). New Subsystems-domain drill-down (202 RTMs, matches GBO's count exactly; grouped by the 45 real sectionTitle values since subcategory is blank for all of them -- cluster mix + avg/composite Weighted S + top-ranked RTM per group). New collapsible tree view for the 32-entry Deliverables Dossier (6 top-level + 26 sub-items), alongside the existing flat table. export_nav_data.py gained the statusLegend/statusLegendNote fields (from COMPLIANCE_LEGEND!A6:F13)."
      v22: "13th tab, 'PCA / Structure' -- see html_navigator.builder_chain's v24 entry above for full detail. First Navigator tab built entirely with self-contained inline SVG scatter charts (buildScatterSvg() helper, new top-level function) rather than the div-bar Pareto pattern every other tab uses -- chosen because a 2D scatter genuinely needs 2 independent axes, which div-bars can't represent. btLambda surfaced on both Lookup cards. (v21 was the AD_07/08 re-sync, already logged above; there was no separate v21 Navigator feature round beyond that re-sync.)"

  bt_method_deck:
    canonical: BT_Method_Evaluation_v12.pptx
    purpose: "BT scoring methodology deck (weight dimensions, gate precedence, rank charts)."
    builder_chain:
      - {script: build_bt_deck_v5.py, in: "GBO's uploaded BT_Method_Evaluation_v3_6.pptx", out: BT_Method_Evaluation_v5.pptx, summary: "Aptos font unification, content-aware text-size bump, navy/blue-grey -> purple/lavender palette blend, 2 real slide-9 overlap bugs found+fixed"}
      - {script: build_bt_deck_v6.py, in: v5, out: v6, summary: "6 new slides (14-19): CHART-S00 master grid + CHART-S01..05 each chart blown up 1x1 with reused board-read captions"}
      - {script: "MISSING (v7, v8)", in: v6, out: v8, note: "content of v7/v8 not reconstructable from a saved script -- see gaps.missing_build_scripts"}
      - {script: "inline python (no saved build_bt_deck_v9.py)", in: v8, out: BT_Method_Evaluation_v9.pptx, summary: "2 new slides: EVAL-S08 real PCA on all 722 RTMs' 7 BT dimensions (PC1=30.6% var, PC2=16.5%, 5 PCs needed for 84.5% cumulative); EVAL-S09 Sum-vs-Average-Weighted-S domain quadrant bubble chart explaining why Section 4's volume doesn't dominate Average. Both replicate the deck's exact visual style (purple header bar, EMU positions, fonts) inspected directly from an existing slide's shape properties. See gaps.missing_build_scripts -- this v9 step should also be formalised as a saved script next round."}
      - {script: build_bt_deck_v10.py, in: v9, out: BT_Method_Evaluation_v10.pptx, summary: "1 new slide (24), EVAL-S10: Deliverables Dossier / Applicable Documentation relevance -- 6 top-level AD group table (sub-item + citing-RTM counts), a relevance/importance callout, and an open-items note that the actual AD source documents haven't been ingested yet (GBO offered a local folder). Content pulled directly from nav_data_v22.json's deliverablesDossier field, not estimated."}
      - {script: "inline python (no saved build script -- retroactively logged, was missing from this chain)", in: v10, out: BT_Method_Evaluation_v11.pptx, summary: "Fixed a real duplicate badge-code bug found via raw XML grep across all 24 slides: EVAL-S08 was used on both slide 21 and slide 22 (inherited from the unsaved v9 build step). Renumbered slide 22 EVAL-S08->S10, slide 23 EVAL-S09->S11, slide 24 (the new Dossier slide) EVAL-S10->S12."}
      - {script: build_bt_deck_v12.py, in: v11, out: BT_Method_Evaluation_v12.pptx, summary: "Control-phase + task #59 round. REBUILT EVAL-S12 (Deliverables Dossier) in place against nav_data_v23.json -- was stale at 32 entries/6 groups, now 34/8 (AD_07/08 added). Deleted+re-appended via python-pptx XML surgery (no in-place slide-edit API exists); verified safe since nothing in this deck references slides by position, only by badge code. Appended 3 new slides: EVAL-S13 'Honest ranking: official (gate-first) vs pure weighted-S' (direct response to GBO's 'do not want to warp picture' ask -- gate coloring kept, pure-score column added as disclosure, not a replacement rank; all 6 gate items drop an avg of 11.3 places under pure scoring, confirming gate status and score are genuinely independent); EVAL-S14 weight-scenario side-by-side (Base/Equal/Cost=70%, message banner, real Spearman findings from backlog Section 19); EVAL-S15 granular OFFER cross-reference (Code/Standard, Explicit deliverable, Phase summary, Primary/Supporting RTM counts for top-10 by rank, all fields pulled directly from OFFER_RANKING). 2 layout bugs found+fixed pre-ship: EVAL-S13 table column widths summed wider than the slide (overflow, caught via LibreOffice-PDF render); EVAL-S15's naive phase-string truncation made every row look identical (all start 'L0 Tender / Offer') -- replaced with a phase_summary() helper (count + first-to-last range) that actually shows the real per-row variation. Verified: zip/XML integrity, 27/27 slides load, badge-uniqueness re-confirmed via XML grep (EVAL-S13/14/15 each appear on exactly 1 slide)."}

  mtbf_dmaic_deck:
    canonical: QPS_MTBF_WCS_DMAIC_v7.pptx
    purpose: "MTBF/reliability DMAIC master deck, separate lineage from the BT-method deck (different source content, different slide count -- 38 slides per content.yaml)."
    builder_chain:
      - {script: build_deck.py .. build_deck5.py, note: "phase 1-5 iterative slide builders against QPS_MTBF_WCS.pptx; energy-mix donut chart added v5 via make_energy_pie.py"}
      - {script: fix_mtbf_rtm_numbers.py, in: QPS_MTBF_WCS_DMAIC_v5.pptx, out: v6, summary: "reconciled obsolete RTM-### citations in Appendix D/F/G/H/I against the canonical RTM-001..722 register; found and fixed multiple mismatched citations"}
      - {script: "MISSING (v7)", in: v6, out: v7, note: "no saved script for the v6->v7 edit -- see gaps.missing_build_scripts"}

  pdf_exports:
    canonical: QPS_Taxonomy_and_Domain_Summary.pdf
