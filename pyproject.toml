[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abacus-dow"
version = "5.0.0"
description = "ABACUS DOW analytical runtime and governed DMAIC/PCA/BT execution framework"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
abacus = "DMAIC_V3.__main__:main"

[dependency-groups]
dev = [
  "CoolProp==7.2.0",
]

[tool.setuptools]
packages = ["DMAIC_V3"]

# Product release identity lives in [project].version.
# DMAIC_V3/config.py VERSION remains the independent engine-generation/API version.


[tool.coverage.run]
source = ["."]
branch = true
dynamic_context = "test_function"
omit = [
  "tests/*",
  "*/tests/*",
  "/tmp/*",
  "*/pytest-of-*/*",
  "*/venv/*",
  "*/__pycache__/*",
  "*/site-packages/*",
  "*/BACKUPS/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"
