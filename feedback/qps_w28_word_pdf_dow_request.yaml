  - do_not_set_child_compliance_or_negotiation_closure
orchestration:
  sequence:
    - source_intake
    - Word_structure_inspection
    - skill_and_builder_reuse_scan
    - normalization_without_silent_rewording
    - governed_PDF_render
    - visual_QA
    - duplicate_surface_prune_scan
    - DOW_receipt
    - child_accept_reject_defer
