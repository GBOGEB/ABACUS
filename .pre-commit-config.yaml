repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: end-of-file-fixer
        exclude: (^|/)LICENSE$
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: abacus-testpilot-fast
        name: ABACUS TestPilot fast preflight
        entry: python scripts/testpilot_preflight.py --mode fast
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: cbd-e2e-pre-commit
        name: CBD TestPilot source-bound pre-commit atom checks
        entry: python scripts/cbd_e2e_stage.py --stage pre-commit --receipt .testpilot/e2e/pre_commit.json
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: cbd-e2e-pre-push
        name: CBD TestPilot source-bound pre-push and pytest proof
        entry: python scripts/cbd_e2e_stage.py --stage pre-push --receipt .testpilot/e2e/pre_push.json
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: mip2-method-contracts
        name: MIP2 method contract validation
        entry: python tools/mip2/validate_method_contracts.py
        language: system
        pass_filenames: false
        files: ^tools/mip2/
        stages: [pre-commit]
      - id: mip2-python-syntax
        name: MIP2 Python syntax preflight
        entry: python -m compileall -q tools/mip2
        language: system
        pass_filenames: false
        files: ^tools/mip2/.*\.py$
        stages: [pre-commit]
      - id: abacus-floating-staging-testflight
        name: ABACUS floating reconnection staged regression
        entry: python -m unittest -q tests.test_floating_testflight tests.test_mip_v3_frontier tests.test_mip_v3_temporal tests.test_floating_accelerator_receiver tests.test_floating_rollup_adversarial
        language: system
        pass_filenames: false
        files: ^(tools/triage/(floating_testflight|floating_evidence_join|mip_pulse_rollup)\.py|tests/test_(floating_testflight|floating_evidence_join|mip_pulse_rollup|mip_v3_frontier|mip_v3_temporal|floating_accelerator_receiver|floating_rollup_adversarial)\.py|scripts/coverage_dab_census\.py|\.github/workflows/floating-reconnection-testflight\.yml)$
        stages: [pre-commit]
