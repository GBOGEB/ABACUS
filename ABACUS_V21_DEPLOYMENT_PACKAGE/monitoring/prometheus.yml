global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'abacus-v21'
    environment: 'production'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  - job_name: 'abacus-application'
    static_configs:
      - targets: ['abacus:8000']
        labels:
          service: 'abacus'
          component: 'application'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  []
