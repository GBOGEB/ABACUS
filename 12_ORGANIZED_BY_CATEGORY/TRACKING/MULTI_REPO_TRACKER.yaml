usage_notes: |
  This MULTI_REPO_TRACKER.yaml provides structured tracking of all 7 GBOGEB
  repositories in the GLOOB integration project.

  **How to Use:**
  1. Check per-repo status sections for detailed information
  2. Review cross-repo integration points for dependencies
  3. Monitor progress_summary for overall project status
  4. Use next_actions for task prioritization
  5. Update as repos are analyzed and integrated

  **Repo Priority Levels:**
  - PRIMARY: Core repo, highest importance (GBOGEB/ABACUS)
  - HIGH: Important repos, analyze next (RTM, Codespaces)
  - MEDIUM: Valuable repos, analyze later (Pipeline, Docs)
  - OPEN_RFI: Structural finding requires human decision (Master_Input)

  **Status Values:**
  - PHASE_1_COMPLETE: Full analysis and deliverables created
  - PENDING_ANALYSIS: Identified but not yet analyzed
  - DEFERRED: Postponed to later phase
  - OPEN_RFI: Requires human decision before further triage

  **V_eff Rule:**
  Fields marked OPEN have no source in the rex scan YAMLs.
  Do not fill them speculatively — verify from repo or ask owner.

  **Integrate_me Backlogs:**
  Not inlined here. Reference files contain full path lists grouped by reason code:
    ABACUS: C:\repos\rex-mapping\_abacus_im_paths.txt  (831 entries)
    CODEX:  C:\repos\rex-mapping\_codex_im_paths.txt   (404 entries)

  **Update Frequency:**
  - Update after each repo analysis
  - Update when cross-repo integration points identified
  - Update when dependencies resolved
  - Update when priorities change

