# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci/cd"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 10

  # Keep Python dependencies in DMAIC_V3/requirements.txt up to date
  - package-ecosystem: "pip"
    directory: "/DMAIC_V3"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 5

  # QPS Yarn (managed by Dependabot via package-ecosystem: "npm" for yarn.lock):
  # small, attributable npm security/version update PRs.
  - package-ecosystem: "npm"
    directory: "/qps_slide_reviewer"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 4
    versioning-strategy: "increase-if-necessary"
