# yamllint disable rule:line-length
name: G3A N15 Cross-Python Source-Matched Coverage Proof
on:
  pull_request:
    paths:
      - 'tests/test_g3a_n15_alias_fault_matrix.py'
      - 'DMAIC_V3/debug_pipeline.py'
      - 'DMAIC_V3/phases/phase4_improve.py'
      - 'DMAIC_V3/phases/phase8_todo_management.py'
      - 'cicd_github_orchestrator.py'
      - 'scripts/g3a_bounded_mission.py'
      - 'MIP/statistics/g3a_w16_kpi.py'
      - 'MIP/statistics/g3a_w16_epoch.json'
      - 'scripts/g3a_w16_preflight.py'
      - 'scripts/g3a_w16_repin.py'
      - '.github/workflows/g3a-n15-python-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  n15-same-head-proof:
    name: N15 source-bound Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checkout and pinned epoch source blobs
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -c 'import json;[print(p,v["blob"]) for p,v in sorted(json.load(open("MIP/statistics/g3a_w16_epoch.json"))["files"].items())]' |
            while read -r path blob; do
              actual="$(git hash-object "$path")"
              if [[ "$actual" != "$blob" ]]; then
                echo "::error::SOURCE_BLOB_DRIFT $path pinned=$blob actual=$actual; re-pin with scripts/g3a_w16_repin.py"
                exit 1
              fi
            done
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install narrow compatibility tools
        run: python -m pip install --disable-pip-version-check 'coverage[toml]==7.16.2' 'PyYAML==6.0.2' 'pytest>=8,<9'
      - name: Run source-epoch W16 tests and measure the pinned five-file arcs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test_reports/n15
          python -m coverage run --branch --source=DMAIC_V3.phases.phase4_improve,DMAIC_V3.phases.phase8_todo_management,DMAIC_V3.debug_pipeline,cicd_github_orchestrator,scripts -m unittest discover -s tests -p 'test_g3a_*.py' -v 2>&1 | tee test_reports/n15/unittest.log
          python -m coverage json -o test_reports/n15/coverage.json
          python -m pytest --noconftest -q tests/test_dmaic_phase4_noop_contract_20261013.py 2>&1 | tee test_reports/n15/noop_contract_pytest.log
      - name: Verify exact denominator and monotone arc presence
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          NATIVE_RUN_ID: ${{ github.run_id }}
          NATIVE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,re,subprocess,sys
          root=pathlib.Path('test_reports/n15')
          epoch=json.loads(pathlib.Path('MIP/statistics/g3a_w16_epoch.json').read_text())
          py='%d.%d' % sys.version_info[:2]
          data=json.loads((root/'coverage.json').read_text())
          if data.get('meta',{}).get('version')!=epoch['coverage_version']:
              raise SystemExit('HOLD: instrumentation drift')
          measured={}
          for path in sorted(epoch['files']):
              found=[v for k,v in data['files'].items() if k==path or k.endswith('/'+path)]
              if len(found)!=1: raise SystemExit('HOLD: missing/duplicate coverage '+path)
              s=found[0]['summary']
              measured[path]={k:int(s[k]) for k in
                  ('num_statements','covered_lines','num_branches','covered_branches')}
              record={'epoch':epoch['source_epoch'],'coverage_version':data['meta']['version'],
                      'python':py,'path':path,'branches':s['num_branches'],'covered':s['covered_branches']}
              print('::notice title=W16 native measurement::W16_MEASURED '+json.dumps(record,sort_keys=True))
          log=(root/'unittest.log').read_text()
          matches=re.findall(r'Ran (\d+) tests? in',log)
          if not matches or int(matches[-1])<epoch['min_tests'] or '\nOK' not in log:
              raise SystemExit('HOLD: W16 same-source cohort not completely green')
          pending=[p for p,e in epoch['files'].items() if e['branches'].get(py) is None]
          if pending:
              raise SystemExit('HOLD: epoch '+epoch['source_epoch']+' pending native measurement on Python '+py+
                               '; feed the W16_MEASURED lines to scripts/g3a_w16_repin.py --measured')
          for path,entry in epoch['files'].items():
              if measured[path]['num_branches']!=entry['branches'][py]:
                  raise SystemExit('HOLD: Python/compiler denominator drift '+path)
              if entry['floor'] is not None and measured[path]['covered_branches']<entry['floor']:
                  raise SystemExit('HOLD: native branch reach displaced '+path)
          receipt={
            'schema':'code-purple.g3a.w16.cross-python.v1',
            'source_sha':os.environ['EXPECTED_HEAD'],
            'checkout_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'python':sys.version.split()[0],
            'coverage_version':data.get('meta',{}).get('version'),
            'run_id':int(os.environ['NATIVE_RUN_ID']),
            'run_attempt':int(os.environ['NATIVE_RUN_ATTEMPT']),
            'job_id':None,'job_identity':'PENDING_NATIVE_API_READBACK',
            'passed_test_count':int(matches[-1]),'failed_test_count':0,
            'source_epoch':epoch['source_epoch'],'lineage':epoch['lineage'],
            'source_unchanged_from_N14':False,
            'historical_n14':{'four_file_covered':200,'four_file_eligible':446,
                              'comparable':False,'delta_pp':None},
            'current_five_file_covered':sum(x['covered_branches'] for x in measured.values()),
            'current_five_file_eligible':sum(x['num_branches'] for x in measured.values()),
            'categories':{p:e['category'] for p,e in epoch['files'].items()},
            'files':measured,'accepted_root_closures':0,
            'merge_admission':'HOLD','security_waiver':False,'authority_transfer':False,
          }
          (root/'native_receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('N15_PYTHON='+sys.version.split()[0])
          print('W16_FIVE_FILE_BRANCH='+str(receipt['current_five_file_covered'])+'/'+str(receipt['current_five_file_eligible']))
          print('N15_GATES=HOLD')
          PY
      - name: Always preserve native first-red and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: g3a-n15-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test_reports/n15/
          if-no-files-found: warn
