name: W105 QPS B1-B2 MIP Probe
on:
  pull_request:
    paths:
      - '.github/workflows/w105-qps-b1b2-mip-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qps-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      QPS_SHA: 7145bf462af40028000e676c98a8d060210872cc
    steps:
      - uses: actions/checkout@v4
        with:
          repository: GBOGEB/cryoplant-project
          ref: ${{ env.QPS_SHA }}
          path: qps
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check openpyxl PyYAML
      - run: python qps/scripts/validate_mip_3p3.py
      - run: python qps/scripts/qps_w85_materialize_alat_surfaces.py --out-dir out/pass1 --expected-head "$QPS_SHA"
      - run: python qps/scripts/qps_w85_materialize_alat_surfaces.py --out-dir out/pass2 --expected-head "$QPS_SHA"
      - run: cmp out/pass1/QPS_ALAT_NEGOTIATION_REVIEW_CURRENT.xlsx out/pass2/QPS_ALAT_NEGOTIATION_REVIEW_CURRENT.xlsx
      - run: cmp out/pass1/QPS_ALAT_NEGOTIATION_REVIEW_CURRENT.html out/pass2/QPS_ALAT_NEGOTIATION_REVIEW_CURRENT.html
      - uses: actions/upload-artifact@v4
        with:
          name: w105-qps-b1b2-mip-probe
          path: out/pass1/
