name: Auto-Merge PRs

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to enable auto-merge for"
        required: true

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for selected PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash
