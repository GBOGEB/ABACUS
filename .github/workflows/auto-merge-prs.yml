name: Auto-Merge PRs

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to auto-merge (leave empty for all)'
        required: false

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false && 
       github.event.pull_request.user.login == 'github-actions[bot]')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install PyGithub requests

      - name: Auto-merge eligible PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
        run: |
          python .github/scripts/auto_merge_prs.py

  auto-update-branch:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    
    steps:
      - name: Auto-update branch if behind
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            
            // Check if PR is behind base branch
            const comparison = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: pr.head.ref,
              head: pr.base.ref
            });
            
            if (comparison.data.behind_by > 0) {
              console.log(`PR #${pr.number} is ${comparison.data.behind_by} commits behind. Updating...`);
              
              try {
                await github.rest.pulls.updateBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number
                });
                console.log(`✅ Successfully updated PR #${pr.number}`);
              } catch (error) {
                console.log(`⚠️ Could not auto-update PR #${pr.number}: ${error.message}`);
              }
            } else {
              console.log(`PR #${pr.number} is up to date`);
            }

  auto-approve-bot-prs:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' && 
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login == 'github-actions[bot]'
    
    steps:
      - name: Auto-approve bot PRs
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            
            // Check if all checks passed
            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha
            });
            
            const allPassed = checks.data.check_runs.every(
              check => check.status === 'completed' && check.conclusion === 'success'
            );
            
            if (allPassed) {
              console.log(`All checks passed for PR #${pr.number}. Auto-approving...`);
              
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                event: 'APPROVE',
                body: '✅ Auto-approved: All checks passed, no conflicts detected.'
              });
              
              console.log(`✅ Auto-approved PR #${pr.number}`);
            } else {
              console.log(`⚠️ Not all checks passed for PR #${pr.number}`);
            }
