name: cryoplant-project Federation Check

# Validates the DELTA_1 auxiliary-plane integration between
# GBOGEB/cryoplant-project and GBOGEB/ABACUS, including the recorded
# ABACUS-to-cryoplant reciprocal smoke that an active membership requires.

on:
  push:
    branches: [main]
    paths:
      - 'federation/manifest.yaml'
      - 'runtime/federation/codex-abacus-federation.yaml'
      - 'integration/cryoplant_project/**'
      - '.github/workflows/cryoplant-federation.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'federation/manifest.yaml'
      - 'runtime/federation/codex-abacus-federation.yaml'
      - 'integration/cryoplant_project/**'
      - '.github/workflows/cryoplant-federation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  federation-smoke:
    name: Federation Smoke (cryoplant-project)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ABACUS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v7
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pytest pyyaml

      - name: Run cryoplant-project integration smoke tests
        run: >-
          python -m pytest integration/cryoplant_project/tests
          -m smoke -v --tb=short -p no:cacheprovider
