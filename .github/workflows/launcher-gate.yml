name: Launcher gate (report-only)

# Reports workflow steps (push / schedule / workflow_run triggered) that launch
# local paths missing from the checkout. Report-only: always exits 0; findings
# go to the step summary and an artifact. Remedies are bridge / prune / spec,
# see docs/ci/RED_CENSUS_README.md. Exceptions: ledger/launcher_exceptions.yaml.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Launcher gate (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install PyYAML
        run: python -m pip install PyYAML==6.0.3

      - name: Scan workflow launchers
        run: |
          python scripts/launcher_gate.py --root . \
            --out launcher-gate.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launcher-gate
          path: launcher-gate.json
          if-no-files-found: warn
          retention-days: 30
