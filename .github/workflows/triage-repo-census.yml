name: TRIAGE Repo Census
on:
  pull_request:
    paths: ['triage/**','scripts/validate_triage_census.py','.github/workflows/triage-repo-census.yml']
  push:
    branches: [main]
    paths: ['triage/**','scripts/validate_triage_census.py']
jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pyyaml
      - run: python scripts/validate_triage_census.py
      - run: python triage/run_repo_census.py
      - name: Guard DOW authority boundary
        run: |
          grep -q 'DOW_DERIVED_ANALYSIS' triage/census/ABACUS.census.yaml
          grep -q 'parent repo may not promote engineering facts' triage/census/ABACUS.census.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: triage-repo-census-abacus
          path: triage/generated/
