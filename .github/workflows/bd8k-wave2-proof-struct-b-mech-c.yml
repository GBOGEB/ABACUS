name: BD8K Wave2 STRUCT-B-MECH-C targeted proof

on:
  push:
    branches:
      - bd8k-wave2-struct-b-mech-c-20261001

jobs:
  ast-proof:
    if: startsWith(github.event.head_commit.message, 'BD8K Wave2 proof STRUCT-B-MECH-C')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bd8k-wave2-struct-b-mech-c-20261001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove AST equivalence and compile
        env:
          BASE_SHA: 575784c61bae24934d1ef85accb9e080a0fb15f7
          FILES_JSON: '["DMAIC_V3/tests/test_agent_manager_requalification.py","architecture/mesh/select_mesh_blocker.py","qps/human_rendition/w276/validate_review_profile.py","qps/visual_regression/w286/validate_review_profile.py","scripts/code_health_check.py","scripts/deterministic_census_authority_and_contract_check.py","scripts/diagnostic_kpi_probe.py","scripts/mcp_capacity_fit.py","scripts/mcp_health_server.py","scripts/validate_gm_i_a_coolprop_runtime_bridge_p002.py","scripts/validate_triage_census.py","scripts/w285_recompute_federation_depth.py","tests/test_w83_ng1_nongovernance_outcome.py","tools/gloob_dispatch_responder.py","tools/triage/accept_accelerator_atom_contract.py","tools/w81_repair_outcome_block.py"]'
        run: |
          python - <<'PY'
          import ast, json, os, subprocess
          from pathlib import Path
          base=os.environ["BASE_SHA"]
          files=json.loads(os.environ["FILES_JSON"])
          receipt={"base_sha":base,"files":[],"errors":[]}
          for name in files:
              try:
                  old=subprocess.check_output(["git","show",f"{base}:{name}"],text=True)
                  new=Path(name).read_text(encoding="utf-8")
                  old_ast=ast.dump(ast.parse(old,filename=name),include_attributes=False)
                  new_ast=ast.dump(ast.parse(new,filename=name),include_attributes=False)
                  same=(old_ast==new_ast)
                  receipt["files"].append({"path":name,"ast_equal":same})
                  if not same:
                      receipt["errors"].append(f"AST changed: {name}")
              except Exception as exc:
                  receipt["errors"].append(f"{name}: {exc}")
          Path("/tmp/targeted-proof.json").write_text(json.dumps(receipt,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(receipt,indent=2))
          if receipt["errors"]:
              raise SystemExit("\n".join(receipt["errors"]))
          PY
          python -m py_compile "DMAIC_V3/tests/test_agent_manager_requalification.py" "architecture/mesh/select_mesh_blocker.py" "qps/human_rendition/w276/validate_review_profile.py" "qps/visual_regression/w286/validate_review_profile.py" "scripts/code_health_check.py" "scripts/deterministic_census_authority_and_contract_check.py" "scripts/diagnostic_kpi_probe.py" "scripts/mcp_capacity_fit.py" "scripts/mcp_health_server.py" "scripts/validate_gm_i_a_coolprop_runtime_bridge_p002.py" "scripts/validate_triage_census.py" "scripts/w285_recompute_federation_depth.py" "tests/test_w83_ng1_nongovernance_outcome.py" "tools/gloob_dispatch_responder.py" "tools/triage/accept_accelerator_atom_contract.py" "tools/w81_repair_outcome_block.py"
      - uses: actions/upload-artifact@v4
        with:
          name: bd8k-wave2-struct-b-mech-c-targeted-proof
          path: /tmp/targeted-proof.json
