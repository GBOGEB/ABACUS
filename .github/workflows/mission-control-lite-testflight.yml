name: Mission Control Lite Testflight
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mission_control_lite/**'
      - 'tests/test_mission_control_lite.py'
      - 'tests/test_mission_control_lite_rex.py'
      - '.github/workflows/mission-control-lite-testflight.yml'
permissions:
  contents: read
jobs:
  native-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Focused tests
        run: |
          python -m unittest discover -s tests \
            -p test_mission_control_lite.py -v
          python -m unittest discover -s tests \
            -p test_mission_control_lite_rex.py -v
      - name: Native output and evidence
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -eu
          mkdir -p evidence
          SOURCE_SHA="$(git rev-parse HEAD)"
          export SOURCE_SHA
          test "$SOURCE_SHA" = "$PR_HEAD_SHA"
          python -c 'import json,os;json.dump({"executed_sha":os.environ["SOURCE_SHA"],"pull_head_sha":os.environ["PR_HEAD_SHA"],"event_sha":os.environ["EVENT_SHA"],"checkout_kind":"pull_head" if os.environ["SOURCE_SHA"]==os.environ["PR_HEAD_SHA"] else "merge_or_other"},open("evidence/provenance.json","w"))'
          python -c 'import json; from pathlib import Path; p=Path("evidence/output.json"); p.write_text(json.dumps({"status":"executed","kind":"native-testflight"}))'
          python -m mission_control_lite.cli produce \
            --mission MCL-P0 --task native-proof --root MCL-ROOT-1 \
            --sha "$SOURCE_SHA" --run "$RUN_ID" \
            --output evidence/output.json --receipt evidence/receipt.json
          python -m mission_control_lite.cli ingest evidence/receipt.json \
            --artifact-root . --db evidence/registry.sqlite
          python -m mission_control_lite.cli census \
            --db evidence/registry.sqlite > evidence/census.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mission-control-lite-evidence
          path: evidence/
          include-hidden-files: false
          if-no-files-found: error
