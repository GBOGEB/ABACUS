name: Mission Control Lite Testflight
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mission_control_lite/**'
      - 'tests/test_mission_control_lite.py'
      - '.github/workflows/mission-control-lite-testflight.yml'
permissions:
  contents: read
jobs:
  native-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused tests
        run: python -m unittest discover -s tests -p test_mission_control_lite.py -v
      - name: Native output and evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p evidence
          python -c 'import json;json.dump({"status":"executed","kind":"native-testflight"},open("evidence/output.json","w"))'
          python -m mission_control_lite.cli produce --mission MCL-P0 --task native-proof --root MCL-ROOT-1 --sha "$SOURCE_SHA" --run "$RUN_ID" --output evidence/output.json --receipt evidence/receipt.json
          python -m mission_control_lite.cli ingest evidence/receipt.json --db evidence/registry.sqlite
          python -m mission_control_lite.cli census --db evidence/registry.sqlite > evidence/census.json
      - uses: actions/upload-artifact@v4
        with:
          name: mission-control-lite-evidence
          path: evidence/
          if-no-files-found: error
