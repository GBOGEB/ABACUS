name: W83 Disposable Semantic Basis Diversity

on:
  pull_request:
    paths:
      - "tools/w83_semantic_basis_probe.py"
      - "tools/w83_semantic_basis_diversity.py"
      - ".github/workflows/w83-semantic-basis-diversity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout probe control
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate W83 helpers
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/w83_semantic_basis_probe.py \
            tools/w83_semantic_basis_diversity.py
          mkdir -p architecture/w83
          python tools/w83_semantic_basis_probe.py \
            --root . \
            --source-sha "${GITHUB_SHA}" \
            --matrix-label current-control \
            --out architecture/w83/W83_CURRENT_PROBE.json
          test -s architecture/w83/W83_CURRENT_PROBE.json

  measure:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - label: s01
            sha: 2a5104eecb2ab3ed340c2e63b3f2ba3b46cb56dd
          - label: s02
            sha: 107c889c87137bfc660a69bfd7dd1cfc121291fc
          - label: s03
            sha: e2ae50cc6951a0fdead9e9b18ea52695c78984be
          - label: s04
            sha: 6f70a2926ecc2aa40e54f7d9f869f1804e4a1e41
          - label: s05
            sha: c9bc44d217d81244e3f6753cd79ae45781b23163
          - label: s06
            sha: e80e7b959c0f0759c48bb0ccf5378564aa29e0ff
          - label: s07
            sha: b0761df32fc31c3757bb499f20af386f3569bebb
          - label: s08
            sha: bffdc3779cd24ed18c043bde571d1d856cd5c8c2
          - label: s09
            sha: 1dfe11f59bca30c4d76ec8c22db237b0a37f1852
          - label: s10
            sha: 09c8a36c5a75816c71f2ec45667c3a5103e2a7de
          - label: s11
            sha: e20f923b5994a2d817fe1fde5d625d189170127b
          - label: s12
            sha: 3e52a1db7560c56a4e67a9a0ffd5686600cfceb1
          - label: s13
            sha: 970bc70a016bc071cd3c97bfdbd012d48a85055d
          - label: s14
            sha: c39696661d8d67c769c8031a962129c6d67c3935
          - label: s15
            sha: 8f7f419d388839a68a416aaa552846cae0c16ac3
          - label: p1281-pass
            sha: 7e8ee178f9d7e6d0d2797c754a7e8fbbde93057b
          - label: p1286-fail
            sha: 9b89aa3516209f18447f03de91e91b21b35c9304
          - label: p1288-fail
            sha: a5a44635d5b10c6bb1984db131d254872efd8b0d
          - label: p1289-pass
            sha: 51e044499bcf8828f9bf92c4472f6c0419f58834
          - label: p1291-fail
            sha: 17f70d5398a710a3714de8dd50f400b3a6c27dee
          - label: p1292-pass
            sha: 9c0e4cd1cf37ff7bebbda9b33734504c32787862
    env:
      TARGET_SHA: ${{ matrix.target.sha }}
      MATRIX_LABEL: ${{ matrix.target.label }}
    steps:
      - name: Checkout W83 control implementation
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Measure typed semantic basis on exact source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${TARGET_SHA}"
          worktree="${RUNNER_TEMP}/w83-${TARGET_SHA:0:12}"
          git worktree add --detach "${worktree}" FETCH_HEAD
          mkdir -p architecture/w83
          out="architecture/w83/W83_SEMANTIC_BASIS_RECEIPT.json"
          python tools/w83_semantic_basis_probe.py \
            --root "${worktree}" \
            --source-sha "${TARGET_SHA}" \
            --matrix-label "${MATRIX_LABEL}" \
            --out "${out}"
          test -s "${out}"
          echo "W83_RECEIPT_BEGIN"
          cat "${out}"
          echo "W83_RECEIPT_END"
          git worktree remove --force "${worktree}"

      - name: Upload W83 receipt
        uses: actions/upload-artifact@v4
        with:
          name: w83-${{ matrix.target.label }}-${{ github.sha }}
          path: architecture/w83/W83_SEMANTIC_BASIS_RECEIPT.json
          if-no-files-found: error

  aggregate:
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout W83 control implementation
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Download W83 receipts
        uses: actions/download-artifact@v4
        with:
          pattern: w83-*
          path: architecture/w83/receipts

      - name: Evaluate basis diversity without PCA
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t receipts < <(
            find architecture/w83/receipts \
              -name W83_SEMANTIC_BASIS_RECEIPT.json \
              -type f \
              | sort
          )
          test "${#receipts[@]}" -eq 21
          python tools/w83_semantic_basis_diversity.py \
            "${receipts[@]}" \
            --out architecture/w83/W83_DIVERSITY_RECEIPT.json
          cat architecture/w83/W83_DIVERSITY_RECEIPT.json

      - name: Upload W83 diversity receipt
        uses: actions/upload-artifact@v4
        with:
          name: w83-diversity-${{ github.sha }}
          path: architecture/w83/W83_DIVERSITY_RECEIPT.json
          if-no-files-found: error
