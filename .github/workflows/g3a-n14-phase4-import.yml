name: G3A N14 Phase4 Alias-Safe Source Repair Proof
on:
  pull_request:
    paths:
      - 'tests/test_g3a_n14_phase4_import.py'
      - 'DMAIC_V3/phases/phase4_improve.py'
      - '.github/workflows/g3a-n14-phase4-import.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  n14-native-regression:
    name: N14 Phase4 source + 89-test branch cohort Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Guard exact source head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install narrow pinned test tools
        run: python -m pip install --disable-pip-version-check 'coverage==7.16.2' 'PyYAML==6.0.2'
      - name: Run full old and N14 source regression cohort
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test_reports/n14
          python -m coverage run --branch --source=DMAIC_V3.phases.phase4_improve,DMAIC_V3.phases.phase8_todo_management,DMAIC_V3.debug_pipeline,cicd_github_orchestrator,scripts -m unittest discover -s tests -p 'test_g3a_*.py' -v 2>&1 | tee test_reports/n14/unittest.log
          python -m coverage json -o test_reports/n14/coverage.json
      - name: Emit source-bound denominator and review-only root receipt
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          root=pathlib.Path('test_reports/n14')
          summary=json.loads((root/'coverage.json').read_text())['files']
          targets={
            'DMAIC_V3/phases/phase4_improve.py':134,
            'DMAIC_V3/phases/phase8_todo_management.py':118,
            'DMAIC_V3/debug_pipeline.py':116,
            'cicd_github_orchestrator.py':78,
            'scripts/g3a_bounded_mission.py':116,
          }
          data={}
          for path, old_branches in targets.items():
            found=[v['summary'] for name,v in summary.items()
                   if name==path or name.endswith('/'+path)]
            if len(found)!=1:
              raise SystemExit('HOLD: missing/duplicate instrumentation '+path)
            m=found[0]
            if m['num_branches']<=0 or not 0<=m['covered_branches']<=m['num_branches']:
              raise SystemExit('HOLD: malformed branch telemetry '+path)
            if path!='DMAIC_V3/phases/phase4_improve.py' and m['num_branches']!=old_branches:
              raise SystemExit('HOLD: unexpected cross-owner denominator change '+path)
            data[path]={'covered_lines':m['covered_lines'],'num_statements':m['num_statements'],
                        'covered_branches':m['covered_branches'],'num_branches':m['num_branches'],
                        'original_branch_denominator':old_branches,
                        'branch_denominator_delta':m['num_branches']-old_branches}
          source=subprocess.check_output(['git','hash-object','DMAIC_V3/phases/phase4_improve.py'],text=True).strip()
          if source=='c86e8e3406f0942f7c0dc3eda4952588308c169d' and data['DMAIC_V3/phases/phase4_improve.py']['branch_denominator_delta']:
            raise SystemExit('HOLD: mismatched unchanged source denominator')
          log=(root/'unittest.log').read_text()
          match=re.findall(r'Ran (\d+) tests? in',log)
          if not match or int(match[-1])<89 or '\nOK' not in log:
            raise SystemExit('HOLD: fewer than 89 legacy/new native tests')
          record={'schema':'code-purple.g3a.n14.phase4.v1','source_sha':os.environ['EXPECTED_HEAD'],
                  'checkout_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                  'phase4_source_blob':source,'run_id':int(os.environ['RUN_ID']),
                  'run_attempt':int(os.environ['RUN_ATTEMPT']),'job_id':None,
                  'tests_executed':int(match[-1]),'tests_failed':0,
                  'measurements':data,'changed_source_scope':'phase4_only',
                  'same_source_percent_uplift':None,'matched_arc_delta':None,
                  'candidate_source_root_status':'REPRODUCED_BEFORE_FIX_NOT_FORMALLY_CLOSED',
                  'accepted_causal_root_closures':0,'security_waiver':False,
                  'authority_transfer':False,'merge_admission':'HOLD'}
          (root/'native_receipt.json').write_text(json.dumps(record,sort_keys=True,indent=2)+'\n')
          print('N14_PHASE4_BRANCH='+str(data['DMAIC_V3/phases/phase4_improve.py']['covered_branches'])+'/'+str(data['DMAIC_V3/phases/phase4_improve.py']['num_branches']))
          print('N14_TESTS='+str(int(match[-1]))+'; ROOT_CLOSURE=HOLD; MERGE=HOLD')
          PY
      - name: Preserve first-red and source-bound coverage receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3a-n14-phase4-${{ github.run_id }}-${{ github.run_attempt }}
          path: test_reports/n14/
          if-no-files-found: warn
