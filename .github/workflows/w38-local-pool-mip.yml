name: CODE PURPLE W38 Local Pool MIP Scale Census
on:
  pull_request:
    paths:
      - 'tools/recovery/w38_local_pool_benchmark.py'
      - 'tests/test_w38_local_pool_mip.py'
      - '.github/workflows/w38-local-pool-mip.yml'
      - 'docs/ci/W33_POOL_DAG_MIP.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w38-local-mip-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  measured-local:
    name: W38 local MIP ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.10'}
          - {os: ubuntu-24.04, python: '3.11'}
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: windows-2022, python: '3.11'}
    steps:
      - name: Checkout exact W38 source without stored credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up native interpreter
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify HEAD and run falsification controls
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python -m unittest discover -s tests -p 'test_w38_local_pool_mip.py' -v
      - name: Repeat comparable 1/2/4 worker census for separate workload families
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python -m tools.recovery.w38_local_pool_benchmark --out w38_receipts --head "$SOURCE_SHA" --run-id "$RUN_ID" --attempt "$ATTEMPT" --repeats 3 --tasks 48 --delay-ms 16
          python -m tools.recovery.w38_local_pool_benchmark --out w38_receipts --head "$SOURCE_SHA" --run-id "$RUN_ID" --attempt "$ATTEMPT" --verify-only
      - name: Retain local-only MIP receipt and raw trial denominators
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w38-local-pool-${{ matrix.os }}-py${{ matrix.python }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: w38_receipts/
          if-no-files-found: error
          retention-days: 30
