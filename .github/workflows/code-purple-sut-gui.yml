name: CODE PURPLE SUT GUI Contract
on:
  pull_request:
    paths:
      - 'tools/everred_v3/sut_gui/**'
      - '.github/workflows/code-purple-sut-gui.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: code-purple-sut-gui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-sut-gui:
    name: SUT GUI guardrails / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test allowlisted SUT harness and fail-closed controls
        run: |
          python -m pip install coverage==7.13.3
          python -m coverage run --rcfile=/dev/null --branch --include='*/sut_gui/server.py' -m unittest discover -s tools/everred_v3/sut_gui/tests -p 'test_*.py' -q
          mkdir -p tools/everred_v3/sut_gui/qa
          python -m coverage json --rcfile=/dev/null -o tools/everred_v3/sut_gui/qa/native-coverage.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('tools/everred_v3/sut_gui/qa/native-coverage.json').read_text())
          observed=list(report['files'])
          assert len(observed) == 1 and observed[0].replace('\\', '/').endswith('tools/everred_v3/sut_gui/server.py'), f'wrong coverage source denominator: {observed}'
          totals=report['totals']
          assert totals['num_statements'] > 0 and totals['num_branches'] > 0, 'coverage denominator missing'
          print('SUT GUI server statement coverage',totals['percent_statements_covered'])
          print('SUT GUI server branch coverage',totals['percent_branches_covered'])
          assert totals['percent_statements_covered'] >= 80.0
          assert totals['percent_branches_covered'] >= 80.0
          PY
      - name: Validate HTML structure and launch contract
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Structure(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.scripts = []
                  self._inside = False
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if 'id' in d:
                      assert d['id'] not in self.ids, 'duplicate id'
                      self.ids.add(d['id'])
                  if tag == 'script':
                      self._inside = True
              def handle_endtag(self, tag):
                  if tag == 'script':
                      self._inside = False
              def handle_data(self, data):
                  if self._inside:
                      self.scripts.append(data)
          p = Path('tools/everred_v3/sut_gui/index.html')
          html = p.read_text(encoding='utf-8')
          assert html.startswith('<!doctype html>')
          assert '<title>' in html and '<h1>' in html
          structure = Structure()
          structure.feed(html)
          must = {'refresh', 'run', 'token', 'profile', 'ci-body', 'connection'}
          assert must.issubset(structure.ids), must - structure.ids
          assert structure.scripts, 'JavaScript missing'
          Path('/tmp/code-purple-sut-gui.js').write_text('\n'.join(structure.scripts))
          PY
          node --check /tmp/code-purple-sut-gui.js

      - name: Publish source-bound local coverage receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-purple-sut-coverage-py-${{ matrix.python-version }}
          if-no-files-found: error
          path: tools/everred_v3/sut_gui/qa/native-coverage.json
