name: GM-I-A P002 CoolProp FAST-HEAVY Federation Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - 'triage/GM_I_A_COOLPROP_RUNTIME_BRIDGE_P002_v1.json'
      - 'scripts/validate_gm_i_a_coolprop_runtime_bridge_p002.py'
      - '.github/workflows/gm-i-a-coolprop-runtime-bridge-p002.yml'

permissions:
  contents: read

jobs:
  consume-provider-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Consume exact P002 CoolProp federation attestation
        run: python scripts/validate_gm_i_a_coolprop_runtime_bridge_p002.py --receipt /tmp/gm_i_a_p002_dow_receipt.json
      - name: Bind P002 DOW receipt
        run: |
          python -m json.tool /tmp/gm_i_a_p002_dow_receipt.json > /dev/null
          sha256sum /tmp/gm_i_a_p002_dow_receipt.json | tee /tmp/GM_I_A_P002_DOW_SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: gm-i-a-p002-dow-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/gm_i_a_p002_dow_receipt.json
            /tmp/GM_I_A_P002_DOW_SHA256SUMS
          if-no-files-found: error
