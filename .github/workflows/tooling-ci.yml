name: Tooling CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'scripts/**'
      - 'tools_v2.3/**'
      - 'local_mcp/**'
      - '.github/workflows/tooling-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'scripts/**'
      - 'tools_v2.3/**'
      - 'local_mcp/**'
      - '.github/workflows/tooling-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint black mypy

      - name: Validate Python scripts
        run: |
          echo "🔍 Validating Python scripts in scripts/ directory..."
          if [ -d "scripts" ]; then
            python -m py_compile scripts/*.py
            echo "✅ Script syntax validation complete"
          else
            echo "⚠️ No scripts directory found"
          fi

      - name: Lint scripts directory
        run: |
          if [ -d "scripts" ]; then
            flake8 scripts/ --max-line-length=120 --exclude=__pycache__ || true
          fi

      - name: Check script formatting
        run: |
          if [ -d "scripts" ]; then
            black --check scripts/ || true
          fi

  validate-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint mypy

      - name: Validate tools_v2.3
        run: |
          echo "🔍 Validating tools in tools_v2.3/ directory..."
          if [ -d "tools_v2.3" ]; then
            python -m py_compile tools_v2.3/*.py
            echo "✅ Tools validation complete"
          else
            echo "⚠️ No tools_v2.3 directory found"
          fi

      - name: Lint tools directory
        run: |
          if [ -d "tools_v2.3" ]; then
            flake8 tools_v2.3/ \
              --max-line-length=120 \
              --exclude=__pycache__ || true
          fi

  validate-mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f DMAIC_V3/requirements.txt ]; then
            pip install -r DMAIC_V3/requirements.txt
          fi
          pip install flake8 pylint

      - name: Validate local_mcp
        run: |
          echo "🔍 Validating MCP components in local_mcp/ directory..."
          if [ -d "local_mcp" ]; then
            python -m py_compile local_mcp/*.py
            echo "✅ MCP validation complete"
          else
            echo "⚠️ No local_mcp directory found"
          fi

      - name: Lint MCP directory
        run: |
          if [ -d "local_mcp" ]; then
            flake8 local_mcp/ \
              --max-line-length=120 \
              --exclude=__pycache__,agents || true
          fi

      - name: Validate MCP agents
        run: |
          if [ -d "local_mcp/agents" ]; then
            echo "🔍 Validating MCP agents..."
            python -m py_compile local_mcp/agents/*.py
            flake8 local_mcp/agents/ --max-line-length=120 || true
          fi

  test-utilities:
    runs-on: ubuntu-latest
    needs: [validate-scripts, validate-tools, validate-mcp]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f DMAIC_V3/requirements.txt ]; then
            pip install -r DMAIC_V3/requirements.txt
          fi
          pip install pytest

      - name: Test script utilities
        run: |
          echo "🧪 Testing script utilities..."

          # Test recursive build
          if [ -f "scripts/recursive_build.py" ]; then
            python scripts/recursive_build.py --help
            echo "✅ recursive_build.py is callable"
          fi

          # Test code health check
          if [ -f "scripts/code_health_check.py" ]; then
            python scripts/code_health_check.py --help
            echo "✅ code_health_check.py is callable"
          fi

      - name: Test MCP orchestrator
        run: |
          if [ -f "local_mcp/agent_orchestrator_v3.0.py" ]; then
            echo "🧪 Testing MCP orchestrator..."
            python local_mcp/agent_orchestrator_v3.0.py --help
            echo "✅ MCP orchestrator is callable"
          fi

      - name: Verify tool imports
        run: |
          echo "🔍 Verifying tool imports..."
          python - <<'PY'
          import importlib.util
          import sys

          sys.path.insert(0, "tools_v2.3")
          tools = [
              "task_tracker_v2.3_20251111",
              "create_chatready_code_v2.3_20251111",
              "code_index_generator_v2.3",
          ]
          missing = [
              tool
              for tool in tools
              if importlib.util.find_spec(tool) is None
          ]
          if missing:
              joined = ", ".join(missing)
              raise SystemExit(f"Tool import check failed; missing: {joined}")
          for tool in tools:
              print(f"✅ {tool} is importable")
          PY

  integration-check:
    runs-on: ubuntu-latest
    needs: test-utilities
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f DMAIC_V3/requirements.txt ]; then
            pip install -r DMAIC_V3/requirements.txt
          fi

      - name: Check tooling integration
        run: |
          echo "🔗 Checking tooling integration..."
          echo "## Tooling CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validated Components:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Scripts directory" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tools v2.3" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ MCP components" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Utility tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All tooling validation checks completed successfully!" \
            >> $GITHUB_STEP_SUMMARY
