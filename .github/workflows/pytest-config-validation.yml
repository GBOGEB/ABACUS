name: Pytest Config Validation

on:
  pull_request:
    paths:
      - 'pytest.ini'
      - 'pyproject.toml'
      - 'tests/**'
      - 'TESTING_SUITE/**'
  push:
    branches:
      - main
      - develop
    paths:
      - 'pytest.ini'
      - 'pyproject.toml'

jobs:
  validate-config:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Verify pytest config sync
        run: python verify_pytest_sync.py
      
      - name: Validate markers (strict mode)
        run: pytest --strict-markers --collect-only
      
      - name: Check for marker drift
        run: |
          python sync_pytest_config.py --dry-run
          if [ $? -ne 0 ]; then
            echo "⚠️  Marker configuration drift detected!"
            exit 1
          fi
      
      - name: Generate marker usage report
        run: python .dmaic/scripts/marker_usage_report.py
      
      - name: Upload marker report
        uses: actions/upload-artifact@v7
        with:
          name: marker-usage-report
          path: .dmaic/reports/marker_usage_report.txt
