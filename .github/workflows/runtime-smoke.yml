name: QPLANT Runtime Smoke

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install pyyaml

      - name: Execute runtime entry
        run: |
          mkdir -p reports
          set +e
          python -m qplant_presentation_engine | tee reports/runtime_output.txt
          RUNTIME_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "RUNTIME_EXIT_CODE=$RUNTIME_EXIT_CODE" >> "$GITHUB_ENV"

      - name: Generate runtime status report
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          reports_dir = Path("reports")
          reports_dir.mkdir(parents=True, exist_ok=True)

          exit_code = int(os.environ.get("RUNTIME_EXIT_CODE", "1"))
          payload = {
              "command": "python -m qplant_presentation_engine",
              "exit_code": exit_code,
              "generated_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "runtime_status": "ok" if exit_code == 0 else "failed",
          }

          runtime_status_source = Path("runtime_status.json")
          if runtime_status_source.exists():
              try:
                  existing = json.loads(runtime_status_source.read_text(encoding="utf-8"))
                  payload["validation_status"] = existing.get("validation_status", "unknown")
                  payload["report"] = existing.get("report", [])
              except Exception:
                  payload["validation_status"] = "unknown"
                  payload["report"] = []
          else:
              payload["validation_status"] = "unknown"
              payload["report"] = []

          (reports_dir / "runtime_status.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          PY

      - name: Upload runtime evidence artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-evidence-${{ github.run_id }}
          if-no-files-found: error
          path: |
            reports/runtime_output.txt
            reports/runtime_status.json
            reports/pca_snapshot.json
            reports/geti_snapshot.json
            reports/truth_matrix_snapshot.json
            runtime_status.json
            validation_report.json
            pca_snapshot.json

      - name: Enforce runtime success
        run: |
          if [ "${RUNTIME_EXIT_CODE}" -ne 0 ]; then
            echo "Runtime command failed with exit code ${RUNTIME_EXIT_CODE}"
            exit "${RUNTIME_EXIT_CODE}"
          fi
