name: qps-line-s-validation

on:
  pull_request:
    paths:
      - 'models/qps_line_s/**'
      - 'docs/qps_line_s_recovery/**'
      - 'tests/test_line_s_buffer.py'
      - '.github/workflows/qps_line_s.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run model tests
        run: python -m pytest -q tests/test_line_s_buffer.py
      - name: Generate scenario matrix
        run: |
          cd models/qps_line_s
          python run_scenarios.py
      - name: Verify generated outputs exist
        run: |
          test -s docs/qps_line_s_recovery/generated/scenario_matrix.md
          test -s docs/qps_line_s_recovery/generated/scenario_matrix.csv
      - name: Zero-test guard
        run: |
          python -m pytest --collect-only -q tests/test_line_s_buffer.py | tee /tmp/collect.txt
          grep -q "test_" /tmp/collect.txt
