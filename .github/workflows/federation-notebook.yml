name: Federation Notebook Plane — Smoke Validation

on:
  push:
    branches: ["**"]
    paths:
      - 'federation/manifest.yaml'
      - 'runtime/federation/codex-abacus-federation.yaml'
      - 'runtime/federation/codex-policy-ingestion.yaml'
      - 'src/dmaic/federation.py'
      - 'DMAIC_V3/tests/test_smoke_federation_jupyter.py'
      - '.github/workflows/federation-notebook.yml'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  federation-notebook-smoke:
    name: 🪐 Notebook Plane Federation Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-federation-${{ hashFiles('DMAIC_V3/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r DMAIC_V3/requirements.txt
          pip install pytest

      - name: Run federation smoke tests (base)
        run: |
          python -m pytest DMAIC_V3/tests/test_smoke_federation.py -m smoke -v --tb=short

      - name: Run notebook plane smoke tests
        run: |
          python -m pytest DMAIC_V3/tests/test_smoke_federation_jupyter.py -m smoke -v --tb=short

      - name: Validate federation assimilate() — notebook plane
        run: |
          python -c "
          from src.dmaic.federation import assimilate
          result = assimilate(context={'ci': True, 'plane': 'notebook'})
          status = result.get('status')
          print('Federation assimilation status:', status)
          print('Details:', result.get('details'))
          assert status == 'ok', f'Expected ok, got {status}'
          print('✅ Federation assimilation OK')
          "

      - name: Verify notebook plane in manifest
        run: |
          python -c "
          import yaml
          from pathlib import Path
          manifest = yaml.safe_load(Path('federation/manifest.yaml').read_text())
          members = manifest['federation']['member_repos']
          names = [m['name'] for m in members]
          assert 'GBOGEB/CODESPACES_jyperter' in names, f'notebook repo missing from manifest: {names}'
          planes = manifest['federation']['planes']
          assert 'notebook' in planes, f'notebook plane missing: {list(planes.keys())}'
          print('✅ Notebook plane registered in manifest')
          "

      - name: Verify notebook_plane in federation spec
        run: |
          python -c "
          import yaml
          from pathlib import Path
          spec = yaml.safe_load(Path('runtime/federation/codex-abacus-federation.yaml').read_text())
          assert 'notebook_plane' in spec['federation'], 'notebook_plane missing from federation spec'
          repo = spec['federation']['notebook_plane']['repository']
          assert repo == 'GBOGEB/CODESPACES_jyperter', f'wrong repo: {repo}'
          print('✅ notebook_plane verified in federation spec')
          "

      - name: Summary
        if: always()
        run: |
          echo "## 🪐 Notebook Plane Federation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repo:** GBOGEB/CODESPACES_jyperter" >> $GITHUB_STEP_SUMMARY
          echo "**Plane:** notebook" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_STEP_SUMMARY
