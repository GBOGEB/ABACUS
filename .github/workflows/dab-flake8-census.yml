name: DAB Flake8 Census

on:
  pull_request:
    paths:
      - '**/*.py'
      - 'scripts/dab_flake8_census.py'
      - '.github/workflows/dab-flake8-census.yml'
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'scripts/dab_flake8_census.py'
      - '.github/workflows/dab-flake8-census.yml'
  workflow_dispatch:

jobs:
  census:
    name: Full Repository Census
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flake8
        run: python -m pip install --upgrade flake8

      - name: Run exact DAB census
        run: python scripts/dab_flake8_census.py

      - name: Verify receipt
        run: |
          test -s reports/dab_flake8_census.json
          test -s reports/dab_flake8_census.txt
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("reports/dab_flake8_census.json").read_text())
          required = {
              "E999", "F821", "F601", "F811", "F841",
              "E722", "E731", "E741", "W293",
          }
          assert required <= set(p["families"])
          assert p["total"] >= sum(p["families"].values())
          print("DAB census receipt PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dab-flake8-census
          path: |
            reports/dab_flake8_census.json
            reports/dab_flake8_census.txt
