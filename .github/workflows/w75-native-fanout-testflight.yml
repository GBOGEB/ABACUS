name: W75 Native Fanout Source-Bound Matrix

on:
  pull_request:
    paths:
      - 'tools/mip2/mip_native_fanout.py'
      - 'tests/test_mip_native_fanout.py'
      - '.github/workflows/w75-native-fanout-testflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fanout-contract:
    name: Fanout ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact selected head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact-head source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -n "$(git rev-parse HEAD:tools/mip2/mip_native_fanout.py)"
      - name: Install pinned source coverage tool
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "coverage==7.13.3"
      - name: Run disjoint fanout adversarial contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test_reports/w75-fanout
          python -m coverage run --branch \
            --include=tools/mip2/mip_native_fanout.py \
            -m unittest discover -s tests \
            -p test_mip_native_fanout.py -v \
            2>&1 | tee test_reports/w75-fanout/unittest.log
          python -m coverage json \
            --include=tools/mip2/mip_native_fanout.py \
            -o test_reports/w75-fanout/coverage.json
      - name: Validate exact-head test and coverage receipt
        shell: bash
        env:
          OS_MATRIX: ${{ matrix.os }}
          PYTHON_MATRIX: ${{ matrix.python }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess

          target = pathlib.Path("test_reports/w75-fanout")
          coverage = json.loads((target / "coverage.json").read_text())
          key = "tools/mip2/mip_native_fanout.py"
          files = coverage.get("files", {})
          if set(files) != {key}:
              raise SystemExit("W75 coverage source scope mismatch")
          if coverage.get("meta", {}).get("branch_coverage") is not True:
              raise SystemExit("W75 branch instrumentation missing")
          totals = coverage["totals"]
          summary = files[key]["summary"]
          fields = ("covered_lines", "num_statements",
                    "covered_branches", "num_branches")
          if any(type(totals.get(k)) is not int or
                 totals[k] != summary.get(k) for k in fields):
              raise SystemExit("W75 coverage numerator/denominator mismatch")
          lines = (totals["covered_lines"], totals["num_statements"])
          branches = (totals["covered_branches"], totals["num_branches"])
          if any(n <= 0 or not 0 <= x <= n
                 for x, n in (lines, branches)):
              raise SystemExit("W75 invalid coverage denominators")
          raw = (target / "unittest.log").read_bytes()
          count = re.search(rb"Ran (\d+) tests?", raw)
          ok = any(line.strip() in (b"OK", b"OK (skipped=0)")
                   for line in raw.splitlines())
          if not count or int(count.group(1)) < 24 or not ok:
              raise SystemExit("W75 test population absent or red")
          head = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          if head != os.environ["EXPECTED_HEAD"]:
              raise SystemExit("W75 checkout SHA mismatch")
          payload = {
              "schema": "abacus.mip.w75-native-fanout/1.0",
              "repository": "GBOGEB/ABACUS",
              "head_sha": head,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job_key": os.environ["GITHUB_JOB"],
              "matrix_os": os.environ["OS_MATRIX"],
              "matrix_python": os.environ["PYTHON_MATRIX"],
              "source_blob": subprocess.check_output(
                  ["git", "rev-parse", "HEAD:" + key], text=True
              ).strip(),
              "log_sha256": hashlib.sha256(raw).hexdigest(),
              "tests_executed": int(count.group(1)),
              "statements": list(lines),
              "branches": list(branches),
              "source_sha256": hashlib.sha256(
                  pathlib.Path(key).read_bytes()
              ).hexdigest(),
              "coverage_scope": "FOCUSED_MODULE_NOT_GLOBAL_MAIN",
              "merge_admission": "HOLD",
              "authenticated_crew_dispatch": False,
              "independent_approval": False,
          }
          (target / "receipt.json").write_text(
              json.dumps(payload, sort_keys=True, indent=2) + "\n"
          )
          print(json.dumps(payload, sort_keys=True))
          PY
      - name: Upload per-platform immutable evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: w75-fanout-${{ matrix.os }}-${{ matrix.python }}-${{ github.run_id }}
          path: test_reports/w75-fanout/
          if-no-files-found: error
