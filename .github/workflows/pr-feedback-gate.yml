name: PR Feedback Gate Evaluator

on:
  issue_comment:
    types: [created, edited, deleted]
  # A deferral is only valid while its tracking issue stays open with intact
  # debt evidence. Re-census on every tracking-issue lifecycle change so a
  # closed or edited issue cannot leave a stale green check behind. Only the
  # PRs named by a trusted issue's current or previous marker are re-census'd;
  # other issue events are no-ops.
  issues:
    types: [edited, closed, reopened, deleted, transferred]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_run:
    workflows:
      - CI - ABACUS Matrix
      - ABACUS v032 - CI/CD Pipeline
      - qps-canonicalization
      - Security Scan — Ruff
      - DELTA_1 CodeQL
      - DELTA_1 Dependency Review
      - OSV-Scanner
      - Validate Docs (Markdown/YAML/JSON)
      - Format Check
      - YAML Validation
      - smoke-test
      - W70 Exact-SHA Measured ID Pulse
      - W71 Residual Generated-Lineage Census
      - DAB Flake8 Census
      - MIP B0 Test Admission and Coverage Evidence
    # Fan-in on terminal upstream evidence only. An initial PR event still
    # marks the gate pending; requested/in_progress events produced repeated
    # no-op evaluator runs and runner queue amplification before results exist.
    # Direct review, issue, comment and scheduled invalidation remain active.
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number; otherwise evaluate all open main PRs
        required: false
        type: string

permissions:
  actions: read
  checks: write
  contents: read
  issues: read
  pull-requests: read

# No workflow-level concurrency group. A run keyed on the triggering issue,
# PR or commit could be cancelled or replaced by an unrelated no-op event for
# the same key (for example a public comment on a deferral tracking issue)
# before it marked its PRs pending. Serialization is per PR, on the evaluate
# job below.

jobs:
  route:
    name: Route PRs to evaluate
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.route.outputs.prs }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v7
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: List PRs this event re-censuses
        id: route
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          args=(--event-path "$GITHUB_EVENT_PATH")
          if [ -n "$INPUT_PR_NUMBER" ]; then
            args+=(--pr-number "$INPUT_PR_NUMBER")
          fi
          prs=$(python ci/governance/pr_feedback_gate.py \
            "${args[@]}" --list-prs)
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

      # Optional observation only: does not alter route outputs, pending stamps,
      # existing evaluator fan-in or the non-compensating review gate.
      - name: Emit read-only routing yield
        if: success()
        continue-on-error: true
        env:
          ROUTED_PRS: ${{ steps.route.outputs.prs }}
        run: |
          python ci/governance/feedback_route_yield_w38.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --routed-prs "$ROUTED_PRS" \
            --event-name "$GITHUB_EVENT_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --event-sha "$GITHUB_SHA" \
            --gate-run-id "$GITHUB_RUN_ID" \
            --gate-attempt "$GITHUB_RUN_ATTEMPT"

  # A tracking-issue close or edit must invalidate a deferral-backed success
  # at once. The census it triggers queues behind any census already running
  # for the PR, which could otherwise publish a success computed from the old
  # issue. This job sits outside that queue and marks the check pending with
  # a newer census stamp, so the running census cannot publish over it and
  # any success it already published is replaced.
  #
  # A head change (synchronize/reopened) is invalidated the same way. A
  # success stays attached to its SHA, so a PR moved A -> B -> A would
  # otherwise re-expose A's earlier success until the queued census of the
  # returning head runs (#1878).
  invalidate:
    name: Invalidate PR feedback gate (#${{ matrix.pr }})
    needs: route
    if: >-
      (
        github.event_name == 'issues'
        || (
          github.event_name == 'pull_request'
          && (
            github.event.action == 'synchronize'
            || github.event.action == 'reopened'
          )
        )
      )
      && needs.route.outputs.prs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.route.outputs.prs) }}
    steps:
      - name: Stamp invalidation
        run: |
          stamp=$(date -u +%Y-%m-%dT%H:%M:%S.%6NZ)
          echo "CENSUS_STARTED=$stamp" >> "$GITHUB_ENV"

      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v7
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Mark feedback gate pending
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          args=(--event-path "$GITHUB_EVENT_PATH")
          args+=(--census-started "$CENSUS_STARTED")
          args+=(--pr-number "$PR_NUMBER")
          python ci/governance/pr_feedback_gate.py \
            "${args[@]}" --mark-pending-only

  evaluate:
    name: Evaluate PR feedback gate (#${{ matrix.pr }})
    # Run after this event's own invalidation, so the invalidator's pending
    # stamp is always older than this census and cannot reject its result.
    # A skipped or failed invalidation must not block the census itself.
    needs: [route, invalidate]
    if: >-
      !cancelled()
      && needs.route.result == 'success'
      && needs.route.outputs.prs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.route.outputs.prs) }}
    # Every census of one PR runs in that PR's group, whatever triggered it
    # (PR event, tracking issue, CI run or sweep), so two censuses never
    # read and write the same check at once. A newer queued census replaces
    # an older queued one; this group never cancels a running census.
    concurrency:
      group: pr-feedback-gate-pr-${{ matrix.pr }}
      cancel-in-progress: false
    steps:
      # One census stamp per job orders this job's pending, result and
      # failure publications against any earlier census of the same PR.
      - name: Stamp census start
        run: |
          stamp=$(date -u +%Y-%m-%dT%H:%M:%S.%6NZ)
          echo "CENSUS_STARTED=$stamp" >> "$GITHUB_ENV"

      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v7
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Mark feedback gate pending
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          args=(--event-path "$GITHUB_EVENT_PATH")
          args+=(--census-started "$CENSUS_STARTED")
          args+=(--pr-number "$PR_NUMBER")
          python ci/governance/pr_feedback_gate.py \
            "${args[@]}" --mark-pending-only

      - name: Run unit tests
        run: python -m unittest ci.governance.tests.test_pr_feedback_gate

      - name: Evaluate and publish gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          args=(--event-path "$GITHUB_EVENT_PATH")
          args+=(--census-started "$CENSUS_STARTED")
          args+=(--pr-number "$PR_NUMBER")
          python ci/governance/pr_feedback_gate.py "${args[@]}"

      - name: Fail gate if evaluator workflow failed
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          args=(--event-path "$GITHUB_EVENT_PATH")
          args+=(--census-started "$CENSUS_STARTED")
          args+=(--pr-number "$PR_NUMBER")
          python ci/governance/pr_feedback_gate.py \
            "${args[@]}" --mark-failure-only
