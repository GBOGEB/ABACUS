name: BD8K Wave2 MECH-A targeted proof

on:
  push:
    branches:
      - bd8k-wave2-mech-a-20261001

jobs:
  ast-proof:
    if: startsWith(github.event.head_commit.message, 'BD8K Wave2 proof MECH-A')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bd8k-wave2-mech-a-20261001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove AST equivalence and compile
        env:
          BASE_SHA: 575784c61bae24934d1ef85accb9e080a0fb15f7
          FILES_JSON: '["MINERVA_PID/generator/build_dissection_pptx.py","architecture/mesh/emit_mesh_status.py","tools/w64_file_index_temporal.py","tools/w66_id_burndown_measure.py","tools/w67_pca_promotion_gate.py"]'
        run: |
          python - <<'PY'
          import ast, json, os, subprocess
          from pathlib import Path
          base=os.environ["BASE_SHA"]
          files=json.loads(os.environ["FILES_JSON"])
          receipt={"base_sha":base,"files":[],"errors":[]}
          for name in files:
              try:
                  old=subprocess.check_output(["git","show",f"{base}:{name}"],text=True)
                  new=Path(name).read_text(encoding="utf-8")
                  old_ast=ast.dump(ast.parse(old,filename=name),include_attributes=False)
                  new_ast=ast.dump(ast.parse(new,filename=name),include_attributes=False)
                  same=(old_ast==new_ast)
                  receipt["files"].append({"path":name,"ast_equal":same})
                  if not same:
                      receipt["errors"].append(f"AST changed: {name}")
              except Exception as exc:
                  receipt["errors"].append(f"{name}: {exc}")
          Path("/tmp/targeted-proof.json").write_text(json.dumps(receipt,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(receipt,indent=2))
          if receipt["errors"]:
              raise SystemExit("\n".join(receipt["errors"]))
          PY
          python -m py_compile "MINERVA_PID/generator/build_dissection_pptx.py" "architecture/mesh/emit_mesh_status.py" "tools/w64_file_index_temporal.py" "tools/w66_id_burndown_measure.py" "tools/w67_pca_promotion_gate.py"
      - uses: actions/upload-artifact@v4
        with:
          name: bd8k-wave2-mech-a-targeted-proof
          path: /tmp/targeted-proof.json
