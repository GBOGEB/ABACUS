name: Execution Spine Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-evidence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml numpy pandas pytest pytest-asyncio

      - name: Generate runtime evidence
        run: |
          python -m src.qplant_presentation_engine

      - name: Generate RTM artifacts
        run: |
          python - <<'EOF'
          from src.qplant_presentation_engine.rtm import (
              generate_rtm_artifacts,
          )
          result = generate_rtm_artifacts()
          summary = result["rtm_summary"]
          coverage = summary["coverage_ratio"]
          with_evidence = summary["requirements_with_evidence"]
          total = summary["total_requirements"]
          print(f"RTM coverage: {coverage:.2%}")
          print(f"Requirements: {with_evidence}/{total}")
          EOF

      - name: Run release gate (validation checks)
        run: |
          python - <<'EOF'
          import json
          import sys

          from src.qplant_presentation_engine.release_gate import (
              evaluate_release_gate,
          )

          result = evaluate_release_gate()
          print(json.dumps(result, indent=2))

          rtm_check = result["checks"]["rtm_coverage"]
          runtime_check = result["checks"]["runtime_evidence"]
          rtm_ok = rtm_check["passed"]
          runtime_ok = runtime_check["passed"]

          if not rtm_ok:
              print(f"FAIL: {rtm_check['message']}", file=sys.stderr)
          if not runtime_ok:
              print(f"FAIL: {runtime_check['message']}", file=sys.stderr)
          if not rtm_ok or not runtime_ok:
              sys.exit(1)

          print("Validation checks passed.")
          EOF

      - name: Run QPLANT presentation engine tests
        run: |
          python -m pytest tests -v

      - name: Upload CI status artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-status
          path: |
            reports/ci_status.json
            reports/release_readiness.json
            rtm/rtm_summary.json
            rtm/trace_matrix.json