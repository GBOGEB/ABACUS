name: Python next canary (non-blocking)

# Early warning for the next CPython release. Versions come from
# ssot/python_versions.yaml `experimental`; this job never gates a merge.
# A red run here means "ecosystem or code not ready yet", not "PR broken".

on:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:
  pull_request:
    paths:
      - ssot/python_versions.yaml
      - .github/workflows/python-next-canary.yml

permissions:
  contents: read

jobs:
  canary:
    name: Canary - Python ${{ matrix.python-version }} (pre-release)
    if: github.repository == 'GBOGEB/ABACUS'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.16']
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }} (pre-release)
        id: setup
        # actions/setup-python v7.1.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Record interpreter
        run: python -VV

      - name: Byte-compile sources (syntax and removed-grammar check)
        run: >-
          python -m compileall -q
          -x '(BACKUPS|node_modules|DMAIC_V3_OUTPUT)/'
          DMAIC_V3 scripts tools tests models

      - name: Install runtime requirements (binary wheels only)
        id: install
        run: |
          python -m pip install --upgrade pip
          # networkx comes from the governed pins in requirements-test.txt;
          # test collection imports it via the W13 neural provider.
          python -m pip install --only-binary=:all: -r requirements.txt \
            pytest networkx -c requirements-test.txt

      - name: Run engine unit tests
        id: tests
        if: steps.install.outcome == 'success'
        run: >-
          python -m pytest -q -p no:cacheprovider -o addopts=""
          -m "unit or smoke" --maxfail=25 tests

      - name: Summarise
        if: always()
        run: |
          setup="${{ steps.setup.outcome }}"
          install="${{ steps.install.outcome }}"
          tests="${{ steps.tests.outcome }}"
          {
            echo "### Python ${{ matrix.python-version }} canary"
            echo "- interpreter: \`${setup}\`"
            echo "- install (wheels only): \`${install}\`"
            echo "- unit/smoke tests: \`${tests}\`"
            echo "- non-blocking; promote via ssot/python_versions.yaml"
          } >> "$GITHUB_STEP_SUMMARY"
          # The job is non-blocking, so a green run must not hide a canary
          # that never ran: annotate every stage that did not succeed.
          for stage in "interpreter:${setup}" "install:${install}" \
                       "tests:${tests}"; do
            if [[ "${stage#*:}" != "success" ]]; then
              echo "::warning title=Python canary not green::${stage}"
            fi
          done
