name: Python next canary (non-blocking)

# Early warning for the next CPython release. Versions come from
# ssot/python_versions.yaml `experimental`; this job never gates a merge.
# A red run here means "ecosystem or code not ready yet", not "PR broken".

on:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:
  pull_request:
    paths:
      - ssot/python_versions.yaml
      - .github/workflows/python-next-canary.yml

permissions:
  contents: read

jobs:
  canary:
    name: Canary - Python ${{ matrix.python-version }} (pre-release)
    if: github.repository == 'GBOGEB/ABACUS'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.16']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }} (pre-release)
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Record interpreter
        run: python -VV

      - name: Byte-compile sources (syntax and removed-grammar check)
        run: >-
          python -m compileall -q
          -x '(BACKUPS|node_modules|DMAIC_V3_OUTPUT)/'
          DMAIC_V3 scripts tools tests models

      - name: Install runtime requirements (binary wheels only)
        id: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt pytest

      - name: Run engine unit tests
        if: steps.install.outcome == 'success'
        run: >-
          python -m pytest -q -p no:cacheprovider -o addopts=""
          -m "unit or smoke" --maxfail=25 tests

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Python ${{ matrix.python-version }} canary"
            echo "- install (wheels only): \`${{ steps.install.outcome }}\`"
            echo "- non-blocking; promote via ssot/python_versions.yaml"
          } >> "$GITHUB_STEP_SUMMARY"
