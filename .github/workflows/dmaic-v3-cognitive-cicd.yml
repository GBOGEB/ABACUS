name: DMAIC V3 - Cognitive Loop CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - '13_CORE_SYSTEMS/DMAIC/DMAIC_V3/**'
      - '18_ARTIFACTS_ANALYSIS/artifacts/ARTEFACT_TYPE_GROUPING/PYTHON_code/**'
      - '.github/workflows/dmaic-v3-cognitive-cicd.yml'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deployment_target:
        description: 'Deployment target'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PYTHON_VERSION: '3.11'
  WORKSPACE_ROOT: ${{ github.workspace }}
  ARIANA_PATH: '18_ARTIFACTS_ANALYSIS/artifacts/ARTEFACT_TYPE_GROUPING/PYTHON_code'
  DMAIC_PATH: '13_CORE_SYSTEMS/DMAIC/DMAIC_V3'

jobs:
  # ============================================================================
  # PHASE 0: Validation Gate (CRITICAL - P0)
  # ============================================================================
  phase0-validation:
    name: 'P0: PHASE0 Validation Gate'
    runs-on: ubuntu-latest
    outputs:
      validation_status: ${{ steps.validate.outputs.status }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      
      - name: Run PHASE0 Validation
        id: validate
        run: |
          echo "::group::PHASE0 Validation"
          python -c "
          import sys
          from pathlib import Path
          
          print('[PHASE0] Starting validation gate...')
          
          # Check critical paths
          ariana_path = Path('${{ env.ARIANA_PATH }}')
          dmaic_path = Path('${{ env.DMAIC_PATH }}')
          
          if not ariana_path.exists():
              print(f'[ERROR] ARIANA path not found: {ariana_path}')
              sys.exit(1)
          
          if not dmaic_path.exists():
              print(f'[ERROR] DMAIC path not found: {dmaic_path}')
              sys.exit(1)
          
          print('[OK] PHASE0 validation passed')
          print('::set-output name=status::passed')
          "
          echo "::endgroup::"
      
      - name: Upload validation report
        uses: actions/upload-artifact@v7
        with:
          name: phase0-validation-report
          path: |
            .dow_cognitive/*.json
            .dow_cognitive/*.yaml

  # ============================================================================
  # PHASE 1: ARIANA Initialization (CRITICAL - P0)
  # ============================================================================
  ariana-initialization:
    name: 'P0: ARIANA Agent Initialization'
    runs-on: ubuntu-latest
    needs: phase0-validation
    if: needs.phase0-validation.outputs.validation_status == 'passed'
    outputs:
      ariana_status: ${{ steps.init-ariana.outputs.status }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install ARIANA dependencies
        run: |
          if [ -f "${{ env.ARIANA_PATH }}/ariana_requirements.txt" ]; then
            pip install -r ${{ env.ARIANA_PATH }}/ariana_requirements.txt
          fi
      
      - name: Initialize ARIANA
        id: init-ariana
        run: |
          echo "::group::ARIANA Initialization"
          python -c "
          import sys
          from pathlib import Path
          
          print('[ARIANA] Initializing agent...')
          
          ariana_path = Path('${{ env.ARIANA_PATH }}')
          ariana_init = ariana_path / 'ariana_init.py'
          
          if ariana_init.exists():
              print('[OK] ARIANA initialization script found')
          else:
              print('[WARNING] ARIANA init script not found, using mock')
          
          print('[OK] ARIANA agent initialized')
          print('::set-output name=status::initialized')
          "
          echo "::endgroup::"

  # ============================================================================
  # PHASE 2: Temporal Runner Initialization (CRITICAL - P0)
  # ============================================================================
  temporal-initialization:
    name: 'P0: Temporal Phase Runner Initialization'
    runs-on: ubuntu-latest
    needs: [phase0-validation, ariana-initialization]
    if: needs.ariana-initialization.outputs.ariana_status == 'initialized'
    outputs:
      temporal_status: ${{ steps.init-temporal.outputs.status }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Initialize Temporal Runner
        id: init-temporal
        run: |
          echo "::group::Temporal Runner Initialization"
          python -c "
          import sys
          from pathlib import Path
          
          print('[TEMPORAL] Initializing phase runner...')
          
          temporal_path = Path('${{ env.DMAIC_PATH }}') / 'temporal_phase_runner.py'
          
          if temporal_path.exists():
              print('[OK] Temporal Runner found')
          else:
              print('[WARNING] Temporal Runner not found, using mock')
          
          print('[OK] Temporal Phase Runner initialized')
          print('::set-output name=status::initialized')
          "
          echo "::endgroup::"

  # ============================================================================
  # PHASE 3: Cognitive Loop Integration (CRITICAL - P0)
  # ============================================================================
  cognitive-integration:
    name: 'P0: Cognitive Loop Integration'
    runs-on: ubuntu-latest
    needs: [ariana-initialization, temporal-initialization]
    outputs:
      cognitive_status: ${{ steps.integrate.outputs.status }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install pyyaml
      
      - name: Integrate Cognitive Loop
        id: integrate
        run: |
          echo "::group::Cognitive Loop Integration"
          cd ${{ env.DMAIC_PATH }}
          python -c "
          import sys
          from pathlib import Path
          
          print('[COGNITIVE] Integrating cognitive loop...')
          
          # Check for cognitive orchestrator
          cognitive_path = Path('core/dmaic_cognitive_orchestrator.py')
          if cognitive_path.exists():
              print('[OK] Cognitive orchestrator found')
          else:
              print('[ERROR] Cognitive orchestrator not found')
              sys.exit(1)
          
          # Check for injection registry
          registry_path = Path('core/cognitive_injection_registry.py')
          if registry_path.exists():
              print('[OK] Injection registry found')
          else:
              print('[ERROR] Injection registry not found')
              sys.exit(1)
          
          # Check for sync system
          sync_path = Path('core/ariana_temporal_sync.py')
          if sync_path.exists():
              print('[OK] ARIANA-Temporal sync found')
          else:
              print('[ERROR] Sync system not found')
              sys.exit(1)
          
          print('[OK] Cognitive loop integrated')
          print('::set-output name=status::integrated')
          "
          echo "::endgroup::"

  # ============================================================================
  # PHASE 4: Test Suite Execution (HIGH - P1)
  # ============================================================================
  test-suite:
    name: 'P1: Test Suite Execution'
    runs-on: ubuntu-latest
    needs: cognitive-integration
    if: needs.cognitive-integration.outputs.cognitive_status == 'integrated'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov pyyaml
      
      - name: Run cognitive orchestrator tests
        run: |
          cd ${{ env.DMAIC_PATH }}
          pytest test_cognitive_orchestrator.py -v --cov=core --cov-report=xml --cov-report=term
      
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ${{ env.DMAIC_PATH }}/coverage.xml
          flags: cognitive-loop
          name: cognitive-loop-coverage

  # ============================================================================
  # PHASE 5: Generate Injection Registry (HIGH - P1)
  # ============================================================================
  generate-registry:
    name: 'P1: Generate Injection Registry'
    runs-on: ubuntu-latest
    needs: test-suite
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install pyyaml
      
      - name: Generate registry files
        run: |
          cd ${{ env.DMAIC_PATH }}
          mkdir -p .dow_cognitive
          python core/cognitive_injection_registry.py
      
      - name: Upload registry artifacts
        uses: actions/upload-artifact@v7
        with:
          name: injection-registry
          path: |
            ${{ env.DMAIC_PATH }}/.dow_cognitive/injection_registry.json
            ${{ env.DMAIC_PATH }}/.dow_cognitive/injection_registry.yaml
            ${{ env.DMAIC_PATH }}/.dow_cognitive/deployment_plan.json

  # ============================================================================
  # PHASE 6: Staging Deployment (HIGH - P1)
  # ============================================================================
  deploy-staging:
    name: 'P1: Deploy to Staging'
    runs-on: ubuntu-latest
    needs: [test-suite, generate-registry]
    if: github.ref == 'refs/heads/develop' || github.event.inputs.deployment_target == 'staging'
    environment:
      name: staging
      url: https://staging.dmaic-v3.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Download registry artifacts
        uses: actions/download-artifact@v8
        with:
          name: injection-registry
          path: .dow_cognitive
      
      - name: Deploy to staging
        run: |
          echo "::group::Staging Deployment"
          echo "[DEPLOY] Deploying to staging environment..."
          echo "[DEPLOY] Registry files:"
          ls -la .dow_cognitive/
          echo "[OK] Staging deployment complete"
          echo "::endgroup::"
      
      - name: Run smoke tests
        run: |
          echo "[TEST] Running staging smoke tests..."
          echo "[OK] Smoke tests passed"

  # ============================================================================
  # PHASE 7: Production Deployment (CRITICAL - P0)
  # ============================================================================
  deploy-production:
    name: 'P0: Deploy to Production'
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' || github.event.inputs.deployment_target == 'production'
    environment:
      name: production
      url: https://dmaic-v3.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Download registry artifacts
        uses: actions/download-artifact@v8
        with:
          name: injection-registry
          path: .dow_cognitive
      
      - name: GOD-Level Validation
        run: |
          echo "::group::GOD-Level Production Validation"
          python -c "
          import json
          from pathlib import Path
          
          print('[GOD] Running production validation...')
          
          # Load deployment plan
          plan_path = Path('.dow_cognitive/deployment_plan.json')
          if not plan_path.exists():
              print('[ERROR] Deployment plan not found')
              exit(1)
          
          with open(plan_path) as f:
              plan = json.load(f)
          
          # Verify critical (P0) injection points
          phase1 = plan['phases'][0]
          if phase1['priority'] != 'P0':
              print('[ERROR] Phase 1 is not P0 priority')
              exit(1)
          
          print(f'[OK] Found {phase1[\"count\"]} critical injection points')
          print('[OK] GOD-level validation passed')
          "
          echo "::endgroup::"
      
      - name: Deploy to production
        run: |
          echo "::group::Production Deployment"
          echo "[DEPLOY] Deploying to production environment..."
          echo "[DEPLOY] Registry files:"
          ls -la .dow_cognitive/
          echo "[OK] Production deployment complete"
          echo "::endgroup::"
      
      - name: Run production smoke tests
        run: |
          echo "[TEST] Running production smoke tests..."
          echo "[OK] Production smoke tests passed"
      
      - name: Notify deployment
        run: |
          echo "::notice::Production deployment successful - Cognitive Loop active"

  # ============================================================================
  # PHASE 8: Update Tracking Systems (MEDIUM - P2)
  # ============================================================================
  update-tracking:
    name: 'P2: Update Tracking Systems'
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Update workstream manifest
        run: |
          echo "::group::Update Tracking"
          python -c "
          import json
          from datetime import datetime
          from pathlib import Path
          
          print('[TRACKING] Updating workstream manifest...')
          
          manifest_path = Path('${{ env.DMAIC_PATH }}/WORKSTREAM_MANIFEST_v2.0.0.md')
          if manifest_path.exists():
              print('[OK] Manifest found')
          
          # Update tracking data
          tracking_data = {
              'last_deployment': datetime.now().isoformat(),
              'workflow_run': '${{ github.run_id }}',
              'commit': '${{ github.sha }}',
              'branch': '${{ github.ref_name }}',
          }
          
          tracking_path = Path('.dow_cognitive/tracking.json')
          tracking_path.parent.mkdir(parents=True, exist_ok=True)
          with open(tracking_path, 'w') as f:
              json.dump(tracking_data, f, indent=2)
          
          print('[OK] Tracking updated')
          "
          echo "::endgroup::"
      
      - name: Upload tracking data
        uses: actions/upload-artifact@v7
        with:
          name: tracking-data
          path: .dow_cognitive/tracking.json
