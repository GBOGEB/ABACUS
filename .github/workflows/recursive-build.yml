name: recursive-build
on:
  push:
    branches: [main]
    paths: ["docs/**", "scripts/**", "GLOBAL_index.json", "metrics/**"]
  workflow_dispatch:
# Evidence-only: the receipt is an artifact, never a commit to main.
permissions:
  contents: read
  actions: read
concurrency:
  group: recursive-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RECEIPT_ARTIFACT: recursive-build-receipt
    steps:
      # SHA-pinned checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      # SHA-pinned setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Restore parent receipt from last green run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p parent
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow recursive-build.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          found=""
          if [ -n "$run_id" ]; then
            api="repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts"
            pick=".artifacts[] | select(.name == env.RECEIPT_ARTIFACT"
            pick="$pick and .expired == false) | .id"
            found="$(gh api "$api" --jq "$pick")"
          fi
          if [ -n "$found" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name "$RECEIPT_ARTIFACT" --dir parent
            test -s parent/metrics.json
            echo "PARENT=parent/metrics.json" >> "$GITHUB_ENV"
          else
            echo "No unexpired parent receipt: this run is GENESIS"
          fi
      - name: Recursive build (strict, chained, read-only index)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/recursive_build.py --strict --index GLOBAL_index.json \
            --out metrics/metrics.json ${PARENT:+--previous "$PARENT"}
      - name: Upload lineage receipt
        if: always()
        # SHA-pinned upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ env.RECEIPT_ARTIFACT }}
          path: metrics/metrics.json
          if-no-files-found: error
