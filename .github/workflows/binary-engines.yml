name: binary-engines

on:
  pull_request:
    paths:
      - "DMAIC_V3/binary_engines/**"
      - "tests/binary_engines/**"
      - "requirements-binary-engines.txt"
      - ".github/workflows/binary-engines.yml"
  push:
    branches: [main]
    paths:
      - "DMAIC_V3/binary_engines/**"
      - "tests/binary_engines/**"
      - "requirements-binary-engines.txt"
      - ".github/workflows/binary-engines.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binary-engines-${{ github.ref }}
  cancel-in-progress: true

env:
  # The gg_MATH commit the kernel pins come from (DMAIC_V3/binary_engines/ggmath_bridge.py PINS).
  # test_binary_engines_ggmath_bridge keeps this value and the pins equal.
  GG_MATH_COMMIT: 198ec510dc0b929c28fee41c29ab3f9da8affada

jobs:
  test:
    name: binary-engines (py3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Check out the pinned gg_MATH kernels (public, read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: GBOGEB/gg_MATH
          ref: ${{ env.GG_MATH_COMMIT }}
          path: _gg_math
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.14"
      - name: Install engine dependencies
        run: python -m pip install -r requirements-binary-engines.txt
      - name: Run engine tests (missing dependencies and skips are failures here)
        env:
          BINARY_ENGINES_REQUIRE_DEPS: "1"
          BINARY_ENGINES_TEST_HOME: ${{ runner.temp }}/estate_test
          GG_MATH_HOME: ${{ github.workspace }}/_gg_math
        # unittest exits non-zero when no test ran, so an empty run cannot pass
        run: python -X utf8 -m unittest discover -s tests/binary_engines -t . -v
      - name: Move-plan dry run (PowerShell) leaves the smoke fixture untouched
        shell: pwsh
        env:
          ESTATE_HOME: ${{ runner.temp }}/estate_test/home
        run: |
          $out = & ./DMAIC_V3/binary_engines/Invoke-EstateMove.ps1 -RootId SMOKE
          $out
          if (-not ($out -match '^DRY RUN: ')) { throw 'no dry-run summary' }
          $files = (Get-ChildItem -File (Join-Path $env:ESTATE_HOME 'fixtures/smoke_root')).Count
          if ($files -ne 12) { throw "the dry run changed the fixture: $files files" }
