name: W4 Dashboard Publication Status Regression
on:
  pull_request:
    paths:
      - 'docs/index.html'
      - 'tests/test_dashboard_health_link_contract.py'
      - '.github/workflows/w4-dashboard-publication-qa.yml'
permissions:
  contents: read
jobs:
  dashboard-status-and-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check exact source SHA
        shell: bash
        env:
          EXACT_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE_SHA"
      - name: Install focused test prerequisites
        run: python -m pip install 'pytest>=7.4,<10'
      - name: Run unpublished-status and static-link regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p w4-evidence
          python -m pytest -q tests/test_dashboard_health_link_contract.py --junitxml=w4-evidence/junit.xml
      - name: Preserve native JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w4-dashboard-status-py${{ matrix.python-version }}
          path: w4-evidence/junit.xml
          if-no-files-found: error
