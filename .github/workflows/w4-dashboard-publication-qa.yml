name: W4 Dashboard Publication Status Regression
on:
  pull_request:
    paths:
      - 'docs/index.html'
      - 'tests/test_dashboard_health_link_contract.py'
      - 'tests/test_dashboard_health_source_contract.py'
      - '.github/workflows/dashboard-health.yml'
      - '.github/workflows/w4-dashboard-publication-qa.yml'
permissions:
  contents: read
jobs:
  dashboard-status-and-links:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: '3.10'
          - os: ubuntu-24.04
            python-version: '3.11'
          - os: ubuntu-24.04
            python-version: '3.12'
          - os: windows-2022
            python-version: '3.11'
          - os: macos-latest
            python-version: '3.11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check exact source SHA
        shell: bash
        env:
          EXACT_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE_SHA"
      - name: Install focused test prerequisites
        run: python -m pip install 'pytest>=7.4,<10' 'numpy>=1.24,<3'
      - name: Run unpublished-status and static-link regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p w4-evidence
          python -m pytest -q tests/test_dashboard_health_link_contract.py tests/test_dashboard_health_source_contract.py --junitxml=w4-evidence/junit.xml
      - name: Preserve native JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w4-dashboard-status-${{ matrix.os }}-py${{ matrix.python-version }}
          path: w4-evidence/junit.xml
          if-no-files-found: error
