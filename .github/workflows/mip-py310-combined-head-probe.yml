name: MIP Python Compatibility Combined-Head Probe
on:
  pull_request:
    paths:
      - 'DMAIC_V3/requirements.txt'
      - 'tests/test_matplotlib_requirement_compatibility.py'
      - '.github/workflows/mip-py310-combined-head-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact tested source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install full canonical DMAIC requirement set
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r DMAIC_V3/requirements.txt
      - name: Execute source-owned Python marker regression tests
        run: >-
          python -m unittest discover -v -s tests
          -p test_matplotlib_requirement_compatibility.py
      - name: Emit matched interpreter evidence
        run: |
          python - <<'PY'
          import sys
          import matplotlib
          print('python', sys.version.split()[0])
          print('matplotlib', matplotlib.__version__)
          print('source-only native compatibility proof, not merge admission')
          PY
