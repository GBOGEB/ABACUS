name: W52 P2R SUPPLIER_A TS strict residual

on:
  pull_request:
    paths:
      - 'qplant/w52_p2r_supplier_a_ts_strict_residual.py'
      - 'models/helium_properties/**'
      - '.github/workflows/w52-p2r-supplier-a-ts-strict-residual.yml'
  workflow_dispatch:

jobs:
  residual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install governed property backend
        run: pip install CoolProp==7.2.0
      - name: Execute SUPPLIER_A TS residual
        run: |
          python -m qplant.w52_p2r_supplier_a_ts_strict_residual | tee w52_p2r_supplier_a_ts_receipt.json
      - name: Upload receipt
        uses: actions/upload-artifact@v7.0.2
        with:
          name: w52-p2r-supplier-a-ts-receipt
          path: w52_p2r_supplier_a_ts_receipt.json
