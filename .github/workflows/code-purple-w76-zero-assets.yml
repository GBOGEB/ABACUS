name: CODE PURPLE W76 Zero-Covered Asset Recovery

on:
  pull_request:
    paths:
      - 'ci/w76_zero_coverage.py'
      - 'ci/w76_zero_coverage_baseline.json'
      - 'tests/test_w76_zero_*.py'
      - '.github/workflows/code-purple-w76-zero-assets.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: w76-zero-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zero-asset-proof:
    name: W76 pinned zero-assets (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout exact PR HEAD with read-only permissions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install baseline-matched coverage instrumenter
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'coverage==7.16.2'
          python -m coverage --version
      - name: Exact-head tests and bounded source-blob/denominator census
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p w76-evidence
          cp ci/w76_zero_coverage_baseline.json w76-evidence/baseline.json
          python -m coverage run --branch -m unittest discover \
            -s tests -p 'test_w76_zero_*.py' -q \
            2>&1 | tee w76-evidence/unittest.log
          python -m coverage json -o w76-evidence/coverage.json
          python ci/w76_zero_coverage.py \
            --baseline w76-evidence/baseline.json \
            --coverage-json w76-evidence/coverage.json \
            --unittest-log w76-evidence/unittest.log \
            --expected-head "$EXPECTED_HEAD" \
            --repository-root . --out w76-evidence
      - name: Upload bytes for independent verification; not admission
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: code-purple-w76-${{ matrix.os }}-py${{ matrix.python-version }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: w76-evidence/
          if-no-files-found: warn
          retention-days: 30
