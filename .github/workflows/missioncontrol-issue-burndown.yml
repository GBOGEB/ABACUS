name: MissionControl ABACUS issue burndown evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'
  pull_request:
    paths:
      - 'scripts/missioncontrol_issue_burndown.py'
      - 'tests/test_missioncontrol_issue_burndown.py'
      - '.github/workflows/missioncontrol-issue-burndown.yml'

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: abacus-missioncontrol-burndown-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Governed CODE PURPLE/EVERRED SHA pin (checkout v4.2.2)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Run negative controls and deterministic unit tests
        run: |
          python -m unittest discover -s tests \
            -p test_missioncontrol_issue_burndown.py -v
      - name: Source-bound live GitHub read
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/missioncontrol_issue_burndown.py \
            --out "$RUNNER_TEMP/mc-burndown"
          python - "$RUNNER_TEMP/mc-burndown" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); m=json.loads((p/'manifest.json').read_text())
          for name,digest in m['sha256'].items():
              observed = hashlib.sha256((p/name).read_bytes()).hexdigest()
              assert observed == digest, name
          e=json.loads((p/'issue_census.json').read_text())
          assert not e['authority']['remote_mutation_authorized']
          assert e['counts']['issues_closed_by_mission']==0
          assert e['counts']['worker_packets_launched']==0
          print((p/'mission_summary.md').read_text())
          PY
      - name: Upload evidence set
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: >-
            abacus-mc-bd-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mc-burndown/
          if-no-files-found: error
          retention-days: 30
