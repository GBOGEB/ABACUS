name: smoke-test
on:
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Ensure global index exists
        run: |
          if [ ! -f GLOBAL_index.json ]; then
            echo '{"artefacts": []}' > GLOBAL_index.json
          fi
      - name: Self Smoke
        run: |
          python scripts/recursive_build.py --smoke --index GLOBAL_index.json
