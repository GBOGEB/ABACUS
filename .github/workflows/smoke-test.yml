name: smoke-test
on:
  pull_request:
  workflow_dispatch:
# Part of #2722: cancel superseded PR runs (same PR, older head). Pushes to
# main are keyed by SHA and never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Self Smoke
        run: |
          python scripts/recursive_build.py --smoke --index GLOBAL_index.json
      - name: Handover V2 tuple lineage regression
        if: hashFiles('tools/handover_v2/tests/test_tuple_lineage.py') != ''
        run: |
          python -m unittest discover -s tools/handover_v2/tests \
            -p test_tuple_lineage.py -v
