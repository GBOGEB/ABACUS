name: W85 Census Proof
on:
  pull_request:
    paths:
      - 'scripts/deterministic_census_authority_and_contract_check.py'
      - 'triage/census/roundtrip/TRIAGE_W62_IMMUTABLE_TUPLE.json'
      - '.github/workflows/w85-census-proof.yml'
  workflow_dispatch:

jobs:
  prove:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute deterministic DOW proof
        shell: bash
        run: |
          python scripts/deterministic_census_authority_and_contract_check.py | tee w85_dow_proof.txt
          grep -q '^status=PASS$' w85_dow_proof.txt
          grep -q '^recommendation=ACCEPT$' w85_dow_proof.txt
          grep -q '^canonical_sha256=5cba183913a951b01a1ff86ac71eb5bfaaf9aeaee70b7442224ff902e95e0261$' w85_dow_proof.txt
      - uses: actions/upload-artifact@v4
        with:
          name: w85-dow-proof-${{ matrix.os }}
          path: w85_dow_proof.txt
