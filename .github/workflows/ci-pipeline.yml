name: Continuous Integration Pipeline

on:
  push:
    branches: [main, master, develop, feature/*]
  pull_request:
    paths:
      - '.github/workflows/ci-pipeline.yml'
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  # JOB 1: CODE QUALITY
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          pip install black flake8 pylint mypy bandit safety

      - name: Run Black (Formatting)
        continue-on-error: true
        run: black --check --diff .

      - name: Run Flake8 (Linting)
        # rex-allow: ADVISORY_EXPLICIT
        continue-on-error: true
        run: flake8 . --count --statistics --max-line-length=120

      - name: Run Pylint
        continue-on-error: true
        run: pylint **/*.py --exit-zero

      - name: Run MyPy (Type Checking)
        continue-on-error: true
        run: mypy . --ignore-missing-imports

      - name: Run Bandit (Security)
        run: bandit -r . -f json -o bandit-report.json || true

      - name: Upload Security Report
        uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: bandit-report.json

  # JOB 2: UNIT TESTS
  unit-tests:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    env:
      PYTEST_WORKERS: ${{ matrix.os == 'windows-latest' && '0' || 'auto' }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install \
            pytest \
            pytest-cov \
            pytest-benchmark \
            pytest-xdist \
            pytest-timeout
          python -m pip install -r requirements.txt
          # W13 G3CS bridge imports NetworkX during pytest collection.
          # Match the Python 3.11+ pin in requirements-dev.txt.
          python -m pip install "networkx==3.6.1"
          python -c 'import networkx; assert networkx.__version__ == "3.6.1"'

      - name: Build Docker test image
        if: runner.os == 'Linux'
        run: docker build -t test-app:latest .

      - name: Run Tests
        shell: bash
        run: |
          set -euo pipefail
          # A clean job-local coverage database must not mix branch data
          # with stale statement-only worker fragments.
          python -m coverage erase
          mkdir -p ci-evidence
          pytest --benchmark-disable tests/ -v \
            --cov=. \
            --cov-branch \
            --cov-report=xml \
            --cov-report=json:ci-evidence/coverage.json \
            --junitxml=ci-evidence/junit.xml \
            --cov-report=html \
            --cov-report=term \
            -n "$PYTEST_WORKERS"

      - name: Preserve native unit and coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            ci-evidence/junit.xml
            ci-evidence/coverage.json
            coverage.xml
          if-no-files-found: error

      - name: Upload Coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests-${{ matrix.os }}-py${{ matrix.python-version }}

  # JOB 3: INTEGRATION TESTS
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt || echo "No requirements.txt"

      - name: Run DMAIC Pipeline
        run: |
          python DMAIC_V3/full_pipeline_orchestrator.py \
            --iteration 1 --no-git --quiet

      - name: Run DOW Pipeline
        run: |
          python execute_full_pipeline_sprint_dow.py || \
            echo "DOW pipeline completed"

      - name: Verify Outputs
        run: |
          test -f DMAIC_V3_OUTPUT/iteration_1/EXECUTION_SUMMARY.md
          grep -Fq "**Status:** SUCCESS" \
            DMAIC_V3_OUTPUT/iteration_1/EXECUTION_SUMMARY.md
          test -f PIPELINE_OUTPUT/pipeline_execution_*.json || \
            echo "Pipeline output missing"

  # JOB 4: BUILD VERIFICATION
  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Build Docker Image
        run: |
          docker build -t dmaic-pipeline:test .

      - name: Test Docker Image
        run: |
          docker run --rm dmaic-pipeline:test python --version

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0
        with:
          image-ref: dmaic-pipeline:test
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Preserve PR Trivy SARIF as read-only artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-trivy-sarif
          path: trivy-results.sarif
          if-no-files-found: error
