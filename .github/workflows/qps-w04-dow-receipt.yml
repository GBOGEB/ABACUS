name: QPS W04 DOW receipt contract
on:
  workflow_dispatch:
  pull_request:
    paths: ['tests/fixtures/qps_w04_dow_receipt_fixture.yaml','tools/validate_qps_w04_dow_receipt.py','tools/run_qps_w04_dow_return.py','federation/qps/QPS_FED_W04_DOW_REQUEST.yaml','federation/qps/snapshots/QPS_FED_W04_SANITIZED_PARENT_SNAPSHOT_v0.2.yaml','ssot/qps_w04_dow_qa_actions.yaml','.github/workflows/qps-w04-dow-receipt.yml']
  push:
    branches: [main]
    paths: ['tests/fixtures/qps_w04_dow_receipt_fixture.yaml','tools/validate_qps_w04_dow_receipt.py','tools/run_qps_w04_dow_return.py','federation/qps/QPS_FED_W04_DOW_REQUEST.yaml','federation/qps/snapshots/QPS_FED_W04_SANITIZED_PARENT_SNAPSHOT_v0.2.yaml','ssot/qps_w04_dow_qa_actions.yaml','.github/workflows/qps-w04-dow-receipt.yml']
permissions:
  contents: read
env:
  QPS_W04_CHILD_SHA: ec12b09873a8e0668176d8212f8d09ecdbe18bad
jobs:
  validate-w04-dow-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check PyYAML
      - run: python tools/validate_qps_w04_dow_receipt.py tests/fixtures/qps_w04_dow_receipt_fixture.yaml

      - name: Prove hash-only lineage refresh emits zero findings
        shell: bash
        run: |
          set -euo pipefail
          zeros="$(printf '0%.0s' {1..64})"
          python tools/run_qps_w04_dow_return.py \
            --snapshot federation/qps/snapshots/QPS_FED_W04_SANITIZED_PARENT_SNAPSHOT_v0.2.yaml \
            --child-sha "$QPS_W04_CHILD_SHA" \
            --prior-artifact-set-sha256 "$zeros" \
            --semantic-change false \
            --analysis-requested false \
            --output /tmp/qps-w04-hash-refresh.yaml
          python tools/validate_qps_w04_dow_receipt.py /tmp/qps-w04-hash-refresh.yaml

      - name: Bind current artifact-set identity
        id: artifact-set
        shell: bash
        run: |
          set -euo pipefail
          current="$(
            python - <<'PY'
          import yaml
          with open("/tmp/qps-w04-hash-refresh.yaml", encoding="utf-8") as fh:
              data = yaml.safe_load(fh)
          print(data["source_artifact_set_sha256"])
          PY
          )"
          test "${#current}" -eq 64
          echo "sha256=$current" >> "$GITHUB_OUTPUT"

      - name: Prove two idempotent no-op repeats
        shell: bash
        env:
          CURRENT_ARTIFACT_SET_SHA256: ${{ steps.artifact-set.outputs.sha256 }}
        run: |
          set -euo pipefail
          for repeat in 1 2; do
            python tools/run_qps_w04_dow_return.py \
              --snapshot federation/qps/snapshots/QPS_FED_W04_SANITIZED_PARENT_SNAPSHOT_v0.2.yaml \
              --child-sha "$QPS_W04_CHILD_SHA" \
              --prior-artifact-set-sha256 "$CURRENT_ARTIFACT_SET_SHA256" \
              --semantic-change false \
              --analysis-requested false \
              --output "/tmp/qps-w04-hash-noop-${repeat}.yaml"
            python tools/validate_qps_w04_dow_receipt.py \
              "/tmp/qps-w04-hash-noop-${repeat}.yaml"
          done

      - name: Enforce BDQ-003 non-semantic invariants
        shell: bash
        run: |
          python - <<'PY'
          import yaml

          def load(path):
              with open(path, encoding="utf-8") as fh:
                  return yaml.safe_load(fh)

          refresh = load("/tmp/qps-w04-hash-refresh.yaml")
          noop1 = load("/tmp/qps-w04-hash-noop-1.yaml")
          noop2 = load("/tmp/qps-w04-hash-noop-2.yaml")

          assert refresh["analysis_decision"] == "LINEAGE_REFRESH_ONLY"
          assert refresh["trigger_semantics"]["artifact_hash_changed"] is True
          assert refresh["trigger_semantics"]["semantic_change"] is False
          assert refresh["trigger_semantics"]["analysis_requested"] is False

          for item in (refresh, noop1, noop2):
              assert item["typed_findings"] == []
              assert item["executed_analysis_scope"] == []
              assert item["executed_stages"] == []
              assert item["stage_status"] == {}

          for item in (noop1, noop2):
              assert item["analysis_decision"] == "IDEMPOTENT_NOOP"
              assert item["trigger_semantics"]["artifact_hash_changed"] is False

          hashes = {
              refresh["lineage_state_hash"],
              noop1["lineage_state_hash"],
              noop2["lineage_state_hash"],
          }
          assert len(hashes) == 1
          assert (
              refresh["source_artifact_set_sha256"]
              == noop1["source_artifact_set_sha256"]
              == noop2["source_artifact_set_sha256"]
          )
          print("PASS_BDQ_003_HASH_ONLY_REFRESH_AND_IDEMPOTENT_NOOP")
          PY

      - name: Upload BDQ-003 trigger receipts
        uses: actions/upload-artifact@v7
        with:
          name: qps-w04-hash-semantic-trigger-${{ github.run_id }}
          path: |
            /tmp/qps-w04-hash-refresh.yaml
            /tmp/qps-w04-hash-noop-1.yaml
            /tmp/qps-w04-hash-noop-2.yaml
          if-no-files-found: error

  execute-w04-dow-sanitized-snapshot-runtime:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ABACUS parent
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Produce sanitized-snapshot W04 DOW runtime receipt
        run: python tools/run_qps_w04_dow_return.py --snapshot federation/qps/snapshots/QPS_FED_W04_SANITIZED_PARENT_SNAPSHOT_v0.2.yaml --child-sha "$QPS_W04_CHILD_SHA"
      - name: Validate sanitized-snapshot W04 DOW runtime receipt
        run: python tools/validate_qps_w04_dow_receipt.py federation/qps/runtime/QPS_FED_W04_DOW_RUNTIME_RECEIPT.yaml
      - name: Upload sanitized-snapshot W04 DOW runtime receipt
        uses: actions/upload-artifact@v7
        with:
          name: qps-w04-dow-sanitized-snapshot-receipt-${{ github.run_id }}
          path: federation/qps/runtime/QPS_FED_W04_DOW_RUNTIME_RECEIPT.yaml
          if-no-files-found: error

  execute-w04-dow-private-child-runtime:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ABACUS parent
        uses: actions/checkout@v7
        with: {path: parent}
      - name: Check private child credential
        id: credential
        shell: bash
        env:
          QPS_REPO_READ_TOKEN: ${{ secrets.QPS_REPO_READ_TOKEN }}
        run: |
          if [ -n "$QPS_REPO_READ_TOKEN" ]; then echo 'available=true' >> "$GITHUB_OUTPUT"; else echo 'available=false' >> "$GITHUB_OUTPUT"; fi
      - name: Checkout request-bound QPS child SSOT
        if: steps.credential.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          repository: GBOGEB/cryoplant-project
          ref: ${{ env.QPS_W04_CHILD_SHA }}
          token: ${{ secrets.QPS_REPO_READ_TOKEN }}
          persist-credentials: false
          path: qps
      - uses: actions/setup-python@v7
        if: steps.credential.outputs.available == 'true'
        with: {python-version: '3.12'}
      - name: Install runtime dependency
        if: steps.credential.outputs.available == 'true'
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Verify exact request-bound QPS child SHA
        if: steps.credential.outputs.available == 'true'
        id: child
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git -C qps rev-parse HEAD)
          test "$actual" = "$QPS_W04_CHILD_SHA"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
      - name: Produce private-child W04 DOW runtime receipt
        if: steps.credential.outputs.available == 'true'
        working-directory: parent
        run: python tools/run_qps_w04_dow_return.py --child-root ../qps --child-sha '${{ steps.child.outputs.sha }}'
      - name: Validate private-child W04 DOW runtime receipt
        if: steps.credential.outputs.available == 'true'
        working-directory: parent
        run: python tools/validate_qps_w04_dow_receipt.py federation/qps/runtime/QPS_FED_W04_DOW_RUNTIME_RECEIPT.yaml
      - name: Upload private-child W04 DOW runtime receipt
        if: steps.credential.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: qps-w04-dow-private-child-receipt-${{ github.run_id }}
          path: parent/federation/qps/runtime/QPS_FED_W04_DOW_RUNTIME_RECEIPT.yaml
          if-no-files-found: error
      - name: Record unavailable higher-authority lane
        if: steps.credential.outputs.available != 'true'
        run: echo 'Private-child receipt lane unavailable; sanitized snapshot lane remains the governed fallback.'
