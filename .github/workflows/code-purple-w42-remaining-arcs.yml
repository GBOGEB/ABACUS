name: CODE PURPLE W42 Remaining-Arcs Matched Native
on:
  pull_request:
    paths:
      - 'tests/test_qps_binary_bridge_w42_remaining_arcs.py'
      - '.github/workflows/code-purple-w42-remaining-arcs.yml'
      - 'tools/qps_binary_bridge.py'
      - 'tools/qps_xlsx_native_features.py'
      - 'tests/test_qps_binary_bridge_native_imports.py'
      - 'tests/test_qps_bridge_source_proof.py'
      - 'scripts/qps_bridge_source_proof.py'
      - 'ci/contracts/qps_binary_bridge_w42_v2.json'
      - 'pyproject.toml'
      - 'pytest.ini'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: code-purple-w42-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  matched-n-n2-n3:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout immutable exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install source-owned native dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest==9.1.1 pytest-cov==5.0.0 coverage==7.16.2 pypdf==6.21.1 numpy==2.2.6 defusedxml==0.7.1
      - name: Verify reviewed source bindings and proof consumer controls
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          export CHECKED_OUT_HEAD="$(git rev-parse HEAD)"
          python scripts/qps_bridge_source_proof.py \
            --contract ci/contracts/qps_binary_bridge_w42_v2.json --native
          python -m pytest -q tests/test_qps_bridge_source_proof.py
      - name: N baseline - 27 preserved cases
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          mkdir -p artifacts/w42
          python -m pytest -q \
            tests/test_qps_binary_bridge.py \
            tests/test_qps_binary_bridge_w32_integrity.py \
            --cov=tools --cov-branch \
            --cov-report=json:artifacts/w42/n-coverage.json \
            --junitxml=artifacts/w42/n-junit.xml
      - name: N+2 W41 - 81 preserved cases
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          python -m pytest -q \
            tests/test_qps_binary_bridge.py \
            tests/test_qps_binary_bridge_w32_integrity.py \
            tests/test_qps_binary_bridge_w40_penetration.py \
            tests/test_qps_binary_bridge_w41_frontier.py \
            --cov=tools --cov-branch \
            --cov-report=json:artifacts/w42/n2-coverage.json \
            --junitxml=artifacts/w42/n2-junit.xml
      - name: N+3 W42 - 85 cases, four unexercised-path oracles
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          python -m pytest -q \
            tests/test_qps_binary_bridge.py \
            tests/test_qps_binary_bridge_w32_integrity.py \
            tests/test_qps_binary_bridge_w40_penetration.py \
            tests/test_qps_binary_bridge_w41_frontier.py \
            tests/test_qps_binary_bridge_w42_remaining_arcs.py \
            --cov=tools --cov-branch \
            --cov-report=json:artifacts/w42/n3-coverage.json \
            --junitxml=artifacts/w42/n3-junit.xml
      - name: N+4 native import fallback - 88 cumulative cases
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          python -m pytest -q \
            tests/test_qps_binary_bridge.py \
            tests/test_qps_binary_bridge_w32_integrity.py \
            tests/test_qps_binary_bridge_w40_penetration.py \
            tests/test_qps_binary_bridge_w41_frontier.py \
            tests/test_qps_binary_bridge_w42_remaining_arcs.py \
            tests/test_qps_binary_bridge_native_imports.py \
            --cov=tools --cov-branch \
            --cov-report=json:artifacts/w42/n4-coverage.json \
            --junitxml=artifacts/w42/n4-junit.xml
      - name: Fail-closed source-bound successor proof
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CELL: ${{ matrix.os }}-py${{ matrix.python }}
        run: |
          set -euo pipefail
          export CHECKED_OUT_HEAD="$(git rev-parse HEAD)"
          python scripts/qps_bridge_source_proof.py \
            --contract ci/contracts/qps_binary_bridge_w42_v2.json \
            --artifacts artifacts/w42 --native
      - name: Upload native exact-head evidence even if RED
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: w42-${{ matrix.os }}-py${{ matrix.python }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: artifacts/w42/
          if-no-files-found: warn
          retention-days: 30
