name: CODE PURPLE W42 Remaining-Arcs Matched Native
on:
  pull_request:
    paths:
      - 'tests/test_qps_binary_bridge_w42_remaining_arcs.py'
      - '.github/workflows/code-purple-w42-remaining-arcs.yml'
      - 'tools/qps_binary_bridge.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: code-purple-w42-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  matched-n-n2-n3:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout immutable exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install source-owned native dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest==9.1.1 pytest-cov==5.0.0 coverage==7.16.2 pypdf==6.21.1 numpy==2.2.6
      - name: N baseline - 27 preserved cases
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          mkdir -p artifacts/w42
          python -m pytest -q \
            tests/test_qps_binary_bridge.py \
            tests/test_qps_binary_bridge_w32_integrity.py \
            --cov=tools --cov-branch \
            --cov-report=json:artifacts/w42/n-coverage.json \
            --junitxml=artifacts/w42/n-junit.xml
      - name: N+2 W41 - 81 preserved cases
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          python -m pytest -q \
            tests/test_qps_binary_bridge.py \
            tests/test_qps_binary_bridge_w32_integrity.py \
            tests/test_qps_binary_bridge_w40_penetration.py \
            tests/test_qps_binary_bridge_w41_frontier.py \
            --cov=tools --cov-branch \
            --cov-report=json:artifacts/w42/n2-coverage.json \
            --junitxml=artifacts/w42/n2-junit.xml
      - name: N+3 W42 - 85 cases, four unexercised-path oracles
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          python -m pytest -q \
            tests/test_qps_binary_bridge.py \
            tests/test_qps_binary_bridge_w32_integrity.py \
            tests/test_qps_binary_bridge_w40_penetration.py \
            tests/test_qps_binary_bridge_w41_frontier.py \
            tests/test_qps_binary_bridge_w42_remaining_arcs.py \
            --cov=tools --cov-branch \
            --cov-report=json:artifacts/w42/n3-coverage.json \
            --junitxml=artifacts/w42/n3-junit.xml
      - name: Fail-closed N N+2 N+3 fixed source proof
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CELL: ${{ matrix.os }}-py${{ matrix.python }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          out=Path("artifacts/w42")
          states=[]
          for epoch,name,expected in (("N","n",27),("N+2","n2",81),("N+3","n3",85)):
              report=json.loads((out/(name+"-coverage.json")).read_text())
              keys=[k for k in report["files"] if k.replace("\\","/").endswith("tools/qps_binary_bridge.py")]
              assert len(keys)==1, ("module coverage ambiguous",name,keys)
              s=report["files"][keys[0]]["summary"]
              tests=list(ET.parse(out/(name+"-junit.xml")).iter("testcase"))
              assert len(tests)==expected, ("culling or duplicate test identity",name,len(tests))
              assert not any(list(t.iter(v)) for t in tests for v in ("failure","error","skipped"))
              if name=="n3":
                  w42=[t for t in tests if "test_qps_binary_bridge_w42_remaining_arcs" in
                       (t.get("classname","")+t.get("name",""))]
                  assert len(w42)==4, ("new oracle identity mismatch",len(w42))
                  assert len({(t.get("classname"),t.get("name")) for t in w42})==4
              states.append({"epoch":epoch,"cases":len(tests),"statements_covered":s["covered_lines"],
                             "statements_eligible":s["num_statements"],
                             "branches_covered":s["covered_branches"],
                             "branches_eligible":s["num_branches"],
                             "combined_covered":s["covered_lines"]+s["covered_branches"],
                             "combined_eligible":s["num_statements"]+s["num_branches"],
                             "missing_lines":s["missing_lines"],"missing_branches":s["missing_branches"]})
          assert len({(s["statements_eligible"],s["branches_eligible"]) for s in states})==1
          assert [(s["statements_eligible"],s["branches_eligible"]) for s in states]==[(214,62)]*3
          assert states[0]["combined_covered"] <= states[1]["combined_covered"] <= states[2]["combined_covered"]
          assert states[0]["combined_covered"]==231 and states[1]["combined_covered"]==271
          assert states[2]["combined_covered"]==states[2]["combined_eligible"], ("five-arc frontier still open",states[2])
          sha=os.environ["EXACT_HEAD"]
          assert len(sha)==40 and all(x in "0123456789abcdef" for x in sha)
          receipt={"schema":"codepurple.w42.matched-fixpop/1.0",
                   "repo":"GBOGEB/ABACUS","head_sha":sha,
                   "run_id":int(os.environ["RUN_ID"]),"attempt":int(os.environ["RUN_ATTEMPT"]),
                   "cell":os.environ["CELL"],"job_id":None,
                   "epochs":states,"n_to_n3_delta_opportunities":states[2]["combined_covered"]-states[0]["combined_covered"],
                   "n2_to_n3_delta_opportunities":states[2]["combined_covered"]-states[1]["combined_covered"],
                   "module_coverage_accepted":True,"global_main_coverage":None,
                   "pr_changed_line_coverage":None,"governed_merge_admission":None,
                   "authenticated_crew_launch":None,"accepted_rex":None,
                   "security_waiver":False,"authority_transfer":False,"merge_admission":"HOLD"}
          (out/"receipt.json").write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          (out/"SHA256.json").write_text(json.dumps({
              p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.iterdir())
              if p.name!="SHA256.json"},sort_keys=True,indent=2)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Upload native exact-head evidence even if RED
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: w42-${{ matrix.os }}-py${{ matrix.python }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: artifacts/w42/
          if-no-files-found: warn
          retention-days: 30
