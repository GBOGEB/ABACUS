name: QPS M05 DOW Independent Attestation Consumer

on:
  pull_request:
    paths:
      - "scripts/qps_m05_verify_attestation_return.py"
      - "scripts/qps_m05_g5_dow_readiness.py"
      - ".github/workflows/qps_m05_dow_independent_consumer.yml"
      - "triage/M05_*"
  push:
    branches: [main]
    paths:
      - "scripts/qps_m05_verify_attestation_return.py"
      - "scripts/qps_m05_g5_dow_readiness.py"
      - ".github/workflows/qps_m05_dow_independent_consumer.yml"
      - "triage/M05_*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ABACUS exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify historical CODEX M05 attestation control
        run: python scripts/qps_m05_verify_attestation_return.py

      - name: Independently consume observed G5 H2 semantic-provenance receipt
        run: python scripts/qps_m05_g5_dow_readiness.py

      - name: Upload DOW independent consumer receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qps-m05-dow-independent-consumer-${{ github.sha }}
          path: artifacts/m05/
          if-no-files-found: error
