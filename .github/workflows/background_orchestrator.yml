# yamllint disable rule:line-length
name: DOW-KEB-GBOGEB Background Orchestrator

on:
  schedule:
    - cron: '0 */6 * * *'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/background_orchestrator.yml'
  workflow_dispatch:
    inputs:
      priority:
        description: 'Task Priority'
        required: false
        default: 'MEDIUM'
        type: choice
        options:
          - CRITICAL
          - HIGH
          - MEDIUM
          - LOW
          - BACKGROUND
      task_type:
        description: 'Task Type'
        required: false
        default: 'validation'
        type: choice
        options:
          - validation
          - analysis
          - artifact_generation
          - health_check
          - full_orchestration

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Step outcomes feed the health_check job, which derives health from
    # them instead of printing constants.
    outputs:
      init_outcome: ${{ steps.init_orchestrator.outcome }}
      validation_outcome: ${{ steps.validation_suite.outcome }}
      pipeline_outcome: ${{ steps.background_pipeline.outcome }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov black flake8 bandit

      - name: Initialize Canonical 12-Cluster Runtime
        id: init_orchestrator
        run: |
          python DMAIC_V3/core/twelve_cluster_orchestrator.py --test --phase phase2 --tasks 12
          echo "orchestrator_initialized=true" >> $GITHUB_OUTPUT

      - name: Run Validation Suite
        id: validation_suite
        if: github.event.inputs.task_type == 'validation' || github.event.inputs.task_type == 'full_orchestration'
        run: |
          python scripts/validate_test_performance.py
          echo "✅ Validation suite completed"

      - name: Execute Governed Background Pipeline
        id: background_pipeline
        if: github.event.inputs.task_type == 'full_orchestration' || github.event_name == 'schedule'
        run: |
          python DMAIC_V3/full_pipeline_orchestrator.py --iteration 1 --no-git --quiet

      - name: Generate Artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp -r DMAIC_V3_OUTPUT/* artifacts/ 2>/dev/null || true
          cp -r orchestrator_outputs/* artifacts/ 2>/dev/null || true
          cp -r test_validation_results/* artifacts/ 2>/dev/null || true
          cp -r local_mcp/logs/* artifacts/ 2>/dev/null || true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: orchestrator-artifacts-${{ github.run_number }}
          path: artifacts/
          retention-days: 30

      - name: Generate Status Report
        if: always()
        run: |
          python -c "
          import json
          from pathlib import Path

          report = {
              'run_id': '${{ github.run_id }}',
              'run_number': '${{ github.run_number }}',
              'trigger': '${{ github.event_name }}',
              'priority': '${{ github.event.inputs.priority || 'MEDIUM' }}',
              'task_type': '${{ github.event.inputs.task_type || 'scheduled' }}',
              'status': '${{ job.status }}'
          }

          Path('status_report.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          "

      - name: Commit Generated Artifacts
        if: github.event_name == 'schedule' || github.event.inputs.task_type == 'full_orchestration'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add orchestrator_outputs/ test_validation_results/ || true
          git commit -m "🤖 Background orchestrator run #${{ github.run_number }}" || echo "No changes to commit"
          git push || echo "Nothing to push"

  health_check:
    runs-on: ubuntu-latest
    needs: orchestrate
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Derive System Health From Upstream Results
        id: health
        env:
          JOB_RESULT: ${{ needs.orchestrate.result }}
          INIT_OUTCOME: ${{ needs.orchestrate.outputs.init_outcome }}
          VALIDATION_OUTCOME: ${{ needs.orchestrate.outputs.validation_outcome }}
          PIPELINE_OUTCOME: ${{ needs.orchestrate.outputs.pipeline_outcome }}
          EXPECT_VALIDATION: ${{ github.event.inputs.task_type == 'validation' || github.event.inputs.task_type == 'full_orchestration' }}
          EXPECT_PIPELINE: ${{ github.event.inputs.task_type == 'full_orchestration' || github.event_name == 'schedule' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          args=(--job-result "$JOB_RESULT" --run-id "$RUN_ID" --out health.json
                --step "init=$INIT_OUTCOME" --expect init
                --step "validation=$VALIDATION_OUTCOME"
                --step "pipeline=$PIPELINE_OUTCOME")
          if [ "$EXPECT_VALIDATION" = true ]; then args+=(--expect validation); fi
          if [ "$EXPECT_PIPELINE" = true ]; then args+=(--expect pipeline); fi
          echo "🏥 System Health Check (derived from orchestrate job)"
          python scripts/ci/orchestrator_health.py "${args[@]}"
          python -c "import json; print('status=' + json.load(open('health.json'))['orchestrator_status'])" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Pages Index
        run: |
          mkdir -p docs
          cat > docs/index.md << 'EOF'
          # DOW-KEB-GBOGEB Integration Orchestrator

          ## System Status

          - **Last Run**: ${{ github.run_id }}
          - **Run Number**: ${{ github.run_number }}
          - **Trigger**: ${{ github.event_name }}
          - **Orchestrator health**: ${{ steps.health.outputs.status }} (derived from the orchestrate job; see health.json in the run)

          ## Components

          ### DOW (Deployment Orchestration Workspace)
          - Level 0 Workspace Root Controller
          - Status: not observed by this workflow

          ### KEB (Knowledge Execution Backend)
          - Agents, MCP, Tasks Management
          - Status: not observed by this workflow

          ### GBOGEB (God-Bot Orchestration)
          - Gods → Demigods → Minions → Agents
          - Status: not observed by this workflow

          ## Recent Runs

          - Run #${{ github.run_number }}: ${{ github.event_name }}

          ## Artifacts

          [View Latest Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ## Documentation

          - [Canonical 12-Cluster Orchestrator](../DMAIC_V3/core/twelve_cluster_orchestrator.py)
          - [Operational Full Pipeline](../DMAIC_V3/full_pipeline_orchestrator.py)
          - [Validation Suite](../scripts/validate_test_performance.py)
          - [Test Metrics](../test_validation_results/)

          ---

          *Last Updated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")*
          EOF

          cat docs/index.md

      - name: Commit Documentation
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/ || true
          git commit -m "📚 Update GitHub Pages documentation" || echo "No changes to commit"
          git push || echo "Nothing to push"

      - name: Fail Unless Healthy
        env:
          STATUS: ${{ steps.health.outputs.status }}
        run: |
          echo "orchestrator_status=$STATUS (causes are in the health step's output)"
          test "$STATUS" = HEALTHY
