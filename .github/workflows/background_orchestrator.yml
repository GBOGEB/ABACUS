name: DOW-KEB-GBOGEB Background Orchestrator

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      priority:
        description: 'Task Priority'
        required: false
        default: 'MEDIUM'
        type: choice
        options:
          - CRITICAL
          - HIGH
          - MEDIUM
          - LOW
          - BACKGROUND
      task_type:
        description: 'Task Type'
        required: false
        default: 'validation'
        type: choice
        options:
          - validation
          - analysis
          - artifact_generation
          - health_check
          - full_orchestration

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov black flake8 bandit
      
      - name: Initialize DOW-KEB-GBOGEB Orchestrator
        id: init_orchestrator
        run: |
          python DOW_KEB_GBOGEB_INTEGRATION_ORCHESTRATOR.py --init-only
          echo "orchestrator_initialized=true" >> $GITHUB_OUTPUT
      
      - name: Run Validation Suite
        if: github.event.inputs.task_type == 'validation' || github.event.inputs.task_type == 'full_orchestration'
        run: |
          python scripts/validate_test_performance.py
          echo "✅ Validation suite completed"
      
      - name: Execute Background Tasks
        if: github.event.inputs.task_type == 'full_orchestration' || github.event_name == 'schedule'
        run: |
          python DOW_KEB_GBOGEB_INTEGRATION_ORCHESTRATOR.py \
            --priority ${{ github.event.inputs.priority || 'MEDIUM' }} \
            --mode background \
            --max-runtime 7200
      
      - name: Generate Artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp -r orchestrator_outputs/* artifacts/ 2>/dev/null || true
          cp -r test_validation_results/* artifacts/ 2>/dev/null || true
          cp -r local_mcp/logs/* artifacts/ 2>/dev/null || true
      
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: orchestrator-artifacts-${{ github.run_number }}
          path: artifacts/
          retention-days: 30
      
      - name: Generate Status Report
        if: always()
        run: |
          python -c "
          import json
          from pathlib import Path
          
          report = {
              'run_id': '${{ github.run_id }}',
              'run_number': '${{ github.run_number }}',
              'trigger': '${{ github.event_name }}',
              'priority': '${{ github.event.inputs.priority || 'MEDIUM' }}',
              'task_type': '${{ github.event.inputs.task_type || 'scheduled' }}',
              'status': 'completed'
          }
          
          Path('status_report.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          "
      
      - name: Commit Generated Artifacts
        if: github.event_name == 'schedule' || github.event.inputs.task_type == 'full_orchestration'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add orchestrator_outputs/ test_validation_results/ || true
          git commit -m "🤖 Background orchestrator run #${{ github.run_number }}" || echo "No changes to commit"
          git push || echo "Nothing to push"

  health_check:
    runs-on: ubuntu-latest
    needs: orchestrate
    if: always()
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Check System Health
        run: |
          python -c "
          import json
          from pathlib import Path
          from datetime import datetime
          
          health = {
              'timestamp': datetime.now().isoformat(),
              'orchestrator_status': 'healthy',
              'dow_active': True,
              'keb_active': True,
              'gbogeb_active': True,
              'last_run': '${{ github.run_id }}'
          }
          
          print('🏥 System Health Check')
          print(json.dumps(health, indent=2))
          "
      
      - name: Create GitHub Pages Index
        run: |
          mkdir -p docs
          cat > docs/index.md << 'EOF'
          # DOW-KEB-GBOGEB Integration Orchestrator
          
          ## System Status
          
          - **Last Run**: ${{ github.run_id }}
          - **Run Number**: ${{ github.run_number }}
          - **Trigger**: ${{ github.event_name }}
          - **Status**: ✅ Active
          
          ## Components
          
          ### DOW (Deployment Orchestration Workspace)
          - Level 0 Workspace Root Controller
          - Status: ✅ Active
          
          ### KEB (Knowledge Execution Backend)
          - Agents, MCP, Tasks Management
          - Status: ✅ Active
          
          ### GBOGEB (God-Bot Orchestration)
          - Gods → Demigods → Minions → Agents
          - Status: ✅ Active
          
          ## Recent Runs
          
          - Run #${{ github.run_number }}: ${{ github.event_name }}
          
          ## Artifacts
          
          [View Latest Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          ## Documentation
          
          - [Integration Orchestrator](../DOW_KEB_GBOGEB_INTEGRATION_ORCHESTRATOR.py)
          - [Validation Suite](../scripts/validate_test_performance.py)
          - [Test Metrics](../test_validation_results/)
          
          ---
          
          *Last Updated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")*
          EOF
          
          cat docs/index.md
      
      - name: Commit Documentation
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/ || true
          git commit -m "📚 Update GitHub Pages documentation" || echo "No changes to commit"
          git push || echo "Nothing to push"
