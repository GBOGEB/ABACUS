name: gg_MATH QPS Wormhole DOW Evidence
on:
  pull_request:
    paths:
      - 'runtime/federation/qps_math_wormhole_dow.py'
      - 'tests/test_qps_math_wormhole_dow.py'
      - 'tests/fixtures/qps_math_wormhole_provider_v1.json'
      - 'tests/test_qps_math_wormhole_dow_adversarial.py'
      - 'scripts/qps_math_dow_coverage_flight.py'
      - 'docs/ci/QPS_MATH_WORMHOLE_DOW_V1.md'
      - '.github/workflows/qps-math-wormhole-dow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dow-observer:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Source-bound DOW observer negative controls
        run: >-
          python -m unittest discover -s tests
          -p test_qps_math_wormhole_dow.py -v

      - name: Source-matched DOW coverage pulse
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'coverage==7.16.2'
          python scripts/qps_math_dow_coverage_flight.py \
            --expected-head "$(git rev-parse HEAD)" \
            --out artifacts/qps_math_dow
      - name: Run fixture-based DOW candidate flight (not native federation)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path

          fixture = Path("tests/fixtures/qps_math_wormhole_provider_v1.json")
          provider = json.loads(fixture.read_text(encoding="utf-8"))["producer"]
          out = Path("artifacts/qps_math_dow")
          out.mkdir(parents=True, exist_ok=True)
          subprocess.run([
              sys.executable, "runtime/federation/qps_math_wormhole_dow.py",
              "--provider-receipt", str(fixture),
              "--provider-sha", provider["source_sha"],
              "--artifact-sha256", provider["artifact_sha256"],
              "--out", str(out / "candidate.json"),
          ], check=True)
          result = json.loads((out / "candidate.json").read_text())
          if result["status"] != "VALID_PROPOSAL_ONLY":
              raise SystemExit("DOW fixture must remain proposal-only")
          if result["measurement"]["runtime_authenticated"] != 0:
              raise SystemExit(
                  "DOW fixture cannot claim runtime authentication"
              )
          manifest = {
              "schema": "qps-wormhole-fixture-flight/v1",
              "repo": "GBOGEB/ABACUS",
              "checked_out_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "provider_sha": provider["source_sha"],
              "provider_artifact_sha256": provider["artifact_sha256"],
              "candidate_file_sha256": hashlib.sha256(
                  (out / "candidate.json").read_bytes()
              ).hexdigest(),
              "flight_type": "SYNTHETIC_FIXTURE_ONLY",
              "native_cross_repository_attested": False,
              "qps_disposition": "DEFER",
              "authority_transfer": False,
          }
          (out / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True), encoding="utf-8"
          )
          PY
      - name: Upload read-only DOW fixture candidate evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qps-dow-fixture-${{matrix.python-version}}-${{github.run_id}}
          path: artifacts/qps_math_dow/
          if-no-files-found: error
