name: W52 P2T TS Runtime Receipt
on:
  pull_request:
    paths:
      - 'qplant/w52_p2n_ts_enthalpy_receipt.py'
      - 'models/helium_properties/provider.py'
      - '.github/workflows/w52-p2t-ts-runtime-receipt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ts-runtime-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install governed helium runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install CoolProp==7.2.0
      - name: Generate exact current LKT thermal-shield receipt
        run: |
          mkdir -p artifacts/w52_p2t
          python - <<'PY' > artifacts/w52_p2t/LKT_TS_enthalpy_receipt.json
          import json
          from qplant.w52_p2n_ts_enthalpy_receipt import report
          print(json.dumps(report(), indent=2, sort_keys=True))
          PY
      - name: Validate exact-state numerical receipt contract
        run: |
          python - <<'PY'
          import json
          p='artifacts/w52_p2t/LKT_TS_enthalpy_receipt.json'
          with open(p, encoding='utf-8') as f: r=json.load(f)
          assert r['reference_chain']['contract_base_W'] == 8200.0
          assert r['reference_chain']['lkt_design_target_W'] == 8610.0
          assert r['reference_chain']['current_offer_source'] == 'LKT OFFER-07 p2 / combined PDF p392'
          s=r['exact_current_offer_state']
          assert s['mdot_g_s'] == 81.0
          assert s['D'] == {'T_K': 40.24, 'P_bara': 12.6}
          assert s['E'] == {'T_K': 60.41, 'P_bara': 11.6}
          x=r['exact_current_offer_receipt']
          assert x['basis'] == 'CURRENT_LKT_OFFER_07_2KOP_EXACT'
          assert r['engineering_tolerance_percent'] == 1.0
          assert len(r['window_points']) == 6
          print('receipt_contract=PASS')
          print('h_D_J_kg=', x['h_D_J_kg'])
          print('h_E_J_kg=', x['h_E_J_kg'])
          print('delta_h_J_kg=', x['h_E_J_kg']-x['h_D_J_kg'])
          print('calculated_duty_W=', x['calculated_duty_W'])
          print('residual_vs_contract_W=', x['residual_vs_contract_W'])
          print('residual_vs_contract_percent=', x['residual_vs_contract_percent'])
          print('residual_vs_lkt_design_W=', x['residual_vs_lkt_design_W'])
          print('residual_vs_lkt_design_percent=', x['residual_vs_lkt_design_percent'])
          print('within_engineering_tolerance_vs_lkt=', x['within_engineering_tolerance_vs_lkt'])
          print('runtime_validation_D=', x['runtime_validation_D'])
          print('runtime_validation_E=', x['runtime_validation_E'])
          PY
      - name: Display receipt
        run: cat artifacts/w52_p2t/LKT_TS_enthalpy_receipt.json
      - name: Upload governed runtime receipt
        uses: actions/upload-artifact@v7
        with:
          name: w53-p05k1-lkt-ts-exact-enthalpy-receipt
          path: artifacts/w52_p2t/LKT_TS_enthalpy_receipt.json
