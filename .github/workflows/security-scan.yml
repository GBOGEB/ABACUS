name: Security Scan — Ruff

# Bandit  → bandit.yml
# OSV     → osv-scanner.yml
# Semgrep → semgrep.yml
# This workflow runs Ruff security rules (S-series) which have no dedicated file.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  ruff-security:
    name: Ruff Security Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff (security rules only)
        # S = flake8-bandit security rules; B = bugbear; F = pyflakes
        run: |
          ruff check DMAIC_V3 \
            --select S,B,F \
            --ignore S603,S101,E501 \
            --exclude "*_corrupted.py,*_fixed.py,*_clean.py" \
            --output-format github || true

