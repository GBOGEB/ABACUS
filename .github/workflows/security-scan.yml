name: Security Scan — Bandit + Ruff + OSV + Semgrep

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # weekly Monday 06:00 UTC (dashboard runs at 08:00)

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        # Config governed by .github/security/security.toml [bandit] section
        run: |
          bandit -r DMAIC_V3 \
            --exclude DMAIC_V3/tests,DMAIC_V3/generators/test_integration_pipeline.py \
            --skip B101,B603 \
            --severity-level medium \
            --confidence-level medium \
            -f sarif \
            -o bandit-results.sarif || true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
          category: bandit

  ruff-security:
    name: Ruff Security Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff (security rules only)
        # S = flake8-bandit security rules; B = bugbear; F = pyflakes
        run: |
          ruff check DMAIC_V3 \
            --select S,B,F \
            --ignore S603,S101,E501 \
            --exclude "*_corrupted.py,*_fixed.py,*_clean.py" \
            --output-format github || true

  osv-scan:
    name: OSV Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run OSV Scanner
        # v1.1+ uses Node 20-compatible actions internally
        uses: google/osv-scanner-action@v1.9.2
        with:
          scan-args: |-
            --lockfile=requirements.txt
            --format=sarif
            --output=osv-results.sarif
        continue-on-error: true

      - name: Upload OSV SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner
  # Semgrep runs in its own workflow: .github/workflows/semgrep.yml
