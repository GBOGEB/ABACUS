name: Validate Docs (Markdown/YAML/JSON)

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

jobs:
  lint:
    name: Changed docs lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node (for markdownlint)
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install markdownlint-cli2
        run: |
          npm install -g markdownlint-cli2

      - name: Setup Python (YAML/JSON checks)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Validate changed docs
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          python scripts/validate_changed_docs.py

      - name: Full YAML lint
        if: github.event_name == 'workflow_dispatch'
        env:
          YAMLLINT_CONFIG: >-
            {extends: default, rules: {document-start: disable,
            truthy: disable}}
        run: |
          yamllint -s -d "$YAMLLINT_CONFIG" .

      - name: Full JSON validation
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -e
          mapfile -t JSONS < <(
            find . -type f -name "*.json" -not -path "./node_modules/*"
          )
          for j in "${JSONS[@]}"; do
            python -m json.tool "$j" > /dev/null || {
              echo "Invalid JSON: $j"
              exit 1
            }
          done
          echo "All JSON files valid."
