name: Deploy Documentation to GitHub Pages

# JADE deploy contract, option A: the hub reusable CI runs the Pages contract
# tests, builds the docs/ bundle once and hashes every file into
# jade-manifest.json; the hub reusable deploy admits main only, verifies the
# digests, deploys to Pages and reads the served files back.
# The tests replace the old `validate` job; the readback replaces `post-deploy`.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'cryo_dashboard_v0_3_0/**'
      - 'docs_versioned/**'
      - 'build_qplant_visualization.py'
      - 'scripts/validate_runtime_foundation.py'
      - 'scripts/write_runtime_governance_status.py'
      - 'tools/gate_rollup.py'
      - 'logs/**'
      - 'content/qplant/**'
      - 'renderers/**'
      - 'rtm/**'
      - 'tests/test_pages_bundle.py'
      - '.github/workflows/pages.yml'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'cryo_dashboard_v0_3_0/**'
      - 'docs_versioned/**'
      - 'build_qplant_visualization.py'
      - 'scripts/validate_runtime_foundation.py'
      - 'scripts/write_runtime_governance_status.py'
      - 'tools/gate_rollup.py'
      - 'logs/**'
      - 'content/qplant/**'
      - 'renderers/**'
      - 'rtm/**'
      - 'tests/test_pages_bundle.py'
      - '.github/workflows/pages.yml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: GBOGEB/pipeline-automation-hub/.github/workflows/jade-reusable-ci.yml@77bac410de6b34afa5df665608611ad9e8db5c84
    with:
      python-version: '3.12'
      install: python -m pip install --disable-pip-version-check pytest
      test-runner: pytest
      # --noconftest: tests/conftest.py imports numpy; the bundle tests need only pytest.
      test-args: -q -p no:cacheprovider --noconftest tests/test_pages_bundle.py
      min-tests: 3
      # Same steps as the old deploy job. docs/ stays the site root, so the
      # entry page is unchanged. Dotfiles are removed because
      # upload-pages-artifact never published them (it skips hidden files).
      build-command: |
        python -m pip install --disable-pip-version-check pyyaml
        python build_qplant_visualization.py
        cp dist/qplant_visualization.html docs/qplant_visualization.html
        python tools/gate_rollup.py
        mkdir -p docs/api docs/reports
        cp rtm/trace_matrix.json docs/api/rtm_trace_matrix.json
        cp reports/*.json docs/reports/ 2>/dev/null || true
        python scripts/validate_runtime_foundation.py
        python scripts/write_runtime_governance_status.py \
          --output docs/reports/runtime_governance_status.json
        find docs -mindepth 1 -name '.*' -prune -exec rm -rf {} +
        test -f docs/index.html
      artifact-path: docs
      artifact-name: abacus-docs-pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: ci
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: GBOGEB/pipeline-automation-hub/.github/workflows/jade-reusable-deploy.yml@77bac410de6b34afa5df665608611ad9e8db5c84
    with:
      environment: production
      target: pages
      artifact-name: ${{ needs.ci.outputs.artifact-name }}
      manifest-sha256: ${{ needs.ci.outputs.manifest-sha256 }}
      tests-ran: ${{ fromJSON(needs.ci.outputs.tests-ran) }}
