name: federation-bridge-contract
on:
  pull_request:
    paths:
      - 'src/dmaic/tuple_metadata.py'
      - 'scripts/validate_tuple_metadata.py'
      - 'DMAIC_V3/tests/test_tuple_metadata_validation.py'
      - 'DMAIC_V3/tests/test_federation_bridge_contracts.py'
      - 'DMAIC_V3/core/**'
      - 'DMAIC_V3/phases/**'
      - 'docs/BRIDGES_AND_CONNECTIONS.md'
      - 'docs/FEDERATION_BRIDGE_ACCEPTANCE_20261026.md'
      - '.github/workflows/federation-bridge-contract.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tuple and bridge contract tests
        run: |
          python -m pip install pytest
          python -m pytest -q \
            DMAIC_V3/tests/test_tuple_metadata_validation.py \
            DMAIC_V3/tests/test_federation_bridge_contracts.py
