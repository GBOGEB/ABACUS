name: DELTA_1 Runtime Governance

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: runtime-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate governance topology
        run: |
          echo "DELTA_1 governance topology validation"

      - name: Validate release lineage
        run: |
          echo "DELTA_1 release-lineage validation"

      - name: Validate runtime manifests
        run: python scripts/validate_runtime_foundation.py

      - name: Generate runtime governance status
        run: >-
          python scripts/write_runtime_governance_status.py
          --output reports/runtime_governance_status.json

      - name: Upload runtime governance evidence
        uses: actions/upload-artifact@v7
        with:
          name: w007-runtime-governance-status
          path: reports/runtime_governance_status.json
