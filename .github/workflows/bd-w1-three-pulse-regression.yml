name: BD W1 Three-Pulse Focused Regression
on:
  pull_request:
    paths:
      - 'tests/test_bd_three_pulse_bridge.py'
      - 'scripts/bd_three_pulse_bridge.py'
      - '.github/workflows/bd-w1-three-pulse-regression.yml'
permissions:
  contents: read
jobs:
  focused-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused test runner
        run: python -m pip install pytest numpy
      - name: Positive and negative Bandit three-pulse bridge
        run: python -m pytest -q tests/test_bd_three_pulse_bridge.py
