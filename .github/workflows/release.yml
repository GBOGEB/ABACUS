name: Release & Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.3.1)'
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building release: $TAG"

      - name: Validate critical files
        run: |
          echo "=== Pre-release validation ==="
          ERRORS=0
          for f in docs/index.html docs/handover_book.html DMAIC_V3/config.py local_mcp/__init__.py; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing: $f"
              ERRORS=$((ERRORS+1))
            else
              echo "✅ $f"
            fi
          done
          if [ $ERRORS -gt 0 ]; then
            echo "Release blocked: $ERRORS missing files"
            exit 1
          fi

      - name: Python syntax check
        run: |
          echo "=== Syntax validation ==="
          ERRORS=0
          while IFS= read -r f; do
            if python3 -m py_compile "$f" 2>/dev/null; then
              echo "✅ $f"
            else
              echo "❌ Syntax error: $f"
              ERRORS=$((ERRORS+1))
            fi
          done < <(find DMAIC_V3 local_mcp staging -name '*.py' -type f 2>/dev/null)
          if [ $ERRORS -gt 0 ]; then
            echo "Release blocked: $ERRORS files with syntax errors"
            exit 1
          fi

      - name: Package dashboards
        run: |
          echo "=== Packaging dashboards ==="
          mkdir -p release-artifacts
          MISSING_DIRS=()
          for d in docs/ cryo_dashboard_v0_3_0/ docs_versioned/; do
            [ -d "$d" ] || MISSING_DIRS+=("$d")
          done
          if [ ${#MISSING_DIRS[@]} -gt 0 ]; then
            echo "❌ Missing directories: ${MISSING_DIRS[*]}"
            exit 1
          fi
          tar czf release-artifacts/abacus-docs-${{ steps.version.outputs.tag }}.tar.gz \
            docs/ cryo_dashboard_v0_3_0/ docs_versioned/
          echo "Package size: $(du -h release-artifacts/*.tar.gz | cut -f1)"

      - name: Generate release notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          cat > release-artifacts/RELEASE_NOTES.md << EOF
          # ABACUS $TAG Release Notes

          ## What's Included
          - 📖 12-Chapter Handover Book (HTML, Markdown)
          - 📊 Deep Analysis Dashboard
          - 🧊 Cryo Dashboard v0.3.0
          - 🏗️ 12-Cluster Architecture documentation
          - 🔒 DOW Governance framework
          - 🧪 Integration test results
          - 🛠️ Engineering tools catalog
          - 📐 Version lineage navigator
          - 7 topic-specific landing pages

          ## Key Metrics
          - 558 commits analyzed
          - 12 agent clusters mapped
          - 92.5/100 quality score
          - 1,327 DOW governance references
          - 41 documentation artifacts

          ## Fixes
          - KEB/GBOGEB timeout handling improved
          - Missing local_mcp/__init__.py added
          - change_detector.py syntax error resolved

          ## CI/CD
          - 4 new GitHub Actions workflows
          - Daily dashboard health checks
          - Automated docs deployment pipeline
          EOF

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.tag }}
          path: release-artifacts/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: release-artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: "ABACUS ${{ needs.build.outputs.tag }}"
          body_path: release-artifacts/RELEASE_NOTES.md
          files: release-artifacts/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
