name: Semgrep

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 6 * * 1'   # Monday 06:30 UTC (after CodeQL at 06:00)
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    # Do NOT use container: here — it breaks checkout's Node.js runtime.
    # Use the official action instead; it handles the environment itself.
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/owasp-top-ten
            p/secrets
          # generateSarif writes semgrep.sarif to the workspace root
          generateSarif: '1'
          # auditOn: push — only block on push to main, not on PRs
          auditOn: push
        env:
          # Optional: link results to Semgrep Cloud dashboard.
          # Add SEMGREP_APP_TOKEN in repo Settings → Secrets → Actions.
          # Leave absent to run fully offline (SARIF still uploads fine).
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        # Never fail the workflow — findings go to GitHub Security tab,
        # not to a build-breaking exit code.
        continue-on-error: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
