name: Semgrep

on:
  push:
    branches: [main, develop]
    paths: &semgrep_paths
      - '**/*.py'
      - '**/*.yaml'
      - '**/*.yml'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'setup.cfg'
      - 'setup.py'
      - '.github/security/**'
      - '.github/workflows/semgrep.yml'
  pull_request:
    branches: [main]
    paths: *semgrep_paths
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/python \
            --config p/owasp-top-ten \
            --config p/secrets \
            --sarif \
            --output semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.39.1
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Run local YAML/YML security rules (advisory)
        run: |
          semgrep scan \
            --config .github/security/semgrep-yaml-workflows.yml \
            --sarif \
            --output semgrep-yaml.sarif \
            .github/workflows
        continue-on-error: true
      - name: Upload original YAML security SARIF evidence
        if: always() && hashFiles('semgrep-yaml.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: semgrep-yaml-advisory-source
          path: semgrep-yaml.sarif
          if-no-files-found: error
      - name: Upload YAML findings to GitHub Security tab
        if: always() && hashFiles('semgrep-yaml.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: semgrep-yaml.sarif
          category: semgrep-yaml-workflows
