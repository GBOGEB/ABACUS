name: Ariana CI/CD

# Source-owned DOW/Ariana CI; no deployment or remote dispatch.
on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/ariana-cicd.yml'
      - 'DMAIC_V3/core/dow_ariana_integration.py'
      - 'DMAIC_V3/core/test_system_bridge.py'
      - 'DMAIC_V3/core/state.py'
      - 'DMAIC_V3/core/handover_bridge.py'
      - 'DMAIC_V3/config.py'
      - 'DMAIC_V3/core/models.py'
      - 'src/dmaic/idempotency.py'
      - 'DMAIC_V3/tests/test_dow_ariana_integration_runtime_coverage.py'
      - 'tests/test_dow_ariana_changed_line_coverage.py'
      - 'tests/test_ariana_ci_federation.py'
      - 'scripts/ci/ariana_dow_evidence.py'
      - '.mesh/MESH_DOCK.yaml'
      - 'architecture/w112/W112_GLOBAL_HIVE_GLOB_DOW_RECEIVER.yaml'
  pull_request:
    paths:
      - '.github/workflows/ariana-cicd.yml'
      - 'DMAIC_V3/core/dow_ariana_integration.py'
      - 'DMAIC_V3/core/test_system_bridge.py'
      - 'DMAIC_V3/core/state.py'
      - 'DMAIC_V3/core/handover_bridge.py'
      - 'DMAIC_V3/config.py'
      - 'DMAIC_V3/core/models.py'
      - 'src/dmaic/idempotency.py'
      - 'DMAIC_V3/tests/test_dow_ariana_integration_runtime_coverage.py'
      - 'tests/test_dow_ariana_changed_line_coverage.py'
      - 'tests/test_ariana_ci_federation.py'
      - 'scripts/ci/ariana_dow_evidence.py'
      - '.mesh/MESH_DOCK.yaml'
      - 'architecture/w112/W112_GLOBAL_HIVE_GLOB_DOW_RECEIVER.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ariana:
    name: Ariana/DOW native Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
    
    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        cd ARTEFACT_TYPE_GROUPING/PYTHON_code
        python -m pip install --upgrade pip
        pip install -r ariana_requirements.txt
    
    - name: Run fix script
      run: |
        cd ARTEFACT_TYPE_GROUPING/PYTHON_code
        python fix_ariana.py
    
    - name: Run tests
      run: |
        cd ARTEFACT_TYPE_GROUPING/PYTHON_code
        python test_ariana.py
    
    - name: Test agent execution
      run: |
        cd ARTEFACT_TYPE_GROUPING/PYTHON_code
        python -c "from ariana_agent import ArianaAgent; agent = ArianaAgent(); result = agent.run(); print('Agent test passed:', result['status'])"
    
    - name: Test DOW integration
      run: |
        cd ARTEFACT_TYPE_GROUPING/PYTHON_code
        python test_ariana_dow_integration.py
    
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ariana-logs
        path: ARTEFACT_TYPE_GROUPING/PYTHON_code/logs/

  federation-bridge:
    name: DOW / KEB / QPS evidence-only matrix join
    needs: test-ariana
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
    
    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        cd ARTEFACT_TYPE_GROUPING/PYTHON_code
        pip install -r ariana_requirements.txt
    
    - name: Deploy Ariana with DOW
      run: |
        cd ARTEFACT_TYPE_GROUPING/PYTHON_code
        python ariana_dow_bridge.py
    
    - name: Verify deployment
      run: |
        cd ARTEFACT_TYPE_GROUPING/PYTHON_code
        test -f DOW/AGENTS_REGISTRY.json && echo "✅ Agent registered in DOW"
        test -f DOW/ariana_health.json && echo "✅ Health monitoring active"
    
    - name: Upload deployment artifacts
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ariana-deployment
        path: |
          ARTEFACT_TYPE_GROUPING/PYTHON_code/DOW/
          ARTEFACT_TYPE_GROUPING/PYTHON_code/logs/
