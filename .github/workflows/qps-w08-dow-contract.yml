name: QPS W08 DOW contract

on:
  pull_request:
    paths:
      - 'feedback/qps_w08_lifecycle_coverage_graph_request.yaml'
      - 'feedback/qps_w08_pr_head_aht_control_snapshot.yaml'
      - 'dashboards/qps_w08_coverage_graph_view.yaml'
      - 'presenter/qps_w08_lifecycle_coverage_html_presentation.yaml'
      - 'tests/test_qps_w08_coverage_graph_request.py'
      - '.github/workflows/qps-w08-dow-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w08-dow-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install pytest pyyaml
      - name: Test W08 parent DOW contract
        run: python -m pytest -q tests/test_qps_w08_coverage_graph_request.py
