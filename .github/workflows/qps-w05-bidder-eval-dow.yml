name: QPS W05 bidder evaluation DOW receipt

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'federation/qps/QPS_FED_W05_BIDDER_EVAL_DOW_REQUEST.yaml'
      - >-
        federation/qps/snapshots/
        QPS_FED_W05_BIDDER_EVAL_SANITIZED_v0.1.yaml
      - 'tools/run_qps_w05_bidder_eval_dow.py'
      - 'tools/validate_qps_w05_bidder_eval_dow.py'
      - '.github/workflows/qps-w05-bidder-eval-dow.yml'
  push:
    branches: [main]
    paths:
      - 'federation/qps/QPS_FED_W05_BIDDER_EVAL_DOW_REQUEST.yaml'
      - >-
        federation/qps/snapshots/
        QPS_FED_W05_BIDDER_EVAL_SANITIZED_v0.1.yaml
      - 'tools/run_qps_w05_bidder_eval_dow.py'
      - 'tools/validate_qps_w05_bidder_eval_dow.py'
      - '.github/workflows/qps-w05-bidder-eval-dow.yml'

permissions:
  contents: read

jobs:
  execute-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Produce W05 DOW receipt
        run: python tools/run_qps_w05_bidder_eval_dow.py
      - name: Validate W05 DOW receipt
        run: >-
          python tools/validate_qps_w05_bidder_eval_dow.py
          federation/qps/runtime/QPS_FED_W05_BIDDER_EVAL_DOW_RECEIPT.yaml
      - name: Upload W05 DOW receipt
        uses: actions/upload-artifact@v4
        with:
          name: qps-w05-bidder-eval-dow-${{ github.run_id }}
          path: >-
            federation/qps/runtime/
            QPS_FED_W05_BIDDER_EVAL_DOW_RECEIPT.yaml
          if-no-files-found: error
