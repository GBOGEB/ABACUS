---
name: QPS W05 Bidder Evaluation DOW receipt

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'federation/qps/QPS_FED_W05_BIDDER_EVAL_DOW_REQUEST.yaml'
      - 'federation/qps/snapshots/**'
      - 'tools/run_qps_w05_bidder_eval_dow_return.py'
      - '.github/workflows/qps-w05-bidder-eval-dow.yml'
  push:
    branches: [main]
    paths:
      - 'federation/qps/QPS_FED_W05_BIDDER_EVAL_DOW_REQUEST.yaml'
      - 'federation/qps/snapshots/**'
      - 'tools/run_qps_w05_bidder_eval_dow_return.py'
      - '.github/workflows/qps-w05-bidder-eval-dow.yml'

permissions:
  contents: read

jobs:
  execute-w05-dow-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Produce runtime receipt
        run: python tools/run_qps_w05_bidder_eval_dow_return.py
      - name: Validate receipt contract
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import yaml

          path = pathlib.Path(
              'federation/qps/runtime/'
              'QPS_FED_W05_BIDDER_EVAL_DOW_RUNTIME_RECEIPT.yaml'
          )
          data = yaml.safe_load(path.read_text())
          assert data['correlation_id'] == 'QPS-FED-W05-BIDDER-EVAL'
          assert data['requested_operations'] == data['executed_operations']
          assert data['child_disposition_placeholder'] == 'UNSET'
          assert data['typed_findings']
          assert len(data['output_hash']) == 64
          print('W05 DOW receipt PASS', len(data['typed_findings']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qps-w05-bidder-eval-dow-${{ github.run_id }}
          path: >-
            federation/qps/runtime/
            QPS_FED_W05_BIDDER_EVAL_DOW_RUNTIME_RECEIPT.yaml
          if-no-files-found: error
