# yamllint disable rule:line-length
---
name: QPS W05 Bidder Evaluation DOW receipt

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'federation/qps/QPS_FED_W05_BIDDER_EVAL_DOW_REQUEST.yaml'
      - 'federation/qps/QPS_FED_W05_PARENT_SSOT_MANIFEST_v0.1.yaml'
      - 'federation/qps/snapshots/QPS_FED_W05_BIDDER_EVAL_SANITIZED_v0.1.yaml'
      - 'tools/run_qps_w05_bidder_eval_dow_return.py'
      - 'tests/test_qps_w05_bidder_eval_dow_return.py'
      - '.github/workflows/qps-w05-bidder-eval-dow.yml'
  push:
    branches: [main]
    paths:
      - 'federation/qps/QPS_FED_W05_BIDDER_EVAL_DOW_REQUEST.yaml'
      - 'federation/qps/QPS_FED_W05_PARENT_SSOT_MANIFEST_v0.1.yaml'
      - 'federation/qps/snapshots/QPS_FED_W05_BIDDER_EVAL_SANITIZED_v0.1.yaml'
      - 'tools/run_qps_w05_bidder_eval_dow_return.py'
      - 'tests/test_qps_w05_bidder_eval_dow_return.py'
      - '.github/workflows/qps-w05-bidder-eval-dow.yml'

permissions:
  contents: read

jobs:
  execute-w05-dow-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Test fail-closed runtime mechanics
        run: python -m unittest tests.test_qps_w05_bidder_eval_dow_return -v
      - name: Produce runtime receipt
        run: python tools/run_qps_w05_bidder_eval_dow_return.py
      - name: Validate receipt contract
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import yaml

          path = pathlib.Path(
              'federation/qps/runtime/'
              'QPS_FED_W05_BIDDER_EVAL_DOW_RUNTIME_RECEIPT.yaml'
          )
          data = yaml.safe_load(path.read_text())
          assert data['receipt_contract_version'] == '0.2.0'
          assert data['correlation_id'] == 'QPS-FED-W05-BIDDER-EVAL'
          assert data['requested_operations'] == data['executed_operations']
          assert data['child_disposition_placeholder'] == 'UNSET'
          assert data['typed_findings']
          assert re.fullmatch(r'[0-9a-f]{64}', data['output_hash'])
          for operation, status in data['operation_status'].items():
              assert status['executed'] is True, operation
              assert status['status'] == 'PASS_EXECUTED_MECHANIC', operation
              assert re.fullmatch(r'[0-9a-f]{64}', status['result_sha256'])
          for finding in data['typed_findings']:
              assert finding['qps_authority'] is False
              hashes = finding['input_and_output_hash_lineage']
              assert all(re.fullmatch(r'[0-9a-f]{64}', value) for value in hashes.values())
          print('W05 DOW executed-mechanics receipt PASS', len(data['typed_findings']))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: qps-w05-bidder-eval-dow-${{ github.run_id }}
          path: federation/qps/runtime/QPS_FED_W05_BIDDER_EVAL_DOW_RUNTIME_RECEIPT.yaml
          if-no-files-found: error
