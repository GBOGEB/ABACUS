name: DOW Main CI/CD Pipeline

on:
  pull_request:
    branches:
    - main
    - develop
  push:
    branches:
    - main
    - develop
    - feat/*
  schedule:
  - cron: 0 */6 * * *

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: pip install -r requirements.txt || echo 'No requirements.txt'
    
    - name: Run Test Suite
      run: python TESTING_SUITE/RUN_ALL_TESTS.py
    
    - name: Run 5-Iteration DMAIC+DOW Integration
      run: python demo_integrated_system.py
    
    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports
        path: TESTING_SUITE/05_TEST_REPORTS/
    
    - name: Upload Integration Reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: integration-reports
        path: demo_workspace/integration_report_*.json
