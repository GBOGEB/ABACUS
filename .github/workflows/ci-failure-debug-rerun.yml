name: CI Failure Debug Rerun

on:
  workflow_run:
    workflows: ["DMAIC V3 CI - Test System Bridge"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  rerun-with-debug:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout failing SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install debug dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-mock pyyaml

      - name: Debug rerun pytest with traceback
        id: debug_rerun
        continue-on-error: true
        run: |
          set -o pipefail
          start_ts="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "debug_start_time=${start_ts}" >> "$GITHUB_OUTPUT"
          python -m pytest DMAIC_V3/tests -vv --tb=long --maxfail=1 2>&1 | tee debug_pytest.log
          echo "pytest_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Extract failure location
        id: parse_failure
        run: |
          python - << 'PYEOF'
          import json
          import re
          from pathlib import Path

          log = Path("debug_pytest.log").read_text(encoding="utf-8", errors="replace")

          nodeid_match = re.search(r"FAILED\\s+([\\w\\-/.:\\[\\]]+)", log)
          file_line_match = re.search(r'File "([^"]+)", line (\\d+)', log)
          longrepr_match = re.search(r"E\\s+(.+)", log)

          result = {
              "failed_test": nodeid_match.group(1) if nodeid_match else "not-detected",
              "file": file_line_match.group(1) if file_line_match else "not-detected",
              "line": int(file_line_match.group(2)) if file_line_match else -1,
              "error_excerpt": longrepr_match.group(1).strip() if longrepr_match else "not-detected",
          }

          Path("debug_failure_summary.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
          print(json.dumps(result, indent=2))
          PYEOF

      - name: Publish debug summary
        uses: actions/github-script@v9
        env:
          DEBUG_START: ${{ steps.debug_rerun.outputs.debug_start_time }}
          DEBUG_EXIT: ${{ steps.debug_rerun.outputs.pytest_exit }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.payload.workflow_run.id;
            const workflowId = context.payload.workflow_run.workflow_id;

            const failure = JSON.parse(fs.readFileSync('debug_failure_summary.json', 'utf8'));
            const jobsResp = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: runId,
              per_page: 100
            });
            const recentRunsResp = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowId,
              per_page: 30
            });
            const recentRuns = (recentRunsResp.data.workflow_runs || [])
              .filter(r => r.status === 'completed');
            const executions = recentRuns.length;
            const failRuns = recentRuns.filter(r =>
              ['failure', 'timed_out', 'cancelled', 'action_required', 'startup_failure'].includes(r.conclusion)
            );
            const passRuns = recentRuns.filter(r => r.conclusion === 'success');
            const successRate = executions > 0 ? ((passRuns.length / executions) * 100) : 0;
            const failureRate = executions > 0 ? ((failRuns.length / executions) * 100) : 0;

            const stepFrequency = new Map();
            const failDurations = [];
            for (const fr of failRuns.slice(0, 15)) {
              const frJobs = await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: fr.id,
                per_page: 100
              });
              let firstFailSeconds = null;
              for (const j of frJobs.data.jobs || []) {
                for (const s of j.steps || []) {
                  if (s.conclusion === 'failure') {
                    const key = `${j.name} :: ${s.name}`;
                    stepFrequency.set(key, (stepFrequency.get(key) || 0) + 1);
                    if (s.started_at && s.completed_at) {
                      const sec = (Date.parse(s.completed_at) - Date.parse(s.started_at)) / 1000;
                      if (!Number.isNaN(sec) && sec >= 0 && (firstFailSeconds === null || sec < firstFailSeconds)) {
                        firstFailSeconds = sec;
                      }
                    }
                  }
                }
              }
              if (firstFailSeconds !== null) failDurations.push(firstFailSeconds);
            }

            const modeStep = [...stepFrequency.entries()].sort((a, b) => b[1] - a[1])[0];
            failDurations.sort((a, b) => a - b);
            const medianFailSeconds = failDurations.length
              ? (failDurations.length % 2
                  ? failDurations[(failDurations.length - 1) / 2]
                  : (failDurations[failDurations.length / 2 - 1] + failDurations[failDurations.length / 2]) / 2)
              : null;

            const failedSteps = [];
            for (const job of jobsResp.data.jobs || []) {
              for (const step of job.steps || []) {
                if (step.conclusion === 'failure') {
                  failedSteps.push({
                    job: job.name,
                    step: step.name,
                    started_at: step.started_at,
                    completed_at: step.completed_at
                  });
                }
              }
            }

            const topStep = failedSteps[0];
            const failedStepBlock = topStep
              ? `- Step: **${topStep.step}**\n- Job: **${topStep.job}**\n- Start: \`${topStep.started_at}\`\n- End: \`${topStep.completed_at}\``
              : '- Step details could not be determined from the originating run.';

            const body = [
              '## 🧰 Automatic Debug Rerun Report',
              '',
              `Original failed run: [#${runId}](${context.serverUrl}/${owner}/${repo}/actions/runs/${runId})`,
              `Debug rerun status: **${process.env.DEBUG_EXIT === '0' ? 'PASS on rerun ✅' : 'FAIL on rerun ❌'}**`,
              `Debug start time: \`${process.env.DEBUG_START || 'n/a'}\``,
              '',
              '### Frequency / Mode / Median / Percentile',
              `- Executions sampled: **${executions}**`,
              `- Success: **${passRuns.length}** (${successRate.toFixed(1)}%)`,
              `- Fail: **${failRuns.length}** (${failureRate.toFixed(1)}%)`,
              `- Mode failing step: **${modeStep ? modeStep[0] : 'n/a'}** (${modeStep ? modeStep[1] : 0} occurrences)`,
              `- Median fail-step duration: **${medianFailSeconds !== null ? medianFailSeconds.toFixed(1) + 's' : 'n/a'}**`,
              `- Failure percentile (recent): **${failureRate.toFixed(1)}th**`,
              '',
              '### Failure step/time (originating run)',
              failedStepBlock,
              '',
              '### Failure location (debug rerun)',
              `- Test: \`${failure.failed_test}\``,
              `- File: \`${failure.file}\``,
              `- Line: \`${failure.line}\``,
              `- Error: \`${failure.error_excerpt}\``,
              '',
              `Artifacts: \`debug_pytest.log\`, \`debug_failure_summary.json\``
            ].join('\n');

            core.summary
              .addHeading('Automatic Debug Rerun')
              .addRaw(body)
              .write();

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-rerun-${{ github.run_id }}
          path: |
            debug_pytest.log
            debug_failure_summary.json
          retention-days: 14
