name: CODE PURPLE Floating Reconnection Testflight

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codepurple/reconnection-loop-*'
    paths:
      - 'tools/triage/floating_testflight.py'
      - 'tools/triage/floating_evidence_join.py'
      - 'tools/triage/mip_pulse_rollup.py'
      - 'tests/test_floating_testflight.py'
      - 'tests/test_floating_evidence_join.py'
      - 'tests/test_mip_pulse_rollup.py'
      - 'tests/test_mip_v3_frontier.py'
      - 'tests/test_mip_v3_temporal.py'
      - 'tests/test_floating_accelerator_receiver.py'
      - 'tests/test_floating_rollup_adversarial.py'
      - 'tools/triage/test_floating_anchor_census.py'
      - '.pre-commit-config.yaml'
      - 'scripts/testpilot.ps1'
      - '.github/workflows/floating-reconnection-testflight.yml'
  pull_request:
    paths:
      - 'tools/triage/**'
      - 'tests/test_floating_*'
      - 'tests/test_mip_pulse_rollup.py'
      - '.pre-commit-config.yaml'
      - '.github/workflows/floating-reconnection-testflight.yml'
  schedule:
    - cron: '11 4 * * *'

permissions:
  contents: read
  actions: read

# Never cancel an earlier evidence wave just because the head advanced.
concurrency:
  group: floating-testflight-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  local-first-flight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXACT_HEAD }}
          persist-credentials: false
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install bounded local-first toolchain
        run: |
          python -m pip install \
            pytest==9.1.1 pytest-cov==5.0.0 coverage==7.16.2 \
            defusedxml==0.7.1 pre-commit==4.3.0 PyYAML==6.0.3 numpy==2.2.6
          mkdir -p test_reports/floating/history
          python -m pip freeze > test_reports/floating/toolchain.txt

      - name: Read previous completed pulse evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test_reports/floating/history
          # Missing history is recorded as UNKNOWN, never invented as zero.
          if gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow floating-reconnection-testflight.yml --limit 30 \
             --json databaseId,headSha,status,number > test_reports/floating/history/runs.json; then
            python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          rows = json.loads(Path("test_reports/floating/history/runs.json").read_text())
          current = int(os.environ["GITHUB_RUN_NUMBER"])
          # Whole-repo heads may differ while measured source scope is stable.
          # Authenticate each historical run->head mapping before comparison.
          selected = [
               {"id": str(row["databaseId"]), "head": row.get("headSha"),
                "pulse": row.get("number")}
               for row in rows
               if row.get("status") == "completed"
               and type(row.get("number")) is int
               and row["number"] < current
               and isinstance(row.get("databaseId"), int)
               and isinstance(row.get("headSha"), str)
          ]
          selected.sort(key=lambda row: row["pulse"], reverse=True)
          source = Path("test_reports/floating/history")
          selected = selected[:8]
          source.joinpath("source-runs.json").write_text(json.dumps(
               {r["id"]: {"head": r["head"], "pulse": r["pulse"]}
                for r in selected}, sort_keys=True))
          source.joinpath("ids.txt").write_text(
               "\n".join(r["id"] for r in selected) + "\n")
          PY
            while IFS= read -r prior_run; do
              test -n "$prior_run" || continue
              mkdir -p "test_reports/floating/history/$prior_run"
              if ! gh run download "$prior_run" --repo "$GITHUB_REPOSITORY" \
                --pattern 'floating-observation-*' \
                --dir "test_reports/floating/history/$prior_run"; then
                echo "$prior_run" >> test_reports/floating/history/unavailable.txt
              fi
            done < test_reports/floating/history/ids.txt
          else
            echo "HISTORY_UNAVAILABLE" > test_reports/floating/history/unavailable.txt
          fi
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from tools.triage.floating_testflight import (
              OBS_SCHEMA, DEFAULT_SELECTION, selection_hash
          )
          root = Path("test_reports/floating/history")
          sources = json.loads((root / "source-runs.json").read_text()) if (
                  root / "source-runs.json").is_file() else {}
          valid = {}
          represented = set()
          for file in root.glob("*/**/observation.json"):
              try:
                  run_id = file.relative_to(root).parts[0]
                  item = json.loads(file.read_text())
                  source = sources.get(run_id, {})
                  attempt = item.get("run_attempt")
                  if (item.get("schema") == OBS_SCHEMA
                      and item.get("head_sha") == source.get("head")
                      and item.get("selection_sha256") ==
                          selection_hash(DEFAULT_SELECTION)
                      and item.get("run_id") == int(run_id)
                      and type(attempt) is int and attempt > 0
                      and type(item.get("pulse")) is int
                      and item["pulse"] == source.get("pulse")):
                    try:
                      result = subprocess.run(
                          ["gh", "run", "view", run_id, "--attempt", str(attempt),
                           "--json", "conclusion", "--jq", ".conclusion"],
                          check=True, capture_output=True, text=True)
                      conclusion = result.stdout.strip()
                      item["native_conclusion"] = (
                          conclusion if conclusion in {
                              "success", "failure", "cancelled", "timed_out",
                              "action_required", "neutral", "skipped",
                              "startup_failure",
                          } else "unverified")
                    except (OSError, subprocess.CalledProcessError):
                      item["native_conclusion"] = "unverified"
                    represented.add(run_id)
                    previous = valid.get(item["pulse"])
                    if previous is None or attempt > previous["run_attempt"]:
                      valid[item["pulse"]] = item
              except (ValueError, TypeError, IndexError, KeyError):
                  pass
          missing = sorted(set(sources) - represented)
          if missing:
              with (root / "unavailable.txt").open("a", encoding="utf-8") as handle:
                  handle.write("\n".join(missing) + "\n")
          if valid:
              ordered = sorted(valid.items())
              (root / "prior.json").write_text(json.dumps(ordered[-1][1]))
              for i, item in ordered[-3:]:
                  (root / f"pulse-{i:08d}.json").write_text(json.dumps(item))
          PY

      - name: Freeze N+1 and N+2 forecast BEFORE test execution
        shell: bash
        run: |
          set -euo pipefail
          args=(forecast --head "$EXACT_HEAD" --pulse "$GITHUB_RUN_NUMBER" \
                --out test_reports/floating/forecast.json)
          if test -f test_reports/floating/history/prior.json; then
            args+=(--prior test_reports/floating/history/prior.json)
          fi
          python tools/triage/floating_testflight.py "${args[@]}"
      - name: Publish frozen forecast separately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: floating-forecast-${{ env.EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test_reports/floating/forecast.json
          if-no-files-found: error
          retention-days: 30

      - name: User-side pre-commit and staging parity
        id: staged
        shell: bash
        run: |
          set +e
          python -m py_compile \
            tools/triage/floating_testflight.py \
            tools/triage/floating_evidence_join.py \
            tools/triage/mip_pulse_rollup.py
          syntax=$?
          python -m pre_commit run abacus-floating-staging-testflight --all-files
          hook=$?
          echo "syntax_exit=$syntax" >> "$GITHUB_OUTPUT"
          echo "hook_exit=$hook" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Execute focused behavioral and branch-coverage suite
        id: behavioral
        shell: bash
        run: |
          set +e
          python -m pytest -q -o addopts= \
            tests/test_coverage_dab_census.py \
            tests/test_floating_evidence_join.py \
            tests/test_mip_pulse_rollup.py \
            tests/test_floating_testflight.py \
            tools/triage/test_floating_anchor_census.py \
            tests/test_mip_v3_frontier.py \
            tests/test_mip_v3_temporal.py \
            tests/test_floating_accelerator_receiver.py \
            tests/test_floating_rollup_adversarial.py \
            --cov=scripts.coverage_dab_census \
            --cov=tools/triage \
            --cov-branch \
            --cov-report=json:test_reports/floating/coverage.json \
            --junitxml=test_reports/floating/junit.xml
          code=$?
          echo "test_exit=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fail closed on missing or zero-covered requested modules
        id: source_scope
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path("test_reports/floating/coverage.json")
          expected = {
              "scripts/coverage_dab_census.py",
              "tools/triage/accept_accelerator_atom_contract.py",
              "tools/triage/floating_anchor_census.py",
              "tools/triage/floating_evidence_join.py",
              "tools/triage/floating_testflight.py",
              "tools/triage/mip_pulse_rollup.py",
              "tools/triage/mip_v3_frontier.py",
              "tools/triage/mip_v3_temporal.py",
          }
          if source.exists():
              coverage = json.loads(source.read_text())
              files = coverage.get("files") or {}
              observed = set(files)
              missing = sorted(expected - observed)
              zero = sorted(p for p in expected & observed
                            if files[p]["summary"]["num_statements"] > 0
                            and files[p]["summary"]["covered_lines"] == 0)
              branch = coverage.get("meta", {}).get("branch_coverage") is True
          else:
              missing, zero, branch, observed = sorted(expected), [], False, set()
          ok = not missing and not zero and branch
          payload = {
              "schema": "codepurple.floating.scope-guard.v1",
              "expected_paths": sorted(expected),
              "observed_paths": sorted(observed),
              "missing_paths": missing,
              "zero_covered_paths": zero,
              "branch_instrumented": branch,
              "status": "PASS" if ok else "FAIL",
              "formal_credit_delta": 0,
              "merge_admission": "HOLD",
          }
          Path("test_reports/floating/source-scope.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(json.dumps(payload, sort_keys=True))
          if not ok:
              raise SystemExit(1)
          PY
          code=$?
          echo "source_exit=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record exact-source observation and review package
        if: always()
        shell: bash
        env:
          SYNTAX_EXIT: ${{ steps.staged.outputs.syntax_exit }}
          HOOK_EXIT: ${{ steps.staged.outputs.hook_exit }}
          TEST_EXIT: ${{ steps.behavioral.outputs.test_exit }}
          SOURCE_EXIT: ${{ steps.source_scope.outputs.source_exit }}
        run: |
          set -euo pipefail
          if test -f test_reports/floating/forecast.json; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          names = {
              "syntax": "SYNTAX_EXIT",
              "hook": "HOOK_EXIT",
              "pytest": "TEST_EXIT",
              "source_scope": "SOURCE_EXIT",
          }
          gates = {}
          for name, variable in names.items():
              raw = os.environ.get(variable, "")
              gates[name] = "PASS" if raw == "0" else (
                  "FAIL" if raw.isdecimal() else "UNKNOWN")
          Path("test_reports/floating/gates.json").write_text(
              json.dumps(gates, sort_keys=True) + "\n")
          PY
            python tools/triage/floating_testflight.py observe \
              --forecast test_reports/floating/forecast.json \
              --junit test_reports/floating/junit.xml \
              --coverage test_reports/floating/coverage.json \
              --gate-outcomes test_reports/floating/gates.json \
              --native-conclusion pending \
              --out test_reports/floating/observation.json
            python - <<'PY'
          import json
          from pathlib import Path
          from tools.triage.floating_testflight import control
          root = Path("test_reports/floating")
          items = []
          for file in (root / "history").glob("pulse-*.json"):
              try:
                  items.append(json.loads(file.read_text()))
              except (OSError, ValueError):
                  pass
          items.append(json.loads((root / "observation.json").read_text()))
          items.sort(key=lambda row: row["pulse"])
          try:
              verdict = control(items)
          except (ValueError, KeyError) as exc:
              verdict = {"state": "HOLD_INVALID_HISTORY",
                         "reason": type(exc).__name__,
                         "phase_two_authorized": False,
                         "merge_admission": "HOLD"}
          unavailable = root / "history" / "unavailable.txt"
          if unavailable.is_file() and unavailable.read_text().strip():
              verdict = {
                  **verdict,
                  "previous_state": verdict.get("state"),
                  "state": "HOLD_UNVERIFIED_HISTORY",
                  "reason": "one or more prior native receipts were unavailable",
                  "phase_two_authorized": False,
                  "merge_admission": "HOLD",
              }
          (root / "control.json").write_text(
              json.dumps(verdict, sort_keys=True, indent=2) + "\n")
          PY
            python tools/triage/floating_testflight.py review \
              --forecast test_reports/floating/forecast.json \
              --observation test_reports/floating/observation.json \
              --control test_reports/floating/control.json \
              --out test_reports/floating/review.md
            cat test_reports/floating/review.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish observation, coverage and reviewer evidence
        if: always()
        id: publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: floating-observation-${{ env.EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test_reports/floating/observation.json
            test_reports/floating/control.json
            test_reports/floating/review.md
            test_reports/floating/coverage.json
            test_reports/floating/source-scope.json
            test_reports/floating/junit.xml
            test_reports/floating/gates.json
            test_reports/floating/toolchain.txt
            test_reports/floating/history/unavailable.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce staged and behavioral first-red results
        if: always()
        shell: bash
        env:
          SYNTAX_EXIT: ${{ steps.staged.outputs.syntax_exit }}
          HOOK_EXIT: ${{ steps.staged.outputs.hook_exit }}
          TEST_EXIT: ${{ steps.behavioral.outputs.test_exit }}
          SOURCE_EXIT: ${{ steps.source_scope.outputs.source_exit }}
        run: |
          set -euo pipefail
          test "$SYNTAX_EXIT" = "0"
          test "$HOOK_EXIT" = "0"
          test "$TEST_EXIT" = "0"
          test "$SOURCE_EXIT" = "0"
