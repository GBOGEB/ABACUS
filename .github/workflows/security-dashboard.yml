name: Security Dashboard — REX Telemetry

# Aggregation is deliberately scheduled/manual. Scanner results remain authoritative
# in their own workflows; rebuilding a dashboard after every scanner completion
# creates workflow_run fan-out without adding evidence authority.
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: security-dashboard-rex-telemetry
  cancel-in-progress: true

permissions:
  contents: write
  security-events: read

jobs:
  build-dashboard:
    name: Build Security Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Generate dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: python .github/scripts/security_dashboard.py
      - name: Commit dashboard if changed
        run: |
          git config user.name "ABACUS Security Bot"
          git config user.email "abacus-security@noreply"
          git add .github/security/dashboard.md .github/security/alerts.yaml
          if git diff --cached --quiet; then
            echo "No changes to dashboard - skipping commit"
          else
            git commit -m "security(dashboard): auto-update REX telemetry [skip ci]"
            git push
          fi
