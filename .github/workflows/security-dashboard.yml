name: Security Dashboard — REX Telemetry

# Runs after governed scanners finish, on schedule, or manually.
# Collapse bursts of scanner completions into one latest dashboard build.
on:
  workflow_run:
    workflows:
      - "DELTA_1 CodeQL"
      - "Bandit"
      - "OSV-Scanner"
      - "Semgrep"
      - "Security Scan — Ruff"
    types: [completed]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: security-dashboard-rex-telemetry
  cancel-in-progress: true

permissions:
  contents: write
  security-events: read

jobs:
  build-dashboard:
    name: Build Security Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Generate dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: python .github/scripts/security_dashboard.py

      - name: Commit dashboard if changed
        run: |
          git config user.name "ABACUS Security Bot"
          git config user.email "abacus-security@noreply"
          git add .github/security/dashboard.md .github/security/alerts.yaml
          if git diff --cached --quiet; then
            echo "No changes to dashboard — skipping commit"
          else
            git commit -m "security(dashboard): auto-update REX telemetry [skip ci]"
            git push
          fi
