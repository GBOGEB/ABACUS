name: Security Dashboard — REX Telemetry

# Scheduled, aggregate-only observation. No bot commit or direct main push.
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: security-dashboard-rex-telemetry
  cancel-in-progress: true

permissions:
  contents: read
  security-events: read

jobs:
  build-dashboard:
    name: Build Security Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Generate aggregate-only dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: python .github/scripts/security_dashboard.py
      - name: Stage source-bound artifact receipt
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/security-dashboard"
          mkdir -p "$out"
          cp .github/security/dashboard.md "$out/dashboard.md"
          ( cd "$out" && sha256sum dashboard.md > dashboard.sha256 )
          printf 'repository=%s\nsource_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > "$out/source.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: security-dashboard-aggregate-${{ github.run_id }}
          path: ${{ runner.temp }}/security-dashboard/
          if-no-files-found: error
          retention-days: 30
