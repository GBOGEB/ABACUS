name: ABACUS bounded first-red acceptance
on:
  push:
    branches: [repair/20261013-postmerge-black-bandit]
    paths:
      - tests/test_dmaic_phase4_noop_contract_20261013.py
      - tests/test_test_evidence_census.py
      - .github/workflows/recovery-first-red-testflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install test and quality tools
        run: python -m pip install pytest pytest-cov black isort bandit numpy
      - name: Verify exact checkout and changed-file formatter state
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          black --check tests/test_dmaic_phase4_noop_contract_20261013.py tests/test_test_evidence_census.py
          isort --check-only tests/test_dmaic_phase4_noop_contract_20261013.py tests/test_test_evidence_census.py
      - name: Execute source-bound JUnit and coverage
        run: |
          mkdir -p outputs/recovery
          python -m pytest -q tests/test_dmaic_phase4_noop_contract_20261013.py tests/test_test_evidence_census.py \
            --junitxml=outputs/recovery/junit.xml \
            --cov=DMAIC_V3.phases.phase4_improve \
            --cov=scripts.test_evidence_census \
            --cov-report=xml:outputs/recovery/coverage.xml \
            --cov-report=term-missing
      - name: Measure changed executable-line coverage
        run: |
          git fetch --no-tags --depth=100 origin main
          base_sha="$(git merge-base HEAD origin/main)"
          python scripts/measure_changed_line_coverage.py outputs/recovery/coverage.xml "$base_sha" outputs/recovery/diff-coverage.json
      - name: Report all Bandit findings and enforce bounded new-debt census
        run: |
          bandit -q -f json -o outputs/recovery/bandit.json tests/test_dmaic_phase4_noop_contract_20261013.py tests/test_test_evidence_census.py || scan_rc=$?
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          report=json.loads(Path('outputs/recovery/bandit.json').read_text())
          tally=Counter(x['test_id'] for x in report.get('results',[]))
          print('Full Bandit report retained. Finding census:',dict(sorted(tally.items())))
          # B101 assertions and one subprocess integration remain visible legacy debt.
          # This source-limited testflight is not the independent full security gate.
          if tally.get('B603',0)>1:
              raise SystemExit('Introduced B603 subprocess debt remains')
          if tally.get('B101',0)>46 or tally.get('B404',0)>1 or tally.get('B105',0)>1:
              raise SystemExit('Increased touched-file Bandit debt')
          for key in tally:
              if key not in {'B101','B404','B105','B603'}:
                  raise SystemExit('Unexpected new Bandit finding type: '+key)
          PY
      - name: Write exact-SHA artifact hashes
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          files=['outputs/recovery/junit.xml','outputs/recovery/coverage.xml','outputs/recovery/diff-coverage.json','outputs/recovery/bandit.json']
          receipt={'exact_sha':os.environ['GITHUB_SHA'],
                   'files':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files if Path(p).is_file()},
                   'authority_transfer':False,'formal_credit_delta':0,'engineering_credit_delta':0}
          p=Path('outputs/recovery/receipt.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: abacus-bounded-recovery-evidence
          path: outputs/recovery/
          if-no-files-found: warn
