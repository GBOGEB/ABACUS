name: W26 TestPilot matched behavioral coverage

on:
  pull_request:
    paths:
      - 'scripts/testpilot_preflight.py'
      - 'tests/test_testpilot_adversarial_coverage.py'
      - 'tests/test_testpilot_coverage_compare.py'
      - 'tests/test_testpilot_w27_native_contract.py'
      - 'tools/mip2/testpilot_coverage_compare.py'
      - '.github/workflows/w26-testpilot-matched-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matched-testpilot:
    name: ${{ matrix.os }} Python ${{ matrix.python }} matched coverage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.11'
    steps:
      - name: Checkout source-owned exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up matrix Python interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Verify selected Python minor version
        shell: bash
        env:
          EXPECTED_PYTHON: ${{ matrix.python }}
        run: |
          python -c "import os, sys; assert sys.version_info[:2] == tuple(map(int, os.environ['EXPECTED_PYTHON'].split('.')))"
      - name: Verify exact head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install focused tools
        shell: bash
        run: |
          python -m pip install pytest==9.1.1 coverage==7.16.2 numpy==1.26.4
          python -m pip install PyYAML==6.0.3 tomli==2.2.1 defusedxml==0.7.1
      - name: Test negative coverage receipt semantics
        shell: bash
        run: |
          python -m pytest -q tests/test_testpilot_coverage_compare.py \
            tests/test_testpilot_w27_native_contract.py \
            --junitxml=w26-validator-junit.xml
      - name: Measure baseline on this same exact head
        shell: bash
        run: |
          python -m coverage erase
          python -m coverage run --branch \
            --source=scripts.testpilot_preflight -m pytest -q \
            tests/test_testpilot_receipt_contract.py \
            --junitxml=w26-baseline-junit.xml
          python -m coverage json -o w26-baseline-coverage.json
      - name: Measure expanded test family on identical source
        shell: bash
        run: |
          python -m coverage erase
          python -m coverage run --branch \
            --source=scripts.testpilot_preflight -m pytest -q \
            tests/test_testpilot_receipt_contract.py \
            tests/test_testpilot_adversarial_coverage.py \
            --junitxml=w26-expanded-junit.xml
          python -m coverage json -o w26-expanded-coverage.json
      - name: Fail closed on mismatched denominators or false uplift
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/mip2/testpilot_coverage_compare.py \
            --base-cov w26-baseline-coverage.json \
            --expanded-cov w26-expanded-coverage.json \
            --base-junit w26-baseline-junit.xml \
            --expanded-junit w26-expanded-junit.xml \
            --exact-head "$EXPECTED_SHA" \
            --output w26-matched-coverage.json
      - name: Upload exact-head per-cell receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: w26-${{ matrix.os }}-py${{ matrix.python }}-${{ github.run_id }}-a${{ github.run_attempt }}-${{ github.sha }}
          path: |
            w26-*-junit.xml
            w26-*-coverage.json
          if-no-files-found: error
