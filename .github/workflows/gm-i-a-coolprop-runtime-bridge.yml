name: GM-I-A CoolProp FAST-HEAVY Federation Bridge

on:
  pull_request:
    paths:
      - 'triage/GM_I_A_COOLPROP_RUNTIME_BRIDGE_v1.json'
      - 'scripts/validate_gm_i_a_coolprop_runtime_bridge.py'
      - '.github/workflows/gm-i-a-coolprop-runtime-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consume-provider-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Consume exact CoolProp federation attestation
        run: |
          python scripts/validate_gm_i_a_coolprop_runtime_bridge.py \
            --receipt /tmp/gm_i_a_coolprop_runtime_bridge_receipt.json
      - name: Validate and bind consumer receipt
        run: |
          python -m json.tool /tmp/gm_i_a_coolprop_runtime_bridge_receipt.json > /dev/null
          sha256sum /tmp/gm_i_a_coolprop_runtime_bridge_receipt.json | tee /tmp/GM_I_A_BRIDGE_SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: gm-i-a-coolprop-runtime-bridge-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/gm_i_a_coolprop_runtime_bridge_receipt.json
            /tmp/GM_I_A_BRIDGE_SHA256SUMS
          if-no-files-found: error
