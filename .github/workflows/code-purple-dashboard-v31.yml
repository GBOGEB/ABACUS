name: CODE PURPLE Dashboard V4 Test Observability
on:
  pull_request:
    paths:
      - 'tools/everred_v3/sut_gui/dashboard_v3.html'
      - 'tools/everred_v3/sut_gui/DASHBOARD_V4_TEST_ARCHITECTURE.md'
      - 'tools/everred_v3/sut_gui/test_observability.py'
      - 'tools/everred_v3/sut_gui/tests/test_observability.py'
      - 'tools/everred_v3/sut_gui/visual_taxonomy_v4.json'
      - 'tools/everred_v3/sut_gui/mip_sipoc_adapter_v42.json'
      - 'tools/everred_v3/sut_gui/DASHBOARD_V42_SIPOC_BRIDGE.md'
      - 'tools/everred_v3/sut_gui/telemetry_reference_v5.json'
      - 'tools/everred_v3/sut_gui/TELEMETRY_MEASUREMENT_DAG_V5.mmd'
      - 'tools/everred_v3/sut_gui/DASHBOARD_V44_TELEMETRY_METHOD.md'
      - '.github/workflows/code-purple-dashboard-v31.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-hex source SHA to census read-only
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dashboard-v4-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dashboard-contract:
    name: HTML structure and JavaScript syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify semantic HTML and source-bound controls
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Inspect(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.links = []
                  self.scripts = []
                  self.inside = False
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.append(attrs['id'])
                  if tag == 'a' and attrs.get('href', '').startswith('#'):
                      self.links.append(attrs['href'][1:])
                  if tag == 'script':
                      self.inside = True
              def handle_endtag(self, tag):
                  if tag == 'script':
                      self.inside = False
              def handle_data(self, data):
                  if self.inside:
                      self.scripts.append(data)
          html = Path('tools/everred_v3/sut_gui/dashboard_v3.html').read_text()
          doc = Inspect()
          doc.feed(html)
          required = {
              'scope-target', 'mini-success', 'mini-failure',
              'mini-queue', 'ci-filter', 'ci-family', 'trend-dialog',
              'test-architecture', 'producer-file', 'zoom-chart',
              'producer-metrics', 'expand-trend',
              'ci-search', 'group-duplicates', 'abacus-badges',
              'codex-badges', 'rules-badges', 'rules-explain',
              'rules-list', 'rules-gap', 'pr-badges',
              'arch-hierarchy', 'arch-dag',
              'arch-wireframe', 'pca-live', 'bt-live',
              'mip-register', 'mip-grid', 'mip-overall',
              'sipoc-drawing','sipoc-canvas','sipoc-zoom','sipoc-dialog',
              'sipoc-reference','sipoc-dialog-content',
              'model-proof-register', 'pca-checks', 'bt-checks', 'sipoc',
              'telemetry', 'telemetry-leaves', 'telemetry-method-dag',
              'tel-penetration-bars', 'tel-backlog-bars',
              'load-telemetry-reference', 'telemetry-reference-state'
          }
          assert required.issubset(set(doc.ids))
          assert len(doc.ids) == len(set(doc.ids)), 'duplicate HTML ID'
          assert set(doc.links).issubset(set(doc.ids)), 'broken nav'
          assert 'code-purple.sut-gui.v4.4' in html
          assert 'architecture-legend' in doc.ids
          assert 'arch-loop feedback' in html
          assert 'arch-loop feedforward' in html
          assert 'P7 | CONDITIONAL YES ONLY' in html
          assert 'Copyable Mermaid DAG source: strict forward graph / NO cycles' in html
          assert 'NO / HOLD (red)' in html and 'YES / eligible path (green)' in html
          assert 'Feedback and feedforward (separate control graph, NOT part of the DAG)' in html
          assert 'Cancelled = GitHub' in html
          assert 'Native paired outcome records: UNKNOWN' in html
          assert 'MIP-01' in html and 'MIP-08' in html
          assert 'PCA-01' in html and 'PCA-04' in html
          assert 'BT-01' in html and 'BT-04' in html
          assert 'CODE PURPLE integrated SIPOC' in html
          assert '31 workflows → 121 jobs → 1,065 steps ≠ 1,217 independent process observations' in html
          assert '#2033' in html and '#1998' in html and '#1989' in html
          assert 'Measurement method DAG' in html
          assert 'M2 / M3 remain HOLD' in html
          assert 'SOURCE-BOUND' in html or 'source-bound' in html
          assert len(doc.scripts) == 1, 'expected inline JS'
          Path('/tmp/dashboard-v31.js').write_text(doc.scripts[0])
          PY
          node --check /tmp/dashboard-v31.js
      - name: Assert visual taxonomy color uniqueness and disjoint roles
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('tools/everred_v3/sut_gui')
          taxonomy = json.loads((root / 'visual_taxonomy_v4.json').read_text())
          assert taxonomy['schema'] == 'code-purple.visual-taxonomy.v4'
          assert taxonomy['authority_transfer'] is False
          outcomes = taxonomy['axes']['execution_outcome']['mapping']
          assert len(outcomes) == 6
          colors = [entry['color'] for entry in outcomes.values()]
          assert len(set(colors)) == len(colors), 'native status colors reused'
          axes = taxonomy['axes']
          assert axes['owner']['channel'] == 'role_text'
          assert axes['phase']['channel'] == 'explicit_P_number'
          assert axes['node_function']['channel'] == 'shape'
          assert axes['edge_flow']['channel'] == 'line_style_plus_label'
          assert axes['repository_protection']['channel'] == 'card_border + explicit status text + scoped shield'
          assert axes['workflow_repetition']['channel'] == 'expandable grouped cohort with preserved native run links'
          assert axes['measurement_granularity']['channel'] == 'explicit_level_label'
          assert axes['measurement_granularity']['mapping']['independent_cycle'] == 'CYCLE'
          assert 'do not increase independent process sample size' in axes['measurement_granularity']['guard']
          html = (root / 'dashboard_v3.html').read_text()
          for id in ('trend-dialog','zoom-chart','test-architecture','taxonomy-grid','producer-file','dmaic-list'):
              assert f'id="{id}"' in html
          for token in ('FEEDBACK', 'FEEDFORWARD', 'NO / HOLD', 'YES / eligible path'):
              assert token in html
          assert 'function renderPolicy' in html
          assert 'function protectionDisplay' in html
          assert 'function familyTag' in html
          print('Visual taxonomy disjointness contract PASS')
          PY

      - name: Assert four SIPOC swimlanes and exact adapter cell parity
        run: |
          python - <<'PY'
          import html
          import json
          import re
          from pathlib import Path
          root=Path('tools/everred_v3/sut_gui')
          source=json.loads((root/'mip_sipoc_adapter_v42.json').read_text())
          view=(root/'dashboard_v3.html').read_text()
          rows=source['sipoc']
          assert len(rows)==4
          assert view.count('class="sipoc-lane"')==4
          assert view.count('class="sipoc-transfer"')==3
          assert view.count('data-sipoc-role=')==20
          assert view.count('class="sipoc-key ') == 8
          blocks=[html.unescape(x) for x in re.findall(r'<div class="sipoc-block-body">(.*?)</div>',view,re.S)]
          expected=[row[k] for row in rows for k in ('supplier','input','process','output','customer')]
          assert blocks == expected, 'SIPOC drawing diverged from controlled source adapter'
          assert 'class="sipoc-control feedback"' in view
          assert 'class="sipoc-control feedforward"' in view
          assert 'id="sipoc-reference"' in view
          assert 'id="sipoc-dialog"' in view
          assert 'Enlarge diagram' in view
          print('SIPOC swimlanes PASS: 4 lanes, 20 source-bound cells, 3 handoffs, 2 independent control overlays')
          PY

      - name: Verify MIP/PCA/BT/SIPOC machine-readable action parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('tools/everred_v3/sut_gui')
          d=json.loads((root/'mip_sipoc_adapter_v42.json').read_text())
          html=(root/'dashboard_v3.html').read_text()
          assert d['schema']=='code-purple.mip-sipoc.adapter.v4.2'
          assert d['merge_authorized'] is False and d['authority_transfer'] is False
          assert len(d['mip'])==8 and len(d['pca'])==4 and len(d['bt'])==4 and len(d['sipoc'])==4
          assert len({r['id'] for r in d['mip']})==8
          for group in ('mip','pca','bt'):
              for row in d[group]:
                  assert row['id'] in html, row['id']
          assert 'id="sipoc"' in html
          print('MIP/SIPOC projection parity PASS; native evidence still separately required')
          PY

      - name: Validate telemetry reference, hierarchy and method DAG
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          root = Path('tools/everred_v3/sut_gui')
          ref = json.loads((root / 'telemetry_reference_v5.json').read_text())
          html = (root / 'dashboard_v3.html').read_text()
          dag = (root / 'TELEMETRY_MEASUREMENT_DAG_V5.mmd').read_text()

          assert ref['schema'] == 'code-purple.telemetry-reference.v5'
          assert ref['classification'] == 'SOURCE_BOUND_REFERENCE_NOT_LIVE'
          assert ref['authority_transfer'] is False
          assert ref['merge_authorized'] is False
          assert ref['security_waiver'] is False
          assert ref['independent_process_observations'] is None

          for sha in (
              ref['producer']['head_sha'],
              ref['ci_hierarchy']['source_sha'],
              ref['native_b0']['source_sha'],
              ref['pca']['source_sha'],
              ref['three_p_star']['source_sha'],
          ):
              assert re.fullmatch(r'[a-f0-9]{40}', sha), sha

          ci = ref['ci_hierarchy']
          assert ci['workflows']['observed'] == 31
          assert ci['jobs']['observed'] == 121
          assert ci['steps']['observed'] == 1065
          assert ci['steps']['failure'] == 10

          tests = ref['test_penetration']
          assert tests['b0']['tests'] == 560
          assert tests['post_b0']['tests'] == 2255
          assert tests['overlap_warning'] is True

          cov = ref['coverage_penetration']
          assert cov['b0_statements']['total'] == 21007
          assert cov['union_statements']['total'] == 30153
          assert cov['interpretation'] == 'MEASUREMENT_WIDTH_EXPANSION_NOT_MATCHED_COVERAGE_DELTA'

          assert ref['pca']['small_sample_warning'] is True
          assert ref['pca']['bradley_terry'].startswith('WITHHELD')
          assert ref['three_p_star']['stability_class'] == 'INSUFFICIENT_EVIDENCE'
          assert ref['burndown']['formal_root_closure_credit'] == 0

          for token in ('#2033', '#1998', '#1989', 'M2 / M3 HOLD'):
              assert token in html
          for token in ('#2033 structural telemetry', '#1998 wave burndown', '#1989 cycle-level statistical maturity'):
              assert token in dag
          assert 'Independent governance' in dag
          assert 'MERGE HOLD' in dag
          print('Telemetry reference + measurement DAG PASS')
          PY

      - name: Test normalized evidence producer and empirical model qualifications
        run: |
          python -m compileall -q tools/everred_v3/sut_gui/test_observability.py
          python -m unittest discover -s tools/everred_v3/sut_gui/tests -p 'test_observability.py' -q

  native-census:
    name: Read-only exact-SHA test evidence producer
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Obtain versioned exact-source workflow/job census
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid exact SHA'; exit 2; }
          python tools/everred_v3/sut_gui/test_observability.py \
            --repo "$GITHUB_REPOSITORY" --sha "$TARGET_SHA" \
            --run-limit 100 --job-limit 20 \
            --out tools/everred_v3/sut_gui/evidence/latest.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('tools/everred_v3/sut_gui/evidence/latest.json').read_text())
          assert data['schema'] == 'code-purple.test-observability.v1'
          assert data['repo'] == os.environ['GITHUB_REPOSITORY']
          assert data['source_sha'] == os.environ['TARGET_SHA']
          assert data['provenance'] == 'GITHUB_API_METADATA_ONLY'
          assert data['authority_transfer'] is False
          assert data['merge_authorized'] is False
          assert data['runs']['observed'] > 0
          print('Observational producer only, NOT coverage or admission PASS')
          PY
      - name: Publish observational JSON to workflow artifacts, never push
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: code-purple-test-observability-${{ inputs.target_sha }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: tools/everred_v3/sut_gui/evidence/latest.json
