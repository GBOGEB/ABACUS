name: OSV-Scanner

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  scan-pr:
    name: OSV Scan (PR — blocks on new vulns)
    # yamllint disable-line rule:line-length
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36"  # v2.7.0
    with:
      scan-args: |-
        -r
        ./
    permissions:
      security-events: write
      contents: read
      actions: read
