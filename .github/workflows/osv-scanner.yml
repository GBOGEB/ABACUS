name: OSV-Scanner

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  scan-pr:
    name: OSV Scan (PR — blocks on new vulns)
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67" # v2.5.1
    with:
      scan-args: |-
        -r
        --skip-git
        ./
    permissions:
      security-events: write
      contents: read
      actions: read
