name: OSV-Scanner

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  scan-pr:
    name: OSV Scan (PR — blocks on new vulns)
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc" # v2.6.0
    with:
      scan-args: |-
        -r
        --skip-git
        ./
    permissions:
      security-events: write
      contents: read
      actions: read
