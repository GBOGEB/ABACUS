name: OSV-Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # Monday 06:00 UTC

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  scan-scheduled:
    name: OSV Scan (push / schedule)
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    # Reusable workflow — handles SARIF upload internally
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v1.9.2"
    with:
      scan-args: |-
        -r
        --skip-git
        ./
    permissions:
      security-events: write
      contents: read
      actions: read

  scan-pr:
    name: OSV Scan (PR — blocks on new vulns)
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v1.9.2"
    with:
      scan-args: |-
        -r
        --skip-git
        ./
    permissions:
      security-events: write
      contents: read
      actions: read
