name: TestPilot Pre-GitHub Parity

on:
  pull_request:
    paths:
      - 'scripts/testpilot_preflight.py'
      - 'scripts/cbd_e2e_stage.py'
      - 'tests/test_cbd_e2e_stage.py'
      - 'scripts/testpilot.ps1'
      - '.pre-commit-config.yaml'
      - 'requirements-dev.txt'
      - 'Makefile'
      - 'docs/ci/TESTPILOT_PREFLIGHT.md'
      - '.github/workflows/testpilot-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/testpilot_preflight.py'
      - 'scripts/testpilot.ps1'
      - '.pre-commit-config.yaml'
      - 'requirements-dev.txt'
      - 'Makefile'
      - 'docs/ci/TESTPILOT_PREFLIGHT.md'
      - '.github/workflows/testpilot-preflight.yml'
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install developer dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run bounded TestPilot fast preflight
        run: python scripts/testpilot_preflight.py --mode fast --parity
      - name: Replay pre-push source-bound checks on exact GitHub head
        if: always()
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/cbd_e2e_stage.py --stage checkout \
            --expected-sha "$EXPECTED_SHA" \
            --receipt .testpilot/e2e/github_checkout.json

      - name: Isolated fresh local Git clone and equivalent testflight
        if: always()
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/cbd_e2e_stage.py --stage replay \
            --expected-sha "$EXPECTED_SHA" \
            --receipt .testpilot/e2e/fresh_clone.json

      - name: Exact-source N-to-N+1 replay comparison
        if: always()
        run: |
          python scripts/cbd_e2e_stage.py --stage compare \
            --before .testpilot/e2e/github_checkout.json \
            --after .testpilot/e2e/fresh_clone.json \
            --receipt .testpilot/e2e/github_clone_parity.json

      - name: Upload TestPilot receipt
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: testpilot-receipt-${{ github.sha }}
          path: .testpilot/
          if-no-files-found: error
