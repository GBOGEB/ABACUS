name: Inventory Scan
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt || true
      # Bridge: runners/dmaic_runner.py dispatches to tools/root_refactor/inventory.py
      # (root-file family inventory). Writes ROOT_INVENTORY.csv + summary to
      # DMAIC_V3_OUTPUT/inventory/; exits 1 while any root file is UNCLASSIFIED.
      - name: Run inventory scan (tools/root_refactor/inventory.py)
        run: |
          python runners/dmaic_runner.py --action inventory --output-dir DMAIC_V3_OUTPUT/inventory
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inventory-results
          path: DMAIC_V3_OUTPUT/inventory/
          if-no-files-found: error
