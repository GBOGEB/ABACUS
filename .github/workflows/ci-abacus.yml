name: CI - ABACUS Matrix

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: ABACUS CI proof planner
    if: github.repository == 'GBOGEB/ABACUS'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      mode: ${{ steps.plan.outputs.mode }}
      reason: ${{ steps.plan.outputs.reason }}
      secondary: ${{ steps.plan.outputs.secondary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify change risk and select Python proof
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          mode="full"
          reason="non-PR events retain full compatibility recertification"
          secondary="3.10"

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            mapfile -t changed < <(
              git diff --name-only "${BASE_SHA}" "${HEAD_SHA}"
            )
            compatibility_sensitive=false
            python_delta=false

            for path in "${changed[@]}"; do
              case "${path}" in
                .github/workflows/*|.github/actions/*)
                  compatibility_sensitive=true
                  ;;
                requirements.txt|*/requirements.txt)
                  compatibility_sensitive=true
                  ;;
                requirements/*.txt|*/requirements/*.txt)
                  compatibility_sensitive=true
                  ;;
                requirements-*.txt|*/requirements-*.txt)
                  compatibility_sensitive=true
                  ;;
                constraints*.txt|*/constraints*.txt)
                  compatibility_sensitive=true
                  ;;
                pyproject.toml|*/pyproject.toml)
                  compatibility_sensitive=true
                  ;;
                setup.py|*/setup.py|setup.cfg|*/setup.cfg)
                  compatibility_sensitive=true
                  ;;
                tox.ini|*/tox.ini|noxfile.py|*/noxfile.py)
                  compatibility_sensitive=true
                  ;;
                Pipfile|*/Pipfile|Pipfile.lock|*/Pipfile.lock)
                  compatibility_sensitive=true
                  ;;
                poetry.lock|*/poetry.lock|uv.lock|*/uv.lock)
                  compatibility_sensitive=true
                  ;;
                .python-version|*/.python-version)
                  compatibility_sensitive=true
                  ;;
                governance/dab/*|governance/proposals/*)
                  compatibility_sensitive=true
                  ;;
                scripts/dab_flake8_census.py|scripts/dab_proposal_queue.py)
                  compatibility_sensitive=true
                  ;;
                scripts/proposal_compatibility.py|scripts/ci_matrix_proof_audit.py)
                  compatibility_sensitive=true
                  ;;
                *.py|*.pyi|scripts/*|tests/*|src/*|abacus/*|qplant/*)
                  python_delta=true
                  ;;
              esac
            done

            if [[ "${compatibility_sensitive}" == "true" ]]; then
              mode="full"
              reason="dependency, packaging, interpreter, shared action, or "
              reason+="this CI workflow changed"
            elif [[ "${python_delta}" == "true" ]]; then
              mode="sampled"
              if (( ${PR_NUMBER:-0} % 2 == 0 )); then
                secondary="3.10"
              else
                secondary="3.11"
              fi
              reason="Python changed: run 3.12 sentinel plus deterministic "
              reason+="compatibility sample"
            else
              mode="sentinel"
              reason="no Python compatibility-sensitive delta: run 3.12 "
              reason+="sentinel; full matrix is recertified after merge "
              reason+="and weekly"
            fi

            {
              echo "### ABACUS CI proof plan"
              echo
              echo "- event: \`${EVENT_NAME}\`"
              echo "- mode: \`${mode}\`"
              echo "- reason: ${reason}"
              echo "- changed files: ${#changed[@]}"
              echo
              if [[ "${mode}" == "sentinel" ]]; then
                echo "- Python 3.12: **EXECUTED / SENTINEL**"
                echo "- Python 3.10: DEFERRED; recertify main/schedule"
                echo "- Python 3.11: DEFERRED; recertify main/schedule"
              elif [[ "${mode}" == "sampled" ]]; then
                echo "- Python 3.12: **EXECUTED / SENTINEL**"
                echo "- Python ${secondary}: EXECUTED compatibility sample"
                if [[ "${secondary}" == "3.10" ]]; then
                  echo "- Python 3.11: DEFERRED; recertify main/schedule"
                else
                  echo "- Python 3.10: DEFERRED; recertify main/schedule"
                fi
              else
                echo "- Python 3.10 / 3.11 / 3.12: **EXECUTED / FULL_MATRIX**"
              fi
              echo
              echo "<details><summary>Changed paths</summary>"
              echo
              for path in "${changed[@]:0:100}"; do
                echo "- \`${path}\`"
              done
              if (( ${#changed[@]} > 100 )); then
                echo "- ... $(("${#changed[@]}" - 100)) more"
              fi
              echo
              echo "</details>"
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "### ABACUS CI proof plan"
              echo
              echo "- event: \`${EVENT_NAME}\`"
              echo "- mode: **full**"
              echo "- Python 3.10 / 3.11 / 3.12: **EXECUTED / FULL_MATRIX**"
              echo "- reason: ${reason}"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          case "${mode}" in
            sentinel)
              matrix='{"include":[{"os":"ubuntu-24.04","python-version":"3.12","proof-role":"sentinel"}]}'
              ;;
            sampled)
              matrix="{\"include\":[{\"os\":\"ubuntu-24.04\",\"python-version\":\"3.12\",\"proof-role\":\"sentinel\"},{\"os\":\"ubuntu-24.04\",\"python-version\":\"${secondary}\",\"proof-role\":\"compatibility-sample\"}]}"
              ;;
            full)
              matrix='{"include":[{"os":"ubuntu-24.04","python-version":"3.10","proof-role":"full-matrix"},{"os":"ubuntu-24.04","python-version":"3.11","proof-role":"full-matrix"},{"os":"ubuntu-24.04","python-version":"3.12","proof-role":"full-matrix"}]}'
              ;;
            *)
              echo "::error::Unknown CI proof mode: ${mode}"
              exit 1
              ;;
          esac

          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"
          echo "secondary=${secondary}" >> "${GITHUB_OUTPUT}"

  abacus:
    name: ABACUS - ${{ matrix.os }} - Python ${{ matrix.python-version }}
    if: github.repository == 'GBOGEB/ABACUS'
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Record proof role
        shell: bash
        run: |
          {
            echo "### Python ${{ matrix.python-version }} proof"
            echo
            echo "- runner: \`${{ matrix.os }}\`"
            echo "- role: \`${{ matrix.proof-role }}\`"
            echo "- planner mode: \`${{ needs.plan.outputs.mode }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure pip mirrors (optional)
        run: |
          mkdir -p ~/.config/pip
          {
            echo "[global]"
            if [ -n "${{ secrets.PIP_INDEX_URL }}" ]; then
              echo "index-url = ${{ secrets.PIP_INDEX_URL }}"
            fi
            if [ -n "${{ secrets.PIP_EXTRA_INDEX_URL }}" ]; then
              echo "extra-index-url = ${{ secrets.PIP_EXTRA_INDEX_URL }}"
            fi
            if [ -n "${{ secrets.PIP_TRUSTED_HOST }}" ]; then
              echo "trusted-host = ${{ secrets.PIP_TRUSTED_HOST }}"
            fi
            if [ -n "${{ secrets.PIP_CERT }}" ]; then
              echo "cert = ${{ secrets.PIP_CERT }}"
            fi
          } > ~/.config/pip/pip.conf

      - name: Install tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          if [[ "${{ matrix.python-version }}" != "3.10" ]]; then
            python -m pip install .
          else
            echo "Python 3.10 is a source-tree compatibility proof;"
            echo "pyproject requires >=3.11."
          fi

      - name: Run pre-commit hooks
        shell: bash
        run: |
          # rex-allow: advisory formatter/lint hook.
          # Correctness is gated separately below.
          pre-commit run --all-files || echo "Pre-commit advisory completed"

          if ! git diff --quiet || ! git diff --cached --quiet; then
            {
              echo
              echo "#### Advisory pre-commit mutations"
              echo
              echo "Pre-commit modified tracked files in the ephemeral runner."
              echo "Those advisory mutations are restored before"
              echo "coverage diffing."
              echo
              git status --short
            } >> "${GITHUB_STEP_SUMMARY}"
            git restore --staged --worktree .
          fi

      - name: Run canonical coverage and emit governed evidence
        id: canonical_coverage
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="test_reports/python-${{ matrix.python-version }}"
          mkdir -p "${evidence_dir}"

          pytest_rc=0
          python -m pytest -p scripts.pytest_test_state_plugin -v \
            --govern-test-states \
            --benchmark-disable \
            --cov=. \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:"${evidence_dir}/coverage.xml" \
            --junitxml="${evidence_dir}/junit.xml" \
            || pytest_rc=$?

          census_rc=0
          python scripts/test_evidence_census.py \
            --junit "${evidence_dir}/junit.xml" \
            --out "${evidence_dir}/test-evidence.json" \
            --max-skips 17 \
            --max-xfails 0 \
            || census_rc=$?

          python -m coverage json \
            --show-contexts \
            -o "${evidence_dir}/coverage-contexts.json"

          python scripts/coverage_dab_census.py \
            --coverage-json "${evidence_dir}/coverage-contexts.json" \
            --criticality governance/coverage/criticality_manifest.json \
            --matrix-baseline \
            governance/coverage/python_matrix_baseline_20261001.json \
            --test-evidence "${evidence_dir}/test-evidence.json" \
            --exact-sha "${GITHUB_SHA}" \
            --out "${evidence_dir}/coverage-dab.json"

          diff_rc=0
          python -m pip install "diff-cover>=9,<10"
          git fetch --no-tags origin main:refs/remotes/origin/main
          diff-cover "${evidence_dir}/coverage.xml" \
            --compare-branch=origin/main \
            --fail-under=80 \
            || diff_rc=$?

          if (( pytest_rc != 0 )); then
            echo "::error::pytest failed with exit code ${pytest_rc};"
            echo "::error::evidence was preserved."
            exit "${pytest_rc}"
          fi
          if (( census_rc != 0 )); then
            echo "::error::test evidence ratchet failed;"
            echo "::error::see test-evidence.json."
            exit "${census_rc}"
          fi
          if (( diff_rc != 0 )); then
            echo "::error::changed-line coverage is below the 80% B9 floor."
            exit "${diff_rc}"
          fi

      - name: Run functional compatibility proof
        id: functional_compatibility
        if: matrix.python-version != '3.12'
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="test_reports/python-${{ matrix.python-version }}"
          mkdir -p "${evidence_dir}"

          pytest_rc=0
          python -m pytest -p scripts.pytest_test_state_plugin -v \
            --govern-test-states \
            --benchmark-disable \
            --junitxml="${evidence_dir}/junit.xml" \
            || pytest_rc=$?

          census_rc=0
          python scripts/test_evidence_census.py \
            --junit "${evidence_dir}/junit.xml" \
            --out "${evidence_dir}/test-evidence.json" \
            --max-skips 17 \
            --max-xfails 0 \
            || census_rc=$?

          if (( pytest_rc != 0 )); then
            echo "::error::pytest failed with exit code ${pytest_rc};"
            echo "::error::evidence was preserved."
            exit "${pytest_rc}"
          fi
          if (( census_rc != 0 )); then
            echo "::error::test evidence ratchet failed;"
            echo "::error::see test-evidence.json."
            exit "${census_rc}"
          fi

      - name: Upload governed test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-py${{ matrix.python-version }}-${{ github.sha }}
          path: test_reports/python-${{ matrix.python-version }}/
          if-no-files-found: warn

      - name: Run truthful Phase0 smoke proof
        id: phase0
        if: matrix.python-version == '3.12'
        run: |
          set -euo pipefail
          evidence_dir="test_reports/python-${{ matrix.python-version }}"
          python scripts/runners/phase0_runner.py --smoke \
            --receipt "${evidence_dir}/phase0-smoke.json"

      - name: Test QPS W08 DOW contract (fail closed)
        id: qps_w08
        if: matrix.python-version == '3.12'
        run: python -m pytest -q tests/test_qps_w08_coverage_graph_request.py

      - name: Recursive build smoke test
        id: recursive_build
        run: |
          python scripts/recursive_build.py --smoke --index GLOBAL_index.json

      - name: Detect artifact payload
        id: artifact_payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(data/output/* logs/*)
          if [[ -f governance/session_trace/session_trace.jsonl ]]; then
            files+=(governance/session_trace/session_trace.jsonl)
          fi

          if (( ${#files[@]} > 0 )); then
            echo "present=true" >> "${GITHUB_OUTPUT}"
            {
              echo
              echo "#### Artifact payload"
              echo
              echo "Uploading ${#files[@]} matching artifact path(s)."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            {
              echo
              echo "#### Artifact payload"
              echo
              echo "No runtime artifact payload was produced by this job;"
              echo "upload intentionally skipped without warning."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload artifacts
        id: artifact_upload
        if: steps.artifact_payload.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: abacus-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            data/output/*
            governance/session_trace/session_trace.jsonl
            logs/*
          if-no-files-found: error

      - name: Write Python proof manifest
        if: always()
        shell: bash
        env:
          VERSION: ${{ matrix.python-version }}
          PROOF_ROLE: ${{ matrix.proof-role }}
          MODE: ${{ needs.plan.outputs.mode }}
          CANONICAL: ${{ steps.canonical_coverage.outcome }}
          FUNCTIONAL: ${{ steps.functional_compatibility.outcome }}
          PHASE0: ${{ steps.phase0.outcome }}
          QPS_W08: ${{ steps.qps_w08.outcome }}
          RECURSIVE: ${{ steps.recursive_build.outcome }}
          PAYLOAD_PRESENT: ${{ steps.artifact_payload.outputs.present }}
          ARTIFACT_UPLOAD: ${{ steps.artifact_upload.outcome }}
        run: |
          set -euo pipefail
          mkdir -p test_reports/proof-manifests
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]

          def classify(outcome: str, required: bool) -> str:
              if required:
                  if outcome == "success":
                      return "EXECUTED_PASS"
                  return "UNCLASSIFIED_" + (outcome or "MISSING").upper()
              if outcome == "skipped":
                  return "CLASSIFIED_ROLE_SKIP"
              if outcome == "success":
                  return "EXECUTED_PASS"
              return "UNCLASSIFIED_" + (outcome or "MISSING").upper()

          checks = {
              "canonical_coverage": classify(
                  os.environ.get("CANONICAL", ""),
                  version == "3.12",
              ),
              "functional_compatibility": classify(
                  os.environ.get("FUNCTIONAL", ""),
                  version != "3.12",
              ),
              "phase0": classify(
                  os.environ.get("PHASE0", ""),
                  version == "3.12",
              ),
              "qps_w08": classify(
                  os.environ.get("QPS_W08", ""),
                  version == "3.12",
              ),
              "recursive_build": classify(
                  os.environ.get("RECURSIVE", ""),
                  True,
              ),
          }
          if os.environ.get("PAYLOAD_PRESENT") == "true":
              checks["artifact_upload"] = classify(
                  os.environ.get("ARTIFACT_UPLOAD", ""),
                  True,
              )
          else:
              checks["artifact_upload"] = "OPTIONAL_NO_PAYLOAD"

          payload = {
              "schema": "abacus-python-proof-manifest/1.0.0",
              "exact_sha": os.environ["GITHUB_SHA"],
              "python_version": version,
              "proof_role": os.environ["PROOF_ROLE"],
              "planner_mode": os.environ["MODE"],
              "checks": checks,
          }
          out = Path(
              f"test_reports/proof-manifests/python-{version}-proof.json"
          )
          out.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Python proof manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-manifest-py${{ matrix.python-version }}-${{ github.sha }}
          path: test_reports/proof-manifests/
          if-no-files-found: error

  proof-completeness:
    name: Python proof completeness
    if: always() && github.repository == 'GBOGEB/ABACUS'
    needs:
      - plan
      - abacus
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download Python proof manifests
        uses: actions/download-artifact@v8
        with:
          pattern: proof-manifest-py*-${{ github.sha }}
          path: test_reports/proof-manifests
          merge-multiple: true

      - name: Audit executed and classified-skipped proof roles
        run: |
          set -euo pipefail
          python scripts/ci_matrix_proof_audit.py \
            --dir test_reports/proof-manifests \
            --mode "${{ needs.plan.outputs.mode }}" \
            --secondary "${{ needs.plan.outputs.secondary }}" \
            --out test_reports/python-proof-audit.json

      - name: Publish proof completeness summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          p = json.loads(
              Path("test_reports/python-proof-audit.json").read_text()
          )
          print("### Python proof completeness")
          print()
          print(f"- status: **{p['status']}**")
          print(f"- mode: `{p['mode']}`")
          for row in p["versions"]:
              print(f"- Python {row['python']}:")
              for name, value in row["checks"].items():
                  print(f"  - {name}: `{value}`")
          if p["errors"]:
              print("- proof debt:")
              for error in p["errors"]:
                  print(f"  - `{error}`")
          PY

      - name: Upload proof completeness receipt
        uses: actions/upload-artifact@v7
        with:
          name: python-proof-audit-${{ github.sha }}
          path: test_reports/python-proof-audit.json
          if-no-files-found: error

  compatibility-gate:
    name: ABACUS compatibility gate
    if: always() && github.repository == 'GBOGEB/ABACUS'
    needs:
      - plan
      - abacus
      - proof-completeness
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce selected proof set
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MATRIX_RESULT: ${{ needs.abacus.result }}
          PROOF_COMPLETENESS: ${{ needs.proof-completeness.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          REASON: ${{ needs.plan.outputs.reason }}
        run: |
          {
            echo "### ABACUS compatibility gate"
            echo
            echo "- planner: \`${PLAN_RESULT}\`"
            echo "- selected matrix: \`${MATRIX_RESULT}\`"
            echo "- proof completeness: \`${PROOF_COMPLETENESS}\`"
            echo "- mode: \`${MODE}\`"
            echo "- reason: ${REASON}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${PLAN_RESULT}" != "success" ||
                "${MATRIX_RESULT}" != "success" ||
                "${PROOF_COMPLETENESS}" != "success" ]]; then
            msg="ABACUS compatibility proof did not complete successfully."
            echo "::error::${msg}"
            exit 1
          fi

  benchmark-baseline:
    name: Benchmark baseline - Python 3.12 - no coverage
    if: github.repository == 'GBOGEB/ABACUS'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install benchmark dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run isolated microbenchmarks
        run: |
          set -euo pipefail
          mkdir -p test_reports/benchmark
          docker_benchmark="tests/test_docker_integration.py::"
          docker_benchmark+="TestDockerConfiguration::"
          docker_benchmark+="test_dockerfile_layer_optimization"
          performance_benchmark="tests/test_integration.py::"
          performance_benchmark+="TestPerformanceBenchmarks::"
          performance_benchmark+="test_bootstrap_computation_speed"
          python -m pytest -q \
            --benchmark-only \
            --benchmark-min-rounds=50 \
            --benchmark-json=test_reports/benchmark/benchmark.json \
            "${docker_benchmark}" \
            "${performance_benchmark}"

          python - <<'PY'
          import json
          import platform
          import subprocess
          import sys
          from pathlib import Path

          receipt = {
              "schema": "abacus-benchmark-baseline/1.0.0",
              "status": "BASELINE_ONLY_NO_REGRESSION_CLAIM",
              "commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "python": sys.version,
              "platform": platform.platform(),
              "coverage_enabled": False,
              "minimum_rounds": 50,
              "benchmark_json": "benchmark.json",
              "authority_transfer": False,
              "formal_credit_delta": 0,
              "engineering_credit_delta": 0,
          }
          Path("test_reports/benchmark/receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload benchmark baseline
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-baseline-${{ github.sha }}
          path: test_reports/benchmark/
          if-no-files-found: error

  runner-migration-canary:
    name: Runner migration canary - ubuntu-latest - Python 3.12
    if: github.event_name == 'schedule' && github.repository == 'GBOGEB/ABACUS'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install canary tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .
          pip install pytest pyyaml

      - name: Run migration-sensitive smoke proof
        run: |
          python -m pytest -q tests/test_qps_w08_coverage_graph_request.py
          python scripts/recursive_build.py --smoke --index GLOBAL_index.json
