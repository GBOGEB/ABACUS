name: Post-Merge PR Summary

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  checks: read
  actions: read
  pull-requests: write

jobs:
  summarize-merged-pr:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Qualify fail-closed summary classifier
        run: node --test scripts/tests/post_merge_summary.test.cjs

      - name: Publish merged PR quality summary
        uses: actions/github-script@v9
        with:
          script: |
            const path = require('node:path');
            const { classify, render } = require(
              path.join(
                process.env.GITHUB_WORKSPACE,
                'scripts/post_merge_summary.cjs'
              )
            );
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = pr.head.sha;
            const mergeSha = pr.merge_commit_sha;
            if (!mergeSha || !/^[0-9a-f]{40}$/.test(mergeSha)) {
              core.setFailed(
                'Merge SHA unavailable: source-bound summary HOLD'
              );
              return;
            }

            // Keep merge-check and PR-head populations separate.
            async function readChecks(sha) {
              const first = await github.rest.checks.listForRef({
                owner, repo, ref: sha, per_page: 100
              });
              const runs = await github.paginate(
                github.rest.checks.listForRef,
                { owner, repo, ref: sha, per_page: 100 }
              );
              return { runs, complete: runs.length >= first.data.total_count };
            }
            const headData = await readChecks(headSha);
            const mergeData = headSha === mergeSha
              ? headData : await readChecks(mergeSha);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100
            });
            const codeChanged = files.some(f =>
              /\.(py|yml|yaml|js|ts|tsx|go|java|rb|rs|cjs)$/i.test(f.filename)
            );
            const versionTouched = files.some(f => {
              const p = f.filename;
              return /(VERSION|CHANGELOG|release|DEPLOYMENT_REPORT)/i.test(p) ||
                /(INTEGRATION_TEST_REPORT)/i.test(p) ||
                /docs\/api\/final_handover_tracker\.json/i.test(p);
            });
            const head = classify(headData.runs, headSha, headData.complete);
            const merge = classify(
              mergeData.runs, mergeSha, mergeData.complete
            );
            const body = render(pr, head, merge, {
              codeChanged, staleRisk: codeChanged && !versionTouched
            });
            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number, body
            });
