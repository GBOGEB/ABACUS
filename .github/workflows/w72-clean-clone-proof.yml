name: W72 Clean Clone Proof

on:
  pull_request:
    paths:
      - '.github/workflows/w72-clean-clone-proof.yml'
      - 'DMAIC_V3/product_version.py'
      - 'pyproject.toml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  clean-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install from clean checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Exercise installed entrypoint
        run: abacus --help >/tmp/abacus-help.txt
      - name: Run package regression suite
        run: python -m pytest DMAIC_V3/tests -q
      - name: Emit clean-clone receipt
        if: success()
        run: |
          mkdir -p architecture/w72/receipts
          python - <<'PY'
          import json, os, platform
          from pathlib import Path
          payload = {
              'schema_version': 'W72-CLEAN-CLONE-1.0.0',
              'status': 'PASS',
              'source_sha': os.environ.get('GITHUB_SHA'),
              'python': platform.python_version(),
              'install': 'python -m pip install . pytest',
              'entrypoint': 'abacus --help',
              'tests': 'python -m pytest DMAIC_V3/tests -q',
              'terminal_item': 'T04_clean_clone_install_build_test',
          }
          p=Path('architecture/w72/receipts/W72_CLEAN_CLONE_RECEIPT.json')
          p.write_text(json.dumps(payload, indent=2)+'\n')
          print(p.read_text())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w72-clean-clone-receipt
          path: architecture/w72/receipts/W72_CLEAN_CLONE_RECEIPT.json
          if-no-files-found: warn
