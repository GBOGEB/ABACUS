name: W72 Clean Clone Proof

on:
  pull_request:
    paths:
      - '.github/workflows/w72-clean-clone-proof.yml'
      - 'DMAIC_V3/product_version.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'DMAIC_V3/requirements.txt'
      - 'tools/w72_receipt_provenance.py'
      - 'tools/w72_testcase_telemetry.py'
      - 'tools/w72_root_watch.py'
      - 'tests/test_w72_receipt_provenance.py'
      - 'tests/test_w72_testcase_telemetry.py'
      - 'tests/test_w72_root_watch.py'
      - 'tests/test_w72_reverse_depth.py'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  clean-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Check W72 source-bound producer and negative controls
        run: |
          python -m unittest discover -s tests -p 'test_w72*.py' -v
      - name: Install from clean checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install -r requirements.txt
      - name: Exercise installed entrypoint
        run: abacus --help >/tmp/abacus-help.txt
      - name: Run package regression suite with testcase evidence
        run: |
          mkdir -p architecture/w72/receipts
          python -m pytest DMAIC_V3/tests -q --junitxml=architecture/w72/receipts/W72_NATIVE_JUNIT.xml
      - name: Preserve testcase evidence on success or failure
        if: always()
        run: |
          if test -f architecture/w72/receipts/W72_NATIVE_JUNIT.xml; then
            python -m tools.w72_testcase_telemetry \
              --junit architecture/w72/receipts/W72_NATIVE_JUNIT.xml \
              --out architecture/w72/receipts/W72_CASES.json
          else
            echo 'No JUnit generated; test collection UNKNOWN, not zero.'
          fi
      - name: Emit exact-checkout-bound clean-clone receipt
        if: success()
        run: |
          python -m tools.w72_receipt_provenance \
            --repo . \
            --event "$GITHUB_EVENT_PATH" \
            --junit architecture/w72/receipts/W72_NATIVE_JUNIT.xml \
            --out architecture/w72/receipts/W72_CLEAN_CLONE_RECEIPT.json \
            --cases-out architecture/w72/receipts/W72_CASES.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: w72-clean-clone-receipt
          path: |
            architecture/w72/receipts/W72_CLEAN_CLONE_RECEIPT.json
            architecture/w72/receipts/W72_CASES.json
            architecture/w72/receipts/W72_NATIVE_JUNIT.xml
          if-no-files-found: warn
