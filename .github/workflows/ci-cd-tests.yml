name: CI/CD Test Suite

on:
  push:
    branches: [main, develop]
    paths:
      - '**/*.py'
      - '!ci/governance/**'
      - 'ci/governance/workflow_policy.json'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'setup.cfg'
      - 'tox.ini'
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/ci-cd-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '**/*.py'
      - '!ci/governance/**'
      - 'ci/governance/workflow_policy.json'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'setup.cfg'
      - 'tox.ini'
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/ci-cd-tests.yml'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  COVERAGE_THRESHOLD: 75

jobs:
  lint-and-format:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy pylint
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi

      - name: Run Black
        run: black --check --diff .

      - name: Run isort
        run: isort --check-only --diff .

      - name: Run Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pylint
        run: pylint **/*.py --exit-zero

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist \
            pytest-asyncio pytest-benchmark 'numpy>=1.21.0,<2.0.0'
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi
        shell: bash

      - name: Run Unit Tests
        shell: bash
        run: |
          junit_path="junit/test-results-${{ matrix.os }}-"
          junit_path+="${{ matrix.python-version }}.xml"
          pytest tests/ -m "not integration" -v --tb=short \
            --junitxml="${junit_path}"
      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: junit/test-results-*.xml

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-benchmark coverage numpy
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi

      - name: Run Tests with Coverage
        run: |
          pytest --benchmark-disable --cov=. \
            --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: Check Coverage Threshold
        run: |
          coverage report --fail-under=${{ env.COVERAGE_THRESHOLD }}

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Upload Coverage HTML
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-format

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-timeout numpy
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi

      - name: Run Integration Tests
        run: |
          pytest tests/test_dow_integration.py -v --tb=short
        timeout-minutes: 15

      - name: Run DMAIC Orchestration Tests
        run: |
          pytest tests/test_dmaic_orchestration.py -v --tb=short
        timeout-minutes: 10

  docker-tests:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-format

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio docker numpy
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi

      - name: Run Docker Tests
        run: |
          pytest tests/test_docker_integration.py -v --tb=short
        timeout-minutes: 20

  performance-tests:
    name: Performance & Benchmark Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-benchmark
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi

      - name: Run Benchmark Tests
        run: |
          pytest -m benchmark --benchmark-only --benchmark-json=benchmark.json

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark.json

  comprehensive-test-suite:
    name: Comprehensive Test Suite
    runs-on: ubuntu-latest
    needs: [lint-and-format, unit-tests]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist pytest-asyncio \
            pytest-benchmark pytest-cov
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi

      - name: Run Comprehensive Tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dashboard
          python -m pytest tests/ --benchmark-disable -q \
            2>&1 | tee test_output.log
          python - <<'PY'
          import html
          import os
          from pathlib import Path

          log = Path("test_output.log").read_text(
              encoding="utf-8",
              errors="replace",
          )
          sha = os.environ.get("GITHUB_SHA", "UNKNOWN")
          body = (
              "<!doctype html><html><head><meta charset='utf-8'>"
              "<title>ABACUS test dashboard</title></head><body>"
              "<h1>ABACUS comprehensive test proof</h1>"
              f"<p>Commit: <code>{html.escape(sha)}</code></p>"
              "<pre>"
              + html.escape(log)
              + "</pre></body></html>\n"
          )
          Path("dashboard/index.html").write_text(
              body,
              encoding="utf-8",
          )
          PY

      - name: Upload Test Output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comprehensive-test-output
          path: test_output.log
          if-no-files-found: error

      - name: Upload Dashboard
        uses: actions/upload-artifact@v7
        with:
          name: test-dashboard
          path: dashboard/
          if-no-files-found: error

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit
        run: bandit -r . -f json -o bandit-report.json

      - name: Run Safety Check
        run: safety check --json > safety-report.json

      - name: Upload Security Reports
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  deploy-dashboard:
    name: Deploy Test Dashboard
    runs-on: ubuntu-latest
    needs: [comprehensive-test-suite, coverage]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Download Dashboard Artifact
        uses: actions/download-artifact@v8
        with:
          name: test-dashboard
          path: dashboard/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
          publish_branch: gh-pages

  notification:
    name: Test Results Notification
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
      - docker-tests
      - coverage
      - performance-tests
    if: always()

    steps:
      - name: Check Test Results
        run: |
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Docker Tests: ${{ needs.docker-tests.result }}"
          echo "Coverage: ${{ needs.coverage.result }}"
          echo "Performance Tests: ${{ needs.performance-tests.result }}"
