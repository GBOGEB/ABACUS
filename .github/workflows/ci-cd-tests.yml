name: CI/CD Test Suite

on:
  push:
    branches: [main, develop]
    paths:
      - '**/*.py'
      - '**/*.pyi'
      - 'ci/governance/workflow_policy.json'
      - 'requirements*.txt'
      # Lint config anywhere in the tree (ci_pr_debt_ratchet.CONFIG_FILES).
      - '**/pyproject.toml'
      - '**/setup.cfg'
      - '**/tox.ini'
      - '**/.flake8'
      - '**/.isort.cfg'
      - '**/.bandit'
      - '**/.editorconfig'
      - '**/.gitignore'
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/ci-cd-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '**/*.py'
      - '**/*.pyi'
      - 'ci/governance/workflow_policy.json'
      - 'requirements*.txt'
      # Lint config anywhere in the tree (ci_pr_debt_ratchet.CONFIG_FILES).
      - '**/pyproject.toml'
      - '**/setup.cfg'
      - '**/tox.ini'
      - '**/.flake8'
      - '**/.isort.cfg'
      - '**/.bandit'
      - '**/.editorconfig'
      - '**/.gitignore'
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/ci-cd-tests.yml'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  COVERAGE_THRESHOLD: 75

jobs:
  lint-and-format:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Depth 2 keeps the PR merge commit's base parent for the
          # red-root delta census; no extra history is fetched otherwise.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy pylint
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi

      - name: Run Black
        id: black
        continue-on-error: true
        shell: bash
        run: |
          out=test_reports/code-quality
          mkdir -p "$out"
          black --check --diff . 2>&1 >"$out/black.diff" |
            tee "$out/black.log"

      - name: Run isort
        id: isort
        continue-on-error: true
        shell: bash
        run: |
          out=test_reports/code-quality
          mkdir -p "$out"
          isort --check-only --diff . 2>&1 >"$out/isort.diff" |
            tee "$out/isort.log"

      - name: Run Flake8
        id: flake8
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p test_reports/code-quality
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics |
            tee test_reports/code-quality/flake8.log

      - name: Run Pylint
        id: pylint
        run: pylint **/*.py --exit-zero

      - name: Census code-quality red-root delta
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          base_args=()
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_args=(--base HEAD^1)
          fi
          python scripts/red_root_delta.py \
            --lane code-quality \
            "${base_args[@]}" \
            --black-log test_reports/code-quality/black.log \
            --isort-log test_reports/code-quality/isort.log \
            --flake8-log test_reports/code-quality/flake8.log \
            --out test_reports/code-quality/red-root-delta.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload code-quality evidence
        if: always()
        # actions/upload-artifact v7.0.1, pinned to the full commit SHA.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: code-quality-evidence-${{ github.sha }}
          path: test_reports/code-quality/
          if-no-files-found: warn

      - name: Per-tool code-quality new-debt ratchet
        id: quality_ratchet
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The event's base.sha goes stale once the base branch moves; the
          # merge commit's first parent is the base tip the PR merges into.
          if git cat-file -e 'HEAD^2^{commit}' 2>/dev/null; then
            base="$(git rev-parse 'HEAD^1')"
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            base="$BASE_SHA"
          fi
          # Run the policy from the PR base rather than untrusted proposed code.
          ratchet="$RUNNER_TEMP/ci_pr_debt_ratchet.py"
          if ! git cat-file -e \
            "$base:scripts/ci_pr_debt_ratchet.py" 2>/dev/null; then
            for tool in black isort flake8; do
              echo "${tool}_full_scan=required" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          git show "$base:scripts/ci_pr_debt_ratchet.py" > "$ratchet"
          for tool in black isort flake8; do
            rc=0
            python -I "$ratchet" --root "$GITHUB_WORKSPACE" \
              --base "$base" --tools "$tool" \
              --summary "$GITHUB_STEP_SUMMARY" || rc=$?
            if [[ "$rc" -eq 3 ]]; then
              # Config/tool changes require a successful full scan.
              echo "${tool}_full_scan=required" >> "$GITHUB_OUTPUT"
            elif [[ "$rc" -ne 0 ]]; then
              echo "::error::Per-tool $tool new-debt ratchet failed (exit $rc)."
              exit "$rc"
            fi
          done

      - name: Enforce code-quality red roots
        if: always()
        shell: bash
        env:
          BLACK: ${{ steps.black.outcome }}
          ISORT: ${{ steps.isort.outcome }}
          FLAKE8: ${{ steps.flake8.outcome }}
          EVENT: ${{ github.event_name }}
          BLACK_FULL_SCAN: ${{ steps.quality_ratchet.outputs.black_full_scan }}
          ISORT_FULL_SCAN: ${{ steps.quality_ratchet.outputs.isort_full_scan }}
          FLAKE8_FULL_SCAN: >-
            ${{ steps.quality_ratchet.outputs.flake8_full_scan }}
        run: |
          {
            echo "### Code-quality full-red surface"
            echo
            echo "- Black: \`$BLACK\`"
            echo "- isort: \`$ISORT\`"
            echo "- Flake8 critical: \`$FLAKE8\`"
            echo "- Pylint: telemetry / exit-zero"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$EVENT" == "pull_request" ]]; then
            failed=0
            for tool in BLACK ISORT FLAKE8; do
              flag_name="${tool}_FULL_SCAN"
              actual="${!tool}"
              fallback="${!flag_name}"
              if [[ "$fallback" == "required" ]]; then
                echo "- ${tool}: config changed; full scan=${actual}" \
                  >> "$GITHUB_STEP_SUMMARY"
                if [[ "$actual" != "success" ]]; then
                  echo "::error::Required ${tool} full scan failed."
                  failed=1
                fi
              else
                echo "- ${tool}: per-tool new-debt ratchet governs" \
                  >> "$GITHUB_STEP_SUMMARY"
              fi
            done
            exit "$failed"
          fi
          if [[ "$BLACK" != "success" ||
                "$ISORT" != "success" ||
                "$FLAKE8" != "success" ]]; then
            echo "::error::One or more code-quality roots are red."
            exit 1
          fi

  ratchet-tool-backed:
    name: DAB T2 tool-installed ratchet detection
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      # Immutable checkout and setup-python references preserve source identity.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned ratchet tools and safe evidence reader
        run: |
          python -m pip install pytest==8.4.2 black==26.10.1 \
            isort==9.0.2 flake8==7.3.0 bandit==1.8.6 \
            defusedxml==0.7.1 numpy==1.26.4
      - name: Prove all four scanners exist and emit exact source
        run: |
          git rev-parse HEAD
          python - <<'PY'
          import importlib.metadata as im
          import importlib.util
          required = ("black", "isort", "flake8", "bandit")
          for name in required:
              if importlib.util.find_spec(name) is None:
                  raise SystemExit("TEST_BLOCKED_DEPENDENCY: " + name)
              print(name + "==" + im.version(name))
          PY
      - name: Run source-owned ratchet negative and positive tests
        run: >-
          python -m pytest -q tests/test_ci_pr_debt_ratchet.py
          --junitxml=ratchet-proof.xml
      - name: Fail closed on skipped, empty or failing tool-backed JUnit
        run: |
          python - <<'PY'
          from pathlib import Path
          from defusedxml import ElementTree as ET
          p = Path("ratchet-proof.xml")
          if not p.is_file():
              raise SystemExit("native tool-backed JUnit missing")
          root = ET.parse(
              p, forbid_dtd=True, forbid_entities=True, forbid_external=True
          ).getroot()
          suites = root.findall("testsuite")
          if root.tag == "testsuite":
              suites = [root]
          if not suites:
              raise SystemExit("no ratchet test suite observed")
          count = sum(int(s.get("tests", "0")) for s in suites)
          skipped = sum(int(s.get("skipped", "0")) for s in suites)
          failed = sum(int(s.get("failures", "0")) for s in suites)
          errors = sum(int(s.get("errors", "0")) for s in suites)
          print(
              f"RATCHET_NATIVE: tests={count} skipped={skipped} "
              f"failures={failed} errors={errors}"
          )
          if not count or skipped or failed or errors:
              raise SystemExit("TEST_BLOCKED_DEPENDENCY_OR_FAILING_RATCHET")
          PY
      - name: Upload exact-head ratchet JUnit even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dab-t2-tool-installed-ratchet
          path: ratchet-proof.xml
          if-no-files-found: warn

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # pyproject.toml requires-python >=3.11; 3.10 is unsupported.
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist \
            pytest-asyncio pytest-benchmark 'numpy>=1.21.0,<2.0.0'
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi
        shell: bash

      - name: Run Unit Tests
        shell: bash
        run: |
          junit_path="junit/test-results-${{ matrix.os }}-"
          junit_path+="${{ matrix.python-version }}.xml"
          pytest tests/ -m "not integration" -v --tb=short \
            --junitxml="${junit_path}"
      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: junit/test-results-*.xml

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v7
        with:
          # Depth 2 keeps the PR merge commit's base parent for the
          # new-line coverage diff.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-benchmark coverage numpy
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi

      - name: Prepare isolated coverage data
        shell: bash
        run: |
          coverage_dir="$RUNNER_TEMP/abacus-broad-coverage"
          mkdir -p "$coverage_dir"
          {
            echo "COVERAGE_FILE=$coverage_dir/.coverage"
            echo "COVERAGE_RCFILE=$GITHUB_WORKSPACE/pyproject.toml"
          } >> "$GITHUB_ENV"

      - name: Run Tests with Coverage
        run: |
          python -m coverage erase
          pytest --benchmark-disable --cov=. \
            --cov-branch \
            --cov-config=pyproject.toml \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing

      - name: Check Coverage Threshold
        id: coverage_threshold
        continue-on-error: true
        run: |
          coverage report --fail-under=${{ env.COVERAGE_THRESHOLD }}

      - name: Record coverage measurement
        if: always()
        run: |
          coverage json -o coverage-summary.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = json.loads(Path("coverage-summary.json").read_text())
          total = p["totals"]
          print("### Broad-suite coverage")
          print()
          print(f"- statements: {total['num_statements']}")
          print(f"- missing: {total['missing_lines']}")
          print(f"- percent: **{total['percent_covered']:.2f}%**")
          print("- threshold: **75%**")
          PY

      - name: Rank broad coverage debt
        if: always()
        run: |
          mkdir -p test_reports/coverage
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("coverage-summary.json")
          data = json.loads(source.read_text(encoding="utf-8"))
          rows = []
          for path, item in data.get("files", {}).items():
              summary = item.get("summary", {})
              statements = int(summary.get("num_statements", 0) or 0)
              missing = int(summary.get("missing_lines", 0) or 0)
              covered = int(summary.get("covered_lines", 0) or 0)
              percent = float(summary.get("percent_covered", 100.0) or 0.0)
              if statements <= 0:
                  continue
              rows.append(
                  {
                      "path": path,
                      "statements": statements,
                      "covered": covered,
                      "missing": missing,
                      "percent_covered": round(percent, 4),
                  }
              )

          rows.sort(
              key=lambda row: (
                  -row["missing"],
                  row["percent_covered"],
                  -row["statements"],
                  row["path"],
              )
          )
          totals = data.get("totals", {})
          payload = {
              "schema": "abacus-broad-coverage-ranking/1.0.0",
              "exact_sha": __import__("os").environ.get(
                  "GITHUB_SHA",
                  "UNKNOWN",
              ),
              "threshold_percent": 75.0,
              "totals": {
                  "statements": int(totals.get("num_statements", 0) or 0),
                  "missing": int(totals.get("missing_lines", 0) or 0),
                  "branches": int(
                      totals.get("num_branches", 0) or 0
                  ),
                  "partial_branches": int(
                      totals.get("num_partial_branches", 0) or 0
                  ),
                  "percent_covered": round(
                      float(totals.get("percent_covered", 0.0) or 0.0),
                      4,
                  ),
              },
              "ranking_rule": (
                  "descending missing executable statements; "
                  "then lower coverage; then larger statement "
                  "count; then path"
              ),
              "files": rows,
          }
          out = Path("test_reports/coverage/broad-coverage-ranking.json")
          out.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          top = rows[:25]
          summary_path = Path(
              __import__("os").environ["GITHUB_STEP_SUMMARY"]
          )
          with summary_path.open("a") as summary:
              summary.write("\n### Broad coverage priority queue\n\n")
              summary.write(
                  "| rank | file | statements | missed | coverage |\n"
                  "|---:|---|---:|---:|---:|\n"
              )
              for idx, row in enumerate(top, 1):
                  summary.write(
                      f"| {idx} | \`{row['path']}\` | {row['statements']} | "
                      f"{row['missing']} | {row['percent_covered']:.2f}% |\n"
                  )
          PY

      - name: Upload broad coverage campaign evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: broad-coverage-ranking-${{ github.sha }}
          path: |
            coverage-summary.json
            test_reports/coverage/broad-coverage-ranking.json
          if-no-files-found: error

      - name: Upload Coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Upload Coverage HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
            coverage-summary.json

      # On a pull request, coverage of the lines the PR adds or changes is
      # measured and reported next to the broad-suite percentage above. No
      # PR threshold is enforced until the owner approves one.
      - name: PR new-line coverage (report)
        id: new_line_coverage
        if: always() && github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The event's base.sha goes stale once the base branch moves; the
          # merge commit's first parent is the base tip the PR merges into.
          if git cat-file -e 'HEAD^2^{commit}' 2>/dev/null; then
            base="$(git rev-parse 'HEAD^1')"
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            base="$BASE_SHA"
          fi
          pip install diff-cover
          diff-cover coverage.xml --compare-branch="$base" \
            --diff-range-notation=.. \
            --format "markdown:diff-coverage.md"
          cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce coverage threshold
        if: always()
        shell: bash
        env:
          THRESHOLD_RESULT: ${{ steps.coverage_threshold.outcome }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            echo "PR coverage is reported, not enforced; broad debt reported."
            exit 0
          fi
          if [[ "$THRESHOLD_RESULT" != "success" ]]; then
            echo "::error::Coverage remains below the governed 75% threshold."
            exit 1
          fi

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    if: always()

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-timeout numpy
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi

      - name: Run Integration Tests
        run: |
          pytest tests/test_dow_integration.py -v --tb=short
        timeout-minutes: 15

      - name: Run DMAIC Orchestration Tests
        run: |
          pytest tests/test_dmaic_orchestration.py -v --tb=short
        timeout-minutes: 10

  docker-tests:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    if: always()

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio docker numpy
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi

      - name: Run Docker Tests
        run: |
          pytest tests/test_docker_integration.py -v --tb=short
        timeout-minutes: 20

  performance-tests:
    name: Performance & Benchmark Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-benchmark
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi

      - name: Run Benchmark Tests
        run: |
          pytest -m benchmark --benchmark-only --benchmark-json=benchmark.json

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark.json

  comprehensive-test-suite:
    name: Comprehensive Test Suite
    runs-on: ubuntu-latest
    needs: [lint-and-format, unit-tests]
    if: always() && needs.unit-tests.result == 'success'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist pytest-asyncio \
            pytest-benchmark pytest-cov
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi

      - name: Run Comprehensive Tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dashboard
          python -m pytest tests/ --benchmark-disable -q \
            2>&1 | tee test_output.log
          python - <<'PY'
          import html
          import os
          from pathlib import Path

          log = Path("test_output.log").read_text(
              encoding="utf-8",
              errors="replace",
          )
          sha = os.environ.get("GITHUB_SHA", "UNKNOWN")
          body = (
              "<!doctype html><html><head><meta charset='utf-8'>"
              "<title>ABACUS test dashboard</title></head><body>"
              "<h1>ABACUS comprehensive test proof</h1>"
              f"<p>Commit: <code>{html.escape(sha)}</code></p>"
              "<pre>"
              + html.escape(log)
              + "</pre></body></html>\n"
          )
          Path("dashboard/index.html").write_text(
              body,
              encoding="utf-8",
          )
          PY

      - name: Upload Test Output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comprehensive-test-output
          path: test_output.log
          if-no-files-found: error

      - name: Upload Dashboard
        uses: actions/upload-artifact@v7
        with:
          name: test-dashboard
          path: dashboard/
          if-no-files-found: error

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Depth 2 keeps the PR merge commit's base parent for the
          # red-root delta census.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "setuptools>=83.0.0"
          python -m pip install "bandit==1.8.6" safety
          python -m pip check
          python -m pip show setuptools nltk

      - name: Run Bandit
        id: bandit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          bandit -r . -f json -o bandit-report.json
          bandit_status=$?
          set -e
          echo "exit_code=$bandit_status" >> "$GITHUB_OUTPUT"
          report_valid=0
          if python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("bandit-report.json").read_text(encoding="utf-8")
          )
          if not isinstance(report, dict):
              raise ValueError("Bandit report must be an object")
          if not isinstance(report.get("results"), list):
              raise ValueError("Bandit report is missing results")
          if not isinstance(report.get("metrics"), dict):
              raise ValueError("Bandit report is missing metrics")
          PY
          then
            report_valid=1
          fi
          if [[ "$bandit_status" -gt 1 || "$report_valid" -ne 1 ]]; then
            echo "scan_error=true" >> "$GITHUB_OUTPUT"
            echo "::error::Bandit scan failed or produced an invalid report."
            exit 2
          fi
          exit "$bandit_status"

      - name: Run Safety Check
        id: safety
        continue-on-error: true
        shell: bash
        run: |
          # Keep Safety's failing exit status; retain diagnostics privately.
          set +e
          safety check --json > safety-report.json 2> safety-stderr.log
          status=$?
          set -e
          echo "Safety exit status: $status" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          try:
              raw = Path("safety-report.json").read_text("utf-8")
              decoder = json.JSONDecoder()
              payload = None
              for index, char in enumerate(raw):
                  if char != "{":
                      continue
                  try:
                      value, _ = decoder.raw_decode(raw[index:])
                  except json.JSONDecodeError:
                      continue
                  if isinstance(value, dict) and isinstance(
                      value.get("report_meta"), dict
                  ):
                      payload = value
                      break
              if payload is None:
                  raise ValueError("missing Safety metadata")
          except (OSError, ValueError):
              print("Safety report parse failed; inspect artifact.")
          else:
              meta = payload["report_meta"]
              found = meta.get("vulnerabilities_found")
              ignored = meta.get("vulnerabilities_ignored")
              found = found if type(found) is int else "UNKNOWN"
              ignored = ignored if type(ignored) is int else "UNKNOWN"
              print(f"Safety findings: {found}; ignored: {ignored}")
          PY
          exit "$status"

      - name: Census security red-root delta
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          base_args=()
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_args=(--base HEAD^1)
          fi
          python scripts/red_root_delta.py \
            --lane security \
            "${base_args[@]}" \
            --bandit-json bandit-report.json \
            --out security-red-root-delta.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            safety-stderr.log
            security-red-root-delta.json
          if-no-files-found: warn

      # On every event, Bandit admission is the new-debt ratchet: changed
      # Python files must not gain Bandit findings. On main pushes,
      # schedules and manual runs the baseline is the previous main tip; the
      # full Bandit scan stays census. Safety is not relaxed: its outcome is
      # enforced on every event.
      - name: New-debt ratchet (Bandit)
        id: bandit_ratchet
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          FORCED_PUSH: ${{ github.event.forced }}
        # The base revision's ratchet runs, as in Code Quality, against the
        # merge commit's first parent rather than the event's stale base.sha.
        run: |
          if [[ "$EVENT" != "pull_request" ]]; then
            base="$(git rev-parse 'HEAD^1')"
            # New and rewritten refs use the first-parent fallback. A normal
            # push must compare with its replaced tip, or fail closed.
            if [[ "$EVENT" == "push" ]]; then
              if [[ "$FORCED_PUSH" != "true" && -n "$BEFORE_SHA" &&
                    ! "$BEFORE_SHA" =~ ^0+$ ]]; then
                if git fetch --no-tags --depth=1 origin "$BEFORE_SHA"; then
                  base="$BEFORE_SHA"
                else
                  echo "::error::Could not fetch previous push tip $BEFORE_SHA."
                  exit 1
                fi
              fi
            fi
          elif git cat-file -e 'HEAD^2^{commit}' 2>/dev/null; then
            base="$(git rev-parse 'HEAD^1')"
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            base="$BASE_SHA"
          fi
          ratchet="$RUNNER_TEMP/ci_pr_debt_ratchet.py"
          if ! git show "$base:scripts/ci_pr_debt_ratchet.py" \
            > "$ratchet" 2>/dev/null; then
            echo "::notice::No ratchet at the base; the full scan decides."
            echo "full_scan=required" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rc=0
          python -I "$ratchet" --root "$GITHUB_WORKSPACE" \
            --base "$base" --tools bandit \
            --summary "$GITHUB_STEP_SUMMARY" || rc=$?
          # Exit 3: Bandit's config, install or invocation changed; the
          # full Bandit scan decides.
          if [[ "$rc" -eq 3 ]]; then
            echo "full_scan=required" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$rc"

      - name: Enforce security red roots
        if: always()
        shell: bash
        env:
          BANDIT: ${{ steps.bandit.outcome }}
          BANDIT_ERROR: ${{ steps.bandit.outputs.scan_error }}
          SAFETY: ${{ steps.safety.outcome }}
          EVENT: ${{ github.event_name }}
          FULL_SCAN: ${{ steps.bandit_ratchet.outputs.full_scan }}
        run: |
          {
            echo "### Security full-red surface"
            echo
            echo "- Bandit: \`$BANDIT\`"
            echo "- Safety: \`$SAFETY\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$BANDIT_ERROR" == "true" ]]; then
            echo "::error::Bandit failed to execute or produce a valid report."
            exit 1
          fi
          if [[ "$FULL_SCAN" != "required" ]]; then
            echo "- Admission (${EVENT}): Bandit ratchet; Safety enforced" \
              >> "$GITHUB_STEP_SUMMARY"
            if [[ "$SAFETY" != "success" ]]; then
              echo "::error::Safety is red."
              exit 1
            fi
            exit 0
          fi
          if [[ "$BANDIT" != "success" || "$SAFETY" != "success" ]]; then
            echo "::error::One or more security roots are red."
            exit 1
          fi

  full-red-summary:
    name: Full Red Proof Summary
    if: always()
    needs:
      - lint-and-format
      - unit-tests
      - coverage
      - integration-tests
      - docker-tests
      - performance-tests
      - comprehensive-test-suite
      - security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Emit full-red summary
        shell: bash
        env:
          LINT: ${{ needs.lint-and-format.result }}
          UNIT: ${{ needs.unit-tests.result }}
          COVERAGE: ${{ needs.coverage.result }}
          INTEGRATION: ${{ needs.integration-tests.result }}
          DOCKER: ${{ needs.docker-tests.result }}
          PERFORMANCE: ${{ needs.performance-tests.result }}
          COMPREHENSIVE: ${{ needs.comprehensive-test-suite.result }}
          SECURITY: ${{ needs.security-scan.result }}
        run: |
          mkdir -p test_reports/full-red
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          results = {
              "lint_and_format": os.environ["LINT"],
              "unit_tests": os.environ["UNIT"],
              "coverage": os.environ["COVERAGE"],
              "integration_tests": os.environ["INTEGRATION"],
              "docker_tests": os.environ["DOCKER"],
              "performance_tests": os.environ["PERFORMANCE"],
              "comprehensive_test_suite": os.environ["COMPREHENSIVE"],
              "security_scan": os.environ["SECURITY"],
          }
          debt = {
              name: value
              for name, value in results.items()
              if value != "success"
          }
          payload = {
              "schema": "abacus-full-red-proof-summary/1.0.0",
              "exact_sha": os.environ["GITHUB_SHA"],
              "results": results,
              "proof_debt": debt,
              "status": "PASS" if not debt else "RED_DEBT_PRESENT",
          }
          Path("test_reports/full-red/summary.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("### Full-red proof summary\n\n")
              for name, value in results.items():
                  out.write(f"- {name}: `{value}`\n")
              out.write(f"- proof-debt jobs: **{len(debt)}**\n")
          if debt:
              raise SystemExit(
                  "full-red proof debt remains: " + ", ".join(debt)
              )
          PY

      - name: Upload full-red summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-red-summary-${{ github.sha }}
          path: test_reports/full-red/summary.json
          if-no-files-found: error

  deploy-dashboard:
    name: Deploy Test Dashboard
    runs-on: ubuntu-latest
    needs: [comprehensive-test-suite, coverage]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Download Dashboard Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: test-dashboard
          path: dashboard/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
          publish_branch: gh-pages

  notification:
    name: Test Results Notification
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
      - docker-tests
      - coverage
      - performance-tests
    if: always()

    steps:
      - name: Check Test Results
        run: |
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Docker Tests: ${{ needs.docker-tests.result }}"
          echo "Coverage: ${{ needs.coverage.result }}"
          echo "Performance Tests: ${{ needs.performance-tests.result }}"
