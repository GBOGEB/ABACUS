name: CI/CD Test Suite

on:
  push:
    branches: [main, develop]
    paths:
      - '**/*.py'
      - '!ci/governance/**'
      - 'ci/governance/workflow_policy.json'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'setup.cfg'
      - 'tox.ini'
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/ci-cd-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '**/*.py'
      - '!ci/governance/**'
      - 'ci/governance/workflow_policy.json'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'setup.cfg'
      - 'tox.ini'
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/ci-cd-tests.yml'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  COVERAGE_THRESHOLD: 75

jobs:
  lint-and-format:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy pylint
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi

      - name: Run Black
        id: black
        continue-on-error: true
        run: black --check --diff .

      - name: Run isort
        id: isort
        continue-on-error: true
        run: isort --check-only --diff .

      - name: Run Flake8
        id: flake8
        continue-on-error: true
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pylint
        id: pylint
        run: pylint **/*.py --exit-zero

      - name: Enforce code-quality red roots
        shell: bash
        env:
          BLACK: ${{ steps.black.outcome }}
          ISORT: ${{ steps.isort.outcome }}
          FLAKE8: ${{ steps.flake8.outcome }}
        run: |
          {
            echo "### Code-quality full-red surface"
            echo
            echo "- Black: \`$BLACK\`"
            echo "- isort: \`$ISORT\`"
            echo "- Flake8 critical: \`$FLAKE8\`"
            echo "- Pylint: telemetry / exit-zero"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$BLACK" != "success" ||
                "$ISORT" != "success" ||
                "$FLAKE8" != "success" ]]; then
            echo "::error::One or more code-quality roots are red."
            exit 1
          fi

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist \
            pytest-asyncio pytest-benchmark 'numpy>=1.21.0,<2.0.0'
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi
        shell: bash

      - name: Run Unit Tests
        shell: bash
        run: |
          junit_path="junit/test-results-${{ matrix.os }}-"
          junit_path+="${{ matrix.python-version }}.xml"
          pytest tests/ -m "not integration" -v --tb=short \
            --junitxml="${junit_path}"
      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: junit/test-results-*.xml

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-benchmark coverage numpy
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi

      - name: Run Tests with Coverage
        run: |
          pytest --benchmark-disable --cov=. \
            --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: Check Coverage Threshold
        id: coverage_threshold
        continue-on-error: true
        run: |
          coverage report --fail-under=${{ env.COVERAGE_THRESHOLD }}

      - name: Record coverage measurement
        if: always()
        run: |
          coverage json -o coverage-summary.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = json.loads(Path("coverage-summary.json").read_text())
          total = p["totals"]
          print("### Broad-suite coverage")
          print()
          print(f"- statements: {total['num_statements']}")
          print(f"- missing: {total['missing_lines']}")
          print(f"- percent: **{total['percent_covered']:.2f}%**")
          print("- threshold: **75%**")
          PY

      - name: Rank broad coverage debt
        if: always()
        run: |
          mkdir -p test_reports/coverage
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("coverage-summary.json")
          data = json.loads(source.read_text(encoding="utf-8"))
          rows = []
          for path, item in data.get("files", {}).items():
              summary = item.get("summary", {})
              statements = int(summary.get("num_statements", 0) or 0)
              missing = int(summary.get("missing_lines", 0) or 0)
              covered = int(summary.get("covered_lines", 0) or 0)
              percent = float(summary.get("percent_covered", 100.0) or 0.0)
              if statements <= 0:
                  continue
              rows.append(
                  {
                      "path": path,
                      "statements": statements,
                      "covered": covered,
                      "missing": missing,
                      "percent_covered": round(percent, 4),
                  }
              )

          rows.sort(
              key=lambda row: (
                  -row["missing"],
                  row["percent_covered"],
                  -row["statements"],
                  row["path"],
              )
          )
          totals = data.get("totals", {})
          payload = {
              "schema": "abacus-broad-coverage-ranking/1.0.0",
              "exact_sha": __import__("os").environ.get(
                  "GITHUB_SHA",
                  "UNKNOWN",
              ),
              "threshold_percent": 75.0,
              "totals": {
                  "statements": int(totals.get("num_statements", 0) or 0),
                  "missing": int(totals.get("missing_lines", 0) or 0),
                  "branches": int(
                      totals.get("num_branches", 0) or 0
                  ),
                  "partial_branches": int(
                      totals.get("num_partial_branches", 0) or 0
                  ),
                  "percent_covered": round(
                      float(totals.get("percent_covered", 0.0) or 0.0),
                      4,
                  ),
              },
              "ranking_rule": (
                  "descending missing executable statements; then lower coverage; "
                  "then larger statement count; then path"
              ),
              "files": rows,
          }
          out = Path("test_reports/coverage/broad-coverage-ranking.json")
          out.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          top = rows[:25]
          summary_path = Path(
              __import__("os").environ["GITHUB_STEP_SUMMARY"]
          )
          with summary_path.open("a") as summary:
              summary.write("\n### Broad coverage priority queue\n\n")
              summary.write(
                  "| rank | file | statements | missed | coverage |\n"
                  "|---:|---|---:|---:|---:|\n"
              )
              for idx, row in enumerate(top, 1):
                  summary.write(
                      f"| {idx} | \`{row['path']}\` | {row['statements']} | "
                      f"{row['missing']} | {row['percent_covered']:.2f}% |\n"
                  )
          PY

      - name: Upload broad coverage campaign evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: broad-coverage-ranking-${{ github.sha }}
          path: |
            coverage-summary.json
            test_reports/coverage/broad-coverage-ranking.json
          if-no-files-found: error

      - name: Upload Coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Upload Coverage HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
            coverage-summary.json

      - name: Enforce coverage threshold
        if: always()
        shell: bash
        env:
          THRESHOLD_RESULT: ${{ steps.coverage_threshold.outcome }}
        run: |
          if [[ "$THRESHOLD_RESULT" != "success" ]]; then
            echo "::error::Coverage remains below the governed 75% threshold."
            exit 1
          fi

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    if: always()

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-timeout numpy
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi

      - name: Run Integration Tests
        run: |
          pytest tests/test_dow_integration.py -v --tb=short
        timeout-minutes: 15

      - name: Run DMAIC Orchestration Tests
        run: |
          pytest tests/test_dmaic_orchestration.py -v --tb=short
        timeout-minutes: 10

  docker-tests:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    if: always()

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio docker numpy
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi

      - name: Run Docker Tests
        run: |
          pytest tests/test_docker_integration.py -v --tb=short
        timeout-minutes: 20

  performance-tests:
    name: Performance & Benchmark Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-benchmark
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi

      - name: Run Benchmark Tests
        run: |
          pytest -m benchmark --benchmark-only --benchmark-json=benchmark.json

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark.json

  comprehensive-test-suite:
    name: Comprehensive Test Suite
    runs-on: ubuntu-latest
    needs: [lint-and-format, unit-tests]
    if: always() && needs.unit-tests.result == 'success'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist pytest-asyncio \
            pytest-benchmark pytest-cov
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi

      - name: Run Comprehensive Tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dashboard
          python -m pytest tests/ --benchmark-disable -q \
            2>&1 | tee test_output.log
          python - <<'PY'
          import html
          import os
          from pathlib import Path

          log = Path("test_output.log").read_text(
              encoding="utf-8",
              errors="replace",
          )
          sha = os.environ.get("GITHUB_SHA", "UNKNOWN")
          body = (
              "<!doctype html><html><head><meta charset='utf-8'>"
              "<title>ABACUS test dashboard</title></head><body>"
              "<h1>ABACUS comprehensive test proof</h1>"
              f"<p>Commit: <code>{html.escape(sha)}</code></p>"
              "<pre>"
              + html.escape(log)
              + "</pre></body></html>\n"
          )
          Path("dashboard/index.html").write_text(
              body,
              encoding="utf-8",
          )
          PY

      - name: Upload Test Output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comprehensive-test-output
          path: test_output.log
          if-no-files-found: error

      - name: Upload Dashboard
        uses: actions/upload-artifact@v7
        with:
          name: test-dashboard
          path: dashboard/
          if-no-files-found: error

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit
        id: bandit
        continue-on-error: true
        run: bandit -r . -f json -o bandit-report.json

      - name: Run Safety Check
        id: safety
        continue-on-error: true
        run: safety check --json > safety-report.json

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
          if-no-files-found: warn

      - name: Enforce security red roots
        if: always()
        shell: bash
        env:
          BANDIT: ${{ steps.bandit.outcome }}
          SAFETY: ${{ steps.safety.outcome }}
        run: |
          {
            echo "### Security full-red surface"
            echo
            echo "- Bandit: \`$BANDIT\`"
            echo "- Safety: \`$SAFETY\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$BANDIT" != "success" || "$SAFETY" != "success" ]]; then
            echo "::error::One or more security roots are red."
            exit 1
          fi

  full-red-summary:
    name: Full Red Proof Summary
    if: always()
    needs:
      - lint-and-format
      - unit-tests
      - coverage
      - integration-tests
      - docker-tests
      - performance-tests
      - comprehensive-test-suite
      - security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Emit full-red summary
        shell: bash
        env:
          LINT: ${{ needs.lint-and-format.result }}
          UNIT: ${{ needs.unit-tests.result }}
          COVERAGE: ${{ needs.coverage.result }}
          INTEGRATION: ${{ needs.integration-tests.result }}
          DOCKER: ${{ needs.docker-tests.result }}
          PERFORMANCE: ${{ needs.performance-tests.result }}
          COMPREHENSIVE: ${{ needs.comprehensive-test-suite.result }}
          SECURITY: ${{ needs.security-scan.result }}
        run: |
          mkdir -p test_reports/full-red
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          results = {
              "lint_and_format": os.environ["LINT"],
              "unit_tests": os.environ["UNIT"],
              "coverage": os.environ["COVERAGE"],
              "integration_tests": os.environ["INTEGRATION"],
              "docker_tests": os.environ["DOCKER"],
              "performance_tests": os.environ["PERFORMANCE"],
              "comprehensive_test_suite": os.environ["COMPREHENSIVE"],
              "security_scan": os.environ["SECURITY"],
          }
          debt = {
              name: value
              for name, value in results.items()
              if value != "success"
          }
          payload = {
              "schema": "abacus-full-red-proof-summary/1.0.0",
              "exact_sha": os.environ["GITHUB_SHA"],
              "results": results,
              "proof_debt": debt,
              "status": "PASS" if not debt else "RED_DEBT_PRESENT",
          }
          Path("test_reports/full-red/summary.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("### Full-red proof summary\n\n")
              for name, value in results.items():
                  out.write(f"- {name}: `{value}`\n")
              out.write(f"- proof-debt jobs: **{len(debt)}**\n")
          if debt:
              raise SystemExit(
                  "full-red proof debt remains: " + ", ".join(debt)
              )
          PY

      - name: Upload full-red summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-red-summary-${{ github.sha }}
          path: test_reports/full-red/summary.json
          if-no-files-found: error

  deploy-dashboard:
    name: Deploy Test Dashboard
    runs-on: ubuntu-latest
    needs: [comprehensive-test-suite, coverage]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Download Dashboard Artifact
        uses: actions/download-artifact@v8
        with:
          name: test-dashboard
          path: dashboard/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
          publish_branch: gh-pages

  notification:
    name: Test Results Notification
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
      - docker-tests
      - coverage
      - performance-tests
    if: always()

    steps:
      - name: Check Test Results
        run: |
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Docker Tests: ${{ needs.docker-tests.result }}"
          echo "Coverage: ${{ needs.coverage.result }}"
          echo "Performance Tests: ${{ needs.performance-tests.result }}"
