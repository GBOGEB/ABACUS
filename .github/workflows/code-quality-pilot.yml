# Code Quality Pilot — REPORT-ONLY (open source).
#
# Adds only what existing ABACUS scanners do not cover:
#   gitleaks (full history) · pip-audit · mypy core · Opengrep rules
# plus a measurement layer that also triages the open alerts already produced by
# CodeQL / Semgrep / Bandit (code-scanning API).
#
# Cadence: daily during burn-in (first BURN_IN_RUNS runs), then Mondays only.
# Burn-in and manual runs add a FOCUSED physics scan and a run-over-run trend.
# Nothing gates a merge; protocol: tools/quality_pilot/README.md
name: Code Quality Pilot

on:
  workflow_dispatch:
    inputs:
      core_paths:
        description: "Space-separated mypy paths (physics + orchestration core)"
        required: false
        default: "models DMAIC_V3/core"
      focus_paths:
        description: "Space-separated paths for the focused (strict) scan"
        required: false
        default: "models"
  pull_request:  # verifies the pilot itself when its own files change
    paths:
      - ".github/workflows/code-quality-pilot.yml"
      - "tools/quality_pilot/**"
  schedule:
    - cron: "17 5 * * *"  # daily 05:17 UTC; cadence thins this after burn-in

permissions:
  contents: read

concurrency:
  group: quality-pilot-${{ github.ref }}
  cancel-in-progress: true

env:
  BURN_IN_RUNS: "10"
  REPORTS: reports
  PILOT_DIR: tools/quality_pilot
  CORE_PATHS: ${{ inputs.core_paths || 'models DMAIC_V3/core' }}
  FOCUS_PATHS: ${{ inputs.focus_paths || 'models' }}

jobs:
  cadence:
    runs-on: ubuntu-latest
    permissions:
      actions: read  # count previous scheduled runs for burn-in window
    outputs:
      run: ${{ steps.decide.outputs.run }}
      phase: ${{ steps.decide.outputs.phase }}
    steps:
      - id: decide
        name: Burn-in daily, then weekly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only scheduled runs consume the burn-in window.
          prev=$(gh run list -R "${{ github.repository }}" \
                   -w code-quality-pilot.yml -e schedule -s completed -L 50 \
                   --json databaseId -q 'length')
          if [ "${{ github.event_name }}" = "schedule" ]; then
            n=$((prev + 1))
          else
            n=$((prev))
          fi
          dow="$(date -u +%u)"   # 1 = Monday
          if [ "$n" -le "$BURN_IN_RUNS" ]; then
            phase=burn-in
          else
            phase=steady
          fi
          if [ "${{ github.event_name }}" != "schedule" ]; then
            run=true; why="manual dispatch"
            [ "$phase" = "steady" ] && phase=manual
          elif [ "$phase" = "burn-in" ]; then
            run=true; why="burn-in scheduled run $n/$BURN_IN_RUNS"
          elif [ "$dow" = "1" ]; then
            run=true; why="weekly (Monday)"
          else
            run=false; why="steady state, not Monday — skipped"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "Cadence: $why · phase=$phase" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  pilot:
    needs: cadence
    if: >-
      needs.cadence.outputs.run == 'true' &&
      github.repository_owner == 'GBOGEB'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read             # burn-in trend: read previous pilot artifacts
      security-events: read     # read existing CodeQL/Semgrep/Bandit alerts
      # No write scopes: this job runs on pull_request. The only write (burn-in
      # issue comment) lives in the `telemetry` job, which never runs on PRs.
    env:
      PHASE: ${{ needs.cadence.outputs.phase }}
      TIMED: tools/quality_pilot/timed.sh
    steps:
      - name: Checkout (full history for gitleaks)
        # actions/checkout v7 (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        # actions/setup-python v7 (pinned)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install mypy pip-audit
          mkdir -p "$REPORTS"
          chmod +x "$TIMED"

      # --- Tier 0 -------------------------------------------------------------
      - name: Secrets across full history (gitleaks, redacted)
        # Report-only pilot; findings are triaged, not gated.
        # rex-allow: ADVISORY_EXPLICIT
        continue-on-error: true
        run: |
          img=ghcr.io/gitleaks/gitleaks:latest
          docker pull -q "$img"
          export TOOL_VERSION="gitleaks $(docker run --rm "$img" version)"
          "$TIMED" gitleaks - docker run --rm -v "$PWD:/repo" "$img" \
            git /repo --redact --exit-code 0 \
            --report-format json --report-path "/repo/$REPORTS/gitleaks.json"

      - name: Dependency CVEs (pip-audit)
        # Report-only CVE baseline; Dependabot owns fixes.
        # rex-allow: ADVISORY_EXPLICIT
        continue-on-error: true
        run: |
          # Audit each requirements file independently.
          export TOOL_VERSION="$(pip-audit --version)"
          rc=0
          for r in requirements.txt requirements-dev.txt \
                   requirements-test.txt; do
            if [ -f "$r" ]; then
              n="${r%.txt}"
              "$TIMED" "pip-audit-$n" - pip-audit -r "$r" -f json \
                -o "$REPORTS/pip-audit-$n.json" --progress-spinner off || rc=$?
            fi
          done
          exit "$rc"

      # --- Tier 1 -------------------------------------------------------------
      - name: Types on core (mypy)
        # Mypy exit 1 means findings; its exit is recorded in telemetry.
        # rex-allow: ADVISORY_EXPLICIT
        continue-on-error: true
        run: |
          export TOOL_VERSION="$(mypy --version)"
          # shellcheck disable=SC2086
          "$TIMED" mypy "$REPORTS/mypy.txt" mypy $CORE_PATHS \
            --ignore-missing-imports --show-error-codes --no-error-summary

      - name: Focused scan — strict types on physics paths (burn-in / manual)
        if: env.PHASE != 'steady'
        # Focused burn-in telemetry is scored separately as mypy-focus.
        # rex-allow: ADVISORY_EXPLICIT
        continue-on-error: true
        run: |
          export TOOL_VERSION="$(mypy --version) strict-focus"
          # shellcheck disable=SC2086
          "$TIMED" mypy-focus "$REPORTS/mypy-focus.txt" mypy $FOCUS_PATHS \
            --ignore-missing-imports --show-error-codes --no-error-summary \
            --check-untyped-defs --warn-unreachable --strict-equality \
            --warn-redundant-casts

      - name: Install Opengrep
        # The summary reports this optional engine as absent if install fails.
        # rex-allow: ADVISORY_EXPLICIT
        continue-on-error: true
        run: |
          installer=https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh
          curl -fsSL "$installer" | bash
          OG="$(command -v opengrep || find "$HOME/.opengrep" -type f \
            -name 'opengrep*' -perm -u+x 2>/dev/null | head -1)"
          test -n "$OG"
          echo "OPENGREP=$OG" >> "$GITHUB_ENV"
          "$OG" --version

      - name: Governance rules self-test (Opengrep)
        # Rule self-test result is reported in the job log.
        # rex-allow: ADVISORY_EXPLICIT
        continue-on-error: true
        run: |
          "$OPENGREP" scan --test "$PILOT_DIR/rules" 2>&1 \
            | tee "$REPORTS/opengrep-selftest.txt"

      - name: Governance rules scan (Opengrep)
        # Report-only pilot; governance precision is measured first.
        # rex-allow: ADVISORY_EXPLICIT
        continue-on-error: true
        run: |
          export TOOL_VERSION="opengrep $("$OPENGREP" --version)"
          "$TIMED" opengrep "$REPORTS/opengrep.json" "$OPENGREP" scan --json \
            --exclude "$PILOT_DIR" -f "$PILOT_DIR/rules/ssot.yml" .

      # --- Existing scanners (read-only) -------------------------------------
      - name: Fetch open code-scanning alerts (CodeQL / Semgrep / Bandit)
        # Read-only enrichment; absent alerts do not hide pilot results.
        # rex-allow: ADVISORY_EXPLICIT
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/code-scanning/alerts"\
            "?state=open&per_page=100" \
            | jq -s 'add' > "$REPORTS/code-scanning.json"

      # --- Measure ----------------------------------------------------------
      - name: Summarize + telemetry + triage sample
        if: always()
        run: |
          python "$PILOT_DIR/pilot_summary.py" summarize "$REPORTS" \
            --sample 20 --seed "${{ github.run_number }}" \
            --run "${{ github.run_number }}" --phase "$PHASE"
          cat "$REPORTS/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Burn-in trend (previous runs' telemetry)
        if: always() && env.PHASE != 'steady'
        # First runs have no history; the trend table says so.
        # rex-allow: ADVISORY_EXPLICIT
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          ids=$(gh run list -R "${{ github.repository }}" \
                  -w code-quality-pilot.yml -s completed -L 15 \
                  --json databaseId -q '.[].databaseId')
          for id in $ids; do
            if gh run download "$id" -R "${{ github.repository }}" \
                -p 'quality-pilot-*' -D "prev/$id" 2>/dev/null; then
              :
            else
              echo "run $id: no pilot artifact (skipped day or expired)"
            fi
          done
          shopt -s nullglob
          python "$PILOT_DIR/pilot_summary.py" trend \
            "$REPORTS/telemetry.json" prev/*/*/telemetry.json \
            --last 12 --out "$REPORTS/trend.md"
          cat "$REPORTS/trend.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Build telemetry digest
        if: always()
        run: |
          {
            echo "<!-- quality-pilot-telemetry -->"
            run_date="$(date -u +%Y-%m-%d)"
            echo "### Quality pilot — run ${{ github.run_number }}" \
              "· ${PHASE} · ${run_date}"
            echo
            cat "$REPORTS/summary.md" 2>/dev/null
            echo
            if [ -f "$REPORTS/trend.md" ]; then
              cat "$REPORTS/trend.md"
              echo
            fi
            echo "<details><summary>Scanner telemetry"
            echo "(tool, seconds, exit, version)</summary>"
            echo
            echo '```'
            cat "$REPORTS/timings.csv" 2>/dev/null
            echo '```'
            echo
            for f in "$REPORTS"/*.stderr; do
              [ -s "$f" ] || continue
              echo "stderr tail — $(basename "$f" .stderr):"
              echo '```'
              tail -n 6 "$f"
              echo '```'
            done
            echo "Opengrep rule self-test (verdict lines):"
            echo '```'
            if [ -s "$REPORTS/opengrep-selftest.txt" ]; then
              grep -iE \
                "mismatch|passed|failed|error|✓|✔|✖|✗|[0-9]+/[0-9]+" \
                "$REPORTS/opengrep-selftest.txt" | tail -n 8
              echo "(self-test output: $(wc -l \
                < "$REPORTS/opengrep-selftest.txt") lines)"
            else
              echo "no self-test output captured"
            fi
            echo '```'
            echo "</details>"
            echo
            run_url="${{ github.server_url }}/${{ github.repository }}"
            run_url="$run_url/actions/runs/${{ github.run_id }}"
            echo "[Run log + artifact]($run_url)"
          } > "$REPORTS/digest.md"

      - name: Telemetry digest to job summary (PR runs post no comment)
        if: always() && github.event_name == 'pull_request'
        run: cat "$REPORTS/digest.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quality-pilot-${{ github.run_number }}
          path: ${{ env.REPORTS }}/
          retention-days: 60

  telemetry:
    # The workflow's only write scope. Never runs on pull_request, so PR runs
    # hold a read-only token end to end: only scheduled or manual runs on main.
    needs: pilot
    if: >-
      always() && needs.pilot.result != 'skipped' &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write             # burn-in telemetry issue comments
    steps:
      - name: Download this run's digest
        # Publishing telemetry must never mask scan results.
        # rex-allow: ADVISORY_EXPLICIT
        continue-on-error: true
        # actions/download-artifact (pinned, as in ariana-cicd.yml)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: quality-pilot-${{ github.run_number }}
          path: ${{ env.REPORTS }}

      - name: Publish telemetry (burn-in issue)
        # Publishing telemetry must never mask scan results.
        # rex-allow: ADVISORY_EXPLICIT
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          body="$REPORTS/digest.md"
          test -s "$body"
          title="Quality pilot — burn-in telemetry"
          num=$(gh api "repos/$REPO/issues?state=open&per_page=100" --paginate \
                  -q ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -z "$num" ]; then
            issue_body="Telemetry digest from each run of"
            issue_body="$issue_body .github/workflows/code-quality-pilot.yml"
            issue_body="$issue_body (protocol: tools/quality_pilot/README.md)."
            issue_body="$issue_body Close when burn-in and triage are done."
            num=$(gh api "repos/$REPO/issues" -f title="$title" \
                    -f body="$issue_body" -q .number)
          fi
          gh api "repos/$REPO/issues/$num/comments" \
            -F body=@"$body" -q .html_url
