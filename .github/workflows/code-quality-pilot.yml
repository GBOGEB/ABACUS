# Code Quality Pilot — REPORT-ONLY (open source).
#
# Adds only what existing ABACUS scanners do not cover:
#   gitleaks (full history) · pip-audit · mypy (physics core) · Opengrep governance rules
# plus a measurement layer that also triages the open alerts already produced by
# CodeQL / Semgrep / Bandit (code-scanning API).
#
# Cadence: daily during burn-in (first BURN_IN_RUNS runs), then Mondays only.
# Burn-in (and manual runs) add a FOCUSED scan on physics paths and a run-over-run
# telemetry trend. Nothing here gates a merge; protocol: tools/quality_pilot/README.md
name: Code Quality Pilot

on:
  workflow_dispatch:
    inputs:
      core_paths:
        description: "Space-separated paths for mypy (physics + orchestration core)"
        required: false
        default: "models DMAIC_V3/core"
      focus_paths:
        description: "Space-separated paths for the focused (strict) scan"
        required: false
        default: "models"
  pull_request:              # verifies the pilot itself when its own files change
    paths:
      - ".github/workflows/code-quality-pilot.yml"
      - "tools/quality_pilot/**"
  schedule:
    - cron: "17 5 * * *"   # daily 05:17 UTC; the cadence job thins this after burn-in

permissions:
  contents: read

concurrency:
  group: quality-pilot-${{ github.ref }}
  cancel-in-progress: true

env:
  BURN_IN_RUNS: "10"
  REPORTS: reports
  PILOT_DIR: tools/quality_pilot
  CORE_PATHS: ${{ inputs.core_paths || 'models DMAIC_V3/core' }}
  FOCUS_PATHS: ${{ inputs.focus_paths || 'models' }}

jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      phase: ${{ steps.decide.outputs.phase }}
    steps:
      - id: decide
        name: Burn-in daily, then weekly
        run: |
          n="${{ github.run_number }}"
          dow="$(date -u +%u)"   # 1 = Monday
          if [ "$n" -le "$BURN_IN_RUNS" ]; then phase=burn-in; else phase=steady; fi
          if [ "${{ github.event_name }}" != "schedule" ]; then
            run=true; why="manual dispatch"
            [ "$phase" = "steady" ] && phase=manual
          elif [ "$phase" = "burn-in" ]; then
            run=true; why="burn-in run $n/$BURN_IN_RUNS"
          elif [ "$dow" = "1" ]; then
            run=true; why="weekly (Monday)"
          else
            run=false; why="steady state, not Monday — skipped"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "Cadence: $why · phase=$phase" | tee -a "$GITHUB_STEP_SUMMARY"

  pilot:
    needs: cadence
    if: needs.cadence.outputs.run == 'true' && github.repository_owner == 'GBOGEB'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read             # burn-in trend: read previous pilot artifacts
      security-events: read     # read existing CodeQL/Semgrep/Bandit alerts
      issues: write             # burn-in telemetry issue comments
      pull-requests: write      # telemetry comment on pilot PRs
    env:
      PHASE: ${{ needs.cadence.outputs.phase }}
      TIMED: tools/quality_pilot/timed.sh
    steps:
      - name: Checkout (full history for gitleaks)
        # actions/checkout v7 (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        # actions/setup-python v7 (pinned)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install mypy pip-audit
          mkdir -p "$REPORTS"
          chmod +x "$TIMED"

      # --- Tier 0 -------------------------------------------------------------
      - name: Secrets across full history (gitleaks, redacted)
        # rex-allow: ADVISORY_EXPLICIT - report-only pilot; findings are triaged, not gated.
        continue-on-error: true
        run: |
          img=ghcr.io/gitleaks/gitleaks:latest
          docker pull -q "$img"
          export TOOL_VERSION="gitleaks $(docker run --rm "$img" version)"
          "$TIMED" gitleaks - docker run --rm -v "$PWD:/repo" "$img" \
            git /repo --redact --exit-code 0 \
            --report-format json --report-path "/repo/$REPORTS/gitleaks.json"

      - name: Dependency CVEs (pip-audit)
        # rex-allow: ADVISORY_EXPLICIT - report-only pilot; CVE baseline, Dependabot owns fixes.
        continue-on-error: true
        run: |
          # Audit each requirements file on its own: run #3 showed the three files
          # cannot be co-resolved (pytest-asyncio pins conflict), which zeroed the baseline.
          export TOOL_VERSION="$(pip-audit --version)"
          rc=0
          for r in requirements.txt requirements-dev.txt requirements-test.txt; do
            if [ -f "$r" ]; then
              n="${r%.txt}"
              "$TIMED" "pip-audit-$n" - pip-audit -r "$r" -f json -o "$REPORTS/pip-audit-$n.json" --progress-spinner off || rc=$?
            fi
          done
          exit "$rc"

      # --- Tier 1 -------------------------------------------------------------
      - name: Types on core (mypy)
        # rex-allow: ADVISORY_EXPLICIT - mypy exit 1 = findings; exit code is recorded in telemetry.
        continue-on-error: true
        run: |
          export TOOL_VERSION="$(mypy --version)"
          # shellcheck disable=SC2086
          "$TIMED" mypy "$REPORTS/mypy.txt" mypy $CORE_PATHS \
            --ignore-missing-imports --show-error-codes --no-error-summary

      - name: Focused scan — strict types on physics paths (burn-in / manual)
        if: env.PHASE != 'steady'
        # rex-allow: ADVISORY_EXPLICIT - focused burn-in telemetry; scored separately as mypy-focus.
        continue-on-error: true
        run: |
          export TOOL_VERSION="$(mypy --version) strict-focus"
          # shellcheck disable=SC2086
          "$TIMED" mypy-focus "$REPORTS/mypy-focus.txt" mypy $FOCUS_PATHS \
            --ignore-missing-imports --show-error-codes --no-error-summary \
            --check-untyped-defs --warn-unreachable --strict-equality --warn-redundant-casts

      - name: Install Opengrep
        # rex-allow: ADVISORY_EXPLICIT - optional engine; summary shows the tool as absent if this fails.
        continue-on-error: true
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
          OG="$(command -v opengrep || find "$HOME/.opengrep" -type f -name 'opengrep*' -perm -u+x 2>/dev/null | head -1)"
          test -n "$OG"
          echo "OPENGREP=$OG" >> "$GITHUB_ENV"
          "$OG" --version

      - name: Governance rules self-test (Opengrep)
        # rex-allow: ADVISORY_EXPLICIT - rule self-test result is reported in the job log.
        continue-on-error: true
        run: |
          "$OPENGREP" scan --test "$PILOT_DIR/rules" | tee "$REPORTS/opengrep-selftest.txt"

      - name: Governance rules scan (Opengrep)
        # rex-allow: ADVISORY_EXPLICIT - report-only pilot; governance precision measured first.
        continue-on-error: true
        run: |
          export TOOL_VERSION="opengrep $("$OPENGREP" --version)"
          "$TIMED" opengrep "$REPORTS/opengrep.json" "$OPENGREP" scan --json \
            --exclude "$PILOT_DIR" -f "$PILOT_DIR/rules/ssot.yml" .

      # --- Existing scanners (read-only) ----------------------------------------
      - name: Fetch open code-scanning alerts (CodeQL / Semgrep / Bandit)
        # rex-allow: ADVISORY_EXPLICIT - read-only enrichment; absent alerts do not hide pilot results.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/code-scanning/alerts?state=open&per_page=100" \
            | jq -s 'add' > "$REPORTS/code-scanning.json"

      # --- Measure --------------------------------------------------------------
      - name: Summarize + telemetry + triage sample
        if: always()
        run: |
          python "$PILOT_DIR/pilot_summary.py" summarize "$REPORTS" \
            --sample 20 --seed "${{ github.run_number }}" \
            --run "${{ github.run_number }}" --phase "$PHASE"
          cat "$REPORTS/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Burn-in trend (previous runs' telemetry)
        if: always() && env.PHASE != 'steady'
        # rex-allow: ADVISORY_EXPLICIT - first runs have no history; the trend table says so.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          ids=$(gh run list -R "${{ github.repository }}" -w code-quality-pilot.yml \
                  -s completed -L 15 --json databaseId -q '.[].databaseId')
          for id in $ids; do
            if gh run download "$id" -R "${{ github.repository }}" -p 'quality-pilot-*' -D "prev/$id" 2>/dev/null; then
              :
            else
              echo "run $id: no pilot artifact (skipped day or expired)"
            fi
          done
          shopt -s nullglob
          python "$PILOT_DIR/pilot_summary.py" trend "$REPORTS/telemetry.json" prev/*/*/telemetry.json \
            --last 12 --out "$REPORTS/trend.md"
          cat "$REPORTS/trend.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Build telemetry digest
        if: always()
        run: |
          {
            echo "<!-- quality-pilot-telemetry -->"
            echo "### Quality pilot — run ${{ github.run_number }} · ${PHASE} · $(date -u +%Y-%m-%d)"
            echo
            cat "$REPORTS/summary.md" 2>/dev/null
            echo
            if [ -f "$REPORTS/trend.md" ]; then cat "$REPORTS/trend.md"; echo; fi
            echo "<details><summary>Scanner telemetry (tool, seconds, exit, version)</summary>"
            echo
            echo '```'
            cat "$REPORTS/timings.csv" 2>/dev/null
            echo '```'
            echo
            for f in "$REPORTS"/*.stderr; do
              [ -s "$f" ] || continue
              echo "stderr tail — $(basename "$f" .stderr):"
              echo '```'
              tail -n 6 "$f"
              echo '```'
            done
            echo "Opengrep rule self-test:"
            echo '```'
            tail -n 8 "$REPORTS/opengrep-selftest.txt" 2>/dev/null
            echo '```'
            echo "</details>"
            echo
            echo "[Run log + artifact](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > "$REPORTS/digest.md"

      - name: Publish telemetry (PR comment or burn-in issue)
        if: always()
        # rex-allow: ADVISORY_EXPLICIT - publishing telemetry must never mask scan results.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          body="$REPORTS/digest.md"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pr="${{ github.event.pull_request.number }}"
            cid=$(gh api "repos/$REPO/issues/$pr/comments" --paginate \
                    -q '.[] | select(.body | startswith("<!-- quality-pilot-telemetry -->")) | .id' | tail -n 1)
            if [ -n "$cid" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$cid" -F body=@"$body" -q .html_url
            else
              gh api "repos/$REPO/issues/$pr/comments" -F body=@"$body" -q .html_url
            fi
          else
            title="Quality pilot — burn-in telemetry"
            num=$(gh api "repos/$REPO/issues?state=open&per_page=100" --paginate \
                    -q ".[] | select(.title == \"$title\") | .number" | head -n 1)
            if [ -z "$num" ]; then
              num=$(gh api "repos/$REPO/issues" -f title="$title" \
                      -f body="Telemetry digest from each run of .github/workflows/code-quality-pilot.yml (protocol: tools/quality_pilot/README.md). Close when burn-in and triage are done." \
                      -q .number)
            fi
            gh api "repos/$REPO/issues/$num/comments" -F body=@"$body" -q .html_url
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quality-pilot-${{ github.run_number }}
          path: ${{ env.REPORTS }}/
          retention-days: 60
