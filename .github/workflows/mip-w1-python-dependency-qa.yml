name: MIP W1 Python Dependency Policy QA
on:
  pull_request:
    paths:
      - 'DMAIC_V3/requirements.txt'
      - 'tests/test_mip_python_dependency_guard.py'
      - 'tools/mip2/mip_python_dependency_guard.py'
      - '.github/workflows/mip-w1-python-dependency-qa.yml'
permissions:
  contents: read
jobs:
  static-and-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused test prerequisites
        run: python -m pip install 'pytest>=7.4,<10' numpy packaging
      - name: Check policy and negative regression controls
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_mip_python_dependency_guard.py
          python tools/mip2/mip_python_dependency_guard.py --requirements DMAIC_V3/requirements.txt --out artifacts/mip/w1-dependency-policy.json
      - name: Upload structured static-policy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mip-w1-dependency-policy-py${{ matrix.python-version }}
          path: artifacts/mip/w1-dependency-policy.json
          if-no-files-found: error
          retention-days: 14
