name: MIP W1 Python Dependency Policy QA
on:
  pull_request:
    paths:
      - 'DMAIC_V3/requirements.txt'
      - 'tests/test_mip_python_dependency_guard.py'
      - 'tests/test_matplotlib_requirement_compatibility.py'
      - 'tools/mip2/mip_python_dependency_guard.py'
      - '.github/workflows/mip-w1-python-dependency-qa.yml'
permissions:
  contents: read
jobs:
  static-and-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused test prerequisites
        run: python -m pip install 'pytest>=7.4,<10' numpy packaging
      - name: Check policy and negative regression controls
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_mip_python_dependency_guard.py tests/test_matplotlib_requirement_compatibility.py
          python tools/mip2/mip_python_dependency_guard.py --requirements DMAIC_V3/requirements.txt --out artifacts/mip/w1-dependency-policy.json
      - name: Upload structured static-policy evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mip-w1-dependency-policy-py${{ matrix.python-version }}
          path: artifacts/mip/w1-dependency-policy.json
          if-no-files-found: error
          retention-days: 14
