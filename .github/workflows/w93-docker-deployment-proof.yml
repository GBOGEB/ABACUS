name: W93 Docker Deployment Proof

on:
  pull_request:
    paths:
      - Dockerfile
      - docker-compose.yml
      - qplant/deployment/**
      - triage/DEPLOYMENT_RUNTIME_REGISTRY_W92.yaml
      - .github/workflows/w93-docker-deployment-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-service-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose model
        run: docker compose config --quiet
      - name: Build exact-head root image
        run: docker build --pull -t abacus-w93:${GITHUB_SHA} .
      - name: Execute root service shell and capture bounded diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          out=.artifacts/w93/root
          mkdir -p "$out"
          image="abacus-w93:${GITHUB_SHA}"
          cid=""
          finish() {
            rc=$?
            trap - EXIT
            if [ -n "$cid" ]; then
              docker logs --tail 100 "$cid" > "$out/container.log" 2>&1 || true
              docker inspect --format '{{json .State}}' "$cid" > "$out/container-state.json" 2>/dev/null || true
              docker rm -f "$cid" >/dev/null 2>&1 || true
            fi
            printf 'exit_code=%s\n' "$rc" > "$out/exit-code.txt"
            (cd "$out" && sha256sum ./*.txt ./*.log ./*.json 2>/dev/null > SHA256SUMS) || true
            exit "$rc"
          }
          trap finish EXIT
          docker image inspect "$image" --format '{{.Id}}' > "$out/image-id.txt"
          # Restrict runner publication to loopback; expose only the intended HTTP port.
          cid=$(docker run -d -p 127.0.0.1:18000:8000 "$image")
          docker port "$cid" 8000/tcp > "$out/port.txt"
          grep -Fxq '127.0.0.1:18000' "$out/port.txt"
          http_status=000
          for i in $(seq 1 20); do
            http_status=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 3 http://127.0.0.1:18000/ || true)
            if [ "$http_status" = 200 ]; then break; fi
            sleep 1
          done
          printf '%s\n' "$http_status" > "$out/http-status.txt"
          test "$http_status" = 200
          health=$(docker inspect -f '{{.State.Health.Status}}' "$cid")
          printf '%s\n' "$health" > "$out/health.txt"
          test "$health" = healthy
          printf 'source_sha=%s\nruntime_role=SERVICE_SHELL\ncontainer_execution=PASS\nhost_bind=127.0.0.1:18000\ncontainer_port=8000/tcp\nhttp_status=%s\nhealth=%s\nengineering_credit_delta=0\n' "$GITHUB_SHA" "$http_status" "$health" > "$out/receipt.txt"
      - name: Upload root service port, health, and debug evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: w93-abacus-root-docker-${{ github.sha }}
          path: .artifacts/w93/root/
          retention-days: 7
          if-no-files-found: warn

  qplant-application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Validate QPLANT compose surfaces
        run: |
          docker compose -f qplant/deployment/docker-compose.yml config --quiet
          docker compose -f qplant/deployment/docker-compose.yml -f qplant/deployment/docker-compose.staging.yml config --quiet
          docker compose -f qplant/deployment/docker-compose.yml -f qplant/deployment/docker-compose.production.yml config --quiet
      - name: Build exact-head QPLANT application image
        run: docker build --pull -t qplant-w93:${GITHUB_SHA} -f qplant/deployment/Dockerfile qplant
      - name: Record build receipt
        run: |
          printf 'source_sha=%s\nruntime_role=QPLANT_APPLICATION\nimage_build=PASS\ncompose_validation=PASS\nengineering_credit_delta=0\n' "$GITHUB_SHA" | tee w93_qplant_docker_receipt.txt
      - uses: actions/upload-artifact@v7
        with:
          name: w93-qplant-docker-${{ github.sha }}
          path: w93_qplant_docker_receipt.txt
