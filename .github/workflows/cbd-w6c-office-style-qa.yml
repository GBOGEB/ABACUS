name: CBD W6C OOXML Unsafe-Path Negative Regression
on:
  pull_request:
    paths:
      - 'tests/test_office_style_probe.py'
      - 'tools/office_style_probe.py'
      - '.github/workflows/cbd-w6c-office-style-qa.yml'
permissions:
  contents: read
jobs:
  unsafe-zip:
    name: office-unsafe-zip (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install native test runner
        run: python -m pip install 'pytest>=7.4,<10' 'numpy>=1.24,<3'
      - name: Execute actual OOXML negative and positive contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p w6c-evidence
          python -m pytest -q tests/test_office_style_probe.py --junitxml=w6c-evidence/junit.xml
      - name: Retain JUnit even on RED
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: w6c-office-unsafe-zip-${{ matrix.os }}-py${{ matrix.python }}
          path: w6c-evidence/junit.xml
          if-no-files-found: error
