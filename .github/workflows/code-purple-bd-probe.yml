name: CODE PURPLE BD exact-head diagnostic
on:
  push:
    branches: [fix/code-purple-evidence-trigger-20261012]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feedback-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute actual governance tests
        run: python -m unittest ci.governance.tests.test_pr_feedback_gate -v
  ldab-self-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute diagnostic receipt and verify bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bd_receipts
          python scripts/mip_repo_self_index.py --output bd_receipts/ldab_self_index.json
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,time
          p=pathlib.Path('bd_receipts/ldab_self_index.json')
          raw=p.read_bytes()
          data=json.loads(raw)
          assert isinstance(data['assessments']['repo_self_assess_debug_ldab'],dict)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert data['repo']['sha']==sha,(data['repo']['sha'],sha)
          receipt={'source_sha':sha,'output_path':str(p),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'assessment':data['assessments']['repo_self_assess_debug_ldab'],'process':'scripts/mip_repo_self_index.py','validated':True}
          pathlib.Path('bd_receipts/ldab_execution.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-purple-ldab-self-index
          path: bd_receipts/
          if-no-files-found: warn

  ldab-extended:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute actual diagnostic and controlled self-heal probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bd_receipts
          python scripts/mip_health_selfheal_probe.py --output bd_receipts/health_selfheal.json
          python integration/codespace_jyperter/scripts/mip_debug_diagnostic.py --output bd_receipts/nested_debug_diagnostic.json
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('bd_receipts/health_selfheal.json')
          d=json.loads(p.read_text())
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert d['exact_sha']==sha
          assert d['verification']=='PASS'
          assert d['source_checkout_unchanged'] is True
          nested=pathlib.Path('bd_receipts/nested_debug_diagnostic.json')
          nested_raw=nested.read_bytes()
          nested_data=json.loads(nested_raw)
          assert nested_data['diagnostic']=='nested_debug_ldab'
          assert nested_data['parent_sha']==sha
          assert nested_data['verification']=='PASS'
          assert nested_data['failed_checks']==[]
          nested_execution={'entrypoint':'integration/codespace_jyperter/scripts/mip_debug_diagnostic.py','source_sha':sha,'exit_code':0,'checks_total':len(nested_data['checks']),'checks_passed':sum(x is True for x in nested_data['checks'].values()),'failed_checks':nested_data['failed_checks'],'receipt_path':str(nested),'receipt_sha256':hashlib.sha256(nested_raw).hexdigest(),'receipt_bytes':len(nested_raw),'verification':'PASS'}
          pathlib.Path('bd_receipts/nested_ldab_execution.json').write_text(json.dumps(nested_execution,sort_keys=True,indent=2)+'\\n')
          print(json.dumps(nested_execution,sort_keys=True))
          obj={'head':sha,'exit_code':0,'receipt_path':str(p),'receipt_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'receipt_bytes':p.stat().st_size,'verification':d['verification'],'checkout_unchanged':d['source_checkout_unchanged']}
          pathlib.Path('bd_receipts/extended_execution.json').write_text(json.dumps(obj,sort_keys=True,indent=2)+'\n')
          print(json.dumps(obj,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-purple-ldab-extended
          path: bd_receipts/
          if-no-files-found: warn

  main-baseline-census:
    name: Main exact-SHA red-root census (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dfd56456bf2b7ce14d48fe136b0800cb6c44f6c9
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute main regression and compile diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bd_baseline
          python - <<'PY'
          import datetime,hashlib,json,pathlib,subprocess,sys
          expected="dfd56456bf2b7ce14d48fe136b0800cb6c44f6c9"
          actual=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          assert actual==expected, (actual,expected)
          commands=[
            [sys.executable,"-m","unittest","ci.governance.tests.test_pr_feedback_gate","-v"],
            [sys.executable,"-m","compileall","-q","ci/governance","scripts/mip_repo_self_index.py","scripts/mip_health_selfheal_probe.py"],
          ]
          results=[]
          for cmd in commands:
            start=datetime.datetime.now(datetime.timezone.utc).isoformat()
            p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
            log=p.stdout.encode("utf-8")
            target=pathlib.Path("bd_baseline")/f"command_{len(results)}.log"
            target.write_bytes(log)
            results.append({"command":cmd,"start_utc":start,"exit_code":p.returncode,"log":str(target),"log_sha256":hashlib.sha256(log).hexdigest()})
          obj={"source_sha":actual,"classification":"REPORT_ONLY_NOT_ADMISSION","results":results}
          pathlib.Path("bd_baseline/receipt.json").write_text(json.dumps(obj,indent=2,sort_keys=True)+"\\n")
          print(json.dumps(obj,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-purple-main-baseline
          path: bd_baseline/
          if-no-files-found: warn

  measured-bd-dashboard:
    name: Pinned baseline security coverage and LDAB HTML
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install measurement tooling
        run: python -m pip install coverage bandit pip-audit safety
      - name: Execute pinned-main and exact-head measurements
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/code_purple_bd_census.py
      - name: Upload evidence dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-purple-bd-measured-dashboard
          path: bd_receipts/extended_bd/
          if-no-files-found: warn
