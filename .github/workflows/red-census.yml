name: RED census (report-only)

# Observer for the BD ledger control loop. Classifies every active workflow by
# its last 10 completed default-branch runs (EVERRED / GREEN_TO_RED / FLAKY /
# GREEN / NO_MAIN_RUNS, GHOST separately, STALE flag), annotates each with the
# ledger root_ids that cover it, and verifies the ledger hash chain.
# Report-only: never writes to the repository, never gates a PR.
# Scope: GBOGEB/ABACUS only. Cross-repo (CODEX) needs a token the owner has
# not provisioned; see docs/ci/RED_CENSUS_README.md.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: red-census-${{ github.ref }}
  cancel-in-progress: true

jobs:
  census:
    name: RED census + ledger verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v7.0.1 (immutable action SHA)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v7.1.0 (immutable action SHA)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'

      - name: Verify BD ledger chain (report-only)
        run: |
          set +e
          python scripts/red_census.py --verify-ledger \
            ledger/bd_ledger.jsonl > ledger-verify.txt 2>&1
          status=$?
          cat ledger-verify.txt
          {
            echo "## BD ledger verify"
            echo
            echo '```'
            cat ledger-verify.txt
            echo '```'
            echo
            echo "exit=${status} (report-only; not enforced)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Run census (GBOGEB/ABACUS)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/red_census.py "${{ github.repository }}" \
            --ledger ledger/bd_ledger.jsonl \
            --out red-census.json \
            --summary "$GITHUB_STEP_SUMMARY"
          sha256sum red-census.json

      - name: Upload census JSON
        if: always()
        # v7.0.2 (immutable action SHA)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: red-census
          path: |
            red-census.json
            ledger-verify.txt
          if-no-files-found: warn
          retention-days: 30
