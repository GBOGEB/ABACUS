name: Bandit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        # Scope and skip rules governed by .github/security/security.toml [bandit]
        run: |
          bandit -r DMAIC_V3 \
            --exclude DMAIC_V3/tests,DMAIC_V3/generators/test_integration_pipeline.py \
            --skip B101,B603 \
            --severity-level medium \
            --confidence-level medium \
            -f sarif \
            -o bandit-results.sarif || true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.4
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit
