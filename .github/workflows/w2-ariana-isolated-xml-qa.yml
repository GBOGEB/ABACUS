name: W2 Ariana Isolated XML Compatibility QA
on:
  pull_request:
    paths:
      - 'requirements-test.txt'
      - 'tests/test_ariana_unit_matrix_dependency_contract.py'
      - 'tests/test_ariana_secure_junit_dependency.py'
      - '.github/workflows/w2-ariana-isolated-xml-qa.yml'
permissions:
  contents: read
jobs:
  isolated-os-proof:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: '3.10'
          - os: windows-2022
            python-version: '3.11'
          - os: macos-14
            python-version: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact head and install isolated manifest
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python -m pip install -r requirements-test.txt
      - name: Test secure XML parser and matrix dependency contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p w2-evidence
          python -m pytest -q tests/test_ariana_unit_matrix_dependency_contract.py tests/test_ariana_secure_junit_dependency.py --junitxml=w2-evidence/junit.xml
      - name: Require native JUnit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secure-xml-${{ matrix.os }}-py${{ matrix.python-version }}
          path: w2-evidence/junit.xml
          if-no-files-found: error
