name: MIP B0 Test Admission and Coverage Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pytest.ini"
      - "requirements*.txt"
      - "pyproject.toml"
      - "scripts/test_admission_census.py"
      - "scripts/test_evidence_census.py"
      - "scripts/coverage_dab_census.py"
      - "scripts/post_b0_coverage_union.py"
      - "scripts/mip_v2_federated_controller.py"
      - "scripts/mip_test_check_completeness.py"
      - "scripts/pytest_test_state_plugin.py"
      - "scripts/ci_false_green_lint.py"
      - "scripts/dab_flake8_census.py"
      - "scripts/dab_proposal_queue.py"
      - "scripts/proposal_compatibility.py"
      - "scripts/ci_matrix_proof_audit.py"
      - "governance/dab/**"
      - "governance/proposals/**"
      - "DMAIC_V3/**/*.py"
      - "MINERVA_PID/**/*.py"
      - "tools/**/*.py"
      - "DMAIC_V3/tests/**"
      - "integration/*/tests/**"
      - "tests/**"
      - ".github/workflows/**"
      - "ci/governance/**"
      - "docs/ci/WORKFLOW_RATIONALIZATION.md"
  pull_request:
    paths:
      - "pytest.ini"
      - "requirements*.txt"
      - "pyproject.toml"
      - "scripts/test_admission_census.py"
      - "scripts/test_evidence_census.py"
      - "scripts/coverage_dab_census.py"
      - "scripts/post_b0_coverage_union.py"
      - "scripts/mip_v2_federated_controller.py"
      - "scripts/mip_test_check_completeness.py"
      - "scripts/pytest_test_state_plugin.py"
      - "scripts/ci_false_green_lint.py"
      - "scripts/dab_flake8_census.py"
      - "scripts/dab_proposal_queue.py"
      - "scripts/proposal_compatibility.py"
      - "scripts/ci_matrix_proof_audit.py"
      - "governance/dab/**"
      - "governance/proposals/**"
      - "DMAIC_V3/**/*.py"
      - "MINERVA_PID/**/*.py"
      - "tools/**/*.py"
      - "DMAIC_V3/tests/**"
      - "integration/*/tests/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read
  actions: read

# Keep only the newest in-flight proof for a PR/ref. A newer exact head
# supersedes unfinished work; completed evidence remains in Actions history.
concurrency:
  group: mip-b0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  canonical-coverage:
    name: B0 canonical coverage producer
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXACT_SHA }}

      - name: Verify exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXACT_SHA"

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install governed test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run canonical exact-head coverage surface
        env:
          COVERAGE_FILE: test_reports/post-b0/.coverage-canonical
        run: |
          set -euo pipefail
          mkdir -p test_reports/post-b0
          python -m pytest \
            -p scripts.pytest_test_state_plugin \
            -q \
            --govern-test-states \
            --benchmark-disable \
            --cov=. \
            --cov-branch \
            --cov-report= \
            --junitxml=test_reports/post-b0/canonical-junit.xml

          python scripts/test_evidence_census.py \
            --junit test_reports/post-b0/canonical-junit.xml \
            --out test_reports/post-b0/canonical-test-evidence.json \
            --max-skips 5 \
            --max-xfails 0

          python -m coverage json \
            --show-contexts \
            -o test_reports/post-b0/canonical-contexts.json

      - name: Upload canonical coverage producer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: b0-canonical-${{ env.EXACT_SHA }}
          path: |
            test_reports/post-b0/canonical-junit.xml
            test_reports/post-b0/canonical-test-evidence.json
            test_reports/post-b0/canonical-contexts.json
          if-no-files-found: error

  report-only-producer:
    name: B0 report-only producer
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXACT_SHA }}

      - name: Verify exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXACT_SHA"

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install governed test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Collect and execute excluded suites as report-only evidence
        env:
          COVERAGE_FILE: test_reports/b0/.coverage
        run: |
          set -euo pipefail
          mkdir -p test_reports/b0/junit
          python scripts/test_admission_census.py \
            --out test_reports/b0/admission-census.json \
            --coverage-out test_reports/b0/coverage-contexts.json \
            --junit-dir test_reports/b0/junit \
            --exact-sha "$EXACT_SHA"

      - name: Build DAB census from measured B0 contexts
        run: |
          set -euo pipefail
          python scripts/coverage_dab_census.py \
            --coverage-json test_reports/b0/coverage-contexts.json \
            --criticality governance/coverage/criticality_manifest.json \
            --matrix-baseline \
            governance/coverage/python_matrix_baseline_20261001.json \
            --exact-sha "${EXACT_SHA}" \
            --out test_reports/b0/coverage-dab.json

      - name: Upload report-only producer evidence
        uses: actions/upload-artifact@v7
        with:
          name: b0-report-only-producer-${{ env.EXACT_SHA }}
          path: test_reports/b0/
          if-no-files-found: error

  false-green-census:
    name: B1 false-green census
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXACT_SHA }}

      - name: Verify exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXACT_SHA"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Census workflow false-green constructs
        run: |
          set -euo pipefail
          mkdir -p test_reports/b1
          python scripts/ci_false_green_lint.py \
            --root .github/workflows \
            --mode census \
            --max-unguarded 267 \
            --out test_reports/b1/false-green-census.json

      - name: Upload B1 census
        uses: actions/upload-artifact@v7
        with:
          name: b1-false-green-census-${{ env.EXACT_SHA }}
          path: test_reports/b1/
          if-no-files-found: error

  static-analysis:
    name: B0 static/DAB census producer
    runs-on: ubuntu-24.04
    outputs:
      proposal_matrix: ${{ steps.proposal_matrix.outputs.matrix }}
      proposal_count: ${{ steps.proposal_matrix.outputs.count }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXACT_SHA }}

      - name: Verify exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXACT_SHA"

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install governed static-analysis dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build exact-head static-analysis census
        run: |
          set -euo pipefail
          mkdir -p test_reports/post-b0
          python scripts/dab_flake8_census.py \
            --json-out test_reports/post-b0/flake8-census.json \
            --text-out test_reports/post-b0/flake8-census.txt

      - name: Build governed DAB proposal queue
        run: |
          set -euo pipefail
          python scripts/dab_proposal_queue.py \
            --census test_reports/post-b0/flake8-census.json \
            --text test_reports/post-b0/flake8-census.txt \
            --source-sha "${EXACT_SHA}" \
            --out test_reports/post-b0/dab-proposal-queue.json
          python scripts/proposal_compatibility.py validate \
            --input test_reports/post-b0/dab-proposal-queue.json

      - name: Build read-only proposal worker matrix
        id: proposal_matrix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          queue = json.loads(
              Path(
                  "test_reports/post-b0/dab-proposal-queue.json"
              ).read_text(encoding="utf-8")
          )
          proposals = queue.get("proposals", [])[:8]
          matrix = {
              "include": [
                  {
                      "proposal_index": index,
                      "proposal_id": proposal["proposal_id"],
                  }
                  for index, proposal in enumerate(proposals)
              ]
          }
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(
                  "matrix="
                  + json.dumps(matrix, separators=(",", ":"))
                  + "\n"
              )
              handle.write(f"count={len(proposals)}\n")
          PY

      - name: Upload static/DAB producer evidence
        uses: actions/upload-artifact@v7
        with:
          name: b0-static-dab-${{ env.EXACT_SHA }}
          path: |
            test_reports/post-b0/flake8-census.json
            test_reports/post-b0/flake8-census.txt
            test_reports/post-b0/dab-proposal-queue.json
          if-no-files-found: error

  proposal-workers:
    name: DAB proposal worker ${{ matrix.proposal_id }}
    if: ${{ needs.static-analysis.outputs.proposal_count != '0' }}
    needs: static-analysis
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.static-analysis.outputs.proposal_matrix) }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXACT_SHA }}

      - name: Verify exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXACT_SHA"

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download proposal queue
        uses: actions/download-artifact@v8
        with:
          name: b0-static-dab-${{ env.EXACT_SHA }}
          path: test_reports/post-b0

      - name: Extract read-only proposal envelope
        env:
          PROPOSAL_INDEX: ${{ matrix.proposal_index }}
          PROPOSAL_ID: ${{ matrix.proposal_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          queue_path = Path(
              "test_reports/post-b0/dab-proposal-queue.json"
          )
          queue = json.loads(queue_path.read_text(encoding="utf-8"))
          proposal = queue["proposals"][int(os.environ["PROPOSAL_INDEX"])]
          if proposal["proposal_id"] != os.environ["PROPOSAL_ID"]:
              raise SystemExit("proposal worker identity mismatch")
          if proposal["mutation_mode"] != "READ_ONLY_PROPOSAL":
              raise SystemExit("proposal worker mutation mode is not read-only")
          Path("proposal.json").write_text(
              json.dumps(proposal, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate proposal compatibility contract
        run: |
          set -euo pipefail
          python scripts/proposal_compatibility.py validate \
            --input proposal.json

      - name: Emit read-only worker receipt
        env:
          PROPOSAL_ID: ${{ matrix.proposal_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          proposal = json.loads(
              Path("proposal.json").read_text(encoding="utf-8")
          )
          receipt = {
              "proposal_id": os.environ["PROPOSAL_ID"],
              "source_sha": proposal["source_sha"],
              "mutation_mode": "READ_ONLY_PROPOSAL",
              "worker_status": "VALIDATED",
              "authority_transfer": False,
              "formal_credit_delta": 0,
              "engineering_credit_delta": 0,
          }
          Path("proposal-worker-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload proposal worker receipt
        uses: actions/upload-artifact@v7
        with:
          name: dab-proposal-worker-${{ matrix.proposal_id }}
          path: |
            proposal.json
            proposal-worker-receipt.json
          if-no-files-found: error

  b0-report-only:
    name: B0 report-only admission census
    if: ${{ always() }}
    needs:
      - canonical-coverage
      - report-only-producer
      - false-green-census
      - static-analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Require all exact-SHA producers GREEN
        env:
          CANONICAL_RESULT: ${{ needs.canonical-coverage.result }}
          REPORT_ONLY_RESULT: ${{ needs.report-only-producer.result }}
          FALSE_GREEN_RESULT: ${{ needs.false-green-census.result }}
          STATIC_RESULT: ${{ needs.static-analysis.result }}
        run: |
          set -euo pipefail
          test "$CANONICAL_RESULT" = "success"
          test "$REPORT_ONLY_RESULT" = "success"
          test "$FALSE_GREEN_RESULT" = "success"
          test "$STATIC_RESULT" = "success"

      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXACT_SHA }}

      - name: Verify exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXACT_SHA"

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download canonical coverage evidence
        uses: actions/download-artifact@v8
        with:
          name: b0-canonical-${{ env.EXACT_SHA }}
          path: test_reports/post-b0

      - name: Download report-only evidence
        uses: actions/download-artifact@v8
        with:
          name: b0-report-only-producer-${{ env.EXACT_SHA }}
          path: test_reports/b0

      - name: Download B1 false-green evidence
        uses: actions/download-artifact@v8
        with:
          name: b1-false-green-census-${{ env.EXACT_SHA }}
          path: test_reports/b1

      - name: Download static/DAB evidence
        uses: actions/download-artifact@v8
        with:
          name: b0-static-dab-${{ env.EXACT_SHA }}
          path: test_reports/post-b0

      - name: Build exact-head post-B0 coverage union
        run: |
          set -euo pipefail
          python scripts/post_b0_coverage_union.py \
            --coverage-surface \
            canonical=test_reports/post-b0/canonical-contexts.json \
            --coverage-surface \
            b0_report_only=test_reports/b0/coverage-contexts.json \
            --criticality governance/coverage/criticality_manifest.json \
            --matrix-baseline \
            governance/coverage/python_matrix_baseline_20261001.json \
            --test-evidence test_reports/post-b0/canonical-test-evidence.json \
            --exact-sha "${EXACT_SHA}" \
            --out test_reports/post-b0/coverage-dab.json

      - name: Consume post-B0 pressure through MIP
        env:
          EXPECTED_SHA: ${{ env.EXACT_SHA }}
        run: |
          set -euo pipefail
          python scripts/mip_v2_federated_controller.py \
            --summary test_reports/post-b0/mip-pressure.json \
            --coverage-census test_reports/post-b0/coverage-dab.json \
            --coverage-limit 40

      - name: Build unified TC0-TC4 residual
        run: |
          set -euo pipefail
          python scripts/mip_test_check_completeness.py \
            --coverage-dab test_reports/post-b0/coverage-dab.json \
            --test-evidence test_reports/post-b0/canonical-test-evidence.json \
            --admission-census test_reports/b0/admission-census.json \
            --false-green-census test_reports/b1/false-green-census.json \
            --static-census test_reports/post-b0/flake8-census.json \
            --exact-sha "$EXACT_SHA" \
            --out test_reports/post-b0/test-check-completeness.json

      - name: Emit shared MIP proposal envelope
        run: |
          set -euo pipefail
          python scripts/proposal_compatibility.py emit-mip \
            --source-sha "$EXACT_SHA" \
            --evidence test_reports/post-b0/test-check-completeness.json \
            --out test_reports/post-b0/mip-proposal-envelope.json
          python scripts/proposal_compatibility.py validate \
            --input test_reports/post-b0/mip-proposal-envelope.json

      - name: Upload B0 report-only evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: b0-test-admission-${{ env.EXACT_SHA }}
          path: |
            test_reports/b0/
            test_reports/post-b0/
          if-no-files-found: error
