name: CODE_MAROON Snapshot

on:
  pull_request:
    paths:
      - "CODE_MAROON/**"
      - "tools/code_maroon/**"
      - "tests/test_code_maroon_reconcile.py"
      - "tests/test_code_maroon_ooxml.py"
      - "**/*.docx"
      - "**/*.docm"
      - "**/*.xlsx"
      - "**/*.xlsm"
      - "**/*.pptx"
      - "**/*.pptm"
      - ".github/workflows/code-maroon.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded pytest runner
        run: python -m pip install pytest==8.4.2
      - name: Validate CODE_MAROON ledger and OOXML negative controls
        run: |
          mkdir -p "$RUNNER_TEMP/code-maroon"
          python -m pytest -q tests/test_code_maroon_reconcile.py tests/test_code_maroon_ooxml.py \
            --junitxml="$RUNNER_TEMP/code-maroon/pytest.xml"
      - name: Scan tracked OOXML packages
        run: |
          mkdir -p "$RUNNER_TEMP/code-maroon"
          python tools/code_maroon/ooxml_scan.py \
            --discover-git \
            --output "$RUNNER_TEMP/code-maroon/ooxml_receipt.json" \
            --fail-on high
      - name: Emit snapshot receipt
        run: |
          python tools/code_maroon/reconcile.py \
            --snapshot CODE_MAROON/snapshot_20261016.json \
            --out "$RUNNER_TEMP/code-maroon"
          cat "$RUNNER_TEMP/code-maroon/code_maroon_receipt.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: code-maroon-receipt
          path: ${{ runner.temp }}/code-maroon/
          if-no-files-found: error
