name: Branch hygiene (lossless)

# Removes stale branches listed in governance/branch_hygiene/*.tsv, only
# when the removal is provably lossless at run time (see
# scripts/branch_hygiene_delete.py). Default is a dry run; deletion needs
# execute=true on a manual dispatch. Pull requests only run the unit tests
# and the list linter: a live dry run of every list would exceed the
# GITHUB_TOKEN rate limit, so dry runs are dispatched.
on:
  workflow_dispatch:
    inputs:
      list:
        description: Branch list (TSV) under governance/branch_hygiene/
        required: true
        default: governance/branch_hygiene/W1_DELETE_MERGED_20261011.tsv
      execute:
        description: Delete (true) or dry run (false)
        type: boolean
        default: false
  pull_request:
    paths:
      - scripts/branch_hygiene_delete.py
      - tests/test_branch_hygiene_delete.py
      - governance/branch_hygiene/**
      - .github/workflows/branch-hygiene.yml

permissions:
  contents: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

# Actions are pinned by commit SHA: checkout v7.0.1, setup-python v7.0.0,
# upload-artifact v7.0.1 (the same pins as the other ABACUS workflows).
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: >-
          python -m pytest -q --noconftest -p no:cacheprovider
          tests/test_branch_hygiene_delete.py

  bdq_sample:
    name: BDQ W20 read-only W1/W2 sample
    if: github.event_name == 'pull_request'
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Bound exact-head read-only census
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_ID: ${{ github.job }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python scripts/branch_hygiene_delete.py \
            governance/branch_hygiene/W1_DELETE_MERGED_20261011.tsv \
            --repo "${{ github.repository }}" --sample-limit 3 \
            --receipt "$RUNNER_TEMP/bdq-w1.json" > /dev/null
          python scripts/branch_hygiene_delete.py \
            governance/branch_hygiene/W2_ARCHIVE_SUPERSEDED_20261011.tsv \
            --repo "${{ github.repository }}" --sample-limit 3 \
            --receipt "$RUNNER_TEMP/bdq-w2.json" > /dev/null
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          receipts = [json.loads((root / x).read_text()) for x in ("bdq-w1.json", "bdq-w2.json")]
          if any(r["mode"] != "dry_run" or r["deleted"] != 0 or r["listed"] != 3 for r in receipts):
              raise SystemExit("read-only sample contract failed")
          proof = {
              "schema": "abacus.bdq.hygiene.readonly.sample.v1",
              "source_sha": os.environ["SOURCE_SHA"],
              "run_id": int(os.environ["RUN_ID"]),
              "job": os.environ["JOB_ID"],
              "authority": "observation_only",
              "mutation_allowed": False,
              "sampled": sum(r["listed"] for r in receipts),
              "eligible": sum(r["eligible"] for r in receipts),
              "skipped": sum(r["skipped"] for r in receipts),
              "errors": sum(r["errors"] for r in receipts),
              "deleted": 0,
          }
          (root / "bdq-sample-manifest.json").write_text(json.dumps(proof, sort_keys=True, indent=2) + "\n")
          print(f"Sample {proof['sampled']}: eligible {proof['eligible']}, skipped {proof['skipped']}, errors {proof['errors']}; deleted 0")
          PY
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bdq-hygiene-sample-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bdq-w1.json
            ${{ runner.temp }}/bdq-w2.json
            ${{ runner.temp }}/bdq-sample-manifest.json
          if-no-files-found: warn
          retention-days: 90

  apply:
    if: github.event_name == 'workflow_dispatch'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Apply list
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LIST: ${{ inputs.list }}
          EXECUTE: ${{ inputs.execute }}
        run: |
          set -euo pipefail
          case "$LIST" in
            governance/branch_hygiene/*.tsv) ;;
            *) echo "list must be under governance/branch_hygiene/"; exit 1;;
          esac
          flag=""; [ "$EXECUTE" = "true" ] && flag="--execute"
          receipt="$RUNNER_TEMP/branch-hygiene-receipt.json"
          status=0
          python scripts/branch_hygiene_delete.py "$LIST" $flag \
            --receipt "$receipt" > /dev/null || status=$?
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          tmp = os.environ["RUNNER_TEMP"]
          d = json.load(open(tmp + "/branch-hygiene-receipt.json"))
          print(f"## Branch hygiene: {d['mode']}\n")
          print(f"Listed {d['listed']}, lossless {d['eligible']}, "
                f"deleted {d['deleted']}, skipped {d['skipped']}, "
                f"errors {d['errors']}.\n")
          for r in d["results"]:
              if r["action"] in ("skip", "error"):
                  print(f"- {r['action']} `{r['branch']}`: {r['reason']}")
          PY
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: branch-hygiene-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/branch-hygiene-receipt.json
          if-no-files-found: error
          retention-days: 90
