name: EVERRED V3 Governed Control Plane
on:
  pull_request:
    paths:
      - 'tools/everred_v3/**'
      - '.github/workflows/everred-v3-validation.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      target_run_id:
        description: 'Existing GitHub Actions run ID to inspect read-only'
        required: false
        type: string
      artifact_plan_json:
        description: 'JSON artifact plan with exact IDs, source SHAs and scopes'
        required: false
        type: string
      target_sha:
        description: 'Exact 40-character source SHA of the target run'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: everred-v3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  local-contract:
    name: EVERRED source, provenance and negative tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      # actions/checkout v4.2.2, immutable SHA pin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # actions/setup-python v5.6.0, immutable SHA pin
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install XML entity-safe parser
        run: |
          python -m pip install defusedxml==0.7.1 \
            PyYAML==6.0.3 jsonschema==4.25.1 pytest numpy==1.26.4
      - name: Verify source, event chain and disjoint leases
        working-directory: tools/everred_v3
        run: |
          python -m compileall -q src scripts tests
          python -m unittest discover -s tests -q
          python src/everred.py verify
          python scripts/build_joined_census.py
          python scripts/build_dashboard.py
          git diff --exit-code -- dashboard/index.html
      - name: Confirm generation does not promote admission
        working-directory: tools/everred_v3
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          snapshot = json.loads(Path('data/snapshot.json').read_text())
          assert snapshot['schema'] == 'abacus.everred.snapshot.v3'
          assert snapshot['mode'] == 'HISTORICAL_EVIDENCE_NOT_LIVE'
          assert 'does not confer merge' in snapshot['disclaimer']
          print('Historical/UNKNOWN admission safeguards retained')
          PY
      - name: Four-plane YAML, LDAB and debugger integration tests
        working-directory: tools/everred_v3
        run: |
          python -m unittest discover -s tests -p test_four_planes.py -q
          python -m pytest -q ../../tests/test_bd_ldab_join_census.py
      - name: Execute bounded native host and LLDB preflight
        working-directory: tools/everred_v3
        env:
          SOURCE_HEAD_SHA: >-
            ${{ github.event.pull_request.head.sha || github.sha }}
          EXECUTION_REPO: ${{ github.repository }}
          EXECUTION_RUN_ID: ${{ github.run_id }}
        run: |
          checked_out_sha="$(git -C ../.. rev-parse HEAD)"
          python scripts/four_plane_preflight.py \
            --repo "$EXECUTION_REPO" \
            --sha "$SOURCE_HEAD_SHA" \
            --executed-sha "$checked_out_sha" \
            --run-id "$EXECUTION_RUN_ID" \
            --probe-lldb \
            --output "$RUNNER_TEMP/everred-v31-preflight.json"
          sha256sum "$RUNNER_TEMP/everred-v31-preflight.json"
      - name: Upload four-plane evidence, never push
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: everred-v31-native-${{ matrix.python-version }}
          path: ${{ runner.temp }}/everred-v31-preflight.json
          if-no-files-found: warn
      - name: Measure matched mass-signal behavioral coverage (advisory)
        working-directory: tools/everred_v3
        env:
          SOURCE_HEAD_SHA: >-
            ${{ github.event.pull_request.head.sha || github.sha }}
          MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -eu
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$SOURCE_HEAD_SHA" || {
            echo "Exact source checkout mismatch" >&2
            exit 64
          }
          export CHECKED_OUT_SHA="$checked_out_sha"
          python -m pip install coverage==7.16.2
          python -m coverage run --branch --source=mass_signal_join \
            -m unittest discover -s tests -p test_mass_signal_join.py -v
          python -m coverage json -o "$RUNNER_TEMP/mass-signal-coverage.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "mass-signal-coverage.json"
          report = json.loads(path.read_text(encoding="utf-8"))
          files = report.get("files", {})
          modules = [v for k, v in files.items()
                     if k.replace("\\", "/").endswith("/mass_signal_join.py")]
          if len(modules) != 1:
              raise SystemExit("exactly one instrumented module is required")
          totals = modules[0]["summary"]
          required = ("covered_lines", "num_statements",
                      "covered_branches", "num_branches")
          if any(type(totals.get(k)) is not int for k in required):
              raise SystemExit("coverage numerator/denominator missing")
          if totals["num_statements"] == 0 or totals["num_branches"] == 0:
              raise SystemExit("coverage denominator is zero")
          receipt = {
              "schema": "abacus.mass_signal.focused_coverage.v1",
              "source_sha": os.environ["CHECKED_OUT_SHA"],
              "event_sha": os.environ["GITHUB_SHA"],
              "source_head_claim": os.environ["SOURCE_HEAD_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "job_key": os.environ["GITHUB_JOB"],
              "job_id": None,
              "native_job_binding": "UNKNOWN_UNBOUND",
              "python_version": os.environ["MATRIX_PYTHON_VERSION"],
              "report_sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              "totals": {k: totals[k] for k in required},
              "instrumented_files": list(files),
              "merge_authority": False,
              "qps_acceptance": "DEFER",
          }
          target = path.parent / "mass-signal-coverage-receipt.json"
          target.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Upload source-bound focused-coverage measurement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: everred-mass-signal-coverage-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/mass-signal-coverage.json
            ${{ runner.temp }}/mass-signal-coverage-receipt.json
          if-no-files-found: warn
      - name: Emit pinned formatter proposal without changing the hard gates
        working-directory: tools/everred_v3
        run: |
          python -m pip install black==26.10.1 isort==9.0.2
          set +e
          echo "CP_FORMATTER_BLACK_DIFF_BEGIN"
          python -m black --diff src scripts tests
          b=$?
          echo "CP_FORMATTER_BLACK_DIFF_END rc=$b"
          echo "CP_FORMATTER_ISORT_DIFF_BEGIN"
          python -m isort --diff src scripts tests
          i=$?
          echo "CP_FORMATTER_ISORT_DIFF_END rc=$i"
          # This is diagnostic only; the following mandatory hard gate
          # independently enforces Black and isort failures.
          exit 0
      - name: Verify committed Black and isort styles
        working-directory: tools/everred_v3
        run: |
          python -m pip install black==26.10.1 isort==9.0.2
          # Diagnostics only; preserve the existing gate.
          python -m black --diff \
            src/mass_signal_join.py tests/test_mass_signal_join.py
          python -m isort --diff \
            src/mass_signal_join.py tests/test_mass_signal_join.py
          python -m black --check src scripts tests
          # Source repair receipts: diagnostic diff, preserve the independent required isort gate.
          python -m isort --diff src scripts tests
          python -m isort --check-only src scripts tests
  native-pulse:
    name: Read-only native run / joined census pulse
    if: github.event_name == 'workflow_dispatch' && inputs.target_run_id != '' && inputs.target_sha != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      # actions/checkout v4.2.2, immutable SHA pin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v5.6.0, immutable SHA pin
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Read existing run; reject SHA mismatch
        working-directory: tools/everred_v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_RUN_ID: ${{ inputs.target_run_id }}
          TARGET_SHA: ${{ inputs.target_sha }}
          SOURCE_REPO: ${{ github.repository }}
          ARTIFACT_PLAN_JSON: ${{ inputs.artifact_plan_json }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          val=os.environ.get('ARTIFACT_PLAN_JSON','').strip()
          if val:
              arr=json.loads(val)
              assert isinstance(arr,list) and len(arr)<=32
              Path('artifact-plan.json').write_text(json.dumps(arr))
          PY
          extra=()
          if [ -s artifact-plan.json ]; then
            extra=(--artifact-plan artifact-plan.json)
          fi
          python scripts/collect_native.py \
            --repo "$SOURCE_REPO" --sha "$TARGET_SHA" \
            --run-id "$TARGET_RUN_ID" \
            --output native-batch.json --apply-ledger "${extra[@]}"
          python src/everred.py verify
          python src/everred.py snapshot
          python src/control.py
          python scripts/build_joined_census.py
          python scripts/build_dashboard.py
      - name: Publish source-bound review artifacts, never push
        if: always()
        # actions/upload-artifact v4.6.2, immutable SHA pin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: everred-v3-observation-${{ github.run_id }}
          if-no-files-found: error
          path: |
            tools/everred_v3/native-batch.json
            tools/everred_v3/data/joined_native.json
            tools/everred_v3/data/kpi_history.jsonl
            tools/everred_v3/data/alerts.json
            tools/everred_v3/dashboard/index.html

  spine-live:
    name: Read-only current-main/PR coverage and LDAB pulse
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install safe artifact XML parser
        run: python -m pip install defusedxml==0.7.1
      - name: Read and reconcile live GitHub heads and native evidence
        working-directory: tools/everred_v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/live_spine.py --repo "$REPOSITORY" \
            --out everred-spine-state.json
          git rev-parse HEAD
          sha256sum everred-spine-state.json
      - name: Upload read-only current evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: everred-spine-current
          path: tools/everred_v3/everred-spine-state.json
          if-no-files-found: error
          retention-days: 14
