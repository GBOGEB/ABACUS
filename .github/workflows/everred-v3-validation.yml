name: EVERRED V3 Governed Control Plane
on:
  pull_request:
    paths:
      - 'tools/everred_v3/**'
      - '.github/workflows/everred-v3-validation.yml'
  workflow_dispatch:
    inputs:
      target_run_id:
        description: 'Existing GitHub Actions run ID to inspect read-only'
        required: true
        type: string
      artifact_plan_json:
        description: 'JSON artifact plan with exact IDs, source SHAs and scopes'
        required: false
        type: string
      target_sha:
        description: 'Exact 40-character source SHA of the target run'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: everred-v3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  local-contract:
    name: EVERRED source, provenance and negative tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      # actions/checkout v4.2.2, immutable SHA pin
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-python v5.6.0, immutable SHA pin
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install XML entity-safe parser
        run: |
          python -m pip install defusedxml==0.7.1 \
            PyYAML==6.0.3 jsonschema==4.25.1 pytest numpy==1.26.4
      - name: Verify source, event chain and disjoint leases
        working-directory: tools/everred_v3
        run: |
          python -m compileall -q src scripts tests
          python -m unittest discover -s tests -q
          python src/everred.py verify
          python scripts/build_joined_census.py
          python scripts/build_dashboard.py
          git diff --exit-code -- dashboard/index.html
      - name: Confirm generation does not promote admission
        working-directory: tools/everred_v3
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          snapshot = json.loads(Path('data/snapshot.json').read_text())
          assert snapshot['schema'] == 'abacus.everred.snapshot.v3'
          assert snapshot['mode'] == 'HISTORICAL_EVIDENCE_NOT_LIVE'
          assert 'does not confer merge' in snapshot['disclaimer']
          print('Historical/UNKNOWN admission safeguards retained')
          PY
      - name: Four-plane YAML, LDAB and debugger integration tests
        working-directory: tools/everred_v3
        run: |
          python -m unittest discover -s tests -p test_four_planes.py -q
          python -m pytest -q ../../tests/test_bd_ldab_join_census.py
      - name: CBD 260 source corpus and adversarial branch-coverage testflight
        working-directory: tools/everred_v3
        run: |
          python -m pip install coverage==7.10.7
          python -m coverage run --rcfile=/dev/null --branch --include='*/cbd_260.py' \
            -m unittest discover -s tests -p test_cbd_260.py -v
          python -m coverage json --rcfile=/dev/null --include='*/cbd_260.py' \
            -o "$RUNNER_TEMP/cbd-260-module-coverage.json"
          python scripts/cbd_260.py data/cbd_260/N0_*.json \
            --output-dir "$RUNNER_TEMP/cbd-260-static"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'cbd-260-static/summary.json').read_text())
          m=d['metrics']
          assert (m['prs_observed'],m['failed_workflow_associations'],m['distinct_failed_run_ids'])==(75,260,253)
          assert m['open_causal_roots'] is None
          assert d['safety']['merge_admission']=='HOLD'
          print('CBD_N0_INPUT_CENSUS=75_PR_260_ASSOC_253_UNIQUE_FAIL_RUN')
          PY
      - name: Upload CBD 260 local and branch coverage receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cbd-260-static-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/cbd-260-static/
            ${{ runner.temp }}/cbd-260-module-coverage.json
          if-no-files-found: warn

      - name: Execute bounded native host and LLDB preflight
        working-directory: tools/everred_v3
        env:
          SOURCE_HEAD_SHA: >-
            ${{ github.event.pull_request.head.sha || github.sha }}
          EXECUTION_REPO: ${{ github.repository }}
          EXECUTION_RUN_ID: ${{ github.run_id }}
        run: |
          checked_out_sha="$(git -C ../.. rev-parse HEAD)"
          python scripts/four_plane_preflight.py \
            --repo "$EXECUTION_REPO" \
            --sha "$SOURCE_HEAD_SHA" \
            --executed-sha "$checked_out_sha" \
            --run-id "$EXECUTION_RUN_ID" \
            --probe-lldb \
            --output "$RUNNER_TEMP/everred-v31-preflight.json"
          sha256sum "$RUNNER_TEMP/everred-v31-preflight.json"
      - name: Upload four-plane evidence, never push
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: everred-v31-native-${{ matrix.python-version }}
          path: ${{ runner.temp }}/everred-v31-preflight.json
          if-no-files-found: warn
      - name: Verify committed Black and isort styles
        working-directory: tools/everred_v3
        run: |
          python -m pip install black==26.10.1 isort==9.0.2
          python -m black --check src scripts tests
          python -m isort --check-only src scripts tests
      - name: Produce source-bound Black repair patch on style failure
        if: failure()
        working-directory: tools/everred_v3
        env:
          EXPECTED_HEAD_SHA: >-
            ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_HEAD_SHA"
          python -m black --version
          python -m black src scripts tests
          python -m black --check src scripts tests
          git diff --check -- src scripts tests
          git diff --binary -- src scripts tests > "$RUNNER_TEMP/black-repair.patch"
          test -s "$RUNNER_TEMP/black-repair.patch"
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          base = Path(os.environ["RUNNER_TEMP"])
          head = os.environ["EXPECTED_HEAD_SHA"]
          names = subprocess.check_output(
              ["git", "diff", "--name-only", "--", "src", "scripts", "tests"],
              text=True,
          ).splitlines()
          patch = (base / "black-repair.patch").read_bytes()
          receipt = {
              "schema": "abacus.everred.black.repair_proposal.v1",
              "source_head_sha": head,
              "tool": "black",
              "tool_version": "26.10.1",
              "source_mutation": "RUNNER_ONLY_NO_PUSH",
              "changed_file_count": len(names),
              "changed_paths": sorted(names),
              "patch_sha256": hashlib.sha256(patch).hexdigest(),
              "root_closure_credit": 0,
              "merge_admission": "HOLD",
          }
          (base / "black-repair-receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Upload proposed Black patch and provenance
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: everred-black-repair-${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/black-repair.patch
            ${{ runner.temp }}/black-repair-receipt.json
          if-no-files-found: warn
  native-pulse:
    name: Read-only native run / joined census pulse
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      # actions/checkout v4.2.2, immutable SHA pin
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-python v5.6.0, immutable SHA pin
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Read existing run; reject SHA mismatch
        working-directory: tools/everred_v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_RUN_ID: ${{ inputs.target_run_id }}
          TARGET_SHA: ${{ inputs.target_sha }}
          SOURCE_REPO: ${{ github.repository }}
          ARTIFACT_PLAN_JSON: ${{ inputs.artifact_plan_json }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          val=os.environ.get('ARTIFACT_PLAN_JSON','').strip()
          if val:
              arr=json.loads(val)
              assert isinstance(arr,list) and len(arr)<=32
              Path('artifact-plan.json').write_text(json.dumps(arr))
          PY
          extra=()
          if [ -s artifact-plan.json ]; then
            extra=(--artifact-plan artifact-plan.json)
          fi
          python scripts/collect_native.py \
            --repo "$SOURCE_REPO" --sha "$TARGET_SHA" \
            --run-id "$TARGET_RUN_ID" \
            --output native-batch.json --apply-ledger "${extra[@]}"
          python src/everred.py verify
          python src/everred.py snapshot
          python src/control.py
          python scripts/build_joined_census.py
          python scripts/build_dashboard.py
      - name: Publish source-bound review artifacts, never push
        if: always()
        # actions/upload-artifact v4.6.2, immutable SHA pin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: everred-v3-observation-${{ github.run_id }}
          if-no-files-found: error
          path: |
            tools/everred_v3/native-batch.json
            tools/everred_v3/data/joined_native.json
            tools/everred_v3/data/kpi_history.jsonl
            tools/everred_v3/data/alerts.json
            tools/everred_v3/dashboard/index.html

  cbd-260-native-readonly:
    name: CBD 260 exact-run failure-job scout (no reruns)
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/everred-cbd-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Prove source checkout exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Native paginated job-step readback of 253 unique failed runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install defusedxml==0.7.1
          python tools/everred_v3/scripts/cbd_260.py \
            tools/everred_v3/data/cbd_260/N0_*.json \
            --output-dir "$RUNNER_TEMP/cbd-260-native" \
            --enrich-native --workers 4 --max-native-runs 256
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'cbd-260-native/summary.json').read_text())
          m=d['metrics']
          assert m['failed_workflow_associations']==260
          assert m['distinct_failed_run_ids']==253
          assert m['job_readbacks_accepted']+m['job_readbacks_withheld']==253
          assert d['safety']['merge_admission']=='HOLD'
          print('CBD_NATIVE_METADATA_READBACK',m['job_readbacks_accepted'],m['job_readbacks_withheld'])
          PY
      - name: Upload native CBD run/job/first-step custody
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cbd-260-native-sourcebound-${{ github.run_id }}
          path: ${{ runner.temp }}/cbd-260-native/
          if-no-files-found: warn
