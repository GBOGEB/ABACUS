name: QPS v24 exact metadata extract

on:
  push:
    branches:
      - qps-v24-exact-metadata-extract

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Recover and verify exact FULL v24 binary
        shell: bash
        run: |
          set -euo pipefail
          FROZEN='0291d43990d73a45058ad19fe5ce6ed97e92e178'
          PATH_IN_REPO='docs/qps_offer_rtm_evaluation/current/QPS_OFFER_Evaluation_FULL_v24.xlsx'
          EXPECTED_BLOB='bccab3a8ccf539db7c4a9636f1f2abee86885494'
          EXPECTED_SHA256='3e84a3cab305b5b6b9bcf73367a47b3d49fef9f74077cff95e5cfe7e1b4a7118'
          EXPECTED_SIZE='641318'

          if ! git cat-file -e "${FROZEN}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$FROZEN"
          fi

          PATH_BLOB="$(git rev-parse "${FROZEN}:${PATH_IN_REPO}")"
          echo "resolved_blob=$PATH_BLOB"
          test "$PATH_BLOB" = "$EXPECTED_BLOB"

          git cat-file blob "$EXPECTED_BLOB" > /tmp/QPS_OFFER_Evaluation_FULL_v24.xlsx
          ACTUAL_SIZE="$(wc -c < /tmp/QPS_OFFER_Evaluation_FULL_v24.xlsx | tr -d ' ')"
          ACTUAL_SHA256="$(sha256sum /tmp/QPS_OFFER_Evaluation_FULL_v24.xlsx | awk '{print $1}')"
          ACTUAL_BLOB="$(git hash-object /tmp/QPS_OFFER_Evaluation_FULL_v24.xlsx)"
          echo "actual_size=$ACTUAL_SIZE"
          echo "actual_sha256=$ACTUAL_SHA256"
          echo "actual_blob=$ACTUAL_BLOB"

          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"

      - name: Extract governed RTM ranking metadata directly
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from datetime import datetime, timezone
          from openpyxl import load_workbook
          from openpyxl.utils import get_column_letter

          path = '/tmp/QPS_OFFER_Evaluation_FULL_v24.xlsx'
          frozen = '0291d43990d73a45058ad19fe5ce6ed97e92e178'
          blob = 'bccab3a8ccf539db7c4a9636f1f2abee86885494'
          sha256 = '3e84a3cab305b5b6b9bcf73367a47b3d49fef9f74077cff95e5cfe7e1b4a7118'
          size = 641318
          targets = {f'RTM-{i:03d}' for i in list(range(48,64)) + list(range(281,310))}
          keep_re = re.compile(r'(rtm|rank|tier|priority|bradley|terry|\bbt\b|pca|score|lambda|weight|dimension|gate)', re.I)
          rtm_re = re.compile(r'^RTM[-_ ]?0*(\d{1,3})$', re.I)

          wb = load_workbook(path, data_only=False, read_only=False)
          wb_values = load_workbook(path, data_only=True, read_only=False)
          ws = wb['RTM_RANKING']
          wsv = wb_values['RTM_RANKING']

          header_row = None
          headers = {}
          rtm_col = None
          for r in range(1, min(ws.max_row, 20) + 1):
              row_headers = {}
              rank_seen = False
              candidate_rtm_col = None
              for c in range(1, ws.max_column + 1):
                  v = ws.cell(r, c).value
                  if v is None:
                      continue
                  s = str(v).strip()
                  row_headers[c] = s
                  if re.search(r'\brank\b', s, re.I):
                      rank_seen = True
                  if re.search(r'\brtm\b', s, re.I) and re.search(r'\b(id|identifier|requirement)?\b', s, re.I):
                      candidate_rtm_col = c
              if rank_seen and candidate_rtm_col:
                  header_row = r
                  headers = row_headers
                  rtm_col = candidate_rtm_col
                  break

          if header_row is None or rtm_col is None:
              raise RuntimeError('Could not identify RTM_RANKING header row and RTM ID column')

          metadata_cols = [c for c, label in headers.items() if keep_re.search(label)]
          if rtm_col not in metadata_cols:
              metadata_cols.append(rtm_col)
          metadata_cols = sorted(set(metadata_cols))

          direct = []
          seen = set()
          for r in range(header_row + 1, ws.max_row + 1):
              raw_id = ws.cell(r, rtm_col).value
              if raw_id is None:
                  continue
              m = rtm_re.match(str(raw_id).strip())
              if not m:
                  continue
              rid = f'RTM-{int(m.group(1)):03d}'
              if rid not in targets:
                  continue
              fields = {}
              for c in metadata_cols:
                  formula_v = ws.cell(r, c).value
                  value_v = wsv.cell(r, c).value
                  label = headers.get(c, '')
                  fields[label or get_column_letter(c)] = {
                      'column': get_column_letter(c),
                      'formula_or_value': formula_v,
                      'cached_value': value_v,
                  }
              direct.append({
                  'rtm_id': rid,
                  'sheet': 'RTM_RANKING',
                  'row': r,
                  'fields': fields,
              })
              if rid in seen:
                  raise RuntimeError(f'Duplicate direct RTM_RANKING row for {rid}')
              seen.add(rid)

          missing = sorted(targets - seen)
          if missing:
              raise RuntimeError(f'Missing governed RTM_RANKING rows: {missing}')

          out = {
              'schema': 'qps-v24-exact-prioritisation-metadata/v2',
              'source': {
                  'workbook': 'QPS_OFFER_Evaluation_FULL_v24.xlsx',
                  'frozen_commit': frozen,
                  'git_blob_sha1': blob,
                  'raw_sha256': sha256,
                  'size_bytes': size,
                  'path_at_frozen_commit': 'docs/qps_offer_rtm_evaluation/current/QPS_OFFER_Evaluation_FULL_v24.xlsx',
              },
              'extraction': {
                  'generated_at_utc': datetime.now(timezone.utc).isoformat(),
                  'tool': 'openpyxl 3.1.5 / GitHub Actions',
                  'scope': ['RTM-048..063', 'RTM-281..309'],
                  'sheet': 'RTM_RANKING',
                  'header_row': header_row,
                  'rtm_id_column': get_column_letter(rtm_col),
                  'selected_headers': [headers.get(c, get_column_letter(c)) for c in metadata_cols],
                  'bidder_evidence_used_in_derivation': False,
                  'note': 'Direct exact-row metadata extraction from provenance-bound FULL v24 RTM_RANKING only; no requirement text, OFFER mapping, compliance or closure mutation.',
              },
              'direct_rtm_ranking': sorted(direct, key=lambda x: x['rtm_id']),
          }
          with open('v24_target_extract.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, indent=2, ensure_ascii=False, default=str)
          print(json.dumps(out, indent=2, ensure_ascii=False, default=str))
          PY

      - name: Upload exact-source metadata extraction
        uses: actions/upload-artifact@v4
        with:
          name: qps-v24-exact-metadata
          path: v24_target_extract.json
          if-no-files-found: error
          retention-days: 7
