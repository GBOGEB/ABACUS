name: QPS v24 exact metadata extract

on:
  push:
    branches:
      - qps-v24-exact-metadata-extract

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Recover and verify exact FULL v24 binary
        shell: bash
        run: |
          set -euo pipefail
          FROZEN='0291d43990d73a45058ad19fe5ce6ed97e92e178'
          PATH_IN_REPO='docs/qps_offer_rtm_evaluation/current/QPS_OFFER_Evaluation_FULL_v24.xlsx'
          EXPECTED_BLOB='bccab3a8ccf539db7c4a9636f1f2abee86885494'
          EXPECTED_SHA256='3e84a3ca2052d6fb56d4a86d4c96364e8c6b8d673dea327353175578916a7118'
          EXPECTED_SIZE='641318'

          # The frozen commit is no longer reachable from current branch/tag refs after
          # binary cleanup, so a normal fetch-depth: 0 checkout does not guarantee the
          # object is present locally. Fetch that exact historical commit explicitly.
          if ! git cat-file -e "${FROZEN}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$FROZEN"
          fi

          PATH_BLOB="$(git rev-parse "${FROZEN}:${PATH_IN_REPO}")"
          test "$PATH_BLOB" = "$EXPECTED_BLOB"
          git cat-file blob "$EXPECTED_BLOB" > /tmp/QPS_OFFER_Evaluation_FULL_v24.xlsx
          test "$(wc -c < /tmp/QPS_OFFER_Evaluation_FULL_v24.xlsx | tr -d ' ')" = "$EXPECTED_SIZE"
          test "$(sha256sum /tmp/QPS_OFFER_Evaluation_FULL_v24.xlsx | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(git hash-object /tmp/QPS_OFFER_Evaluation_FULL_v24.xlsx)" = "$EXPECTED_BLOB"

      - name: Extract governed RTM prioritisation metadata only
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from datetime import datetime, timezone
          from openpyxl import load_workbook
          from openpyxl.utils import get_column_letter

          path = '/tmp/QPS_OFFER_Evaluation_FULL_v24.xlsx'
          frozen = '0291d43990d73a45058ad19fe5ce6ed97e92e178'
          blob = 'bccab3a8ccf539db7c4a9636f1f2abee86885494'
          sha256 = '3e84a3ca2052d6fb56d4a86d4c96364e8c6b8d673dea327353175578916a7118'
          size = 641318
          targets = {f'RTM-{i:03d}' for i in list(range(48,64)) + list(range(281,310))}
          keep_re = re.compile(r'(?:^|[^a-z])(rtm|rank|tier|priority|bradley|terry|\bbt\b|pca|score|lambda|weight|dimension|gate)(?:[^a-z]|$)', re.I)
          rtm_re = re.compile(r'RTM[-_ ]?0*(\d{1,3})\b', re.I)

          wb = load_workbook(path, data_only=False, read_only=True)
          wb_values = load_workbook(path, data_only=True, read_only=True)

          matches = []
          sheet_diagnostics = []
          for ws, wsv in zip(wb.worksheets, wb_values.worksheets):
              header_parts = {}
              for r in range(1, min(ws.max_row, 40) + 1):
                  for c in range(1, ws.max_column + 1):
                      v = ws.cell(r, c).value
                      if v is None:
                          continue
                      s = str(v).strip()
                      if not s or len(s) > 180:
                          continue
                      header_parts.setdefault(c, [])
                      if s not in header_parts[c]:
                          header_parts[c].append(s)
              labels = {c: ' | '.join(parts[-5:]) for c, parts in header_parts.items()}

              found_on_sheet = 0
              for r in range(1, ws.max_row + 1):
                  row_ids = set()
                  for c in range(1, ws.max_column + 1):
                      v = ws.cell(r, c).value
                      if v is None:
                          continue
                      for m in rtm_re.finditer(str(v)):
                          row_ids.add(f'RTM-{int(m.group(1)):03d}')
                  hit_ids = sorted(row_ids & targets)
                  if not hit_ids:
                      continue

                  metadata = {}
                  for c in range(1, ws.max_column + 1):
                      label = labels.get(c, '')
                      if not keep_re.search(label):
                          continue
                      formula_v = ws.cell(r, c).value
                      value_v = wsv.cell(r, c).value
                      if formula_v is None and value_v is None:
                          continue
                      key = f'{get_column_letter(c)}:{label}'
                      metadata[key] = {
                          'formula_or_value': formula_v,
                          'cached_value': value_v,
                      }
                  for rid in hit_ids:
                      matches.append({
                          'rtm_id': rid,
                          'sheet': ws.title,
                          'row': r,
                          'metadata': metadata,
                      })
                      found_on_sheet += 1
              sheet_diagnostics.append({
                  'sheet': ws.title,
                  'max_row': ws.max_row,
                  'max_column': ws.max_column,
                  'target_row_hits': found_on_sheet,
              })

          out = {
              'schema': 'qps-v24-exact-prioritisation-metadata/v1',
              'source': {
                  'workbook': 'QPS_OFFER_Evaluation_FULL_v24.xlsx',
                  'frozen_commit': frozen,
                  'git_blob_sha1': blob,
                  'raw_sha256': sha256,
                  'size_bytes': size,
                  'path_at_frozen_commit': 'docs/qps_offer_rtm_evaluation/current/QPS_OFFER_Evaluation_FULL_v24.xlsx',
              },
              'extraction': {
                  'generated_at_utc': datetime.now(timezone.utc).isoformat(),
                  'tool': 'openpyxl 3.1.5 / GitHub Actions',
                  'scope': ['RTM-048..063', 'RTM-281..309'],
                  'bidder_evidence_used_in_derivation': False,
                  'note': 'Read-only extraction from exact provenance-bound FULL v24 binary; no requirement text, OFFER mapping, compliance or closure mutation.',
              },
              'sheet_diagnostics': sheet_diagnostics,
              'matches': matches,
          }
          with open('v24_target_extract.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, indent=2, ensure_ascii=False, default=str)
          print(json.dumps(out, indent=2, ensure_ascii=False, default=str))
          PY

      - name: Upload exact-source metadata extraction
        uses: actions/upload-artifact@v4
        with:
          name: qps-v24-exact-metadata
          path: v24_target_extract.json
          if-no-files-found: error
          retention-days: 7
