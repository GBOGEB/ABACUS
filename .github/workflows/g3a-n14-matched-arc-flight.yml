name: G3A N14-N15 matched four-module branch flight
on:
  pull_request:
    paths:
      - 'tests/test_g3a_n14_debug.py'
      - 'tests/test_g3a_n14_improve.py'
      - 'tests/test_g3a_n15_phase8.py'
      - 'tests/test_g3a_w16_*.py'
      - 'DMAIC_V3/phases/phase4_improve.py'
      - 'MIP/statistics/g3a_w16_kpi.py'
      - 'scripts/g3a_w16_preflight.py'
      - '.github/workflows/g3a-n14-matched-arc-flight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched-four-module:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: W16 preflight before Python provisioning
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/g3a_w16_preflight.py --expected-head "$EXPECTED_HEAD" --out test_reports/n16/preflight.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Source guard
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object DMAIC_V3/debug_pipeline.py)" = 730cab72408ac473fb89123d9d76bb7a2edb075e
          test "$(git hash-object DMAIC_V3/phases/phase4_improve.py)" = 18bec722fef537aa74b85295954cf66a002695d0
          test "$(git hash-object DMAIC_V3/phases/phase8_todo_management.py)" = e9e4edd4c2b5b23a850892efb40b0c256a9ce490
          test "$(git hash-object cicd_github_orchestrator.py)" = 2e0f80b8f476d6f4eab05defb52aae2f77e30c61
      - name: Install coverage and PyYAML
        run: python -m pip install --disable-pip-version-check 'coverage==7.16.2' 'PyYAML==6.0.2'
      - name: W16 source-epoch single-process branch flight
        run: |
          set -euo pipefail
          mkdir -p test_reports/n16
          date +%s > test_reports/n16/test-start.txt
          set +e
          python -m coverage run --branch --source=DMAIC_V3.phases.phase4_improve,DMAIC_V3.phases.phase8_todo_management,DMAIC_V3.debug_pipeline,cicd_github_orchestrator,scripts -m unittest discover -s tests -p 'test_g3a_*.py' -v 2>&1 | tee test_reports/n16/unittest.log
          test_exit="${PIPESTATUS[0]}"
          set -e
          date +%s > test_reports/n16/test-end.txt
          test "$test_exit" -eq 0
          python -m coverage json -o test_reports/n16/coverage.json
      - name: Fail-closed frozen denominators and test proof
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json,os,pathlib,re,subprocess,sys
          root=pathlib.Path("test_reports/n16")
          data=json.loads((root/"coverage.json").read_text())
          expected={"DMAIC_V3/debug_pipeline.py":(116,94),
                    "DMAIC_V3/phases/phase4_improve.py":(132,None),
                    "DMAIC_V3/phases/phase8_todo_management.py":(118,30),
                    "cicd_github_orchestrator.py":(78,23),
                    "scripts/g3a_bounded_mission.py":(116,105)}
          if data["meta"]["version"]!="7.16.2":sys.exit("HOLD: instrumentation drift")
          files={}
          for path,(den,old) in expected.items():
            hits=[v for k,v in data["files"].items() if k==path or k.endswith("/"+path)]
            if len(hits)!=1:sys.exit("HOLD: missing/duplicated scope "+path)
            v=hits[0];s=v["summary"]
            if s["num_branches"]!=den or (old is not None and s["covered_branches"]<old):sys.exit("HOLD: scope drift/regression "+path)
            files[path]={"eligible":den,"covered":s["covered_branches"],"baseline":old,
                         "executed_branches":v.get("executed_branches",[])}
          log=(root/"unittest.log").read_text()
          counts=re.findall(r"Ran (\d+) tests? in",log)
          if not counts or int(counts[-1])<121 or "\nOK" not in log:sys.exit("HOLD: W16 cohort incomplete")
          total=sum(v["covered"] for k,v in files.items() if k!="scripts/g3a_bounded_mission.py")
          receipt={"schema":"code-purple.g3a.w16.native.v1",
                   "source_epoch":"G3A_W16_V2_PHASE4_REPAIRED",
                   "run_id":int(os.environ["RUN_ID"]),"run_attempt":int(os.environ["RUN_ATTEMPT"]),
                   "checkout_sha":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
                   "phase4_source_blob":subprocess.check_output(["git","hash-object",
                       "DMAIC_V3/phases/phase4_improve.py"],text=True).strip(),
                   "tests":int(counts[-1]),"covered":total,"eligible":444,
                   "historical_n14":{"covered":200,"eligible":446,"same_epoch":False,
                                     "delta_pp":None},
                   "phase8_same_blob_gain":files["DMAIC_V3/phases/phase8_todo_management.py"]["covered"]-30,
                   "candidate_roots_closed":0,"files":{k:v for k,v in files.items()
                         if k!="scripts/g3a_bounded_mission.py"},
                   "control_file":files["scripts/g3a_bounded_mission.py"],
                   "security_waiver":False,"merge_admission":"HOLD"}
          if total<0 or total>444:sys.exit("HOLD: four-module arithmetic invalid")
          (root/"n16_receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True))
          print("W16_SOURCE_EPOCH=444; COVERED="+str(total)+
                "; Phase8 same-blob delta="+str(receipt["phase8_same_blob_gain"]))
          print("N14_VS_W16_CROSS_EPOCH_DELTA=NOT_COMPARABLE")
          print("MERGE_ADMISSION=HOLD")
          PY
      - name: Write bounded five-KPI receipt including failure states
        if: always()
        run: |
          python3 MIP/statistics/g3a_w16_kpi.py --receipt test_reports/n16/n16_receipt.json --start-s test_reports/n16/test-start.txt --end-s test_reports/n16/test-end.txt --out test_reports/n16/w16_kpis.json
      - name: Preserve test evidence even on red
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: g3a-w16-${{ github.run_id }}-${{ github.run_attempt }}
          path: test_reports/n16/
          if-no-files-found: warn
