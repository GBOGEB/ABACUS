name: G3A N14-N15 matched four-module branch flight
on:
  pull_request:
    paths:
      - 'tests/test_g3a_n14_debug.py'
      - 'tests/test_g3a_n14_improve.py'
      - 'tests/test_g3a_n15_phase8.py'
      - '.github/workflows/g3a-n14-matched-arc-flight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched-four-module:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Source guard
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          actual="$(git hash-object DMAIC_V3/debug_pipeline.py)"
          test "$actual" = "730cab72408ac473fb89123d9d76bb7a2edb075e"
          actual="$(git hash-object DMAIC_V3/phases/phase4_improve.py)"
          test "$actual" = "c86e8e3406f0942f7c0dc3eda4952588308c169d"
          actual="$(git hash-object DMAIC_V3/phases/phase8_todo_management.py)"
          test "$actual" = "e9e4edd4c2b5b23a850892efb40b0c256a9ce490"
          actual="$(git hash-object cicd_github_orchestrator.py)"
          test "$actual" = "2e0f80b8f476d6f4eab05defb52aae2f77e30c61"
      - name: Install coverage and PyYAML
        run: |
          python -m pip install --disable-pip-version-check \
            'coverage==7.16.2' 'PyYAML==6.0.2'
      - name: N13 plus N14 single-process matched coverage
        run: |
          set -euo pipefail
          mkdir -p test_reports/n15
          source_modules="DMAIC_V3.phases.phase4_improve,"
          source_modules="${source_modules}DMAIC_V3.phases."
          source_modules="${source_modules}phase8_todo_management,"
          source_modules="${source_modules}DMAIC_V3.debug_pipeline,"
          source_modules="${source_modules}cicd_github_orchestrator,scripts"
          python -m coverage run --branch \
            --source="$source_modules" -m unittest discover \
            -s tests -p 'test_g3a_*.py' -v 2>&1 \
            | tee test_reports/n15/unittest.log
          python -m coverage json -o test_reports/n15/coverage.json
      - name: Fail-closed frozen denominators and test proof
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json,os,pathlib,re,sys
          root=pathlib.Path("test_reports/n15")
          data=json.loads((root/"coverage.json").read_text())
          expected={"DMAIC_V3/debug_pipeline.py":(116,17),
                    "DMAIC_V3/phases/phase4_improve.py":(134,45),
                    "DMAIC_V3/phases/phase8_todo_management.py":(118,30),
                    "cicd_github_orchestrator.py":(78,23),
                    "scripts/g3a_bounded_mission.py":(116,105)}
          if data["meta"]["version"] != "7.16.2":
              sys.exit("HOLD: instrumentation drift")
          files={}
          for path,(den,old) in expected.items():
            hits = [
                v for k, v in data["files"].items()
                if k == path or k.endswith("/" + path)
            ]
            if len(hits)!=1:sys.exit("HOLD: missing/duplicated scope "+path)
            v=hits[0];s=v["summary"]
            if s["num_branches"] != den or s["covered_branches"] < old:
                sys.exit("HOLD: scope drift/regression " + path)
            files[path] = {
                "eligible": den,
                "covered": s["covered_branches"],
                "baseline": old,
                "executed_branches": v.get("executed_branches", []),
            }
          log=(root/"unittest.log").read_text()
          counts=re.findall(r"Ran (\d+) tests? in",log)
          if not counts or int(counts[-1]) < 112 or "\nOK" not in log:
              sys.exit("HOLD: N13+N14+N15 tests incomplete")
          total = sum(
              v["covered"] for k, v in files.items()
              if k != "scripts/g3a_bounded_mission.py"
          )
          phase8 = files["DMAIC_V3/phases/phase8_todo_management.py"]
          receipt = {
              "schema": "code-purple.g3a.n15.native.v1",
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "tests": int(counts[-1]),
              "covered": total,
              "eligible": 446,
              "n13_baseline_covered": 115,
              "n14_baseline_covered": 200,
              "phase8_n14_baseline": 30,
              "phase8_new_count": phase8["covered"] - 30,
              "delta_count": total - 115,
              "files": files,
              "accepted_roots": None,
              "security_waiver": False,
              "merge_admission": "HOLD",
          }
          (root / "n15_receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True)
          )
          print(f"N15_MATCHED_COUNT={total}/446; N14_delta={total - 200}")
          print("MERGE_ADMISSION=HOLD")
          PY
      - name: Preserve test evidence even on red
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: g3a-n15-${{ github.run_id }}-${{ github.run_attempt }}
          path: test_reports/n15/
          if-no-files-found: warn
