name: codespace_jyperter Federation Check

# Validates the DELTA_1 auxiliary-plane integration between
# GBOGEB/codespace_jyperter and GBOGEB/ABACUS.
#
# Triggers:
#   - push / PR touching federation files or the integration bridge
#   - workflow_dispatch (manual trigger from CI or codespace_jyperter via
#     repository_dispatch is handled by the separate codespace-federation-dispatch.yml)

on:
  push:
    branches: ["**"]
    paths:
      - 'federation/manifest.yaml'
      - 'runtime/federation/codex-abacus-federation.yaml'
      - 'integration/codespace_jyperter/**'
      - 'src/dmaic/federation.py'
      - 'src/dmaic/contract.py'
      - '.github/workflows/codespace-federation.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'federation/manifest.yaml'
      - 'runtime/federation/codex-abacus-federation.yaml'
      - 'integration/codespace_jyperter/**'
      - 'src/dmaic/federation.py'
      - 'src/dmaic/contract.py'
  workflow_dispatch:
    inputs:
      triggered_by:
        description: 'Triggering repository (e.g. GBOGEB/codespace_jyperter)'
        required: false
        default: 'manual'
  repository_dispatch:
    types: [codespace_jyperter_federation_check]

env:
  PYTHON_VERSION: '3.12'

jobs:
  federation-smoke:
    name: 🔗 Federation Smoke — codespace_jyperter
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout ABACUS
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-federation-${{ hashFiles('DMAIC_V3/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml
          if [ -f DMAIC_V3/requirements.txt ]; then
            pip install -r DMAIC_V3/requirements.txt
          fi

      - name: Validate federation manifest YAML
        run: |
          python -c "
          import yaml, sys
          with open('federation/manifest.yaml') as f:
              data = yaml.safe_load(f)
          assert 'federation' in data, 'missing federation key'
          members = [m['name'] for m in data['federation'].get('member_repos', [])]
          assert 'GBOGEB/codespace_jyperter' in members, \
              f'GBOGEB/codespace_jyperter not in member_repos: {members}'
          print('federation/manifest.yaml OK — codespace_jyperter registered')
          "

      - name: Validate runtime federation spec YAML
        run: |
          python -c "
          import yaml
          with open('runtime/federation/codex-abacus-federation.yaml') as f:
              data = yaml.safe_load(f)
          assert 'federation' in data
          planes = data['federation'].get('auxiliary_planes', [])
          repos = [p.get('repository') for p in planes]
          assert 'GBOGEB/codespace_jyperter' in repos, \
              f'codespace_jyperter not in auxiliary_planes: {repos}'
          print('codex-abacus-federation.yaml OK — auxiliary plane registered')
          "

      - name: Run ABACUS federation assimilation smoke tests
        run: |
          python -m pytest DMAIC_V3/tests/test_smoke_federation.py -m smoke -v --tb=short

      - name: Run codespace_jyperter integration smoke tests
        run: |
          python -m pytest integration/codespace_jyperter/tests/test_smoke_federation.py -v --tb=short

      - name: Validate integration contract YAML
        run: |
          python -c "
          import yaml
          with open('integration/codespace_jyperter/abacus_contract.yaml') as f:
              data = yaml.safe_load(f)
          assert 'contract' in data
          c = data['contract']
          assert c.get('consumer') == 'GBOGEB/codespace_jyperter'
          assert c.get('provider') == 'GBOGEB/ABACUS'
          assert 'consumed_from_abacus' in c
          assert 'produced_for_abacus' in c
          print('abacus_contract.yaml OK')
          "

      - name: Verify downstream consumer registration
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from src.dmaic.contract import DOWNSTREAM_CONSUMERS
          assert 'codespace_jyperter' in DOWNSTREAM_CONSUMERS, \
              'codespace_jyperter missing from DOWNSTREAM_CONSUMERS'
          entry = DOWNSTREAM_CONSUMERS['codespace_jyperter']
          assert entry['repo'] == 'GBOGEB/codespace_jyperter'
          assert entry['plane'] == 'auxiliary'
          print('DOWNSTREAM_CONSUMERS OK:', entry)
          "

      - name: Upload federation check summary
        if: always()
        run: |
          echo "## 🔗 codespace_jyperter Federation Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event.inputs.triggered_by || github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_STEP_SUMMARY
