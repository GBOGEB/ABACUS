name: Review Artifact Validation
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'ssot/**'
      - 'governance/**'
      - 'scripts/validate_review_package.py'
      - '.github/workflows/review-artifact-validation.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'ssot/**'
      - 'governance/**'
      - 'scripts/validate_review_package.py'
      - '.github/workflows/review-artifact-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python scripts/validate_runtime_foundation.py
