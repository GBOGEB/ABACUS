name: MIP v2 federated control

on:
  pull_request:
    paths:
      - "MIP/V2_**"
      - "scripts/mip_v2_*.py"
      - "tests/test_mip_v2_*.py"
      - ".github/workflows/mip-v2-federated-control.yml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "MIP/V2_**"
      - "scripts/mip_v2_*.py"
      - "tests/test_mip_v2_*.py"
      - ".github/workflows/mip-v2-federated-control.yml"

permissions:
  contents: read

jobs:
  federated-control-baseline:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact evaluated SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest numpy

      - name: Exercise controller transition tests
        run: >-
          python -m pytest -q
          tests/test_mip_v2_federated_controller.py
          tests/test_qps_triage_dow_contract.py

      - name: Execute baseline controller
        run: |
          python scripts/mip_v2_federated_controller.py \
            --summary "${RUNNER_TEMP}/mip-v2-control-summary.json"

      - name: Validate bounded WAIT state
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "mip-v2-control-summary.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["scope_id"] == "mip_v2_federated_closed_loop_control"
          assert data["gate_count"] == 10
          assert data["controller_head_sha"] == os.environ["EXPECTED_SHA"]
          assert data["controller_state"] == "WAIT_KEB_RECEIPT"
          assert data["gate_observations"]["V2-G1"] == "PASS"
          assert data["gate_observations"]["V2-G2"] == "PASS"
          assert data["gate_observations"]["V2-G3"] == "PASS"
          assert data["gate_observations"]["V2-G4"] == "PASS"
          assert data["gate_observations"]["V2-G5"] == "NOT_RUN"
          assert data["global_project_dov"] == "WITHHELD"
          assert data["authority_transfer"] is False
          PY

      - name: Confirm source checkout remains clean
        run: test -z "$(git status --porcelain)"

      - name: Publish sanitized controller checkpoint
        run: |
          {
            echo '## MIP v2 federated control baseline'
            echo '```json'
            cat "${RUNNER_TEMP}/mip-v2-control-summary.json"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload sanitized checkpoint only
        uses: actions/upload-artifact@v4
        with:
          name: mip-v2-control-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/mip-v2-control-summary.json
          if-no-files-found: error
          retention-days: 14
