name: QPLANT Runtime Evidence (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Manual artifact evidence only. deploy-docs.yml is the sole Pages publisher.
  group: qplant-runtime-evidence
  cancel-in-progress: false

jobs:
  build-runtime-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Install build dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Build QPLANT visualization
        run: python build_qplant_visualization.py

      - name: Copy runtime page to docs
        run: |
          mkdir -p docs
          cp dist/qplant_visualization.html docs/qplant_visualization.html

      - name: Build CI gate rollup feed
        run: python tools/gate_rollup.py

      - name: Publish runtime governance feeds
        run: |
          mkdir -p docs/api docs/reports
          cp rtm/trace_matrix.json docs/api/rtm_trace_matrix.json
          cp reports/*.json docs/reports/ 2>/dev/null || true

      - name: Validate W007 runtime foundation
        run: python scripts/validate_runtime_foundation.py

      - name: Generate run-bound W007 governance status
        run: >-
          python scripts/write_runtime_governance_status.py
          --output docs/reports/runtime_governance_status.json

      - name: Record artifact-only runtime status
        run: |
          mkdir -p reports
          cat > reports/runtime_publish_status.json <<'JSON'
          {
            "wave": "W005.1",
            "runtime_status": "artifact_only",
            "runtime_evidence": true,
            "deployment_evidence": false
          }
          JSON

      - name: Upload runtime evidence artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: qplant-runtime-evidence
          path: |
            dist/qplant_visualization.html
            docs/reports/runtime_governance_status.json
            reports/runtime_publish_status.json
