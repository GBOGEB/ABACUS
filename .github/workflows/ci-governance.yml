name: CI Workflow Governance

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "ci/governance/**"
      - "ci/governance/tests/**"
      - "docs/ci/WORKFLOW_RATIONALIZATION.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "ci/governance/**"
      - "ci/governance/tests/**"
      - "docs/ci/WORKFLOW_RATIONALIZATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-and-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Validate workflow policy
        run: python -m unittest discover -s ci/governance/tests -p 'test_*.py' -v
      - name: Validate REX workflow immutability and exact-source controls
        run: python ci/governance/validate_mission_workflow_controls.py
      - name: Generate governed inventory
        run: |
          python ci/governance/audit_ci_workflows.py \
            --check \
            --json-output ci-governance-report.json \
            --markdown-output docs/ci/WORKFLOW_RATIONALIZATION.md
      - name: Upload inventory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-governance-report
          path: |
            ci-governance-report.json
            docs/ci/WORKFLOW_RATIONALIZATION.md
