name: CI Workflow Governance

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "ci/governance/**"
      - "ci/governance/tests/**"
      - "docs/ci/WORKFLOW_RATIONALIZATION.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "ci/governance/**"
      - "ci/governance/tests/**"
      - "docs/ci/WORKFLOW_RATIONALIZATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-and-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Validate REX workflow immutability and exact-source controls
        run: python ci/governance/validate_mission_workflow_controls.py

      - name: Validate workflow policy and retain first-red
        id: policy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s ci/governance/tests -p 'test_*.py' -v \
            2>&1 | tee ci-governance-unittest.log

      - name: Check governed inventory and retain first-red
        id: inventory
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python ci/governance/audit_ci_workflows.py \
            --check \
            --json-output ci-governance-report.json \
            --markdown-output docs/ci/WORKFLOW_RATIONALIZATION.md \
            2>&1 | tee ci-governance-inventory.log

      - name: Generate exact derived inventory candidate
        if: always()
        shell: bash
        run: |
          python ci/governance/audit_ci_workflows.py \
            --json-output ci-governance-generated-report.json \
            --markdown-output ci-governance-generated-rationalization.md \
            > ci-governance-generation.log 2>&1 || true

      - name: Upload governance diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-governance-first-red-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ci-governance-unittest.log
            ci-governance-inventory.log
            ci-governance-report.json
            ci-governance-generation.log
            ci-governance-generated-report.json
            ci-governance-generated-rationalization.md
            docs/ci/WORKFLOW_RATIONALIZATION.md
          if-no-files-found: warn

      - name: Fail closed on governance red
        if: always()
        env:
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
        shell: bash
        run: |
          echo "policy_outcome=$POLICY_OUTCOME"
          echo "inventory_outcome=$INVENTORY_OUTCOME"
          test "$POLICY_OUTCOME" = success
          test "$INVENTORY_OUTCOME" = success
