name: CI Workflow Governance

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "ci/governance/**"
      - "ci/governance/tests/**"
      - "docs/ci/WORKFLOW_RATIONALIZATION.md"
      - "MIP/EVIDENCE_TO_ADMISSION_OBSERVATORY/global/**"
  push:
    branches: [main, code-purple/w36-governance-seven-workflow-census-20261018, hold/cbd-w39-gov-dov-qa-20261018]
    paths:
      - ".github/workflows/**"
      - "ci/governance/**"
      - "ci/governance/tests/**"
      - "docs/ci/WORKFLOW_RATIONALIZATION.md"
      - "MIP/EVIDENCE_TO_ADMISSION_OBSERVATORY/global/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-and-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Validate REX workflow immutability and exact-source controls
        run: python ci/governance/validate_mission_workflow_controls.py

      - name: Validate workflow policy and retain first-red
        id: policy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s ci/governance/tests -p 'test_*.py' -v \
            2>&1 | tee ci-governance-unittest.log

      - name: Check governed inventory and retain first-red
        id: inventory
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python ci/governance/audit_ci_workflows.py \
            --check \
            --json-output ci-governance-report.json \
            --markdown-output docs/ci/WORKFLOW_RATIONALIZATION.md \
            2>&1 | tee ci-governance-inventory.log

      - name: Generate exact derived inventory candidate
        if: always()
        shell: bash
        run: |
          python ci/governance/audit_ci_workflows.py \
            --json-output ci-governance-generated-report.json \
            --markdown-output ci-governance-generated-rationalization.md \
            > ci-governance-generation.log 2>&1 || true

      - name: W36 read-only generated report return
        if: always()
        shell: bash
        run: |
          if test -s ci-governance-generated-rationalization.md; then
            echo W36_REPORT_BASE64_BEGIN
            base64 -w 0 ci-governance-generated-rationalization.md
            echo
            echo W36_REPORT_BASE64_END
          else
            echo W36_REPORT_GENERATOR_MISSING
            exit 1
          fi

      - name: W39 source-bound global DOV static and browser QA
        id: global
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python MIP/EVIDENCE_TO_ADMISSION_OBSERVATORY/global/render_global.py --check
          python -m unittest discover -s MIP/EVIDENCE_TO_ADMISSION_OBSERVATORY/global -p 'test_global_rollup.py' -v
          python -m pip install --disable-pip-version-check "playwright==1.57.0"
          python MIP/EVIDENCE_TO_ADMISSION_OBSERVATORY/global/qa_playwright.py --out w39_qa_receipts

      - name: Upload governance diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-governance-first-red-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ci-governance-unittest.log
            ci-governance-inventory.log
            ci-governance-report.json
            ci-governance-generation.log
            ci-governance-generated-report.json
            ci-governance-generated-rationalization.md
            docs/ci/WORKFLOW_RATIONALIZATION.md
            w39_qa_receipts/
          if-no-files-found: warn

      - name: Fail closed on governance red
        if: always()
        env:
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          GLOBAL_OUTCOME: ${{ steps.global.outcome }}
        shell: bash
        run: |
          echo "policy_outcome=$POLICY_OUTCOME"
          echo "inventory_outcome=$INVENTORY_OUTCOME"
          test "$POLICY_OUTCOME" = success
          test "$INVENTORY_OUTCOME" = success
          test "$GLOBAL_OUTCOME" = success
