name: CI Workflow Governance

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "ci/governance/**"
      - "scripts/audit_ci_workflows.py"
      - "tests/test_ci_workflow_policy.py"
      - "docs/ci/WORKFLOW_RATIONALIZATION.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "ci/governance/**"
      - "scripts/audit_ci_workflows.py"
      - "tests/test_ci_workflow_policy.py"
      - "docs/ci/WORKFLOW_RATIONALIZATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-and-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate workflow policy
        run: python -m unittest tests/test_ci_workflow_policy.py -v
      - name: Generate governed inventory
        run: |
          python scripts/audit_ci_workflows.py \
            --check \
            --json-output ci-governance-report.json \
            --markdown-output docs/ci/WORKFLOW_RATIONALIZATION.md
      - name: Upload inventory evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-governance-report
          path: |
            ci-governance-report.json
            docs/ci/WORKFLOW_RATIONALIZATION.md
