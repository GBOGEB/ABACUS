name: W79 Deterministic Multivariate

on:
  pull_request:
    paths:
      - "tools/w79_deterministic_multivariate.py"
      - "tests/test_w79_deterministic_multivariate.py"
      - ".github/workflows/w79-deterministic-multivariate.yml"
      - "ci/governance/workflow_policy.json"
      - "docs/ci/WORKFLOW_RATIONALIZATION.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  w79-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVALUATED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      W78_RUN_ID: "34777543492"
      W78_HEAD_SHA: "9d55b8ba73a05efaa3e519acacacd1dffb3c787c"
      W78_DIVERSITY_ARTIFACT_ID: "10323323552"
      W78_DIVERSITY_ARTIFACT_DIGEST: "sha256:6e0a868916c1730fdc8eefc1f24ffea06185ca56ef1a8caffdaeb325eed445ae"
    steps:
      - name: Checkout exact W79 PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert exact evaluated source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${EVALUATED_SOURCE_SHA}"
          printf 'evaluated_source_sha=%s\n' "${actual}"

      - name: Set up pinned Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pinned numerical dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet "numpy==2.3.3"
          python - <<'PY'
          import numpy
          assert numpy.__version__ == "2.3.3", numpy.__version__
          print(f"numpy={numpy.__version__}")
          PY

      - name: Run W79 regression tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_w79_deterministic_multivariate.py

      - name: Recompute 15 exact historical deterministic work states
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p architecture/w79/inputs
          cat > "${RUNNER_TEMP}/w79-targets.tsv" <<'EOF'
          s01	2a5104eecb2ab3ed340c2e63b3f2ba3b46cb56dd
          s02	107c889c87137bfc660a69bfd7dd1cfc121291fc
          s03	e2ae50cc6951a0fdead9e9b18ea52695c78984be
          s04	6f70a2926ecc2aa40e54f7d9f869f1804e4a1e41
          s05	c9bc44d217d81244e3f6753cd79ae45781b23163
          s06	e80e7b959c0f0759c48bb0ccf5378564aa29e0ff
          s07	b0761df32fc31c3757bb499f20af386f3569bebb
          s08	bffdc3779cd24ed18c043bde571d1d856cd5c8c2
          s09	1dfe11f59bca30c4d76ec8c22db237b0a37f1852
          s10	09c8a36c5a75816c71f2ec45667c3a5103e2a7de
          s11	e20f923b5994a2d817fe1fde5d625d189170127b
          s12	3e52a1db7560c56a4e67a9a0ffd5686600cfceb1
          s13	970bc70a016bc071cd3c97bfdbd012d48a85055d
          s14	c39696661d8d67c769c8031a962129c6d67c3935
          s15	8f7f419d388839a68a416aaa552846cae0c16ac3
          EOF
          while IFS=$'\t' read -r label sha; do
            git fetch --no-tags --depth=1 origin "${sha}"
            worktree="${RUNNER_TEMP}/w79-${label}-${sha:0:12}"
            git worktree add --detach "${worktree}" FETCH_HEAD
            python tools/w78_deterministic_work_probe.py \
              --root "${worktree}" \
              --source-sha "${sha}" \
              --repeat 1 \
              --matrix-label "${label}" \
              --out "architecture/w79/inputs/${label}.json"
            git worktree remove --force "${worktree}"
          done < "${RUNNER_TEMP}/w79-targets.tsv"
          test "$(find architecture/w79/inputs -name 's*.json' -type f | wc -l)" -eq 15

      - name: Execute W79 PCA and PA95 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t inputs < <(find architecture/w79/inputs -name 's*.json' -type f | sort)
          test "${#inputs[@]}" -eq 15
          python tools/w79_deterministic_multivariate.py \
            "${inputs[@]}" \
            --out architecture/w79/W79_MULTIVARIATE_RECEIPT.json \
            --w78-run-id "${W78_RUN_ID}" \
            --w78-head-sha "${W78_HEAD_SHA}" \
            --w78-artifact-id "${W78_DIVERSITY_ARTIFACT_ID}" \
            --w78-artifact-digest "${W78_DIVERSITY_ARTIFACT_DIGEST}"
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("architecture/w79/W79_MULTIVARIATE_RECEIPT.json").read_text())
          assert receipt["status"] == "DIAGNOSTIC_PCA_PA_COMPLETE"
          assert receipt["source_panel"]["target_count"] == 15
          assert receipt["bt_status"].startswith("WITHHELD")
          assert receipt["global_allocation_authority"] is False
          assert receipt["qps_credit_delta"] == 0
          print(json.dumps({
              "status": receipt["status"],
              "receipt_sha256": receipt["receipt_sha256"],
              "semantic_retained": receipt["primary_semantic_work_panel"]["parallel_analysis"]["retained_component_count"],
              "all_work_retained": receipt["all_work_sensitivity_panel"]["parallel_analysis"]["retained_component_count"],
          }, sort_keys=True))
          PY

      - name: Bind execution receipt to actual run job runner and analysis
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100"
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          candidates = [job for job in payload.get("jobs", []) if job.get("name") == "w79-analysis"]
          if len(candidates) != 1:
              raise RuntimeError(f"expected one w79-analysis job, found {len(candidates)}")
          job = candidates[0]
          runner_id = int(job.get("runner_id") or 0)
          completed_steps = [step for step in job.get("steps", []) if step.get("status") == "completed"]
          if runner_id == 0 or not completed_steps:
              raise RuntimeError("W79 execution receipt requires allocated runner and completed steps")

          analysis = json.loads(Path("architecture/w79/W79_MULTIVARIATE_RECEIPT.json").read_text())
          actual_head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected_head = os.environ["EVALUATED_SOURCE_SHA"]
          if actual_head != expected_head:
              raise RuntimeError(f"source identity mismatch: {actual_head} != {expected_head}")
          receipt = {
              "schema_version": "MC2-W79-EXECUTION-RECEIPT-0.1.0",
              "repository": repo,
              "evaluated_source_sha": expected_head,
              "workflow_run_id": int(run_id),
              "run_attempt": int(os.environ.get("GITHUB_RUN_ATTEMPT", "1")),
              "job_id": int(job["id"]),
              "job_name": job["name"],
              "runner_id": runner_id,
              "runner_name": job.get("runner_name"),
              "runner_group_name": job.get("runner_group_name"),
              "runner_labels": job.get("labels", []),
              "completed_step_count_before_receipt": len(completed_steps),
              "completed_step_names_before_receipt": [step["name"] for step in completed_steps],
              "analysis_receipt_sha256": analysis["receipt_sha256"],
              "analysis_status": analysis["status"],
              "execution_state": "PASS_GT_ZERO_STEPS",
              "authority": "execution_evidence_only",
              "global_allocation_authority": False,
              "child_engineering_promotion_authority": False,
              "qps_credit_delta": 0,
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()
          receipt["receipt_sha256"] = hashlib.sha256(canonical).hexdigest()
          out = Path("architecture/w79/W79_EXECUTION_RECEIPT.json")
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload W79 exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w79-deterministic-multivariate-${{ env.EVALUATED_SOURCE_SHA }}
          path: |
            architecture/w79/inputs/*.json
            architecture/w79/W79_MULTIVARIATE_RECEIPT.json
            architecture/w79/W79_EXECUTION_RECEIPT.json
          if-no-files-found: error
