name: MIP2 Method Qualification
on:
  pull_request:
    paths:
      - 'tools/mip2/**'
      - '.github/workflows/mip2-method-qualification.yml'
  workflow_dispatch:
  push:
    branches:
      - bd/mip2-control-20261014
    paths:
      - 'tools/mip2/**'
      - '.github/workflows/mip2-method-qualification.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test -n "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install pinned method tools
        run: python -m pip install pytest==9.1.1 coverage==7.16.2 black==26.10.0 isort==7.0.0 bandit==1.9.4 defusedxml==0.7.1
      - name: Verify installed toolchain
        run: |
          python -m pip freeze > mip3-pip-freeze.txt
          python -c 'import json,importlib.metadata as m; d=json.load(open("tools/mip2/mip3_toolchain.json")); assert all(m.version(k)==v for k,v in d["packages"].items())'
      - name: MIP3 preflight
        run: python tools/mip2/mip3_flight.py --phase preflight --output mip3-preflight.json
      - name: Validate method contracts
        run: python tools/mip2/validate_method_contracts.py
      - name: Execute seeded qualification corpus with branch coverage
        run: python -m coverage run --branch --source=tools/mip2 -m pytest tools/mip2/tests -v -rs --junitxml=mip2-junit.xml
      - name: Publish method coverage
        if: success()
        run: python -m coverage json -o mip2-coverage.json
      - name: Create local-compatible flight receipt
        if: success()
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/mip2/local_testflight.py --mode full --expected-head "$EXPECTED_HEAD" --output mip2-local-receipt.json
      - name: MIP3 postflight
        if: success()
        run: python tools/mip2/mip3_flight.py --phase postflight --junit mip2-junit.xml --receipt mip2-local-receipt.json --output mip3-postflight.json
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mip2-qualification
          path: |
            mip2-junit.xml
            mip2-local-receipt.json
            mip2-local-junit.xml
            mip2-coverage.json
            mip3-preflight.json
            mip3-postflight.json
            mip3-pip-freeze.txt
          if-no-files-found: warn
