name: CBD Scheduled Governed DAG
on:
  schedule:
    - cron: '23 5 * * 1-6'
  workflow_dispatch:
    inputs:
      method:
        type: choice
        required: true
        default: auto
        options: [auto, gogreen, everred, code_purple, full]
      full_ack:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: cbd-scheduled-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bounded-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Exact source and UTC date
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "UTC_DAY=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: Observe queue pressure (read-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          def count(status):
              url = ("https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"]
                     + "/actions/runs?status=" + status + "&per_page=1")
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28"})
              try:
                  with urllib.request.urlopen(req, timeout=12) as response:
                      value = json.load(response).get("total_count")
                  return value if type(value) is int and value >= 0 else None
              except (OSError, ValueError, KeyError):
                  return None
          d = {"schema": "abacus.cbd.scheduled_observation.v1",
               "repository": os.environ["GITHUB_REPOSITORY"],
               "source_sha": os.environ["GITHUB_SHA"],
               "capacity": {"queued": count("queued"),
                            "in_progress": count("in_progress")},
               "authority_transfer": False, "security_waiver": False,
               "merge_admission": "HOLD"}
          (Path(os.environ["RUNNER_TEMP"]) / "queue.json").write_text(
              json.dumps(d, sort_keys=True) + "\n")
          print("CAPACITY", d["capacity"])
          PY
      - name: Generate scheduled DAG and SIPOC
        id: plan
        env:
          METHOD: ${{ inputs.method || 'auto' }}
          ACK: ${{ inputs.full_ack || 'false' }}
        run: |
          set --
          if [ "$ACK" = "true" ]; then set -- --full-ack; fi
          python tools/everred_v3/scripts/cbd_scheduled_pulse.py \
            --observation "$RUNNER_TEMP/queue.json" \
            --utc-day "$UTC_DAY" --event "$GITHUB_EVENT_NAME" \
            --method "$METHOD" --output-dir "$RUNNER_TEMP/plan" \
            --github-output "$GITHUB_OUTPUT" "$@"
      - name: Prepare canonical gg_MATH provider request (no execution claim)
        if: steps.plan.outputs.execute_mode != 'none'
        run: |
          python tools/everred_v3/scripts/cbd_260.py \
            tools/everred_v3/data/cbd_260/N0_*.json \
            --output-dir "$RUNNER_TEMP/static"
          python tools/everred_v3/scripts/cbd_ggmath_bridge.py \
            --summary "$RUNNER_TEMP/static/summary.json" \
            --source-sha "$GITHUB_SHA" --output-dir "$RUNNER_TEMP/math"
      - name: GoGREEN positive negative reverse tests
        if: >
          steps.plan.outputs.execute_mode == 'gogreen' ||
          steps.plan.outputs.execute_mode == 'code_purple' ||
          steps.plan.outputs.execute_mode == 'full'
        run: |
          python -m unittest discover -s tools/everred_v3/tests \
            -p 'test_cbd_scheduled_pulse.py' -v
          python -m unittest discover -s tools/everred_v3/tests \
            -p 'test_cbd_ggmath_bridge.py' -v
          python -m unittest discover -s tools/everred_v3/tests \
            -p 'test_cbd_job_graph.py' -v
      - name: EVERRED native bounded 4-reader scout (no reruns)
        if: >
          steps.plan.outputs.execute_mode == 'everred' ||
          steps.plan.outputs.execute_mode == 'full'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install defusedxml==0.7.1
          python tools/everred_v3/scripts/cbd_260.py \
            tools/everred_v3/data/cbd_260/N0_*.json \
            --enrich-native --workers 4 --max-native-runs 256 \
            --output-dir "$RUNNER_TEMP/native"
          python tools/everred_v3/scripts/cbd_job_graph.py \
            tools/everred_v3/data/cbd_260/N0_*.json \
            --native-jobs "$RUNNER_TEMP/native/native_jobs.json" \
            --output-dir "$RUNNER_TEMP/native/dag"
      - name: CODE PURPLE review-only HOLD receipt
        if: >
          steps.plan.outputs.execute_mode == 'code_purple' ||
          steps.plan.outputs.execute_mode == 'full'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "code-purple-hold.json"
          p.write_text(json.dumps({
              "schema": "abacus.cbd.admission_readonly.v1",
              "source_sha": os.environ["GITHUB_SHA"],
              "governed_issue": 1860, "bd_owner": 1929,
              "security_pass": None, "independent_review": None,
              "main_coverage": None, "diff_coverage": None,
              "merge_admission": "HOLD", "authority_transfer": False,
              "security_waiver": False}, sort_keys=True) + "\n")
          PY
      - name: Publish artifacts without pushing or merging
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cbd-scheduled-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/queue.json
            ${{ runner.temp }}/plan/
            ${{ runner.temp }}/static/
            ${{ runner.temp }}/math/
            ${{ runner.temp }}/native/
            ${{ runner.temp }}/code-purple-hold.json
          if-no-files-found: warn
