name: W53 P05T QCELL JT Runtime
on:
  pull_request:
    paths:
      - 'qplant/w53_p05s_qcell_jt_flash_receipt.py'
      - 'qplant/data/w53_p05s_nist_tn1334_qcell_reference_v0.1.json'
      - 'models/helium_properties/provider.py'
      - '.github/workflows/w53-p05t-qcell-jt-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jt-flash-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install governed helium runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install CoolProp==7.2.0
      - name: Execute canonical receipt (NIST TN1334; the 31 mbar outlet is He II)
        run: |
          mkdir -p artifacts/w53_p05t
          python qplant/w53_p05s_qcell_jt_flash_receipt.py --reference nist-tn1334 | tee artifacts/w53_p05t/qcell_jt_flash_receipt.json
      - name: CoolProp default must refuse the sub-lambda outlet
        run: |
          if python qplant/w53_p05s_qcell_jt_flash_receipt.py > /dev/null 2> coolprop_err.txt; then
            echo "CoolProp receipt was produced below the lambda point; the He II guard did not fire" >&2
            exit 1
          fi
          grep -q HE_II_SUB_LAMBDA_OUT_OF_COOLPROP_RANGE coolprop_err.txt
          tail -n 1 coolprop_err.txt
      - name: Validate and summarize
        run: |
          python - <<'PY'
          import json
          p='artifacts/w53_p05t/qcell_jt_flash_receipt.json'
          with open(p, encoding='utf-8') as f: r=json.load(f)
          x=r['flash_quality_mass_fraction']
          assert 0.0 <= x <= 1.0
          assert abs(r['boundary']['outlet_local_QCELL']['P_mbar_abs']-31.0) < 1e-12
          assert r['validation'] == 'NIST_TN1334_INDEPENDENT_REFERENCE_HEPAK_GOVERNING'
          assert r['boundary']['outlet_local_QCELL']['T_sat_K'] < 2.1768  # He II outlet
          assert abs(x - 0.43643131189448126) < 1e-12  # cryoplant P05V
          print('flash_percent=', r['flash_percent_of_A'])
          print('Tsat_K=', r['boundary']['outlet_local_QCELL']['T_sat_K'])
          print('hA_J_kg=', r['boundary']['inlet_A']['h_J_kg'])
          print('hf_J_kg=', r['boundary']['outlet_local_QCELL']['h_f_J_kg'])
          print('hg_J_kg=', r['boundary']['outlet_local_QCELL']['h_g_J_kg'])
          for row in r['A_flow_cases']:
              print('A=', row['A_g_s'], 'flash=', row['JT_flash_g_s'], 'liquid=', row['post_flash_liquid_g_s'])
          PY
      - name: Upload receipt
        uses: actions/upload-artifact@v7
        with:
          name: w53-p05t-qcell-jt-flash-receipt
          path: artifacts/w53_p05t/qcell_jt_flash_receipt.json
