name: CI/CD Monitor, Issue Creator & Tracker

# Failure-only CI monitoring. Deployment-status aggregation was removed from
# automatic execution because high-frequency deployment events were consuming
# runner capacity and starving governed evidence workflows.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ci-failure-monitor
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read

jobs:
  monitor-and-create-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests PyGithub pytest pytest-json-report PyYAML
      - name: Download test artifacts
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: test-results
          path: ./test-results
        continue-on-error: true
      - name: Run tests and capture results
        run: pytest --json-report --json-report-file=test_report.json || true
        continue-on-error: true
      - name: Parse test results and create issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: python .github/scripts/create_issues_from_failures.py
