name: DOW Monitoring Dashboard

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Dashboard
        run: python DOW_DEPLOYMENT_ORCHESTRATOR.py --dashboard

      - name: Commit Dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DOW_LOGS/
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'chore: update monitoring dashboard [skip ci]'
            git push
          fi
