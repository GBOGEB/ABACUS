name: DOW Monitoring Dashboard

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

concurrency:
  group: dow-monitoring-dashboard
  cancel-in-progress: true

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Generate Dashboard
        run: python DOW_DEPLOYMENT_ORCHESTRATOR.py --dashboard
      - name: Commit Dashboard
        run: git add DOW_LOGS/* && git commit -m 'Update monitoring dashboard' || echo 'No changes'
