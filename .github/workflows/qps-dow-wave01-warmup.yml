name: QPS DOW Wave 01 Warm-up

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'DMAIC_V3/dow_integration_executor.py'
      - 'DMAIC_V3/local_mcp/agents/dow_metadata_injector.py'
      - 'DMAIC_V3/local_mcp/agents/dow_recursive_hooks_injector.py'
      - 'DMAIC_V3/local_mcp/agents/dow_convergence_calculator.py'
      - 'DMAIC_V3/local_mcp/agents/dow_knowledge_extractor.py'
      - 'DMAIC_V3/local_mcp/agents/recursive_self_ranking_v2.3_OPTIMIZED.py'
      - 'DMAIC_V3/local_mcp/agents/smoke_test_runner_ULTRA_OPTIMIZED.py'
      - 'local_mcp/agents/smoke_test_runner_ULTRA_OPTIMIZED.py'
      - 'federation/qps/wave-01/**'
      - '.github/workflows/qps-dow-wave01-warmup.yml'

permissions:
  contents: read

env:
  CORRELATION_ID: QPS-FED-W01
  TARGET_DIR: federation/qps/wave-01/input

jobs:
  dow-warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ABACUS
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DOW dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f DMAIC_V3/requirements.txt ]; then pip install -r DMAIC_V3/requirements.txt; fi

      - name: Stage 0 - show execution architecture
        run: |
          echo "QPS CHILD SSOT"
          echo "      |"
          echo "      v"
          echo "ABACUS DOW: metadata -> hooks -> convergence -> knowledge -> ranking -> validation"
          echo "      |"
          echo "      v"
          echo "RETURN ARTIFACT -> QPS CHILD DISPOSITION"
          echo "correlation_id=${CORRELATION_ID}"

      - name: Run canonical DOW integration executor
        id: dow
        continue-on-error: true
        run: |
          set +e
          python DMAIC_V3/dow_integration_executor.py --iteration 1 --target "${TARGET_DIR}" --verbose 2>&1 | tee federation/qps/wave-01/dow_run.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build execution-truth receipt
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          fixture = Path("federation/qps/wave-01/input/qps_federation_fixture.json")
          input_sha = hashlib.sha256(fixture.read_bytes()).hexdigest() if fixture.exists() else None
          result_file = Path("dow_integration_results_iteration_1.json")
          result = json.loads(result_file.read_text(encoding="utf-8")) if result_file.exists() else {"status": "missing_result", "results": []}
          expected = {1:"metadata_injection",2:"recursive_hooks",3:"convergence",4:"knowledge_extraction",5:"recursive_self_ranking",6:"validation"}
          by_stage = {int(item.get("stage")): item for item in result.get("results", []) if item.get("stage") is not None}
          stages = []
          for number, name in expected.items():
              item = by_stage.get(number)
              stages.append({
                  "stage_number": number,
                  "stage": name,
                  "status": item.get("status") if item else "NOT_REACHED",
                  "agent": item.get("agent") if item else None,
                  "mechanic_path": item.get("path") if item else None,
                  "reason": (item.get("reason") or item.get("error")) if item else None,
                  "executed": bool(item and item.get("status") == "success"),
              })
          receipt = {
              "schema": "abacus-dow-wave-receipt/v2",
              "correlation_id": "QPS-FED-W01",
              "engine": "DMAIC_V3/dow_integration_executor.py",
              "input_sha256": input_sha,
              "engine_status": result.get("status", "unknown"),
              "all_required_stages_pass": all(s["executed"] for s in stages),
              "stages": stages,
              "result_artifact": str(result_file),
              "child_disposition": None,
              "authority_rule": "Parent output cannot self-approve QPS engineering decisions"
          }
          Path("federation/qps/wave-01/dow_wave_receipt.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Publish visible stage summary
        run: |
          echo "## DOW Wave 01 — ${CORRELATION_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'QPS CHILD SSOT' '      |' '      v' 'ABACUS DOW' '  1 metadata' '  2 recursive hooks' '  3 convergence' '  4 knowledge extraction' '  5 self-ranking' '  6 validation' '      |' '      v' 'RETURN -> CHILD DISPOSITION' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat federation/qps/wave-01/dow_wave_receipt.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DOW warm-up artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qps-dow-wave01-${{ github.run_id }}
          path: |
            federation/qps/wave-01/dow_run.log
            federation/qps/wave-01/dow_wave_receipt.json
            federation/qps/wave-01/input/qps_federation_fixture.json
            dow_integration_results_iteration_1.json
          if-no-files-found: warn

      - name: Fail if any required canonical stage did not execute
        if: steps.dow.outputs.exit_code != '0'
        run: |
          echo "Canonical DOW executor returned exit code ${{ steps.dow.outputs.exit_code }}. Receipt identifies the blocked parent mechanic; artifacts are preserved for diagnosis."
          exit 1
