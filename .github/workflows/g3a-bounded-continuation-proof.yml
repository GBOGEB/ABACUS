name: G3A Governed Three-Advance Contract Proof
on:
  pull_request:
    paths:
      - scripts/g3a_bounded_mission.py
      - tests/test_g3a_bounded_mission.py
      - tests/test_g3a_child_probe.py
      - tests/test_g3a_n13_canary.py
      - docs/ci/G3A_EXAMPLE_MISSION.json
      - docs/ci/G3A_GOVERNED_THREE_ADVANCE.md
      - .github/workflows/g3a-bounded-continuation-proof.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g3a-readonly-proof:
    name: G3A bounded 3-checkpoint + coverage proof
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install coverage only
        run: python -m pip install 'coverage>=7.7,<8'
      - name: Test control and measure native branch coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test_reports/g3a
          python -m coverage run --branch --include='*/scripts/g3a_bounded_mission.py' -m unittest discover -s tests -p test_g3a_bounded_mission.py -v 2>&1 | tee test_reports/g3a/unittest.log
          python -m coverage json -o test_reports/g3a/coverage.json
      - name: Execute bound N to N+3 local demonstration
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python scripts/g3a_bounded_mission.py --spec docs/ci/G3A_EXAMPLE_MISSION.json --repo-root . --expected-head "$EXPECTED_HEAD" --out test_reports/g3a/mission-receipt.json
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('test_reports/g3a')
          receipt = json.loads((root / 'mission-receipt.json').read_text())
          cov = json.loads((root / 'coverage.json').read_text())['files']['scripts/g3a_bounded_mission.py']['summary']
          assert receipt['status'] == 'COMPLETE_LOCAL_3_OF_3' and receipt['accepted_checkpoints'] == 3
          assert cov['num_statements'] > 0 and cov['num_branches'] > 0
          assert cov['covered_lines'] * 100 >= 90 * cov['num_statements']
          assert cov['covered_branches'] * 100 >= 85 * cov['num_branches']
          assert receipt['merge_admission'] == 'HOLD' and receipt['formal_root_closures'] == 0
          print('Exact-head G3A local proof checked; merge admission remains HOLD')
          PY
      - name: Preserve immutable run receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: g3a-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: test_reports/g3a/
          if-no-files-found: warn

  n13-four-source-canary:
    name: N13 four-source branch canary Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind exact SHA and source blobs
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object DMAIC_V3/phases/phase4_improve.py)" = c86e8e3406f0942f7c0dc3eda4952588308c169d
          test "$(git hash-object DMAIC_V3/phases/phase8_todo_management.py)" = e9e4edd4c2b5b23a850892efb40b0c256a9ce490
          test "$(git hash-object DMAIC_V3/debug_pipeline.py)" = 730cab72408ac473fb89123d9d76bb7a2edb075e
          test "$(git hash-object cicd_github_orchestrator.py)" = 2e0f80b8f476d6f4eab05defb52aae2f77e30c61
      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install narrow coverage and YAML tools
        run: python -m pip install --disable-pip-version-check 'coverage==7.16.2' 'PyYAML==6.0.2'
      - name: Run old and new tests in one branch-instrumented cohort
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test_reports/n13
          python -m coverage run --branch --source=DMAIC_V3.phases.phase4_improve,DMAIC_V3.phases.phase8_todo_management,DMAIC_V3.debug_pipeline,cicd_github_orchestrator,scripts -m unittest discover -s tests -p 'test_g3a_*.py' -v 2>&1 | tee test_reports/n13/unittest.log
          python -m coverage json -o test_reports/n13/coverage.json
      - name: Validate branch denominators and collect candidate-red symptoms
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          NATIVE_RUN_ID: ${{ github.run_id }}
          NATIVE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,re,subprocess
          base=pathlib.Path('test_reports/n13')
          data=json.loads((base/'coverage.json').read_text())
          expected={
            'DMAIC_V3/phases/phase4_improve.py':134,
            'DMAIC_V3/phases/phase8_todo_management.py':118,
            'DMAIC_V3/debug_pipeline.py':116,
            'cicd_github_orchestrator.py':78,
            'scripts/g3a_bounded_mission.py':116,
          }
          measured={}
          for path,denom in expected.items():
            found=[s['summary'] for name,s in data['files'].items()
                   if name==path or name.endswith('/'+path)]
            if len(found)!=1:
              raise SystemExit('HOLD: missing or duplicate coverage scope '+path)
            s=found[0]
            if s['num_branches']!=denom:
              raise SystemExit('HOLD: source/instrumentation denominator drift '+path)
            if s['num_statements']<=0 or not 0<=s['covered_branches']<=s['num_branches']:
              raise SystemExit('HOLD: malformed coverage counts '+path)
            measured[path]={key:int(s[key]) for key in
                            ('num_statements','covered_lines','num_branches','covered_branches')}
          log=(base/'unittest.log').read_text()
          counts=re.findall(r'Ran (\d+) tests? in',log)
          if not counts or int(counts[-1])<76 or '\nOK' not in log:
            raise SystemExit('HOLD: 49 old+1 child+26 new methods not verified')
          candidates=[]
          for line in log.splitlines():
            if 'N13_CANDIDATE_SYMPTOM=' in line:
              v=json.loads(line.split('N13_CANDIDATE_SYMPTOM=',1)[1])
              if v.get('accepted_causal_root') is not False:
                raise SystemExit('HOLD: invalid root promotion')
              candidates.append(v)
          if len(candidates)<4 or len({v['id'] for v in candidates})!=len(candidates):
            raise SystemExit('HOLD: candidate observations absent or duplicated')
          new=sum(measured[k]['covered_branches'] for k in expected
                  if k!='scripts/g3a_bounded_mission.py')
          if new<=0:
            raise SystemExit('HOLD: no new source branches reached')
          receipt={
            'schema':'code-purple.g3a.n13.native-canary.v1',
            'repo':'GBOGEB/ABACUS','source_sha':os.environ['EXPECTED_HEAD'],
            'checkout_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'run_id':int(os.environ['NATIVE_RUN_ID']),
            'run_attempt':int(os.environ['NATIVE_RUN_ATTEMPT']),
            'native_job_id':None,'native_job_join':'PENDING_NATIVE_API',
            'tests_executed':int(counts[-1]),'tests_failed':0,
            'instrumentation_version':data.get('meta',{}).get('version'),
            'four_file_covered_branches':new,
            'four_file_eligible_branches':sum(measured[k]['num_branches'] for k in expected
                                              if k!='scripts/g3a_bounded_mission.py'),
            'five_file_covered_branches':sum(v['covered_branches'] for v in measured.values()),
            'five_file_eligible_branches':sum(v['num_branches'] for v in measured.values()),
            'files':measured,'candidates':candidates,
            'accepted_causal_roots':None,'matched_main_coverage_delta':None,
            'security_waiver':False,'authority_transfer':False,'merge_admission':'HOLD',
          }
          (base/'native_canary_receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('N13_NEW_FOUR_FILE_BRANCHES='+str(new)+'/446')
          print('N13_REPRODUCED_CANDIDATES='+str(sum(bool(x['reproduced']) for x in candidates)))
          print('N13_ADMISSION=HOLD')
          PY
      - name: Preserve source-bound canary receipts on any outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: g3a-n13-breadth-${{ github.run_id }}-${{ github.run_attempt }}
          path: test_reports/n13/
          if-no-files-found: warn
