name: OSV-Scanner Scheduled

# Full-repository dependency scanning is intentionally scheduled/manual.
# Per-push execution duplicated other security checks and created queue pressure.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  scan-scheduled:
    name: OSV Scan (schedule / manual)
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc" # v2.6.0
    with:
      scan-args: |-
        -r
        --skip-git
        ./
    permissions:
      security-events: write
      contents: read
      actions: read
