name: V5 W62 Twelve Cluster Requalification

on:
  pull_request:
    paths:
      - 'DMAIC_V3/core/twelve_cluster_orchestrator.py'
      - 'DMAIC_V3/tests/test_twelve_cluster_requalification.py'
      - '.github/workflows/v5-w62-twelve-cluster-requalification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  representative-adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact checkout SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Install bounded test dependency
        run: python -m pip install pytest
      - name: Execute representative and adversarial sample
        run: python -m pytest DMAIC_V3/tests/test_twelve_cluster_requalification.py -q
