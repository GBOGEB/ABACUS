schema_version: "0.2"
document_id: ABACUS_QPS_W04_DOW_QA_ACTIONS
status: parent_QA_action_contract
correlation_id: QPS-FED-W04-T10-SAFE-CTRL
child_repo: GBOGEB/cryoplant-project
child_prs: [141, 142, 143]
parent_pr: 722
runtime_trigger_wave: W04-runtime-retrigger-20260830
purpose: >-
  Capture parent-side ABACUS QA/DevOps actions exposed by the QPS W04
  exchange. This keeps parent hardening separate from child QPS engineering
  authority while making returned DOW evidence machine-checkable.

authority_boundary:
  ABACUS_role: parent_DOW_analysis_and_decomposition_lane
  child_authority: >-
    QPS owns engineering SSOT, Table-10 interpretation, Safety acceptance,
    compliance and completion.
  prohibition: >-
    ABACUS findings cannot self-promote into QPS maturity or compliance.

receipt_contract:
  required_fields:
    - correlation_id
    - child_source_ref
    - authoritative_child_sha
    - parent_commit_sha
    - run_id
    - artifact_id
    - input_hash
    - input_snapshot_hash
    - source_artifact_identities
    - source_artifact_set_sha256
    - prior_source_artifact_set_sha256
    - trigger_semantics
    - analysis_decision
    - lineage_state_hash
    - available_analysis_scope
    - requested_analysis_scope
    - semantic_trigger_scope
    - executed_analysis_scope
    - stage_status
    - typed_findings
    - child_disposition_placeholder
    - output_hash
  required_stage_status_fields:
    - stage_id
    - mechanic_path
    - executed
    - status
    - reason

QA_actions:
  - id: ABACUS-W04-QA-001
    title: enforce W04 receipt schema
    action: >-
      validate correlation, hashes, run/artifact identity and typed findings
    status: implemented
  - id: ABACUS-W04-QA-002
    title: typed DOW findings
    action: >-
      expose dependency, common-cause, PCA, reverse-catchup and BT
      observations as typed records, not prose-only output
    status: implemented
  - id: ABACUS-W04-QA-003
    title: fail-closed stage truth
    action: >-
      ensure each required DOW mechanic has explicit executed/status/reason
      fields
    status: implemented
  - id: ABACUS-W04-QA-004
    title: W04 nonconfidential fixture
    action: >-
      retain a non-confidential fixture for schema and authority validation
    status: implemented
  - id: ABACUS-W04-QA-005
    title: parent feedback intake
    action: >-
      accept child ACCEPT/REJECT/DEFER feedback without claiming QPS authority
    status: proposed
  - id: ABACUS-W04-QA-006
    title: distinguish source hash refresh from semantic DOW trigger
    action: >-
      bind typed source-artifact identity and suppress DOW findings for
      hash-only or unchanged-artifact refreshes unless semantic change or an
      explicit analysis request is present
    status: implemented_by_BDQ_003

finding_types_expected:
  - missing_atom
  - dependency_gap
  - common_cause_gap
  - C24_C30_tradeoff_gap
  - N_plus_1_or_spares_semantics_gap
  - PCA_feature_gap
  - reverse_PCA_catchup_candidate
  - BT_dependency_unlock_candidate

CI_or_DevOps_expectations:
  - receipt_schema_validation
  - fixture_hash_check
  - correlation_id_check
  - no_confidential_payload_check
  - all_required_stages_pass_or_fail_closed
  - typed_findings_lint
  - hash_only_refresh_zero_findings
  - idempotent_noop_stable_lineage_state_hash

child_return_contract:
  expected_child_dispositions: [ACCEPT, REJECT, DEFER]
  parent_learning_fields:
    - disposition_summary
    - accepted_parent_improvement
    - rejected_reason
    - deferred_reason
    - future_fixture_update

completion_effect:
  ABACUS_parent_maturity_delta: 0
  QPS_child_completion_delta: 0
  reason: >-
    parent trigger/receipt contract only; engineering authority remains in QPS
