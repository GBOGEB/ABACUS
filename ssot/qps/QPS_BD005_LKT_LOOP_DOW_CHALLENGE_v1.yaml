challenge_findings:
  - id: DOW-BD005-01
    finding: >-
      357 kW nominal at the current 112 g/s maximum reference exceeds the 350 kW EPS limit by 7 kW,
      while the stated +/-5% package-power tolerance spans both below and above the EPS limit. Therefore
      the maximum reference cannot establish LOOP feasibility or electrical margin.
    required_return: bidder_or_OEM_exact_LOOP_frequency_flow_package_power_point_and_tolerance
  - id: DOW-BD005-02
    finding: >-
      The 110 g/s LOOP claim is only about 1.8% below the 112 g/s maximum-flow reference. No power estimate
      is admitted from that proximity because the controlled source explicitly lacks the lower operating point
      and compressor/VFD package behavior is not linearly inferable here.
    required_return: measured_or_vendor_curve_point_not_interpolation
  - id: DOW-BD005-03
    finding: >-
      Recovery cooling water remains explicitly TO BE DEFINED. The normal 18.5 m3/h per-compressor reference
      cannot be reused as the PAB12 LOOP hydraulic state.
    required_return: recovery_CW_hydraulic_and_control_state
  - id: DOW-BD005-04
    finding: >-
      13.9 kW ambient radiation is arithmetically below the 15 kW LOOP ambient ceiling, but that does not
      establish room temperature response because degraded ventilation, effective free air volume, solid thermal
      inventory and duct routing remain unbound.
    required_return: degraded_HVAC_boundary_plus_thermal_inventory_then_first_law_transient

