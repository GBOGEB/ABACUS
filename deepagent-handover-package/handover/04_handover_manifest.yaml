# PPT WORKFLOW METHODOLOGY
# Special focus area as requested
ppt_workflow:
  overview: "Comprehensive methodology for PowerPoint processing, analysis, and content extraction"
  
  # --------------------------------------------------------------------------
  # Phase 1: Preparation
  # --------------------------------------------------------------------------
  preparation:
    description: "Setup and environment preparation"
    steps:
      - step: 1
        action: "Install required dependencies"
        commands:
          - "pip install python-pptx"
          - "pip install Pillow  # for image handling"
        notes: "Ensure Python 3.7+ is installed"
        
      - step: 2
        action: "Organize source files"
        details: "Place all .pptx files in a dedicated directory (e.g., /home/ubuntu/Uploads/)"
        best_practice: "Use consistent naming conventions"
        
      - step: 3
        action: "Identify file variants"
        notes: "Some presentations may have _fontnorm variants"
        decision: "Process unique presentations, skip duplicates"
  
  # --------------------------------------------------------------------------
  # Phase 2: Extraction
  # --------------------------------------------------------------------------
  extraction:
    description: "Extract structured data from PowerPoint files"
    
    method_1_pythonpptx:
      name: "Python-pptx Library (Recommended)"
      use_case: "Structured extraction with full metadata"
      
      script_template: |
        ```python
        from pptx import Presentation
        import json
        from pathlib import Path
        
        def extract_slide_content(slide):
            """Extract all content from a single slide."""
            slide_data = {
                "title": "",
                "text": [],
                "shapes": [],
                "tables": [],
                "images": [],
                "notes": ""
            }
            
            # Extract title
            if slide.shapes.title:
                slide_data["title"] = slide.shapes.title.text
            
            # Extract text from all shapes
            for shape in slide.shapes:
                if hasattr(shape, "text") and shape.text:
                    slide_data["text"].append(shape.text)
                
                # Extract tables
                if shape.has_table:
                    table_data = []
                    for row in shape.table.rows:
                        row_data = [cell.text for cell in row.cells]
                        table_data.append(row_data)
                    slide_data["tables"].append(table_data)
                
                # Track shape types
                slide_data["shapes"].append({
                    "type": shape.shape_type,
                    "name": shape.name if hasattr(shape, "name") else "Unknown"
                })
            
            # Extract notes
            if slide.has_notes_slide:
                notes_frame = slide.notes_slide.notes_text_frame
                if notes_frame:
                    slide_data["notes"] = notes_frame.text
            
            return slide_data
        
        def extract_presentation(pptx_path):
            """Extract all content from a PowerPoint presentation."""
            prs = Presentation(pptx_path)
            
            presentation_data = {
                "filename": Path(pptx_path).name,
                "total_slides": len(prs.slides),
                "slides": []
            }
            
            for idx, slide in enumerate(prs.slides, 1):
                slide_content = extract_slide_content(slide)
                slide_content["slide_number"] = idx
                presentation_data["slides"].append(slide_content)
            
            return presentation_data
        
        def extract_all_presentations(directory):
            """Extract content from all .pptx files in directory."""
            all_presentations = []
            
            for pptx_file in Path(directory).glob("*.pptx"):
                print(f"Processing: {pptx_file.name}")
                try:
                    pres_data = extract_presentation(pptx_file)
                    all_presentations.append(pres_data)
                except Exception as e:
                    print(f"Error processing {pptx_file.name}: {e}")
            
            return all_presentations
        
        # Main execution
        if __name__ == "__main__":
            presentations = extract_all_presentations("/home/ubuntu/Uploads")
            
            # Save to JSON
            with open("qsys_slide_dump.json", "w", encoding="utf-8") as f:
                json.dump(presentations, f, indent=2, ensure_ascii=False)
            
            print(f"Extracted {len(presentations)} presentations")
        ```
      
      advantages:
        - "Preserves slide structure and hierarchy"
        - "Extracts tables, shapes, images, and notes"
        - "Programmatic access to all slide elements"
        - "No external dependencies beyond python-pptx"
      
      limitations:
        - "May not preserve exact visual layout"
        - "Complex embedded objects may need special handling"
        - "Charts are not fully parsed (stored as shapes)"
    
    method_2_libreoffice:
      name: "LibreOffice CLI Conversion"
      use_case: "Convert to PDF or other formats"
      command: "libreoffice --headless --convert-to pdf --outdir output/ *.pptx"
      advantages:
        - "High-fidelity visual conversion"
        - "Preserves formatting and layout"
      limitations:
        - "Lossy for text extraction"
        - "Requires LibreOffice installation"
    
    method_3_cloudapis:
      name: "Cloud APIs (Google Slides API, Microsoft Graph)"
      use_case: "Cloud-native presentations"
      notes: "Requires authentication and API setup"
      advantages:
