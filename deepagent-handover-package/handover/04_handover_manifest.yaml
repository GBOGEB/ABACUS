    report_generation_script: |
      ```python
      def generate_markdown_report(analysis_results, output_path):
          """Generate markdown report from analysis."""
          report = f"""
      # QSYS Analysis Report
      
      ## Executive Summary
      - **Total Presentations**: {analysis_results['total_presentations']}
      - **Total Slides**: {analysis_results['total_slides']}
      
      ## Key Themes
      """
          for theme, count in analysis_results['themes'].items():
              report += f"- **{theme.title()}**: {count} occurrences\n"
          
          report += "\n## Top Keywords\n"
          for word, count in analysis_results['word_frequency']:
              report += f"- {word}: {count}\n"
          
          with open(output_path, 'w') as f:
              f.write(report)
      ```
  
