  # --------------------------------------------------------------------------
  common_pitfalls:
    - pitfall: "Embedded objects not extracted"
      solution: "Use python-pptx's shape.image property for embedded images"
      
    - pitfall: "Charts appear as generic shapes"
      solution: "Charts are complex; extract underlying data if available, or use OCR on exported images"
      
    - pitfall: "Notes slides missing"
      solution: "Always check slide.has_notes_slide before accessing notes"
      
    - pitfall: "Large files cause memory issues"
      solution: "Process files one at a time; use generators for streaming"
      
    - pitfall: "Special characters cause encoding errors"
      solution: "Always use UTF-8 encoding and ensure_ascii=False in JSON dumps"
  
