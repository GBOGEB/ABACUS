    - category: "Extraction"
      practices:
        - "Always validate extraction completeness (check slide counts)"
        - "Handle errors gracefully (some slides may be corrupted)"
        - "Extract incrementally for large batches"
        - "Log extraction process for debugging"
    
    - category: "Data Quality"
      practices:
