        - "API rate limits"
        - "Cost considerations"
  
  # --------------------------------------------------------------------------
  # Phase 3: Analysis
  # --------------------------------------------------------------------------
  analysis:
    description: "Analyze extracted content for insights"
    
    techniques:
      - name: "Text Analysis"
        methods:
          - "Keyword extraction (TF-IDF)"
          - "Topic modeling (LDA)"
          - "Sentiment analysis"
        tools:
          - "nltk"
          - "spacy"
          - "scikit-learn"
      
      - name: "Structural Analysis"
        methods:
          - "Slide hierarchy mapping"
          - "Section identification"
          - "Flow analysis"
        output: "Slide dependency graphs"
      
      - name: "Content Categorization"
        methods:
          - "Manual tagging by theme"
          - "Automated classification"
          - "Entity recognition"
        output: "Categorized slide groups"
      
      - name: "Visualization"
        methods:
          - "Word clouds for frequent terms"
          - "Bar charts for slide counts by category"
          - "Network graphs for cross-references"
        tools:
          - "matplotlib"
          - "plotly"
          - "networkx"
    
    analysis_script_example: |
      ```python
      import json
      from collections import Counter
      import re
      
      def analyze_slide_data(json_path):
          """Analyze extracted slide data."""
          with open(json_path, 'r') as f:
              data = json.load(f)
          
          # Statistics
          total_slides = sum(p["total_slides"] for p in data)
          total_presentations = len(data)
          
          # Text analysis
          all_text = []
          for pres in data:
              for slide in pres["slides"]:
                  all_text.extend(slide["text"])
          
          # Word frequency
          words = ' '.join(all_text).lower()
          words = re.findall(r'\b\w+\b', words)
          word_freq = Counter(words).most_common(50)
          
          # Identify key themes
          themes = {
              "architecture": ["architecture", "system", "design"],
              "data": ["database", "data", "storage"],
              "process": ["process", "workflow", "procedure"],
              "installation": ["install", "setup", "deploy"]
          }
          
          theme_counts = {theme: 0 for theme in themes}
          for word, count in word_freq:
              for theme, keywords in themes.items():
                  if word in keywords:
                      theme_counts[theme] += count
          
          return {
              "total_presentations": total_presentations,
              "total_slides": total_slides,
              "word_frequency": word_freq[:20],
              "themes": theme_counts
          }
      ```
  
  # --------------------------------------------------------------------------
  # Phase 4: Report Generation
  # --------------------------------------------------------------------------
  report_generation:
    description: "Generate comprehensive reports from analysis"
    
    report_types:
