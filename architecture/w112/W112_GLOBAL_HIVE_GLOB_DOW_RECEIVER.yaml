schema: w112-global-hive-glob-dow-receiver/1.0
wave: W112
consumer: GBOGEB/ABACUS
role: DOW_RUNTIME_ANALYSIS_CONSUMER
producer:
  repo: GBOGEB/CODEX
  pr: 619
  exact_head_sha: 4805871b12974715299f505d4259ce2f44e6a2e3
  glob: GLOB.yaml
  action_taxonomy: federation/mesh/GLOBAL_ACTION_TAXONOMY_v1.yaml
  receipt: federation/mesh/W112_GLOBAL_HIVE_3PC_MIP_RECEIPT.yaml
baseline:
  abacus_main_sha: aefc9db9e5e71b83d2983f7894b90d09eb402b3d
3pc_consumption:
  role: consume task/action vocabulary and status pointers for orchestration visibility
  authority:
    may: [consume_status, select_action_moniker, orchestrate_bounded_runtime, emit_derived_receipt]
    must_not: [redefine_CODEX_status_contract, promote_QPS_engineering_truth, treat_GLOB_as_scheduler]
  lifecycle:
    W108_status_keys: RESERVED_ACTIVE
    W111_colliding_action_aliases: HISTORICAL_ONLY
    W112_action_monikers: CANDIDATE_FOR_DOW_CONSUMPTION
  consumer_classification: ACCEPT_SEMANTIC_MODEL_PENDING_PRODUCER_CI
namespace_invariant:
  status_keys: [CG, WD, RR, DR, SR, HK, EX, FE, QH, KR, CR, PB, BG]
  action_monikers: [CLOSE, RED, RUNTIME, SEM, SSOT, RECEIPT, ENABLE, HARDEN, CLEAN, MAINT, READ, EXP, WATCH]
  intersection_must_be_empty: true
orchestration_binding:
  status_source: GBOGEB/CODEX:governance/mesh/MESH_STATUS_CONTRACT_v1.yaml
  action_source: GBOGEB/CODEX:federation/mesh/GLOBAL_ACTION_TAXONOMY_v1.yaml
  rule: ABACUS may use status to rank/dispatch existing orchestration but does not create a replacement global scheduler
mip:
  modernize: stop interpreting W108 status aliases as W111 action classes
  innovate: consume GLOB lookup/menu and direction/lane filters as a discovery surface
  perpetuate: emit DOW receipts with separate status_snapshot and action_moniker fields
proof_gate:
  producer_ci_required: true
  producer_ci_state: PENDING
  exact_sha_required: true
  local_execution_required_for_this_receiver: false
disposition: ACCEPT_CONTRACT_PENDING_CODEX_CI
next_action: when CODEX #619 CI is green, use this receiver in one DOW pulse and emit a receipt with >0 execution steps if runtime is invoked
